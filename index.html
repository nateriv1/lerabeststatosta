ет ацетил-КоА-карбоксилазу → падает малонил-КоА → снимается блок с карнитин-ацилтрансферазы I → усиливается транспорт ЖК в митохондрии → усиливается β-окисление → накапливается избыток ацетил-КоА → печень \"сбрасывает\" его в кетоновые тела.</p>", "conspectHtml": "<p><strong>26. Кетоновые тела: синтез, окисление, регуляция</strong></p>\n<p><strong>Кетоновые тела:</strong> ацетоацетат, β-гидроксибутират, ацетон</p>\n<p><strong>Значение:</strong> энергосубстрат для миокарда, мышц, коркового слоя почек; при голодании — для ЦНС. Печень сама НЕ утилизирует!</p>\n<p><strong>Синтез (кетогенез) — матрикс Mx печени, субстрат Ацетил-SKoA:</strong></p>\n<ol>\n<li>2Ацетил-КоА → Ацетоацетил-КоА (тиолаза/трансфераза)</li>\n<li>Ацетоацетил-КоА+Ацетил-КоА+Н2О → ГМГ-КоА (ГМГ-КоА-синтетаза)</li>\n<li>ГМГ-КоА → Ацетоацетат + Ацетил-КоА (ГМГ-КоА-лиаза)</li>\n</ol>\n<p><em>Реакции 1-2 идентичны синтезу ХС (вопр.24)! Развилка на р.3: лиаза→кетоновые тела; (в вопр.24) редуктаза→ХС</em></p>\n<p><strong>Судьба ацетоацетата:</strong></p>\n<ul>\n<li>+НАДН → β-гидроксибутират (обратимо, фермент β-гидроксибутиратДГ)</li>\n<li>спонтанно (без фермента!) → Ацетон + CO2</li>\n</ul>\n<p><strong>Окисление (кетолиз) — периферич. ткани (НЕ печень):</strong></p>\n<p>β-гидроксибутират → Ацетоацетат (обратная р-ция, +НАД+) Ацетоацетат + сукцинил-КоА → Ацетоацетил-КоА + сукцинат (трансфераза, активация без затраты доп. АТФ) Ацетоацетил-КоА+HSKoA → 2 Ацетил-КоА (тиолаза) → ЦТК</p>\n<p><strong>Энергетика:</strong> 3АТФ(НАДН) + 24АТФ(2×ацетил-КоА в ЦТК) − 1АТФ(активация) = 26 АТФ</p>\n<p><strong>3 пункта координации кетогенеза:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>↑СЖК в крови (липолиз ТАГ) → ингибир. ацетил-КоА-карбоксилазы → ↓малонил-КоА</td></tr>\n<tr><td>2</td><td>↓малонил-КоА (ингибитор карнитин-ацилтрансферазы I) → снят блок → ↑транспорт ЖК в Mx → ↑β-окисление</td></tr>\n<tr><td>3</td><td>↓оксалоацетат (уходит на глюконеогенез) → ↓цитратсинтез → накопление ацетил-КоА → ↑кетогенез</td></tr>\n</tbody>\n</table></div>\n<p><em>\"Жиры сгорают в пламени углеводов\" — без ОАА ацетил-КоА не входит в ЦТК</em></p>\n<p><strong>Кетонемия/-урия/-ацидоз:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Термин</th><th>Суть</th></tr></thead>\n<tbody>\n<tr><td>Кетонемия</td><td>↑кетон. тел в крови (N 0,03-0,2 ммоль/л)</td></tr>\n<tr><td>Кетонурия</td><td>кетон. тела в моче</td></tr>\n<tr><td>Кетоацидоз</td><td>90% β-ГБ ионизировано → ↑Н+ → ↓pH</td></tr>\n</tbody>\n</table></div>\n<p><strong>Причины:</strong> непатолог. (голодание, нагрузка) / патолог. (СД, гиперинсулинизм, дефицит ГКС)</p>"}, {"num": 27, "title": "Классификация ЛП, апобелки, ферменты метаболизма, хиломикроны", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Липопротеиды (ЛП) — это \"упаковка\", в которой гидрофобные липиды (ТАГ, ХС) путешествуют по водной среде крови.</p>\n<p><strong>Классификация ЛП — по трём разным принципам:</strong></p>\n<ol>\n<li>По плотности (ультрацентрифугирование): ХМ (хиломикроны) → ЛПОНП → ЛППП → ЛПНП → ЛПВП</li>\n<li>По электрофоретической подвижности: ХМ, ЛПОНП (пре-β-ЛП), ЛПНП (β-ЛП), ЛПВП (α-ЛП)</li>\n<li>По составу: богатые ТАГ (ХМ, ЛПОНП), богатые ХС (ЛПНП), богатые ФЛ (ЛПВП)</li>\n</ol>\n<p><strong>Строение ЛП</strong> — все они устроены по одному принципу: сферические надмолекулярные комплексы.</p>\n<ul>\n<li>Ядро — неполярные липиды (ТАГ и эфиры холестерина — ЭХС)</li>\n<li>Оболочка (монослой) — полярные липиды (ФЛ, свободный ХС) и апобелки</li>\n</ul>\n<p><strong>Апобелки</strong> — это не просто \"пассажиры\", а функционально критичная часть частицы: нековалентно связаны с ФЛ и ХС, поддерживают структурную целостность ЛП, обеспечивают обмен между разными классами ЛП, и отвечают за взаимодействие с рецепторами клеток.</p>\n<p>Два типа апобелков по подвижности:</p>\n<ul>\n<li>Стационарные (интегральные): АПО В-48 (кишечник), АПО В-100 (печень), АПО-А-1 (кишечник, печень)</li>\n<li>Динамические (периферические): АПО-С-II, АПО Е, АПО-С-III, АПО-А-II, АПО-А-IV, АПО D</li>\n</ul>\n<p><strong>Функции апобелков (3 пункта):</strong></p>\n<ol>\n<li>Структурообразование</li>\n<li>Векторная функция (направленный транспорт к клеткам-мишеням)</li>\n<li>Кофакторы ферментов обмена ЛП</li>\n</ol>\n<p><strong>Ферменты метаболизма ЛП (3 фермента, каждый со своим апобелком-кофактором):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Фермент</th><th>Что делает</th><th>Кофактор-апобелок</th></tr></thead>\n<tbody>\n<tr><td>ЛПЛ (липопротеинлипаза)</td><td>гидролизует ТАГ в ХМ и ЛПОНП → ДАГ+ЖК</td><td>АПО-С-II</td></tr>\n<tr><td>ПГГ (печёночная глицеролгидралаза)</td><td>гидролизует ТАГ в ЛППП, ЛПНП</td><td>АПО-С-III</td></tr>\n<tr><td>ЛХАТ (лецитинхолестеролацилтрансфераза)</td><td>этерификация ХС (перенос ЖК с ФХ на ХС)</td><td>АПО-А-II</td></tr>\n</tbody>\n</table></div>\n<p><strong>Хиломикроны (ХМ) — функции, формирование, метаболизм</strong></p>\n<p>Функции: 1) транспорт ресинтезированных в кишечнике ТАГ к периферическим тканям и печени 2) транспорт жирорастворимых витаминов</p>\n<p>Формирование насцентных ХМ: в энтероцитах Апо В-48 связывает ТАГ, образуя белок-липидный комплекс, покрытый монослоем ФЛ.</p>\n<p>Созревание ХМ: в крови насцентные ХМ \"дозревают\" — приобретают Апо С-II и Апо Е (донор — ЛПВП2α).</p>\n<p>Ферментативная деградация: ЛПЛ (её кофактор — полученный Апо С-II!) гидролизует ТАГ хиломикрона → ЖК поглощаются тканями. Параллельно идёт гетерообмен с ЛПВП (ХМ отдаёт ДАГ, получает взамен ЭХС) и потеря Апо С-II → образуются ремнантные ХМ.</p>\n<p>Поглощение гепатоцитами: ремнантные ХМ связываются с рецептором Апо В-48/Е на поверхности печёночных клеток → эндоцитоз → распад в лизосомах.</p>", "conspectHtml": "<p><strong>27. Классификация ЛП, апобелки, ферменты, хиломикроны</strong></p>\n<p><strong>Классификация:</strong></p>\n<ul>\n<li>По плотности: ХМ→ЛПОНП→ЛППП→ЛПНП→ЛПВП</li>\n<li>По электрофорезу: ХМ / ЛПОНП(пре-β) / ЛПНП(β) / ЛПВП(α)</li>\n<li>По составу: ТАГ-богаты (ХМ,ЛПОНП) / ХС-богаты (ЛПНП) / ФЛ-богаты (ЛПВП)</li>\n</ul>\n<p><strong>Строение:</strong> ядро (ТАГ+ЭХС, неполярное) + оболочка-монослой (ФЛ+ХС+апобелки)</p>\n<p><strong>Апобелки:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Примеры</th><th>Функции</th></tr></thead>\n<tbody>\n<tr><td>Стационарные</td><td>АпоВ-48(кишечник), АпоВ-100(печень), АпоА-1</td><td>структура, вектор к рецепторам</td></tr>\n<tr><td>Динамические</td><td>АпоС-II, АпоЕ, АпоС-III, АпоА-II</td><td>кофакторы ферментов, перепрыгивают между ЛП</td></tr>\n</tbody>\n</table></div>\n<p><strong>Ферменты метаболизма ЛП:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Фермент</th><th>Действие</th><th>Кофактор</th></tr></thead>\n<tbody>\n<tr><td>ЛПЛ</td><td>гидролиз ТАГ (ХМ, ЛПОНП)</td><td>АпоС-II</td></tr>\n<tr><td>ПГГ</td><td>гидролиз ТАГ (ЛППП, ЛПНП)</td><td>АпоС-III</td></tr>\n<tr><td>ЛХАТ</td><td>этерификация ХС</td><td>АпоА-II</td></tr>\n</tbody>\n</table></div>\n<p><strong>Хиломикроны:</strong></p>\n<p>Функции: транспорт пищевых ТАГ + жирораств. витаминов</p>\n<p>Формирование (энтероцит): АпоВ-48+ТАГ+ФЛ-оболочка → насцентный ХМ → (кровь) приобрет. АпоС-II+АпоЕ (от ЛПВП2α) → зрелый ХМ → ЛПЛ (кофактор АпоС-II) гидролизует ТАГ → ЖК в ткани + гетерообмен с ЛПВП (ДАГ↔ЭХС) → ремнантный ХМ → рецептор АпоВ-48/Е на гепатоците → эндоцитоз → лизосомы</p>"}, {"num": 28, "title": "ЛПОНП и ЛПНП, полиморфизм гена АроЕ", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Продолжаем цепочку транспортных частиц — теперь разбираем ЛП, которые синтезирует сама печень, и то, как они постепенно \"худеют\" и превращаются друг в друга.</p>\n<p><strong>Формирование насцентных ЛПОНП (печень):</strong> гепатоциты синтезируют Апо В-100 (в отличие от В-48 у ХМ — принципиальная разница, В-100 длиннее и служит \"меткой\" именно печёночного происхождения частицы), который связывает ТАГ. Комплекс покрывается монослоем ФЛ.</p>\n<p><strong>Созревание ЛПОНП:</strong> в крови насцентные ЛПОНП приобретают Апо С-II и Апо Е (от ЛПВП2α).</p>\n<p><strong>Ферментативная деградация:</strong> ЛПЛ гидролизует ТАГ ЛПОНП → ЖК поглощаются тканями. В результате гетерообмена с ЛПВП и потери Апо С-II → образуются ремнантные ЛПОНП. Часть из них (крупные) сразу поглощается печенью.</p>\n<p><strong>Образование ЛППП→ЛПНП:</strong> мелкие ремнантные ЛПОНП под действием печёночной глицеролгидралазы (ПГГ, кофактор — Апо С-III) и дальнейшего гетерообмена постепенно \"худеют\" ещё больше → превращаются в ЛПНП.</p>\n<p><strong>Ключевая идея этой цепочки:</strong> ЛПОНП → ЛППП → ЛПНП — это по сути одна и та же частица, которая постепенно теряет ТАГ и \"концентрируется\" по холестерину.</p>\n<p><strong>Функции ЛПНП (2 пункта):</strong></p>\n<ol>\n<li>Транспорт ХС к клеткам органов и тканей</li>\n<li>Транспорт эссенциальных полиненасыщенных ЖК в виде ЭХС</li>\n</ol>\n<p><strong>Поглощение ЛПНП:</strong> связываются с рецепторами Апо В-100/Е на клетках различных тканей → рецептор-опосредованный эндоцитоз.</p>\n<p><strong>Полиморфизм гена апобелка Е (АроЕ) — клиническое значение</strong></p>\n<p>Ген АроЕ имеет 3 основных аллельных варианта: ε2, ε3, ε4, кодирующих 3 изоформы белка (E2, E3, E4). Самый распространённый генотип — ε3/ε3.</p>\n<p><strong>Клиническое значение:</strong></p>\n<ol>\n<li>Сердечно-сосудистые заболевания:</li>\n</ol>\n<ul>\n<li>Аллель ε4 — фактор риска ИБС, коронарного атеросклероза, повышения общего ХС, ЛПНП, апоВ и липопротеина(а). Также связан с повышенным риском послеоперационной фибрилляции предсердий и более тяжёлым повреждением миокарда после АКШ.</li>\n<li>Аллель ε2 — наоборот, протективный (защитный) эффект. Носители ε2/ε3 имеют более высокий уровень ЛПВП.</li>\n</ul>\n<ol>\n<li>Нейродегенеративные заболевания:</li>\n</ol>\n<ul>\n<li>Аллель ε4 — самый сильный генетический фактор риска болезни Альцгеймера и сосудистой деменции.</li>\n</ul>\n<ol>\n<li>Воспаление:</li>\n</ol>\n<ul>\n<li>Носители ε4 имеют более высокие уровни провоспалительных маркеров (hs-CRP, миелопероксидаза, окисленный ЛПНП).</li>\n</ul>\n<p><strong>Практический вывод:</strong> генотипирование АроЕ используется для оценки индивидуального риска и персонализации профилактики сердечно-сосудистых и нейродегенеративных заболеваний.</p>", "conspectHtml": "<p><strong>28. ЛПОНП и ЛПНП, полиморфизм АроЕ</strong></p>\n<p><strong>Формирование ЛПОНП (печень):</strong> АпоВ-100 + ТАГ + ФЛ-оболочка → насцентный ЛПОНП → приобрет. АпоС-II+АпоЕ (от ЛПВП2α) → зрелый ЛПОНП → ЛПЛ (кофактор АпоС-II) гидролизует ТАГ → ЖК в ткани + гетерообмен → ремнантный ЛПОНП (крупные → сразу в печень) → ПГГ (кофактор АпоС-III) на мелких ремнантах → ЛППП → ЛПНП</p>\n<p><strong>Функции ЛПНП:</strong> 1) транспорт ХС к тканям 2) транспорт эссенц. ЖК (в виде ЭХС)</p>\n<p><strong>Поглощение:</strong> рецепторы АпоВ-100/Е → эндоцитоз</p>\n<p><strong>Полиморфизм АроЕ (ε2/ε3/ε4, самый частый — ε3/ε3):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Аллель</th><th>Эффект</th></tr></thead>\n<tbody>\n<tr><td>ε4</td><td>↑риск ИБС, атеросклероза, ↑ХС/ЛПНП; сильнейший фактор риска Альцгеймера; ↑воспалит. маркеры</td></tr>\n<tr><td>ε2</td><td>протективный; ε2/ε3 → ↑ЛПВП</td></tr>\n</tbody>\n</table></div>"}, {"num": 29, "title": "ЛПВП — формирование, функции, метаболизм", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>ЛПВП — самые \"маленькие и плотные\" частицы, и их главная роль принципиально другая, чем у ХМ/ЛПОНП/ЛПНП: они не доставляют жир тканям, а собирают избыток холестерина ИЗ тканей и несут его обратно в печень. Единственный ЛП, работающий \"в обратную сторону\".</p>\n<p><strong>Кишечный пул ЛПВП:</strong></p>\n<ol>\n<li>Формирование насцентных ЛПВП: в энтероцитах синтезируются ФЛ (с экзогенными полиеновыми ЖК), АПО-А-I и АПО-А-II.</li>\n<li>Созревание: в крови приобретают Апо-А-IV (транспортирует ХС от клеток), АПО D, АПО-С-II, АПО Е и α-ЛХАТ → образуются ЛПВП3. В результате реакции ЛХАТ образуются ЭХС → формируются зрелые ЛПВП2α.</li>\n<li>Деградация: ЛПВП2α вступают в гетерообмен с ХМ, ЛПОНП, ЛПНП (отдают ЭХС, получают взамен ДАГ), теряют АПО Е → превращаются в ЛПВП2β.</li>\n<li>Поглощение: ЛПВП2β поглощаются гепатоцитами.</li>\n</ol>\n<p><strong>Печёночный пул ЛПВП:</strong></p>\n<ol>\n<li>Формирование насцентных ЛПВП: в печени синтезируются ФЛ (но уже с эндогенными моноеновыми ЖК), АПО-А-I и АПО-А-II.</li>\n<li>Созревание: в крови приобретают Апо-А-IV и β-ЛХАТ → ЛПВП3. В результате β-ЛХАТ реакции → ЭХС → зрелые ЛПВП2α.</li>\n<li>Поглощение: у печёночных ЛПВП2α гетерообмен отсутствует (в отличие от кишечного пула!) — они сразу поглощаются гепатоцитами, доставляя ХС для выведения в виде желчных кислот.</li>\n</ol>\n<p><strong>Функции ЛПВП (4 пункта):</strong></p>\n<ol>\n<li>Донор АПО-С-II и АПО Е в кровотоке для формирования зрелых ХМ, ЛПОНП, ЛПНП</li>\n<li>Участвуют в гетерообмене, обогащая другие ЛП эфирами ХС</li>\n<li>Обеспечивают обратный транспорт холестерина (удаление ХС из периферических тканей в печень) — это главная, уникальная функция именно ЛПВП</li>\n<li>Участвуют в транспорте полиеновых ЖК</li>\n</ol>", "conspectHtml": "<p><strong>29. ЛПВП: формирование, функции, метаболизм</strong></p>\n<p><strong>Кишечный пул:</strong> Энтероцит: ФЛ(экзоген. полиеновые ЖК)+АпоА-I+АпоА-II → насцентный ЛПВП → кровь: +АпоА-IV,АпоD,АпоС-II,АпоЕ + α-ЛХАТ → ЛПВП3 →(этерификация ХС)→ ЛПВП2α → гетерообмен с ХМ/ЛПОНП/ЛПНП (отдаёт ЭХС↔получает ДАГ), теряет АпоЕ → ЛПВП2β → поглощение гепатоцитами</p>\n<p><strong>Печёночный пул:</strong> Печень: ФЛ(эндоген. моноеновые ЖК)+АпоА-I+АпоА-II → насцентный ЛПВП → +АпоА-IV + β-ЛХАТ (субстрат: ХС de novo+олеиновая к-та) → ЛПВП3 → ЭХС → ЛПВП2α → БЕЗ гетерообмена → сразу поглощение печенью (ХС → желчные к-ты)</p>\n<p><strong>Функции ЛПВП:</strong></p>\n<ol>\n<li>Донор АпоС-II/АпоЕ для др. ЛП</li>\n<li>Обогащение др. ЛП эфирами ХС (гетерообмен)</li>\n<li>Обратный транспорт ХС (ткани→печень) — гл. функция</li>\n<li>Транспорт полиеновых ЖК</li>\n</ol>"}, {"num": 30, "title": "Модификация ЛПНП, атеросклероз, коэффициент атерогенности, гиперлипопротеидемии", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Это, по сути, \"финальный итог\" всего блока про липопротеиды.</p>\n<p><strong>Модифицированные ЛП</strong> — образуются в крови и межклеточном пространстве из нормальных ЛП:</p>\n<ol>\n<li>Гликозилирование ЛП — присоединение моносахаридов к апобелкам (активируется при сахарном диабете) → изменение конформации белков → нарушение рецептор-опосредованного эндоцитоза</li>\n<li>Перекисная модификация — окисление ЛП активными формами кислорода (активируется при курении, гипоксии, гипероксии)</li>\n</ol>\n<p><strong>Молекулярные механизмы развития атеросклероза (6 шагов):</strong></p>\n<ol>\n<li>Модифицированные ЛП (особенно ЛПНП) и иммунные комплексы прикрепляются к эндотелию сосудов, повреждают его и проникают в субэндотелий</li>\n<li>В субэндотелии захватываются макрофагами интимы путём скэвенджер-рецепторного эндоцитоза — у этого рецептора отсутствует регуляция по принципу отрицательной обратной связи (в отличие от нормального ЛПНП-рецептора)</li>\n<li>В макрофагах накапливаются ЭХС → макрофаги превращаются в пенистые клетки</li>\n<li>Пенистые клетки разрушаются → ЭХС оказываются во внеклеточном пространстве → формируется холестериновый очаг (инициатор атеросклеротической бляшки)</li>\n<li>Фибробласты и гладкомышечные клетки мигрируют в интиму, пролиферируют и продуцируют коллаген и эластин → формируется атеросклеротическая бляшка</li>\n<li>В области бляшки образуются тромбы → инфаркты (миокарда, ишемический инсульт)</li>\n</ol>\n<p><strong>Коэффициент атерогенности (КА)</strong> — расчётный показатель риска атеросклероза:</p>\n<p>КА = (ХС(ЛПНП)+ХС(ЛПОНП)) / ХС(ЛПВП) = (ХСобщий − ХСЛПВП) / ХСЛПВП</p>\n<p>У здоровых лиц КА = 2,5-3,0. В числителе — \"плохой\" холестерин (атерогенные фракции), в знаменателе — \"хороший\" (ЛПВП, который выводит ХС из тканей).</p>\n<p><strong>Дислипопротеидемии — типы гиперлипопротеидемий по Фредриксону:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Увеличение ЛП</th><th>Увеличение липидов</th></tr></thead>\n<tbody>\n<tr><td>I</td><td>ХМ</td><td>ТАГ, ХС</td></tr>\n<tr><td>IIa</td><td>ЛПНП</td><td>ХС↑/ТАГ-норма</td></tr>\n<tr><td>IIb</td><td>ЛПНП и ЛПОНП</td><td>ХС и ТАГ</td></tr>\n<tr><td>III</td><td>ЛПОНП</td><td>ХС и ТАГ</td></tr>\n<tr><td>IV</td><td>ЛПОНП и ↓ЛПВП</td><td>ТАГ/ХС в норме</td></tr>\n<tr><td>V</td><td>ХМ и ЛПОНП</td><td>ТАГ/ХС в норме</td></tr>\n</tbody>\n</table></div>\n<p>Мнемоническая логика: типы I и V — про хиломикроны (проблемы с расщеплением пищевых ТАГ), типы IIa/IIb/III — про ЛПНП/ЛПОНП (самые \"атерогенные\" типы), тип IV — особый, с падением защитного ЛПВП.</p>", "conspectHtml": "<p><strong>30. Модификация ЛПНП, атеросклероз, КА, гиперлипопротеидемии</strong></p>\n<p><strong>Модифицированные ЛП:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Механизм</th><th>Активируется при</th></tr></thead>\n<tbody>\n<tr><td>Гликозилирование</td><td>моносахарид → апобелок → нарушен эндоцитоз</td><td>сахарный диабет</td></tr>\n<tr><td>Перекисная модиф.</td><td>окисление АФК</td><td>курение, гипо/гипероксия</td></tr>\n</tbody>\n</table></div>\n<p><strong>Механизм атеросклероза (6 шагов):</strong></p>\n<ol>\n<li>Модифиц. ЛПНП → повреждают эндотелий → в субэндотелий</li>\n<li>Захват макрофагами (скэвенджер-рецептор, БЕЗ обратной связи!)</li>\n<li>Накопление ЭХС в макрофагах → пенистые клетки</li>\n<li>Разрушение пенистых клеток → холестериновый очаг</li>\n<li>Фибробласты+гладкомыш.клетки → коллаген/эластин → атеросклеротич. бляшка</li>\n<li>Тромбы на бляшке → инфаркты/инсульты</li>\n</ol>\n<p><strong>Коэффициент атерогенности:</strong> КА = (ХСЛПНП+ХСЛПОНП) / ХСЛПВП Норма: 2,5-3,0</p>\n<p><strong>Типы гиперлипопротеидемий (Фредриксон):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>ЛП↑</th><th>Липиды↑</th></tr></thead>\n<tbody>\n<tr><td>I</td><td>ХМ</td><td>ТАГ,ХС</td></tr>\n<tr><td>IIa</td><td>ЛПНП</td><td>ХС</td></tr>\n<tr><td>IIb</td><td>ЛПНП+ЛПОНП</td><td>ХС+ТАГ</td></tr>\n<tr><td>III</td><td>ЛПОНП</td><td>ХС+ТАГ</td></tr>\n<tr><td>IV</td><td>ЛПОНП+↓ЛПВП</td><td>ТАГ/ХС-N</td></tr>\n<tr><td>V</td><td>ХМ+ЛПОНП</td><td>ТАГ/ХС-N</td></tr>\n</tbody>\n</table></div>"}, {"num": 31, "title": "АФК, ферментативные/неферментативные системы генерации, стадии ПОЛ", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Переходим к большому блоку про свободнорадикальное окисление.</p>\n<p><strong>Активные формы кислорода (АФК)</strong> — высокореакционноспособные производные кислорода: супероксид-анионрадикал (О2⁻•), синглетный кислород (¹О2), перекись водорода (Н2О2), гидроксильный радикал (НО•), гидроперекисный радикал (НО2•), пероксинитрит (ONOO⁻).</p>\n<p><strong>Разница между обычным (триплетным) и синглетным кислородом:</strong></p>\n<ul>\n<li>Триплетный О2 (тот, которым мы дышим) — стабильный бирадикал (2 неспаренных электрона с параллельными спинами), низкая реакционная способность</li>\n<li>Синглетный ¹О2 — возбуждённое состояние, высокореакционноспособен, инициирует ПОЛ</li>\n</ul>\n<p><strong>Ферментативные системы, генерирующие АФК (7 источников):</strong></p>\n<ol>\n<li>Ксантиноксидаза (КО) — использует О2 как акцептор электронов → О2⁻• и Н2О2. Активна в кишечнике и печени.</li>\n<li>L-оксидаза аминокислот — окислительное дезаминирование АК (ФМН-зависимая)</li>\n<li>Моноаминооксидаза (МАО) — окислительное дезаминирование аминов (ФАД-зависимая)</li>\n<li>Миелопероксидаза (МПО) — образование гипогалоидов (HOCl)</li>\n<li>НАДФ-оксидаза фагоцитов — О2⁻•+2Н+→Н2О2→НО• — это ключевой фермент \"респираторного взрыва\" при фагоцитозе</li>\n<li>Митохондриальные оксидазы — около 5% кислорода в дыхательной цепи \"случайно\" преобразуется в О2⁻• (побочный продукт нормального дыхания!)</li>\n<li>Микросомальная монооксигеназа (цитохром Р-450) — 75% кислорода, поглощаемого печенью, преобразуется в О2⁻•</li>\n</ol>\n<p><strong>Неферментативные системы, генерирующие АФК:</strong></p>\n<ol>\n<li>Реакция Фентона: Fe2++H2O2 → Fe3++HO•+HO⁻</li>\n<li>Реакция Хабера-Вейса: H2O2+O2⁻• → HO•+HO⁻+¹O2</li>\n<li>Радиолиз воды: H2O → HO•+H++ē</li>\n<li>Протонирование пероксинитрита: ONOO⁻+H+ → HO•+NO2⁻</li>\n</ol>\n<p><strong>Биологическое действие АФК — двойственное:</strong></p>\n<ul>\n<li>Повреждающее: инициация ПОЛ, окисление белков и нуклеиновых кислот, повреждение мембран</li>\n<li>Защитное: участие в фагоцитозе (кислородзависимая бактерицидность)</li>\n</ul>\n<p><strong>Стадии свободно-радикального окисления липидов (ПОЛ) — 4 стадии, классическая цепная реакция:</strong></p>\n<ol>\n<li>Инициация цепи: НО• отрывает атом водорода от α-углеродного атома ненасыщенной ЖК → образуется ацильный радикал (R•). Дальше: R• + O2 → ROO• (перекисный радикал)</li>\n<li>Развитие цепи (элонгация): ROO• + RH → ROOH + R• (R• снова вступает в реакцию с O2 → ROO•). Продукт этой стадии — гидроперекись ЖК (диеновые конъюгаты)</li>\n<li>Разветвление цепи: ROOH + Fe2+ → RO• + HO⁻; RO• + RH → ROH + R•. Процесс идёт безостановочно</li>\n<li>Обрыв цепи (терминация): рекомбинация свободных радикалов друг с другом (R•+R•→R-R; R•+ROO•→ROOR; ROO•+ROO•→ROOR+O2+hv — вот откуда берётся сверхслабая хемилюминесценция при ПОЛ)</li>\n</ol>", "conspectHtml": "<p><strong>31. АФК: системы генерации, стадии ПОЛ</strong></p>\n<p><strong>АФК:</strong> О2⁻•, ¹О2, Н2О2, НО•, НО2•, ONOO⁻</p>\n<p>Триплетный О2 (норма, малоактивен) vs Синглетный ¹О2 (возбуждён, высокоактивен, инициирует ПОЛ)</p>\n<p><strong>Ферментативные системы:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Фермент</th><th>Продукт</th><th>Где</th></tr></thead>\n<tbody>\n<tr><td>Ксантиноксидаза</td><td>О2⁻•, Н2О2</td><td>кишечник, печень</td></tr>\n<tr><td>L-оксидаза АК</td><td>—</td><td>дезаминирование</td></tr>\n<tr><td>МАО</td><td>—</td><td>дезаминирование аминов</td></tr>\n<tr><td>МПО</td><td>HOCl</td><td>фагоциты</td></tr>\n<tr><td>НАДФ-оксидаза</td><td>О2⁻•→Н2О2→НО•</td><td>фагоциты (респир. взрыв)</td></tr>\n<tr><td>Митох. оксидазы</td><td>О2⁻• (5% О2 дых.цепи)</td><td>Mx</td></tr>\n<tr><td>Цитохром Р-450</td><td>О2⁻• (75% О2 печени)</td><td>печень</td></tr>\n</tbody>\n</table></div>\n<p><strong>Неферментативные:</strong></p>\n<ul>\n<li>Фентона: Fe2++H2O2→Fe3++HO•+HO⁻</li>\n<li>Хабера-Вейса: H2O2+O2⁻•→HO•+HO⁻+¹O2</li>\n<li>Радиолиз воды: H2O→HO•+H++ē</li>\n</ul>\n<p><strong>Действие АФК:</strong> повреждающее (ПОЛ, окисление белков/НК) / защитное (фагоцитоз)</p>\n<p><strong>Стадии ПОЛ:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Стадия</th><th>Р-ция</th><th>Продукт</th></tr></thead>\n<tbody>\n<tr><td>1.Инициация</td><td>НО•+ЖК→R•; R•+O2→ROO•</td><td>ацильный радикал</td></tr>\n<tr><td>2.Развитие</td><td>ROO•+RH→ROOH+R•</td><td>гидроперекись (диеновые конъюгаты)</td></tr>\n<tr><td>3.Разветвление</td><td>ROOH+Fe2+→RO•+HO⁻</td><td>безостановочно</td></tr>\n<tr><td>4.Обрыв</td><td>R•+R•→R-R и т.п.</td><td>хемилюминесценция</td></tr>\n</tbody>\n</table></div>"}, {"num": 32, "title": "Повреждающее действие ПОЛ, системы антирадикальной защиты", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Разберём, ЧТО именно повреждают продукты перекисного окисления, и как клетка от этого защищается.</p>\n<p>Различают первичный и вторичный повреждающие механизмы ПОЛ.</p>\n<p><strong>Первичный механизм — непосредственное действие радикалов/продуктов на клетку:</strong></p>\n<ol>\n<li>Деструкция ПНЖК мембранных фосфолипидов:</li>\n</ol>\n<ul>\n<li>Из \"срезанных хвостов\" ПНЖК с одной двойной связью → оксикислоты, этилен, кетоны, альдегиды</li>\n<li>Из \"срезанных хвостов\" с двумя+ двойными связями → дикарбонильные соединения: малоновый диальдегид (МДА, преобладает), глиоксаль, метилглиоксаль</li>\n</ul>\n<ol>\n<li>Полимеризация белков/липидов — образование Шиффовых оснований (конечный, третичный продукт ПОЛ):</li>\n</ol>\n<p>МДА имеет две реакционноспособные альдегидные группы → легко взаимодействует с аминогруппами (лизин, концевые NH2-группы белков, аминогруппы ФЭА) → образует внутри- и межмолекулярные сшивки.</p>\n<p>Последствия:</p>\n<ul>\n<li>Внутримолекулярная сшивка в белке → ограничивает конформационные изменения → утрата функции белка</li>\n<li>Межмолекулярная сшивка между белками → димеры</li>\n<li>Межмолекулярная сшивка между ФЭА → образование липофусцина (это тот самый \"пигмент старения\") → ↑микровязкость мембраны, ↓текучесть → при старении формируются ксантоматозные бляшки</li>\n<li>Итог всех сшивок: мембрана становится ригидной (невосприимчивой к внешним сигналам) — нарушение функции мембранных ферментов и рецепторов</li>\n</ul>\n<ol>\n<li>Окисление SH-групп аминокислот/белков (цистеин, метионин): Pr–SH + ROO• → PrS• → образуются дисульфидные мостики (Pr–S–S–Pr) или белковые сульфопроизводные</li>\n</ol>\n<ol>\n<li>Разрыв гликозидных связей в полисахаридах → деструкция</li>\n</ol>\n<ol>\n<li>Деструкция нуклеопротеинов → клетка утрачивает генетическую информацию</li>\n</ol>\n<p><strong>Вторичный повреждающий механизм (следствие первичного):</strong></p>\n<ol>\n<li>Повышение проницаемости мембран: атака НО• → гидрофильная перекисная группа (-ООН) выталкивается на поверхность мембраны → фосфолипаза А2 \"выстригает\" повреждённые радикалы ЖК → образуются гидрофильные поры → мембрана превращается в \"решето\", теряет избирательную проницаемость</li>\n</ol>\n<ol>\n<li>Снижение окислительного фосфорилирования (разобщение): поры в митохондриальной мембране → Н+ возвращается в матрикс, минуя АТФ-синтазу → ΔμН+ падает → окисление \"вхолостую\", АТФ не синтезируется. Через поры также проходят Na+ и Ca2+ → активация Na+/Ca2+-обменника → ↑Ca2+ внутри клетки → активация Ca2+-зависимых гидролаз → разрушение структур клетки</li>\n</ol>\n<p><strong>Ферментативная система антирадикальной защиты — 3 линии обороны:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Линия</th><th>Ферменты</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>СОД + каталаза</td><td>СОД: 2О2⁻•+2Н+→Н2О2+О2; Каталаза: 2Н2О2→2Н2О+О2</td></tr>\n<tr><td>2</td><td>Глутатионпероксидаза (ГПО, содержит Se) + глутатионредуктаза (ГР)</td><td>ГПО: ROOH+2G-SH→ROH+H2O+G-S-S-G; ГР (регенерирует глутатион, +НАДФН2 из ПФ-пути!)</td></tr>\n<tr><td>3</td><td>Церулоплазмин (ЦП) + трансферин</td><td>ЦП (Cu2+-фермент): окисляет Fe2+→Fe3+, тормозит разветвление цепи ПОЛ; трансферин связывает Fe3+</td></tr>\n</tbody>\n</table></div>\n<p><strong>Неферментативная система (природные антиоксиданты):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Антиоксидант</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>α-Токоферол (вит.Е)</td><td>мембранный, взаимодействует с ROO•, регенерируется вит.С</td></tr>\n<tr><td>Аскорбиновая к-та (вит.С)</td><td>восстанавливает α-ТФ•, сама переходит в семидегидроаскорбат</td></tr>\n<tr><td>SH-соединения (глутатион, цистеин)</td><td>инактивируют ROO•</td></tr>\n<tr><td>Многоатомные спирты (сорбит, ксилит, глюкоза)</td><td>ловушки радикалов через ОН-группы</td></tr>\n<tr><td>Хелаторы (ЭДТА)</td><td>связывают Fe2+/Fe3+</td></tr>\n</tbody>\n</table></div>", "conspectHtml": "<p><strong>32. Повреждающее действие ПОЛ, антирадикальная защита</strong></p>\n<p><strong>Первичный механизм:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Мишень</th><th>Продукт/следствие</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>ПНЖК мембран</td><td>оксикислоты, альдегиды; МДА (гл. дикарбонильный продукт)</td></tr>\n<tr><td>2</td><td>Полимеризация (Шиффовы основания)</td><td>внутримол. сшивка→↓функция белка; межмол. ФЭА→липофусцин→ригидность мембраны</td></tr>\n<tr><td>3</td><td>SH-группы белков</td><td>дисульфидные мостики</td></tr>\n<tr><td>4</td><td>Гликозидные связи</td><td>деструкция полисахаридов</td></tr>\n<tr><td>5</td><td>Нуклеопротеины</td><td>потеря генетич. инф-ции</td></tr>\n</tbody>\n</table></div>\n<p><strong>Вторичный механизм:</strong></p>\n<ul>\n<li>↑проницаемости мембран: -ООН→поры→фосфолипаза А2→гидрофильные поры→\"решето\"</li>\n<li>↓окислит. фосфорилирования: поры в Mx→Н+ в обход АТФ-синтазы→↓ΔμН+; Na+/Ca2+→↑Ca2+ внутри→активация гидролаз→разрушение клетки</li>\n</ul>\n<p><strong>Антиоксидантная защита — 3 линии (ферментативная):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Линия</th><th>Ферменты</th><th>Реакция</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>СОД+каталаза</td><td>2О2⁻•→Н2О2+О2 → 2Н2О+О2</td></tr>\n<tr><td>2</td><td>ГПО(Se)+ГР</td><td>ROOH+2GSH→ROH+GSSG; ГР регенерирует (НАДФН2 из ПФ-пути)</td></tr>\n<tr><td>3</td><td>Церулоплазмин+трансферин</td><td>Fe2+→Fe3+ (тормоз разветвления)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Неферментативная:</strong> вит.Е (мембранный) ⇄ вит.С (регенерирует Е), SH-соединения, многоатомные спирты, хелаторы Fe</p>"}, {"num": 33, "title": "АФК в фагоцитозе, гипоксия и ПОЛ, простагландины и лейкотриены", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Это большой комплексный вопрос, объединяющий три темы: как иммунная система использует АФК как оружие, что происходит при кислородном голодании тканей, и как из арахидоновой кислоты образуются важные сигнальные молекулы.</p>\n<p><strong>Молекулярные механизмы фагоцитоза — 3 стадии:</strong></p>\n<ol>\n<li>Узнавание и адгезия</li>\n<li>Захват и поглощение (образование фагосомы)</li>\n<li>Внутриклеточная деструкция (слияние с лизосомой → фаголизосома)</li>\n</ol>\n<p><strong>\"Комплекс четырёх повышений\" при фагоцитозе (\"респираторный взрыв\")</strong> — фагоцит, атакующий бактерию, резко меняет метаболизм:</p>\n<ol>\n<li>↑потребление кислорода</li>\n<li>↑потребление глюкозы и её окисление по ПФ-пути</li>\n<li>↑продукция супероксидного анион-радикала</li>\n<li>↑продукция пероксида водорода</li>\n</ol>\n<p><strong>Кислородзависимые механизмы фагоцитоза:</strong></p>\n<ul>\n<li>НАДФН-оксидаза: НАДФН2+2О2→2О2⁻•+НАДФ++2Н+ — это \"родоначальник\" всех биоцидных соединений фагоцита</li>\n<li>СОД или спонтанно: 2О2⁻•+2Н+→Н2О2+¹О2</li>\n<li>Миелопероксидаза (МПО): Cl⁻+H2O2→OCl⁻+H2O — два механизма действия гипохлорита: хлорирует мембраны микробов → гибель; работает как декарбоксилаза (превращает аминокислоты в токсичные для микробов альдегиды)</li>\n<li>Хемилюминесценция — сверхслабое свечение при фагоцитозе, используется для оценки бактерицидного потенциала фагоцитов лабораторно</li>\n</ul>\n<p><strong>Кислороднезависимые механизмы:</strong></p>\n<ul>\n<li>Снижение pH в фагосомах до 4-5 (за счёт лактата анаэробного гликолиза) — бактерицидный эффект + оптимум для гидролаз</li>\n<li>Лизоцим — расщепляет полисахариды клеточной стенки бактерий</li>\n<li>Катионные белки (дефензины) — образуют ионные каналы в мембране фагоцитируемой клетки</li>\n</ul>\n<p><strong>Роль АФК в антимикробной защите грудного молока:</strong> молоко содержит АФК (О2⁻•, Н2О2) от макрофагов/нейтрофилов молока + фермент ксантиноксидазу. Лактопероксидаза использует Н2О2 для образования бактерицидных соединений.</p>\n<p><strong>Роль ПОЛ при гипоксии (ишемии) — 9 источников АФК:</strong></p>\n<ol>\n<li>Переход ксантиндегидрогеназы в ксантиноксидазную форму (протеолитическая модификация; ингибитор — аллопуринол)</li>\n<li>Нарушение работы дыхательной цепи → одноэлектронное восстановление O2 → O2⁻•</li>\n<li>Активация микросомального окисления</li>\n<li>Нарушение Ca2+-гомеостаза → активация фосфолипаз → каскад арахидоновой кислоты</li>\n<li>Накопление Fe2+ (из ферритина) — мощный прооксидант</li>\n<li>Окисление Hb→метHb, накопление внеэритроцитарного Hb</li>\n<li>Аутоокисление катехоламинов (при стрессе)</li>\n<li>Активация нейтрофилов (\"дыхательный взрыв\")</li>\n<li>Накопление NO•</li>\n</ol>\n<p><strong>«Кислородный парадокс» (реоксигенационный синдром):</strong> подача кислорода после ишемии парадоксально НЕ нормализует состояние, а усугубляет — ПОЛ резко усиливается именно при реоксигенации. Добавление СОД+каталазы тормозит этот процесс.</p>\n<p><strong>«Кальциевый парадокс»:</strong> ↑Ca2+ в плазме при реперфузии → усиленное поступление Ca2+ в клетку и митохондрии → накопление Ca2+ в матриксе Mx — главная причина разобщения окислительного фосфорилирования.</p>\n<p><strong>Последствия гиперкальциемии:</strong></p>\n<ol>\n<li>Усиление ПОЛ</li>\n<li>↑проницаемости мембран</li>\n<li>Повреждение мембран лизосом → выход липаз/протеаз → аутолиз клетки</li>\n<li>Активация ферментов пероксисом → генерация H2O2</li>\n</ol>\n<p><strong>Простагландины и лейкотриены (каскад арахидоновой кислоты)</strong> — при гипоксии усиливается фосфолиполиз → активируется этот каскад:</p>\n<p>Циклооксигеназный путь (ЦОГ-1, ЦОГ-2): Арахидоновая к-та → PGG2 → PGH2 → простагландины (PGD2, PGE2, PGF2α), простациклин (PGI2), тромбоксан A2 (TXA2)</p>\n<p>Липоксигеназный путь (5-ЛОГ): Арахидоновая к-та → 5-HPETE → лейкотриены (LTA4→LTB4→LTC4→LTD4→LTE4)</p>\n<p><strong>Функции:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Соединение</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>PGE2, PGD2</td><td>воспаление (отёк, боль, лихорадка), защита слизистой желудка, тонус сосудов</td></tr>\n<tr><td>Простациклин PGI2</td><td>антиагрегантный, вазодилатация</td></tr>\n<tr><td>Тромбоксан A2 (TXA2)</td><td>агрегация тромбоцитов, вазоконстрикция</td></tr>\n<tr><td>Лейкотриены (LTC4, LTD4, LTE4)</td><td>медленно реагирующая субстанция анафилаксии (бронхоконстрикция)</td></tr>\n<tr><td>Лейкотриен B4 (LTB4)</td><td>хемоаттрактант и активатор лейкоцитов</td></tr>\n</tbody>\n</table></div>", "conspectHtml": "<p><strong>33. АФК в фагоцитозе, гипоксия и ПОЛ, эйкозаноиды</strong></p>\n<p><strong>Фагоцитоз (3 стадии):</strong> узнавание/адгезия → захват (фагосома) → деструкция (фаголизосома)</p>\n<p><strong>\"4 повышения\" (респират. взрыв):</strong> ↑О2, ↑глюкоза/ПФП, ↑О2⁻•, ↑Н2О2</p>\n<p><strong>Кислородзависимые мех-мы:</strong> НАДФН-оксидаза (НАДФН2+2О2→2О2⁻•) → СОД → Н2О2 → МПО (+Cl⁻→OCl⁻, хлорирует микробы)</p>\n<p><strong>Кислороднезависимые:</strong> ↓pH(4-5, лактат), лизоцим, дефензины</p>\n<p><strong>Грудное молоко:</strong> АФК+ксантиноксидаза+лактопероксидаза → защита ЖКТ новорождённого</p>\n<p><strong>Гипоксия — источники АФК:</strong> ксантинокс. переход (инг. аллопуринол), сбой ЦПЭ, Ca2+→фосфолипазы→арахидонат, ↑Fe2+, ауто-окисл. катехоламинов, дыхат. взрыв нейтрофилов, NO•</p>\n<p><strong>Кислородный парадокс:</strong> реоксигенация → резкий взрыв ПОЛ (не улучшение!). Терапия: СОД+каталаза</p>\n<p><strong>Кальциевый парадокс:</strong> ↑Ca2+ при реперфузии → накопление в Mx → разобщение окисл. фосфорилир. → ПОЛ, ↑проницаемость, аутолиз (лизосом. ферменты), Н2О2 (пероксисомы)</p>\n<p><strong>Каскад арахидоновой к-ты:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>Фермент</th><th>Продукты</th></tr></thead>\n<tbody>\n<tr><td>Циклооксигеназный</td><td>ЦОГ-1/2</td><td>PG(D2,E2,F2α), простациклин PGI2, тромбоксан TXA2</td></tr>\n<tr><td>Липоксигеназный</td><td>5-ЛОГ</td><td>лейкотриены LTB4,C4,D4,E4</td></tr>\n</tbody>\n</table></div>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Продукт</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>PGI2</td><td>↓агрегация, вазодилатация</td></tr>\n<tr><td>TXA2</td><td>↑агрегация, вазоконстрикция</td></tr>\n<tr><td>LTC4,D4,E4</td><td>бронхоконстрикция (анафилаксия)</td></tr>\n<tr><td>LTB4</td><td>хемоаттрактант лейкоцитов</td></tr>\n</tbody>\n</table></div>"}, {"num": 34, "title": "Питательная ценность белков, азотистый баланс, переваривание белков в ЖКТ", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p><strong>Питательная ценность белков</strong> определяется содержанием незаменимых аминокислот.</p>\n<ul>\n<li>Высококачественные (полноценные) — белки животного происхождения (яйцо, мясо, молоко)</li>\n<li>Растительные белки — характеризуются относительным дефицитом некоторых незаменимых аминокислот (в кукурузе — дефицит триптофана, лизина; в пшенице — лизина)</li>\n</ul>\n<p><strong>Азотистый баланс</strong> — разница между количеством азота, поступившего с пищей, и выведенного.</p>\n<ul>\n<li>Азотистое равновесие — у здорового взрослого человека при нормальном питании</li>\n<li>Положительный азотистый баланс — выводится азота меньше, чем поступает (рост, выздоровление, беременность)</li>\n<li>Отрицательный азотистый баланс — выводится больше, чем поступает (голодание, старение, опухоли)</li>\n</ul>\n<p><strong>Клинические проявления недостатка белков в пище:</strong> Квашиоркор (задержка роста, анемия, отёки, нарушение секреции панкреатических ферментов). Исключение одной незаменимой аминокислоты ведёт к неполному усвоению других (остановка роста, истощение, отрицательный азотистый баланс).</p>\n<p><strong>Схема переваривания белков в ЖКТ</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Отделы ЖКТ</th><th>Ферменты</th><th>Продукты гидролиза</th></tr></thead>\n<tbody>\n<tr><td>I. Желудок (полостное переваривание)</td><td>ферменты желудка: пепсин, гастриксин, реннин (химозин) (у детей)</td><td>эндопептидазы</td></tr>\n<tr><td>12 п. кишка</td><td>ферменты поджелудочной железы: Трипсин, Химотрипсин, Эластаза, Коллагеназа, Карбоксипептидаза (экзопептидаза)</td><td>—</td></tr>\n<tr><td>II. Тонкая кишка (полостное и пристеночное переваривание)</td><td>ферменты, секретируемые клетками эпителия ворсинок: аминопептидазы (три- и тетра-) и дипептидазы (экзопептидазы)</td><td>—</td></tr>\n<tr><td>III. Толстая кишка</td><td>ферменты бактерий → а.к.-гниение</td><td>—</td></tr>\n</tbody>\n</table></div>\n<p><strong>Биологическое значение переваривания:</strong> Деградация белков до свободных аминокислот (потеря видовой и тканевой специфичности).</p>\n<p><strong>Активация пищеварительных ферментов (частичный протеолиз):</strong></p>\n<ul>\n<li>Пепсиноген → HCl (медленно) → пепсин → аутокатализ</li>\n<li>Трипсиноген → энтерокиназа → трипсин → активирует другие проферменты (химотрипсиноген, проэластазу, прокарбоксипептидазы)</li>\n</ul>\n<p><strong>Трансмембранный перенос аминокислот в кишечнике:</strong></p>\n<ul>\n<li>Вторичный активный транспорт (симпорт с Na+): аминокислота + Na+ поступают в энтероцит (градиент Na+ создаётся Na+/K+-АТФазой)</li>\n<li>γ-Глутаминальный цикл (Майстера): транспорт нейтральных аминокислот. Ключевой фермент — γ-глутамилтрансфераза (мембранный, Na+-зависимый). Цикл включает 6 ферментов и затрачивает 3 АТФ на одну аминокислоту</li>\n<li>Из энтероцита в кровоток аминокислоты транспортируются путём облегчённой диффузии (унипорт, транслаказа)</li>\n</ul>", "conspectHtml": "<p><strong>34. Питательная ценность белков, азотистый баланс, переваривание</strong></p>\n<p><strong>Ценность белков:</strong> животные (полноценные) vs растительные (дефицит отд. АК: кукуруза-Три/Лиз, пшеница-Лиз)</p>\n<p><strong>Азотистый баланс:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Суть</th><th>Когда</th></tr></thead>\n<tbody>\n<tr><td>Равновесие</td><td>приход=расход</td><td>норма</td></tr>\n<tr><td>Положительный</td><td>приход&gt;расход</td><td>рост, беременность</td></tr>\n<tr><td>Отрицательный</td><td>приход&lt;расход</td><td>голодание, опухоли</td></tr>\n</tbody>\n</table></div>\n<p><strong>Дефицит белка:</strong> квашиоркор (рост↓, анемия, отёки); отсутствие 1 незамен. АК → блок синтеза белка (принцип лимитир. фактора)</p>\n<p><strong>Переваривание:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Отдел</th><th>Ферменты</th><th>Тип</th></tr></thead>\n<tbody>\n<tr><td>Желудок</td><td>пепсин, гастриксин, реннин(дети)</td><td>эндопептидазы</td></tr>\n<tr><td>12-п.кишка</td><td>трипсин, химотрипсин, эластаза, коллагеназа, карбоксипептидаза</td><td>эндо+экзо</td></tr>\n<tr><td>Тонкая кишка</td><td>амино-/дипептидазы</td><td>экзопептидазы</td></tr>\n</tbody>\n</table></div>\n<p><strong>Активация (частичный протеолиз):</strong> Пепсиноген→(HCl медленно→пепсин→аутокатализ) Трипсиноген→(энтерокиназа)→Трипсин→активирует остальные проферменты ПЖ</p>\n<p><strong>Транспорт АК в кишечнике:</strong></p>\n<ul>\n<li>Вторичный активн. транспорт (симпорт с Na+, как и глюкоза!)</li>\n<li>γ-Глутаминовый цикл (γ-глутамилтрансфераза, 6 ферментов, 3АТФ/1АК) — для нейтральных АК</li>\n<li>Выход в кровь: облегчённая диффузия (унипорт)</li>\n</ul>"}, {"num": 35, "title": "Образование соляной кислоты, регуляция секреции, диагностика желудочного сока, гниение аминокислот", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p><strong>Образование соляной кислоты (в париетальных клетках желудка):</strong></p>\n<ul>\n<li>CO2 + H2O → H2CO3 (карбоангидраза) → H+ + HCO3⁻</li>\n<li>H+ выкачивается в просвет желудка через H+/K+-АТФазу (активный транспорт — та же логика, что и Na+/K+-АТФаза, только с другими ионами!)</li>\n<li>Cl⁻ поступает в просвет через хлорные каналы</li>\n<li>HCO3⁻ поступает в плазму — это называется \"щелочной прилив\"</li>\n</ul>\n<p><strong>Роль соляной кислоты (6 функций):</strong></p>\n<ol>\n<li>Переводит пепсиноген в активный пепсин</li>\n<li>Создаёт оптимум pH для пепсина (1,5-2,5)</li>\n<li>Денатурирует белки (увеличивает площадь для ферментативного катализа)</li>\n<li>Бактерицидное действие</li>\n<li>Освобождает железо из солей органических кислот</li>\n<li>Стимулирует выработку секретина</li>\n</ol>\n<p><strong>Регуляция секреции HCl:</strong></p>\n<ul>\n<li>Стимуляторы: гастрин (гормон-пептид), гистамин</li>\n<li>Ингибиторы: секретин, ЖИП (желудочный ингибиторный полипептид), простагландины Е2</li>\n</ul>\n<p>Именно потому что гистамин — стимулятор секреции HCl, блокаторы Н2-гистаминовых рецепторов (ранитидин и подобные) снижают кислотность желудка.</p>\n<p><strong>Диагностическое значение анализа желудочного сока:</strong></p>\n<p>Определение кислотности (общей, свободной, связанной HCl). Патологические изменения:</p>\n<ul>\n<li>Ахлоргидрия — полное отсутствие HCl</li>\n<li>Гипо-/гиперхлоргидрия — снижение/повышение</li>\n</ul>\n<p><strong>Патологические компоненты желудочного сока:</strong></p>\n<ul>\n<li>Кровь (\"кофейная гуща\")</li>\n<li>Молочная кислота (при застое содержимого, раке желудка)</li>\n<li>Желчь (при дуоденогастральном рефлюксе)</li>\n</ul>\n<p><strong>Гниение аминокислот в толстом кишечнике</strong> — это то, что происходит с той частью белка, которая НЕ была переварена и всосана в тонкой кишке:</p>\n<p><strong>Примеры конкретных реакций гниения:</strong></p>\n<ul>\n<li>Серосодержащие АК → меркаптаны, H2S, CH4</li>\n<li>Диаминокислоты (орнитин, лизин) → путресцин, кадаверин (\"трупные яды\")</li>\n<li>Ароматические АК: тирозин → фенол, крезол; триптофан → индол, скатол</li>\n</ul>\n<p><strong>Обезвреживание продуктов гниения (в печени):</strong></p>\n<p>Фенол, крезол, индол, скатол → окисление → конъюгация с серной или глюкуроновой кислотами (ФАФС или УДФ-ГК) → парные соединения → выводятся с мочой</p>\n<p>Конкретный клинически известный конъюгат — животный индикан (калиевая соль индоксилсерной кислоты), образующийся из индола. Повышение индикана в моче — косвенный маркер усиленных гнилостных процессов в кишечнике.</p>", "conspectHtml": "<p><strong>35. Соляная кислота, диагностика желуд. сока, гниение АК</strong></p>\n<p><strong>Образование HCl (париетальные клетки):</strong> CO2+H2O →(карбоангидраза)→ H++HCO3⁻ H+ → просвет (H+/K+-АТФаза), Cl⁻ → просвет (каналы) HCO3⁻ → плазма (\"щелочной прилив\")</p>\n<p><strong>Роль HCl (6):</strong> активация пепсиногена, оптимум pH пепсина(1,5-2,5), денатурация белков, бактерицидная, освобождение Fe, стимуляция секретина</p>\n<p><strong>Регуляция:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Стимуляторы</th><th>Ингибиторы</th></tr></thead>\n<tbody>\n<tr><td>гастрин, гистамин</td><td>секретин, ЖИП, PgE2</td></tr>\n</tbody>\n</table></div>\n<p><strong>Диагностика желуд. сока:</strong> ахлоргидрия, гипо-/гиперхлоргидрия; патология: кровь(\"кофейная гуща\"), лактат(рак желудка), желчь(рефлюкс)</p>\n<p><strong>Гниение АК (толстая кишка, бактерии):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>АК</th><th>Продукты</th></tr></thead>\n<tbody>\n<tr><td>Серосодержащие</td><td>меркаптаны, H2S, CH4</td></tr>\n<tr><td>Диаминокислоты (орнитин,лизин)</td><td>путресцин, кадаверин</td></tr>\n<tr><td>Тирозин</td><td>фенол, крезол</td></tr>\n<tr><td>Триптофан</td><td>индол, скатол</td></tr>\n</tbody>\n</table></div>\n<p><strong>Обезвреживание (печень):</strong> окисление → конъюгация (ФАФС/УДФ-ГК) → парные соединения → моча Пример: индол → индикан (маркер гнилостных процессов)</p>"}, {"num": 36, "title": "Пул свободных аминокислот, трансаминирование, неокислительное дезаминирование", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p><strong>Пул свободных аминокислот:</strong> около 30 г в организме взрослого человека.</p>\n<p><strong>Источники пула (3 пункта):</strong></p>\n<ol>\n<li>Аминокислоты, всосавшиеся в кишечнике (из пищевых белков)</li>\n<li>Аминокислоты, образовавшиеся при распаде собственных белков тканей</li>\n<li>Синтез заменимых аминокислот из метаболитов</li>\n</ol>\n<p><strong>Пути использования аминокислот (3 пункта):</strong></p>\n<ol>\n<li>Синтез белков и пептидов</li>\n<li>Синтез азотсодержащих небелковых соединений (гем, пурины, пиримидины, креатин, нейромедиаторы, гормоны)</li>\n<li>Катаболизм (дезаминирование, декарбоксилирование) → энергия и кетокислоты</li>\n</ol>\n<p><strong>Судьба безазотистого остатка:</strong></p>\n<ul>\n<li>Превращение в ПВК, ацетил-SKoA, сукцинил-SKoA, фумарат, ОАА</li>\n<li>Окисление в ЦТК (энергия)</li>\n<li>Глюконеогенез (синтез глюкозы)</li>\n<li>Липогенез (синтез жирных кислот)</li>\n</ul>\n<p><strong>Трансаминирование аминокислот</strong></p>\n<p>Реакция: Аминокислота₁ + α-кетокислота₁ ⇄ α-кетокислота₂ + Аминокислота₂</p>\n<p>Суть — перенос аминогруппы (NH2) с одной молекулы на другую, БЕЗ выделения свободного аммиака. Это принципиально важное отличие от дезаминирования.</p>\n<p><strong>Биологическое значение (4 пункта):</strong></p>\n<ol>\n<li>Перераспределение аминогрупп между разными аминокислотами</li>\n<li>Синтез заменимых аминокислот</li>\n<li>Связь обмена аминокислот с ЦТК и углеводным обменом (через α-КГ и ПВК)</li>\n<li>\"Коллекторная\" функция — сбор NH2-групп в глутамате (множество разных аминокислот через трансаминазы \"сливают\" свои аминогруппы именно в глутамат, который потом становится \"центральным узлом\" для дальнейшего обезвреживания азота)</li>\n</ol>\n<p><strong>Ферменты:</strong> Трансаминазы (аминотрансферазы) — АсАТ (аспартатаминотрансфераза) и АлАТ (аланинаминотрансфераза) — те же самые ферменты, которые упоминались в энзимодиагностике! Повышение АлАТ — маркер гепатита, а АсАТ — маркер инфаркта миокарда.</p>\n<p><strong>Кофермент:</strong> пиридоксальфосфат (производное витамина В6) — механизм реакции называется \"пинг-понг\".</p>\n<p><strong>Неокислительное дезаминирование аминокислот</strong></p>\n<p>В отличие от трансаминирования, здесь аммиак реально высвобождается — но без участия окислительных ферментов, просто через гидролиз или отщепление воды:</p>\n<ul>\n<li>Серин: серин + H2O → ПВК + NH3 (фермент серингидратаза)</li>\n<li>Треонин: треонин + H2O → α-кетобутират + NH3 (треонингидратаза)</li>\n<li>Цистеин: цистеин + H2O → ПВК + NH3 + H2S (цистингидратаза)</li>\n<li>Гистидин: гистидин → уроканиновая кислота + NH3 (гистидаза)</li>\n</ul>\n<p>Это специфический путь только для этих 4 аминокислот — для остальных 16 аминокислот основной путь дезаминирования другой (окислительное дезаминирование через трансаминирование + глутаматдегидрогеназу).</p>", "conspectHtml": "<p><strong>36. Пул свободных АК, трансаминирование, неокислит. дезаминирование</strong></p>\n<p><strong>Пул АК:</strong> ~30г. Источники: пищевые (кишечник), из распада тканевых белков, синтез заменимых АК</p>\n<p><strong>Пути использования:</strong> 1) синтез белков 2) синтез небелковых N-соединений (гем, пурины, креатин, гормоны) 3) катаболизм → энергия+кетокислоты</p>\n<p><strong>Судьба безазотистого остатка:</strong> ПВК/ацетил-КоА/сукцинил-КоА/фумарат/ОАА → ЦТК (энергия) / глюконеогенез / липогенез</p>\n<p><strong>Трансаминирование:</strong> АК1 + α-КК1 ⇄ α-КК2 + АК2 (БЕЗ выделения своб. NH3!)</p>\n<p><strong>Значение (4):</strong> перераспределение NH2-групп, синтез заменимых АК, связь с ЦТК/углеводами, \"коллекторная\" функция (сбор NH2 в глутамате)</p>\n<p><strong>Ферменты:</strong> АсАТ, АлАТ (кофермент — пиридоксальфосфат, вит.В6; механизм \"пинг-понг\") <em>АлАТ↑ — гепатит; АсАТ↑ — инфаркт миокарда</em></p>\n<p><strong>Неокислительное дезаминирование (только 4 АК, гидролитически, с реальным выделением NH3):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>АК</th><th>Продукт</th><th>Фермент</th></tr></thead>\n<tbody>\n<tr><td>Серин</td><td>ПВК+NH3</td><td>серингидратаза</td></tr>\n<tr><td>Треонин</td><td>α-кетобутират+NH3</td><td>треонингидратаза</td></tr>\n<tr><td>Цистеин</td><td>ПВК+NH3+H2S</td><td>цистингидратаза</td></tr>\n<tr><td>Гистидин</td><td>уроканиновая к-та+NH3</td><td>гистидаза</td></tr>\n</tbody>\n</table></div>"}, {"num": 37, "title": "Прямое и непрямое окислительное дезаминирование (трансдезаминирование)", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Это главный, основной путь дезаминирования большинства аминокислот в тканях.</p>\n<p><strong>Прямое окислительное дезаминирование</strong></p>\n<p>Реакция (2 стадии):</p>\n<ol>\n<li>Дегидрирование: R-CH(NH2)-COOH + ФМН → Иминокислота + ФМНН2</li>\n<li>Спонтанный гидролиз (без фермента!): Иминокислота + Н2О → R-CO-COOH + NH3</li>\n</ol>\n<p>Фермент: L-оксидаза аминокислот (ФМН-зависимая). Ключевая проблема этого фермента: оптимум pH ≈ 10 — то есть при физиологическом pH (~7,4) он практически не работает!</p>\n<p><strong>Исключение — глутаматдегидрогеназа (ГлуДГ):</strong> этот фермент высокоактивен именно при физиологическом pH≈7, и использует НАД+/НАДФ+. Катализирует обратимую реакцию:</p>\n<p>Глутамат + НАД+ ⇄ α-КГ + NH3 + НАДН+Н+</p>\n<p>Это регуляторный аллостерический фермент.</p>\n<p><strong>Биологическое значение:</strong> образование NH3 для синтеза мочевины (через глутамат). Связь с ЦТК — через α-КГ.</p>\n<p><strong>Непрямое окислительное дезаминирование (трансдезаминирование)</strong> — это то, как на самом деле дезаминируется подавляющее большинство аминокислот в организме.</p>\n<p><strong>Логика:</strong> у большинства аминокислот нет собственной эффективной дезаминазы, работающей при физиологическом pH. Но глутаматдегидрогеназа — работает отлично! Проблема лишь в том, что она специфична только к одной аминокислоте — глутамату. Решение: сначала \"перекинуть\" аминогруппу с ЛЮБОЙ аминокислоты именно на глутамат (через трансаминирование), а потом уже глутамат сам эффективно дезаминируется через ГлуДГ.</p>\n<p><strong>Схема (2 стадии):</strong></p>\n<ol>\n<li>Трансаминирование: Аминокислота + α-КГ ⇄ Кетокислота + Глутамат (фермент — трансаминаза, кофермент — витамин В6)</li>\n<li>Окислительное дезаминирование глутамата: Глутамат + НАД+ → α-КГ + NH3 + НАДН+Н+ (фермент — глутаматдегидрогеназа)</li>\n</ol>\n<p><strong>Суммарно:</strong> Аминокислота + Н2О + НАД+ → Кетокислота + NH3 + НАДН+Н+</p>\n<p>Красивая логика цикла: α-кетоглутарат (α-КГ), который \"принял\" аминогруппу на первом шаге (превратившись в глутамат), на втором шаге снова регенерируется обратно в α-КГ — то есть α-КГ работает как многоразовый \"челнок\".</p>\n<p><strong>Биологическое значение:</strong> это основной путь дезаминирования БОЛЬШИНСТВА аминокислот в тканях. Связывает обмен аминокислот и с ЦТК (через α-КГ), и с энергетикой клетки (через образующийся НАДН, который идёт в ЦПЭ и даёт 3 АТФ).</p>", "conspectHtml": "<p><strong>37. Прямое и непрямое окислительное дезаминирование</strong></p>\n<p><strong>Прямое окислительное дезаминирование:</strong></p>\n<p>Р-ция (2 стадии): 1) R-CH(NH2)COOH+ФМН→Иминокислота+ФМНН2 2) Иминокислота+Н2О→ R-CO-COOH+NH3 (спонтанно)</p>\n<p>Фермент: L-оксидаза АК (ФМН-завис.), оптимум pH≈10 — малоактивна при физиол. pH!</p>\n<p><strong>Исключение — ГлутаматДГ:</strong> активна при pH≈7, НАД+/НАДФ+-завис., аллостерический регулят. фермент Глутамат+НАД+ ⇄ α-КГ+NH3+НАДН+Н+</p>\n<p>Значение: NH3 → синтез мочевины; связь с ЦТК (α-КГ)</p>\n<p><strong>Непрямое окислит. дезаминирование (трансдезаминирование):</strong></p>\n<p>Логика: у большинства АК нет своей эффективной дезаминазы при физиол. pH → сначала перекидываем NH2 на глутамат (у него дезаминаза есть и работает!)</p>\n<p>Схема (2 стадии):</p>\n<ol>\n<li>Трансаминирование: АК+α-КГ ⇄ Кетокислота+Глутамат (трансаминаза, вит.В6)</li>\n<li>Дезаминирование глутамата: Глутамат+НАД+ → α-КГ+NH3+НАДН+Н+ (глутаматДГ)</li>\n</ol>\n<p>Суммарно: АК+Н2О+НАД+ → Кетокислота+NH3+НАДН+Н+</p>\n<p><em>α-КГ — многоразовый \"челнок\" (регенерируется на 2-м шаге)</em></p>\n<p>Значение: основной путь дезаминирования большинства АК в тканях; связь с ЦТК (α-КГ) и энергетикой (НАДН→3АТФ)</p>"}, {"num": 38, "title": "Декарбоксилирование аминокислот, образование биогенных аминов, обезвреживание", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Декарбоксилирование — это ещё один путь превращения аминокислот, принципиально отличный от дезаминирования и трансаминирования. Здесь убирается карбоксильная группа (СООН) в виде CO2, а аминогруппа остаётся — и в результате образуются биогенные амины, мощные сигнальные молекулы.</p>\n<p><strong>Реакция:</strong> R-CH(NH2)-COOH → R-CH2-NH2 + CO2</p>\n<p><strong>Ферменты:</strong> декарбоксилазы аминокислот. <strong>Кофермент:</strong> пиридоксальфосфат (витамин В6 — тот же кофермент, что и в трансаминировании!).</p>\n<p><strong>Важная деталь:</strong> процесс необратим.</p>\n<p><strong>Образование биогенных аминов и их значение — 4 примера:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Аминокислота</th><th>Биогенный амин</th><th>Функции</th></tr></thead>\n<tbody>\n<tr><td>Гистидин</td><td>Гистамин</td><td>сосудорасширяющее действие, ↑секреция HCl в желудке, медиатор боли, сенсибилизация (аллергические реакции)</td></tr>\n<tr><td>Триптофан</td><td>Серотонин (через промежуточный 5-окситриптофан)</td><td>сосудосуживающий, нейромедиатор ЦНС, ↑свёртывание крови, причастен к аллергии и токсикозу беременных</td></tr>\n<tr><td>Глутаминовая кислота</td><td>ГАМК (γ-аминомасляная кислота)</td><td>тормозной нейромедиатор ЦНС</td></tr>\n<tr><td>Тирозин</td><td>ДОФА → Дофамин</td><td>предшественник катехоламинов (адреналин, норадреналин); ингибирующий медиатор нейронов ствола мозга (↓ при паркинсонизме, ↑ при шизофрении)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Обезвреживание (инактивация) биогенных аминов — 2 механизма:</strong></p>\n<p>а) Прямое окислительное дезаминирование — процесс окислительного дезаминирования аминов под действием фермента МАО (моноаминооксидазы, ФАД-зависимая) → образуются альдегиды + NH3:</p>\n<p>R-CH2-NH2 → (МАО, ФАД→ФАДН2) → R-CH=NH → (спонтанный гидролиз, +Н2О) → R-CHO + NH3</p>\n<p>Из альдегида дальше образуется соответствующая кислота, которая выводится почками.</p>\n<p>Так инактивируются дофамин, норадреналин, ГАМК.</p>\n<p>б) Метилирование — под воздействием метилтрансфераз с участием S-аденозилметионина (SAM).</p>\n<p>Так инактивируются гистамин (→метилгистамин, SAM→SAГ) и адреналин (→метиладреналин).</p>", "conspectHtml": "<p><strong>38. Декарбоксилирование АК, биогенные амины</strong></p>\n<p><strong>Реакция:</strong> R-CH(NH2)COOH → R-CH2-NH2 + CO2 (необратимо) Ферменты: декарбоксилазы. Кофермент: пиридоксальфосфат (В6)</p>\n<p><strong>Биогенные амины (4):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>АК</th><th>Амин</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>Гистидин</td><td>Гистамин</td><td>вазодилатация, ↑HCl, боль, аллергия</td></tr>\n<tr><td>Триптофан</td><td>Серотонин</td><td>вазоконстрикция, нейромедиатор, ↑свёртывание, токсикоз беременных</td></tr>\n<tr><td>Глутамат</td><td>ГАМК</td><td>тормозной медиатор ЦНС</td></tr>\n<tr><td>Тирозин</td><td>ДОФА→Дофамин</td><td>предшественник катехоламинов; ↓при Паркинсоне, ↑при шизофрении</td></tr>\n</tbody>\n</table></div>\n<p><strong>Обезвреживание (2 механизма):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Механизм</th><th>Фермент</th><th>Для каких аминов</th></tr></thead>\n<tbody>\n<tr><td>Прямое окислит. дезаминирование</td><td>МАО (ФАД) → альдегид+NH3 → кислота (в мочу)</td><td>дофамин, норадреналин, ГАМК</td></tr>\n<tr><td>Метилирование</td><td>метилтрансферазы + SAM</td><td>гистамин, адреналин</td></tr>\n</tbody>\n</table></div>"}, {"num": 39, "title": "Механизмы токсичности аммиака, пути образования", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Аммиак — необходимый промежуточный продукт азотистого обмена, но в свободном виде он токсичен, особенно для нервной ткани.</p>\n<p><strong>Механизмы токсичности аммиака (3 пункта):</strong></p>\n<ol>\n<li>\"НАД+-ловушка\" — NH3 связывает α-КГ в обратной реакции глутаматдегидрогеназы. Если NH3 много, равновесие сдвигается влево — α-КГ активно \"оттягивается\" на связывание аммиака и превращается в глутамат → истощение пула α-КГ в клетке → замедление ЦТК (не хватает субстрата для цикла!) → ↓АТФ.</li>\n</ol>\n<ol>\n<li>Нарушение работы Na+/K+-АТФазы → отёк клеток (особенно нейронов мозга) — механизм связан с тем, что накопление глутамина внутри клетки создаёт осмотическое давление, которое тянет воду внутрь.</li>\n</ol>\n<ol>\n<li>Подщелачивание среды: NH3+Н+ → NH4+ → защелачивание (особенно заметно в мозге).</li>\n</ol>\n<p><strong>Симптомы аммиачного отравления:</strong></p>\n<p>Норма содержания NH3 в крови: 25-40 мкмоль/л (0,4-0,7 мг/л).</p>\n<p>При отравлении (гипераммониемии): рвота, отвращение к белковой пище, психические расстройства, сонливость, умственная отсталость, судороги, кома.</p>\n<p><strong>Пути образования аммиака в организме — 6 путей:</strong></p>\n<ol>\n<li>Непрямое окислительное дезаминирование (трансдезаминирование) — основной путь в тканях</li>\n<li>Неокислительное дезаминирование серина, треонина, цистеина, гистидина</li>\n<li>Гидролитическое дезаминирование АМФ (адениловой кислоты) — особенно активно в мышечной ткани</li>\n<li>Гидролиз глутамина (фермент глутаминаза) — особенно в почках (активируется при ацидозе)</li>\n<li>Обезвреживание биогенных аминов (через МАО)</li>\n<li>Бактериальное гниение аминокислот в толстом кишечнике (образовавшийся там NH3 поступает в кровь воротной вены)</li>\n</ol>", "conspectHtml": "<p><strong>39. Токсичность аммиака, пути образования</strong></p>\n<p><strong>Механизмы токсичности (3):</strong></p>\n<ol>\n<li>\"НАД+-ловушка\": NH3+α-КГ→глутамат (обратная р-ция ГлутаматДГ) → ↓α-КГ → замедление ЦТК → ↓АТФ</li>\n<li>Нарушение Na+/K+-АТФазы → отёк клеток (особенно нейронов)</li>\n<li>Подщелачивание: NH3+Н+→NH4+ → ↑pH среды (мозг)</li>\n</ol>\n<p><strong>Норма NH3 в крови:</strong> 25-40 мкмоль/л <strong>Симптомы отравления:</strong> рвота, отвращение к белку, психич. расстройства, сонливость, судороги, кома</p>\n<p><strong>6 путей образования NH3:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Путь</th><th>Где/связь</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Непрямое окислит. дезаминирование (трансдезаминирование)</td><td>осн. путь в тканях</td></tr>\n<tr><td>2</td><td>Неокислит. дезаминирование (Сер,Тре,Цис,Гис)</td><td>—</td></tr>\n<tr><td>3</td><td>Гидролит. дезаминирование АМФ</td><td>мышцы</td></tr>\n<tr><td>4</td><td>Гидролиз глутамина (глутаминаза)</td><td>почки, при ацидозе</td></tr>\n<tr><td>5</td><td>Обезвреживание биогенных аминов (МАО)</td><td>—</td></tr>\n<tr><td>6</td><td>Бактериальное гниение АК</td><td>толстая кишка</td></tr>\n</tbody>\n</table></div>"}, {"num": 40, "title": "Пути обезвреживания аммиака, механизмы транспорта: глутаминовый и глюкозо-аланиновый циклы", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Разберём, как организм нейтрализует аммиак, и что важно — как безопасно транспортирует его от периферических тканей (где он образуется) до печени (где происходит его окончательное обезвреживание в мочевину).</p>\n<p><strong>Пути обезвреживания аммиака (5 путей):</strong></p>\n<ol>\n<li>Синтез мочевины (орнитиновый цикл) — основной путь, работает только в печени</li>\n<li>Синтез глутамина (фермент глутаминсинтетаза, +АТФ) — работает во всех тканях, особенно в мозге и мышцах. Глутамин — основная транспортная форма аммиака в организме</li>\n<li>Восстановительное аминирование α-КГ → глутамат — в мозге, слабый путь</li>\n<li>Синтез аспарагина (аспарагинсинтетаза, +АТФ) — встречается редко, энергозатратно (тратятся сразу 2 макроэргические связи)</li>\n<li>Образование аммонийных солей (в почках) — Na-сберегающий механизм поддержания кислотно-щелочного состояния</li>\n</ol>\n<p><strong>Механизмы транспорта аммиака — два ключевых \"челнока\":</strong></p>\n<p><strong>1. Глутаминовый цикл (глутамин-транспортная система)</strong></p>\n<ul>\n<li>В тканях (мозг, мышцы): Глутамат + NH3 + АТФ → Глутамин (фермент глутаминсинтетаза)</li>\n<li>Транспорт глутамина кровью → в печень, почки, кишечник</li>\n<li>В печени: Глутамин + Н2О → Глутамат + NH3 (фермент глутаминаза) → NH3 дальше идёт в орнитиновый цикл на синтез мочевины</li>\n<li>В почках: NH3 → аммонийные соли</li>\n</ul>\n<p><strong>2. Глюкозо-аланиновый цикл (ГАЦ) — транспорт NH3 конкретно из мышц в печень</strong></p>\n<p>В мышцах: при распаде аминокислот → образуется NH3 → через непрямое окислительное дезаминирование связывается в глутамат → глутамат передаёт аминогруппу на ПВК (через трансаминазу АлАТ) → образуется аланин</p>\n<p>Аланин транспортируется кровью → в печень</p>\n<p>В печени: Аланин → ПВК + NH3 (обратная реакция АлАТ). NH3 → идёт в орнитиновый цикл на мочевину. ПВК → глюкоза (через глюконеогенез)</p>\n<p>Глюкоза возвращается в мышцы</p>\n<p><strong>Функции ГАЦ (3 пункта):</strong></p>\n<ol>\n<li>Обезвреживание NH3 в мышцах</li>\n<li>Транспорт NH3 в печень (в безопасной форме аланина)</li>\n<li>Обеспечение мышц глюкозой</li>\n</ol>\n<p>Глюкозо-аланиновый цикл по структуре похож на цикл Кори, но здесь транспортируется не лактат, а аланин — и главная цель уже не \"экономия\" молочной кислоты, а именно обезвреживание аммиака попутно с транспортом углеродного скелета.</p>", "conspectHtml": "<p><strong>40. Пути обезвреживания и транспорта аммиака</strong></p>\n<p><strong>5 путей обезвреживания:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Путь</th><th>Где</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Синтез мочевины (орнитин. цикл)</td><td>печень, основной</td></tr>\n<tr><td>2</td><td>Синтез глутамина (глутаминсинтетаза,+АТФ)</td><td>все ткани, особ. мозг/мышцы</td></tr>\n<tr><td>3</td><td>Восстановит. аминирование α-КГ→глутамат</td><td>мозг, слабый путь</td></tr>\n<tr><td>4</td><td>Синтез аспарагина (+2 макроэрг.связи)</td><td>редко</td></tr>\n<tr><td>5</td><td>Аммонийные соли</td><td>почки</td></tr>\n</tbody>\n</table></div>\n<p><strong>Глутаминовый цикл:</strong> Ткани: Глутамат+NH3+АТФ →(глутаминсинтетаза)→ Глутамин → кровь → печень/почки Печень: Глутамин+Н2О →(глутаминаза)→ Глутамат+NH3 → орнитин. цикл Почки: NH3 → аммонийные соли</p>\n<p><strong>Глюкозо-аланиновый цикл (ГАЦ):</strong> Мышцы: распад АК→NH3→глутамат→(АлАТ)→Аланин → кровь → печень Печень: Аланин→(АлАТ обратно)→ПВК+NH3 (NH3→мочевина; ПВК→глюконеогенез→глюкоза) → обратно в мышцы</p>\n<p><strong>Функции ГАЦ (3):</strong> обезвреживание NH3 в мышцах + транспорт NH3 в печень + снабжение мышц глюкозой</p>\n<p><em>Похоже на цикл Кори, но переносит аланин (азот), а не лактат</em></p>"}, {"num": 41, "title": "Синтез мочевины (орнитиновый цикл)", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Это финальный, \"решающий\" путь обезвреживания аммиака — единственный способ полностью и безвозвратно избавиться от токсичного азота.</p>\n<p><strong>Локализация:</strong> реакции 1 и 2 — в митохондриях гепатоцитов; реакции 3, 4, 5 — в цитозоле.</p>\n<p><strong>5 стадий цикла:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Стадия</th><th>Реакция</th><th>Фермент</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>NH3+CO2+2АТФ+Н2О → Карбамоилфосфат+2АДФ+2Фн</td><td>Карбамоилфосфатсинтетаза I (биотин, Mg2+)</td></tr>\n<tr><td>2</td><td>Карбамоилфосфат+Орнитин → Цитруллин+H3PO4</td><td>Орнитинкарбамоилтрансфераза</td></tr>\n<tr><td>3</td><td>Цитруллин+Аспартат+АТФ → Аргининосукцинат+АМФ+ФФн</td><td>Аргининосукцинатсинтетаза</td></tr>\n<tr><td>4</td><td>Аргининосукцинат → Аргинин+Фумарат</td><td>Аргининосукциназа</td></tr>\n<tr><td>5</td><td>Аргинин+Н2О → Орнитин+Мочевина</td><td>Аргиназа (Ca2+, Mn2+)</td></tr>\n</tbody>\n</table></div>\n<p>Орнитин \"запускает\" процесс на 2-й стадии и регенерируется на 5-й стадии (та же логика многоразового \"челнока\", что и с α-КГ) — то есть орнитин не расходуется, а постоянно циркулирует внутри цикла.</p>\n<p><strong>Источники атомов азота в мочевине — их ровно 2:</strong></p>\n<ul>\n<li>Первый атом азота — из свободного NH3 (входит в состав карбамоилфосфата на 1-й стадии)</li>\n<li>Второй атом азота — из аспартата (входит на 3-й стадии)</li>\n</ul>\n<p><strong>Суммарное уравнение:</strong> CO2 + NH4+ + 3АТФ + Аспартат + 2Н2О → Мочевина + Фумарат + 2АДФ + 2Фн + АМФ + ФФн</p>\n<p>(расходуется 4 макроэргические связи на 1 молекулу мочевины: 2 от первых двух АТФ→2АДФ, и ещё 2 от третьей АТФ→АМФ)</p>\n<p><strong>Связь с ЦТК (бицикл Кребса-Гензелейта):</strong> фумарат, образующийся на 4-й стадии орнитинового цикла, идёт в цитозоле → малат → ОАА → аспартат (через трансаминирование) → возвращается обратно в орнитиновый цикл на 3-ю стадию как донор второго атома азота.</p>\n<p><strong>Клиническое значение определения мочевины:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Показатель</th><th>Норма</th></tr></thead>\n<tbody>\n<tr><td>В крови</td><td>3,5-9 ммоль/л</td></tr>\n<tr><td>В моче</td><td>25-30 г/сут</td></tr>\n</tbody>\n</table></div>\n<p><strong>Повышение мочевины в крови (азотемия):</strong> почечная недостаточность, ↑катаболизм белков (ожоги, кахексия), ↓почечном кровотоке, гиперпротеиновой диете.</p>\n<p><strong>Понижение мочевины:</strong> при нарушении мочевинообразовательной функции печени, заболеваниях почек.</p>\n<p><strong>Метаболические нарушения орнитинового цикла:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Дефектный фермент</th><th>Патологическое состояние</th></tr></thead>\n<tbody>\n<tr><td>Карбамоилфосфатсинтетаза I</td><td>Гипераммонемия тип I</td></tr>\n<tr><td>Орнитинкарбамоилтрансфераза</td><td>Гипераммонемия тип II</td></tr>\n<tr><td>Аргининосукцинатсинтетаза</td><td>Цитруллинемия</td></tr>\n<tr><td>Аргининосукциназа</td><td>Аргининосукцинатная ацидурия</td></tr>\n<tr><td>Аргиназа</td><td>Гипераргининемия</td></tr>\n</tbody>\n</table></div>\n<p><strong>Биохимическое следствие:</strong> накопление субстратов, предшествующих дефектному ферменту, и накопление NH3 в крови (гипераммонемия).</p>", "conspectHtml": "<p><strong>41. Синтез мочевины (орнитиновый цикл)</strong></p>\n<p><strong>Локализация:</strong> реакции 1-2 в Mx, реакции 3-5 в цитозоле (гепатоциты)</p>\n<p><strong>5 стадий:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Р-ция</th><th>Фермент</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>NH3+CO2+2АТФ→Карбамоилфосфат</td><td>Карбамоилфосфатсинтетаза I (биотин,Mg2+)</td></tr>\n<tr><td>2</td><td>+Орнитин→Цитруллин</td><td>Орнитинкарбамоилтрансфераза</td></tr>\n<tr><td>3</td><td>+Аспартат+АТФ→Аргининосукцинат</td><td>Аргининосукцинатсинтетаза</td></tr>\n<tr><td>4</td><td>→Аргинин+Фумарат</td><td>Аргининосукциназа</td></tr>\n<tr><td>5</td><td>+Н2О→Орнитин+Мочевина</td><td>Аргиназа (Ca2+,Mn2+)</td></tr>\n</tbody>\n</table></div>\n<p><em>Орнитин — многоразовый челнок (регенерируется на р.5)</em></p>\n<p><strong>Источники N в мочевине:</strong> 1-й атом — NH3 (р.1); 2-й атом — аспартат (р.3)</p>\n<p><strong>Суммарное ур-е:</strong> CO2+NH4++3АТФ+Аспартат+2Н2О → Мочевина+Фумарат+2АДФ+АМФ+2Фн+ФФн (4 макроэрг. связи на 1 мочевину)</p>\n<p><strong>Связь с ЦТК (бицикл Кребса-Гензелейта):</strong> Фумарат→Малат→ОАА→(трансаминир.)→Аспартат → обратно в цикл (р.3)</p>\n<p><strong>Клиника:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Показатель</th><th>Норма</th></tr></thead>\n<tbody>\n<tr><td>Мочевина в крови</td><td>3,5-9 ммоль/л</td></tr>\n<tr><td>Мочевина в моче</td><td>25-30 г/сут</td></tr>\n</tbody>\n</table></div>\n<p>↑мочевины: почечная недостат., ↑катаболизм белка, гиперпротеин. диета ↓мочевины: нарушение синтетич. функции печени</p>\n<p><strong>Нарушения цикла:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Дефект фермента</th><th>Болезнь</th></tr></thead>\n<tbody>\n<tr><td>Карбамоилфосфатсинтетаза I</td><td>Гипераммонемия I</td></tr>\n<tr><td>Орнитинкарбамоилтрансфераза</td><td>Гипераммонемия II</td></tr>\n<tr><td>Аргининосукцинатсинтетаза</td><td>Цитруллинемия</td></tr>\n<tr><td>Аргининосукциназа</td><td>Аргининосукцинатная ацидурия</td></tr>\n<tr><td>Аргиназа</td><td>Гипераргининемия</td></tr>\n</tbody>\n</table></div>"}, {"num": 42, "title": "Синтез креатина, креатинфосфата, креатинина", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Это система \"быстрого энергетического резерва\" мышц и мозга — креатинфосфат работает как буфер, мгновенно пополняющий АТФ в момент интенсивной работы.</p>\n<p><strong>Синтез креатина — участвуют 3 аминокислоты: аргинин, глицин, метионин</strong>, и происходит он в двух разных органах последовательно:</p>\n<p>Шаг 1 — Почки: Аргинин + Глицин → Гуанидинацетат + Орнитин (фермент глицинамидинотрансфераза)</p>\n<p>Побочный продукт этой реакции — орнитин, тот же орнитин, что участвует в цикле мочевины!</p>\n<p>Шаг 2 — Печень: Гуанидинацетат + SAM (S-аденозилметионин) → Креатин + SAH (фермент гуанидинацетметилтрансфераза)</p>\n<p><strong>Синтез креатинфосфата (в мышцах и мозговой ткани):</strong></p>\n<p>Креатин + АТФ ⇄ Креатинфосфат + АДФ (фермент креатинкиназа). Реакция легко обратима:</p>\n<ul>\n<li>В покое (98% этого направления) — реакция идёт в сторону запасания</li>\n<li>При работе — реакция идёт в обратную сторону: креатинфосфат мгновенно отдаёт фосфат на АДФ, регенерируя АТФ (субстратное фосфорилирование)</li>\n</ul>\n<p><strong>Клиническая деталь про фермент:</strong> креатинкиназа (КК) — изоформы (КК-МВ для сердца, КК-ММ для скелетных мышц, КК-ВВ для мозга) используются как маркеры повреждения соответствующих тканей.</p>\n<p><strong>Синтез креатинина (неферментативно!):</strong></p>\n<p>Креатинфосфат ⇄ Креатин + Фн → спонтанная циклизация → Креатинин (выводится с мочой)</p>\n<p>Важная деталь: только около 2% креатинфосфата/креатина ежедневно превращается в креатинин таким образом — именно эта предсказуемость делает креатинин таким удобным клиническим маркером.</p>\n<p><strong>Функции этих трёх соединений:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Соединение</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>Креатин</td><td>промежуточный метаболит, субстрат для синтеза креатинфосфата</td></tr>\n<tr><td>Креатинфосфат</td><td>макроэрг, система быстрой регенерации АТФ в работающих мышцах и мозге</td></tr>\n<tr><td>Креатинин</td><td>конечный продукт азотистого обмена, диагностический маркер</td></tr>\n</tbody>\n</table></div>\n<p><strong>Почему креатинин — такой ценный диагностический маркер:</strong> он образуется с постоянной скоростью (пропорционально мышечной массе человека) и выводится почками практически полностью через фильтрацию, без реабсорбции — поэтому клиренс креатинина используется для оценки скорости клубочковой фильтрации (СКФ).</p>", "conspectHtml": "<p><strong>42. Синтез креатина, креатинфосфата, креатинина</strong></p>\n<p><strong>Синтез креатина (3 АК: аргинин, глицин, метионин):</strong></p>\n<ol>\n<li>Почки: Аргинин+Глицин →(глицинамидинотрансфераза)→ Гуанидинацетат+Орнитин</li>\n<li>Печень: Гуанидинацетат+SAM →(гуанидинацетметилтрансфераза)→ Креатин+SAH</li>\n</ol>\n<p><strong>Синтез креатинфосфата (мышцы, мозг):</strong> Креатин+АТФ ⇄ Креатинфосфат+АДФ (креатинкиназа, обратимо)</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Состояние</th><th>Направление</th></tr></thead>\n<tbody>\n<tr><td>Покой (98%)</td><td>запасание: АТФ→КрФ</td></tr>\n<tr><td>Работа</td><td>регенерация: КрФ→АТФ (субстратн. фосфорилир.)</td></tr>\n</tbody>\n</table></div>\n<p><em>КК-изоформы: МВ-сердце, ММ-мышцы, ВВ-мозг (энзимодиагностика)</em></p>\n<p><strong>Синтез креатинина (неферментативно!):</strong> КрФ ⇄ Креатин+Фн → циклизация → Креатинин (моча). ~2%/сутки</p>\n<p><strong>Функции:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Соединение</th><th>Роль</th></tr></thead>\n<tbody>\n<tr><td>Креатин</td><td>промежуточный метаболит</td></tr>\n<tr><td>Креатинфосфат</td><td>быстрый резерв АТФ</td></tr>\n<tr><td>Креатинин</td><td>маркер функции почек (клиренс → СКФ)</td></tr>\n</tbody>\n</table></div>"}, {"num": 43, "title": "Обмен отдельных аминокислот: метионин, фенилаланин/тирозин, цистеин, серин/глицин, аргинин", "section": "Раздел 4", "sectionTitle": "Липопротеиды, перекисное окисление липидов, азотистый обмен", "explanationHtml": "<p>Разберём судьбу нескольких \"особых\" аминокислот по отдельности, и связанные с ними наследственные заболевания.</p>\n<p><strong>Обмен метионина</strong></p>\n<p>Метионин — условно заменимая АК, поступает с животной пищей (много в твороге).</p>\n<p>Активация: Метионин + АТФ → S-аденозилметионин (SAM) (фермент метионин-аденозилтрансфераза). SAM — универсальный донор метильных групп.</p>\n<p>Цикл трансметилирования: SAM отдаёт CH3-группу → превращается в S-аденозилгомоцистеин (SAH) → гидролизуется до гомоцистеина.</p>\n<p>Регенерация метионина (цикл, требует 2 витамина):</p>\n<ul>\n<li>Фолиевая кислота → Н4-фолат (фолатредуктаза)</li>\n<li>Н4-фолат акцептирует одноуглеродные фрагменты (от серина, глицина) → метил-Н4-фолат</li>\n<li>Метил-Н4-фолат передаёт СН3 на витамин В12 → метилкобаламин</li>\n<li>Метилкобаламин отдаёт СН3 гомоцистеину → регенерируется метионин</li>\n</ul>\n<p>Нарушение — Гомоцистинурия: дефект фермента цистатионин-β-синтазы (тот же фермент, что участвует в синтезе цистеина!). Клиника: фиброз и утончение сосудов, у детей — эпизодические припадки, тяжёлое физическое и умственное отставание.</p>\n<p><strong>Обмен фенилаланина и тирозина</strong></p>\n<p>Фенилаланин → Тирозин (фермент фенилаланингидроксилаза, кофакторы НАДФН+биоптерин).</p>\n<p>Дальше тирозин расходится на 3 разных пути:</p>\n<ol>\n<li>Тирозин → ДОФА → Дофамин → Норадреналин → Адреналин</li>\n<li>Тирозин → гомогентизиновая кислота → фумарилацетоацетат → фумарат+ацетоацетат → ЦТК</li>\n<li>Тирозин → меланин (кожный пигмент)</li>\n</ol>\n<p><strong>Заболевания (таблица — обязательно знать все 4):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Заболевание</th><th>Дефектный фермент</th><th>Накопление</th><th>Клиника</th></tr></thead>\n<tbody>\n<tr><td>Фенилкетонурия (ФКУ)</td><td>фенилаланингидроксилаза</td><td>фенилаланин, фенилпируват</td><td>умственная отсталость, судороги, нарушение пигментации</td></tr>\n<tr><td>Альбинизм</td><td>тирозиназа</td><td>нет меланина</td><td>светлая кожа, светобоязнь, ↓зрение</td></tr>\n<tr><td>Алкаптонурия</td><td>оксидаза гомогентизиновой к-ты</td><td>гомогентизиновая к-та</td><td>моча чернеет на воздухе, охроноз, артрит</td></tr>\n<tr><td>Болезнь Паркинсона</td><td>↓дофамина в базальных ганглиях (не всегда генетич.)</td><td>—</td><td>нарушение двигат. активности, тремор</td></tr>\n</tbody>\n</table></div>\n<p><strong>Обмен цистеина</strong></p>\n<p>Синтез: гомоцистеин + серин → цистатионин → цистеин (фермент цистатионин-β-синтаза, витамин В6).</p>\n<p><strong>Пути использования цистеина:</strong></p>\n<ul>\n<li>Синтез таурина (подавляет нейрональную возбудимость)</li>\n<li>Синтез глутатиона (антиоксидант)</li>\n<li>Образование сульфатов (для конъюгации токсинов — ФАФС)</li>\n<li>Включение в белки (SH-группы → дисульфидные связи)</li>\n</ul>\n<p>Нарушение — Цистинурия: дефект транспорта цистина в почках → цистиновые камни.</p>\n<p><strong>Обмен серина и глицина</strong></p>\n<p>Синтез серина: из 3-фосфоглицерата (метаболит гликолиза!). Синтез глицина: из серина (серин-оксиметилтрансфераза, Н4-фолат).</p>\n<p>Пути использования: синтез белков, пуринов, пиримидинов, гема, креатина, глутатиона. Глицин — тормозной медиатор спинного мозга.</p>\n<p><strong>Обмен аргинина</strong></p>\n<p>Пути использования (5 пунктов):</p>\n<ol>\n<li>Синтез белков</li>\n<li>Синтез креатина (с глицином и метионином)</li>\n<li>Синтез NO (NO-синтаза: аргинин+О2 → цитруллин+NO• — эндотелиальный фактор релаксации, нейромедиатор)</li>\n<li>Источник орнитина для орнитинового цикла</li>\n<li>Синтез агматина</li>\n</ol>\n<p>Нарушение — Гипераргининемия: дефект аргиназы → ↑аргинина, ↑аммиака, умственная отсталость.</p>", "conspectHtml": "<p><strong>43. Обмен отдельных аминокислот</strong></p>\n<p><strong>Метионин:</strong> Метионин+АТФ→SAM→(отдаёт CH3)→SAH→Гомоцистеин →(регенерация: фолат+В12)→ Метионин Нарушение: Гомоцистинурия (дефект цистатионин-β-синтазы) — сосудистый фиброз, отставание</p>\n<p><strong>Фенилаланин/Тирозин:</strong> Фен →(фенилаланингидроксилаза)→ Тир → [катехоламины / гомогентизиновая к-та→ЦТК / меланин]</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Болезнь</th><th>Дефект</th><th>Накопление</th><th>Клиника</th></tr></thead>\n<tbody>\n<tr><td>ФКУ</td><td>фенилаланингидроксилаза</td><td>Фен, фенилпируват</td><td>умств. отсталость</td></tr>\n<tr><td>Альбинизм</td><td>тирозиназа</td><td>нет меланина</td><td>светлая кожа</td></tr>\n<tr><td>Алкаптонурия</td><td>оксидаза гомогентизин. к-ты</td><td>гомогентизин. к-та</td><td>моча чернеет</td></tr>\n<tr><td>Паркинсон</td><td>↓дофамина</td><td>—</td><td>тремор</td></tr>\n</tbody>\n</table></div>\n<p><strong>Цистеин:</strong> Гомоцистеин+Серин→(цистатионин-β-синтаза,В6)→Цистеин → таурин/глутатион/сульфаты(ФАФС)/белки Нарушение: Цистинурия — камни в почках</p>\n<p><strong>Серин/Глицин:</strong> Серин из 3-фосфоглицерата; Глицин из серина → белки, пурины/пиримидины, гем, креатин, глутатион</p>\n<p><strong>Аргинин:</strong> → белки / креатин / NO (NO-синтаза) / орнитин (цикл мочевины) / агматин Нарушение: Гипераргининемия (дефект аргиназы)</p>"}, {"num": 44, "title": "Транспорт АК, метаболизм АК нервной ткани, синтез цистатиона и таурина, глиоксилатный цикл", "section": "Раздел 5", "sectionTitle": "Биохимия нервной ткани, гормональная регуляция", "explanationHtml": "<p>Переходим к биохимии нервной ткани — мозг вообще склонен \"жить по своим правилам\".</p>\n<p><strong>Транспорт аминокислот в нервной ткани</strong> — работают 2 разные системы: для нейтральных аминокислот и для кислых и основных аминокислот. Незаменимые аминокислоты поступают путём активного транспорта — через γ-глутаминовый цикл (тот же механизм, что и в кишечнике!).</p>\n<p><strong>Особенности метаболизма аминокислот нервной ткани (5 пунктов):</strong></p>\n<ol>\n<li>Обмен АК между мозгом и кровью идёт очень интенсивно</li>\n<li>Мозг накапливает аминокислоты в небольшом количестве</li>\n<li>Из всех АК, поступивших в мозг,
