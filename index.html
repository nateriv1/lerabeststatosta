ают неполярные АК (аланин, валин), много пролина, лизина, глицина, но отсутствует гидроксилизин (важное отличие от коллагена!) и мало гидроксипролина.</p>\n<p>Структурная логика: большое количество гидрофобных радикалов препятствует формированию стабильной глобулы → полипептидная цепь эластина НЕ формирует регулярную вторичную/третичную структуру, а сворачивается в \"клубок\" — это прямо противоположно коллагену.</p>\n<p><strong>Сшивки эластина — десмозины:</strong></p>\n<p>В межклеточном пространстве молекулы эластина (тропоэластин) сшиваются с образованием специфических структур — десмозинов и лизиннорлейцина (оба образуются из остатков лизина).</p>\n<p>Механизм образования десмозина:</p>\n<ol>\n<li>3 остатка лизина окисляются до ε-альдегидов</li>\n<li>Соединяются с 4-м остатком лизина → образуется замещённое пиридиновое кольцо (десмозин — то есть сшивка образована сразу четырьмя остатками лизина, в отличие от более простых сшивок коллагена!)</li>\n</ol>\n<p>Фермент: лизилоксидаза (Cu2+-зависимая, активность также зависит от пиридоксина — витамина В6).</p>\n<p><strong>Свойства:</strong> обеспечивает эластичность тканей (кожа, стенки сосудов, лёгкие, связки) — способность растягиваться в несколько раз и возвращаться в исходное состояние.</p>\n<p><strong>Биосинтез эластина:</strong></p>\n<p>Синтезируется фибробластами в виде растворимого предшественника — тропоэластина. После секреции в межклеточный матрикс происходит формирование сшивок (десмозинов) при участии лизилоксидазы (Cu2+).</p>\n<p><strong>Катаболизм эластина:</strong></p>\n<p>Разрушается ферментом эластазой нейтрофилов. В норме её активность контролируется (ингибируется) белком α1-антитрипсином (тот же белок острой фазы, который уже встречался как ингибитор протеаз!).</p>\n<p>Клиническая связка: дефицит α1-антитрипсина → эластаза нейтрофилов работает бесконтрольно → разрушение эластина в лёгких → развитие эмфиземы.</p>\n<p>Логика этой патологии: без \"тормоза\" (α1-антитрипсина) фермент, который в норме нужен для нормального обновления/защиты ткани, начинает разрушать собственную структурную основу лёгких.</p>\n<p><strong>Мини-сравнение коллаген vs эластин:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Коллаген</th><th>Эластин</th></tr></thead>\n<tbody>\n<tr><td>Структура</td><td>тройная спираль (регулярная)</td><td>клубок (нерегулярная)</td></tr>\n<tr><td>Гидроксилизин</td><td>есть, важен</td><td>ОТСУТСТВУЕТ</td></tr>\n<tr><td>Тип сшивок</td><td>альдольная конденсация</td><td>десмозины (Cu2+-лизилоксидаза)</td></tr>\n<tr><td>Свойство</td><td>прочность, нерастяжимость</td><td>эластичность, растяжимость</td></tr>\n<tr><td>Катаболизм</td><td>тканевая коллагеназа (Zn2+)</td><td>эластаза нейтрофилов</td></tr>\n<tr><td>Ингибитор фермента</td><td>—</td><td>α1-антитрипсин</td></tr>\n<tr><td>Патология при дефекте</td><td>фиброз/аутоиммунные</td><td>эмфизема лёгких</td></tr>\n</tbody>\n</table></div>", "conspectHtml": "<p><strong>96. Эластин: состав, строение, биосинтез, катаболизм</strong></p>\n<p><strong>Состав:</strong> гликопротеин ~800АК, много Ala,Val,Pro,Lys,Gly; НЕТ гидроксилизина, мало гидроксипролина</p>\n<p><strong>Строение:</strong> НЕ формирует регулярную II/III структуру (гидрофобные радикалы) → \"клубок\", разные конформации</p>\n<p><strong>Сшивки — десмозины:</strong> 3 остатка Lys → ε-альдегиды → +4-й Lys → пиридиновое кольцо (десмозин, из 4 Lys!) Фермент: лизилоксидаза (Cu2+, завис. от вит.В6)</p>\n<p><strong>Свойства:</strong> эластичность (кожа, сосуды, лёгкие, связки) — растяжение+возврат формы</p>\n<p><strong>Биосинтез:</strong> фибробласты → тропоэластин (раствор.предшеств.) → сшивки в матриксе (лизилоксидаза)</p>\n<p><strong>Катаболизм:</strong> эластаза нейтрофилов → в норме ингибируется α1-антитрипсином <em>Дефицит α1-антитрипсина → неконтролируем. эластаза → разрушение эластина лёгких → эмфизема</em></p>\n<p><strong>Сравнение с коллагеном:</strong> тройная спираль(регулярная) vs клубок; есть гидроксилизин vs нет; коллагеназа(Zn) vs эластаза; фиброз vs эмфизема</p>"}, {"num": 97, "title": "Фибронектин, гликозаминогликаны (ГАГ), протеогликаны", "section": "Раздел 8", "sectionTitle": "Биохимия мышечной и соединительной тканей", "explanationHtml": "<p>Финальный вопрос раздела соединительной ткани — разберём три компонента внеклеточного матрикса.</p>\n<p><strong>Фибронектин</strong></p>\n<p>Гликопротеин, построен из 2 идентичных полипептидных цепей, соединённых дисульфидными связями. Существует в 2 формах:</p>\n<ul>\n<li>Растворимая (плазменная) — циркулирует в крови</li>\n<li>Нерастворимая (тканевая) — часть внеклеточного матрикса</li>\n</ul>\n<p>Функции фибронектина: адгезия клеток (прикрепление к матриксу), миграция, пролиферация, участие в воспалении и репарации (заживлении).</p>\n<p>Логическая связка: фибронектин — это тот самый белок, к которому прикрепляется тромбоцит через фактор Виллебранда при адгезии в первичном гемостазе, и тот же белок, к которому \"прошивается\" фибрин ковалентными связями через фактор XIIIа. Он же участвует в миграции фибробластов при заживлении ран.</p>\n<p><strong>Гликозаминогликаны (ГАГ)</strong> — линейные, отрицательно заряженные гетерополисахариды.</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>ГАГ</th><th>Особенности</th><th>Локализация/функция</th></tr></thead>\n<tbody>\n<tr><td>Гиалуроновая кислота</td><td>НЕТ сульфатных групп</td><td>основа протеогликановых агрегатов; рессорная функция в суставах, заживление ран, ангиогенез</td></tr>\n<tr><td>Хондроитинсульфаты (4 и 6)</td><td>сульфатированы</td><td>хрящ, кости, кожа</td></tr>\n<tr><td>Гепарансульфат</td><td>много N-сульфатных групп</td><td>компонент клеточной мембраны (рецептор, адгезия)</td></tr>\n<tr><td>Гепарин</td><td>вариант гепарансульфата</td><td>антикоагулянт (активирует антитромбин III)</td></tr>\n<tr><td>Кератансульфат</td><td>вместо гексуроновой кислоты — галактоза</td><td>тип I — роговица, тип II — хрящи</td></tr>\n</tbody>\n</table></div>\n<p>Отрицательный заряд ГАГ (за счёт сульфатных и карбоксильных групп) критически важен для их функции: он притягивает воду и катионы, создавая осмотическое давление, которое и обеспечивает \"рессорные\" (амортизирующие) свойства хряща и суставной жидкости.</p>\n<p><strong>Протеогликаны</strong> — высокомолекулярные соединения: белок (5-10%) + ГАГ (90-95%, то есть углеводная часть преобладает, в отличие от гликопротеинов вроде коллагена/эластина, где белок доминирует!).</p>\n<p><strong>Структура (\"ершик\"):</strong></p>\n<p>Молекула гиалуроновой кислоты (стержень-основа) → через связывающий белок присоединяется коровый (сердцевидный) белок → к коровому белку прикреплены боковые цепи хондроитинсульфата и кератансульфата (как \"щетинки ёршика для чистки бутылок\").</p>\n<p><strong>Функции протеогликанов (4 пункта):</strong></p>\n<ol>\n<li>Структурный компонент межклеточного матрикса</li>\n<li>Взаимодействуют с коллагеном и эластином (связывают всю структуру матрикса воедино)</li>\n<li>Регулируют водно-солевой обмен (тургор тканей)</li>\n<li>Роль \"молекулярного сита\" — барьер для микроорганизмов + рессорная функция (в суставах, межпозвоночных дисках)</li>\n</ol>\n<p><strong>Итоговая логика вопроса:</strong> коллаген (прочность) + эластин (эластичность) + фибронектин (склеивание/адгезия) + протеогликаны с ГАГ (заполнение пространства, амортизация, удержание воды) — вместе они формируют полноценный внеклеточный матрикс.</p>", "conspectHtml": "<p><strong>97. Фибронектин, гликозаминогликаны, протеогликаны</strong></p>\n<p><strong>Фибронектин:</strong> гликопротеин, 2 идентичные ППЦ (дисульфидные связи). Формы: растворимая(плазма) / нерастворимая(ткань) Функции: адгезия, миграция, пролиферация, воспаление, репарация <em>Связь: адгезия тромбоцитов, сшивка с фибрином</em></p>\n<p><strong>ГАГ (линейные, отрицательно заряженные):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>ГАГ</th><th>Особенность</th><th>Локализация</th></tr></thead>\n<tbody>\n<tr><td>Гиалуроновая к-та</td><td>без сульфатных групп</td><td>суставы, заживление, ангиогенез</td></tr>\n<tr><td>Хондроитинсульфаты</td><td>сульфатированы</td><td>хрящ, кости, кожа</td></tr>\n<tr><td>Гепарансульфат</td><td>N-сульфатные группы</td><td>мембрана(рецептор,адгезия)</td></tr>\n<tr><td>Гепарин</td><td>вариант гепарансульфата</td><td>антикоагулянт</td></tr>\n<tr><td>Кератансульфат</td><td>галактоза вместо гексуроновой к-ты</td><td>роговица(I)/хрящ(II)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Протеогликаны:</strong> белок(5-10%)+ГАГ(90-95%) Строение (\"ершик\"): гиалуроновая к-та(стержень) → связывающий белок → коровый белок → боковые цепи хондроитинсульфата/кератансульфата</p>\n<p>Функции(4): структура матрикса, связь с коллагеном/эластином, водно-солевой обмен(тургор), молекулярное сито+рессорная функция</p>"}, {"num": 98, "title": "Переваривание нуклеиновых кислот в ЖКТ", "section": "Раздел 9", "sectionTitle": "Обмен нуклеиновых кислот, матричные биосинтезы", "explanationHtml": "<p>Первый важный момент: организм человека синтезирует нуклеотиды сам, de novo, и не зависит от их поступления с пищей — ни готовые нуклеотиды, ни азотистые основания из еды НЕ включаются напрямую в собственные нуклеиновые кислоты или коферменты организма.</p>\n<p><strong>Переваривание — по отделам ЖКТ:</strong></p>\n<p>Желудок: HCl отщепляет белковый компонент от нуклеопротеидов + денатурирует саму ДНК и РНК.</p>\n<p>12-перстная кишка (2 шага):</p>\n<ol>\n<li>Эндонуклеазы панкреатического сока (ДНК-аза, РНК-аза) → гидролиз ДНК/РНК до олигонуклеотидов (до 10 нуклеотидных остатков)</li>\n<li>Фосфодиэстеразы панкреатического сока → гидролиз олигонуклеотидов до 3'- и 5'-мононуклеотидов</li>\n</ol>\n<p>Тонкий кишечник (2 шага):</p>\n<ol>\n<li>Нуклеотидазы (специфические фосфатазы) кишечного сока → мононуклеотиды → нуклеозиды + H3PO4. Часть нуклеозидов сразу всасывается в кровь через энтероцит.</li>\n<li>Оставшиеся нуклеозиды → нуклеозидфосфорилазы кишечного сока → рибоза/дезоксирибоза + пуриновые/пиримидиновые основания</li>\n</ol>\n<p>Дальше рибозо-1-фосфат/дезоксирибозо-1-фосфат гидролизуются фосфатазой до H3PO4 + свободных сахаров, которые всасываются в энтероцит и либо идут в обмен углеводов (гликолиз/ПФП), либо на синтез собственных нуклеиновых кислот организма.</p>\n<p><strong>Судьба азотистых оснований — важная асимметрия между пуринами и пиримидинами:</strong></p>\n<ul>\n<li>Пуриновые основания — всасываются в энтероцит и там же метаболизируются до мочевой кислоты. Часть мочевой кислоты идёт в кровь → выводится с мочой; часть возвращается в просвет кишечника → выводится с калом.</li>\n<li>Пиримидиновые основания — частично всасываются в энтероцит → с кровью в печень и мышцы для дальнейшего катаболизма.</li>\n</ul>\n<p><strong>Толстый кишечник:</strong> оставшиеся (не всосавшиеся) пиримидиновые основания расщепляются бактериями до NH3, CO2, β-аланина и β-аминомасляной кислоты (β-аминобутирата).</p>\n<p>Интересная деталь: под действием бактериальной микрофлоры β-аланин может включаться в структуру пантотеновой кислоты (витамин B5!) — кишечные бактерии частично \"утилизируют\" продукт распада пиримидинов, превращая его обратно в полезный витамин.</p>", "conspectHtml": "<p><strong>98. Переваривание нуклеиновых кислот в ЖКТ</strong></p>\n<p><em>Организм синтезирует нуклеотиды de novo — пищевые НК НЕ встраиваются в собственные НК/коферменты</em></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Отдел</th><th>Фермент</th><th>Продукт</th></tr></thead>\n<tbody>\n<tr><td>Желудок</td><td>HCl</td><td>отщепл. белка, денатурация ДНК/РНК</td></tr>\n<tr><td>12-п. кишка</td><td>эндонуклеазы(ДНК-аза,РНК-аза)</td><td>олигонуклеотиды</td></tr>\n<tr><td>12-п. кишка</td><td>фосфодиэстеразы</td><td>3'/5'-мононуклеотиды</td></tr>\n<tr><td>Тонкая кишка</td><td>нуклеотидазы(фосфатазы)</td><td>нуклеозиды+H3PO4 (часть всасыв.)</td></tr>\n<tr><td>Тонкая кишка</td><td>нуклеозидфосфорилазы</td><td>рибоза/дезоксирибоза + основания</td></tr>\n</tbody>\n</table></div>\n<p><strong>Судьба оснований:</strong></p>\n<ul>\n<li>Пурины → метаболизм ПРЯМО в энтероците → мочевая кислота → кровь(моча) / просвет кишки(кал)</li>\n<li>Пиримидины → частично всасыв. → кровь → печень, мышцы (дальнейший катаболизм)</li>\n</ul>\n<p><strong>Толстая кишка (бактерии):</strong> остаточные пиримидины → NH3,CO2,β-аланин,β-аминобутират <em>β-аланин → может включаться в пантотеновую к-ту(вит.B5) → HS-KoA</em></p>"}, {"num": 99, "title": "Синтез пуриновых нуклеотидов", "section": "Раздел 9", "sectionTitle": "Обмен нуклеиновых кислот, матричные биосинтезы", "explanationHtml": "<p>Пуриновое кольцо буквально собирается по кусочкам из разных источников углерода и азота, как мозаика.</p>\n<p><strong>Место синтеза:</strong> основное место — печень, откуда готовые нуклеотиды поступают в ткани, НЕ способные к собственному синтезу — эритроциты, полиморфноядерные лейкоциты (эритроциты вообще не имеют ядра и не могут синтезировать нуклеиновые кислоты!).</p>\n<p><strong>\"Строительные материалы\" пуринового кольца — 4 источника:</strong></p>\n<ol>\n<li>3 аминокислоты: аспартат (Асп), глутамин (Глн), глицин (Гли)</li>\n<li>CO2 (прямо из воздуха/метаболизма)</li>\n<li>2 одноуглеродных производных тетрагидрофолата: N10-формил-Н4-фолат и N5,N10-метенил-Н4-фолат</li>\n</ol>\n<p><strong>Ключевой строительный \"фундамент\" — ФРДФ (5-фосфорибозил-1-дифосфат):</strong></p>\n<p>Образуется переносом β,γ-пирофосфатного остатка с АТФ на рибозо-5-фосфат (источник рибозо-5-фосфата — ПФ-путь!):</p>\n<p>Рибозо-5-фосфат + АТФ →(ФРДФ-синтаза)→ ФРДФ + АМФ</p>\n<p>Пуриновое кольцо собирается ПРЯМО на этом остатке ФРДФ.</p>\n<p><strong>Результат сборки:</strong> Инозин-5-монофосфат (ИМФ) — это первый полноценный пуриновый нуклеотид, образующийся в этом пути. На его синтез затрачивается 6 молекул АТФ (очень энергозатратный процесс!).</p>\n<p><strong>От ИМФ — развилка к двум конечным продуктам (АМФ и ГМФ):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>Затраты</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>ИМФ → АМФ</td><td>использует ГТФ</td><td>через аденилосукцинат (аденилосукцинатсинтетаза + аспартат → аденилосукциназа → фумарат отщепляется)</td></tr>\n<tr><td>ИМФ → ГМФ</td><td>использует АТФ</td><td>через ксантозин-5-монофосфат (ИМФ-дегидрогеназа, НАД+ → +глутамин, ГМФ-синтетаза)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Ключевая регуляторная идея — перекрёстное использование:</strong></p>\n<p>При синтезе АМФ расходуется ГТФ, а при синтезе ГМФ расходуется АТФ — каждый из двух путей \"использует энергию соседа\". Это красивый механизм перекрёстной регуляции, который автоматически поддерживает баланс адениловых и гуаниловых нуклеотидов в клетке.</p>\n<p><strong>Образование ди- и трифосфатов из монофосфатов:</strong></p>\n<ul>\n<li>Аденилаткиназа: АМФ + АТФ → 2 АДФ (особенно активна в печени и мышцах; поддерживает равновесие фонда АМФ/АДФ/АТФ — тот же самый фермент, что и в миоаденилаткиназной реакции!)</li>\n<li>Гуанилаткиназа: ГМФ + АТФ → ГДФ + АДФ</li>\n<li>Нуклеозиддифосфаткиназа: ГДФ + АТФ → ГТФ + АДФ</li>\n</ul>", "conspectHtml": "<p><strong>99. Синтез пуриновых нуклеотидов</strong></p>\n<p><strong>Место синтеза:</strong> печень → эритроциты, лейкоциты (сами не синтезируют)</p>\n<p><strong>Источники пуринового кольца (4):</strong></p>\n<ol>\n<li>3 АК: Асп, Глн, Гли</li>\n<li>CO2</li>\n<li>2 производных Н4-фолата (формил-, метенил-)</li>\n</ol>\n<p><strong>ФРДФ:</strong> Рибозо-5-Ф(из ПФП)+АТФ →(ФРДФ-синтаза)→ ФРДФ+АМФ Пуриновое кольцо собирается прямо на ФРДФ → ИМФ (затрата 6 АТФ)</p>\n<p><strong>Развилка от ИМФ:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>Затраты энергии</th></tr></thead>\n<tbody>\n<tr><td>ИМФ→АМФ</td><td>тратит ГТФ</td></tr>\n<tr><td>ИМФ→ГМФ</td><td>тратит АТФ</td></tr>\n</tbody>\n</table></div>\n<p><em>Перекрёстное использование — автоматич. баланс адениловых/гуаниловых нуклеотидов</em></p>\n<p><strong>Образование НДФ/НТФ:</strong> Аденилаткиназа: АМФ+АТФ→2АДФ (активна в печени,мышцах) Гуанилаткиназа: ГМФ+АТФ→ГДФ+АДФ Нуклеозиддифосфаткиназа: ГДФ+АТФ→ГТФ+АДФ</p>"}, {"num": 100, "title": "Катаболизм пуриновых нуклеотидов, резервные пути реутилизации, подагра, синдром Леша-Найхана", "section": "Раздел 9", "sectionTitle": "Обмен нуклеиновых кислот, матричные биосинтезы", "explanationHtml": "<p>Разберём, как пуриновые нуклеотиды разбираются до конечного продукта — мочевой кислоты, зачем клетке \"экономные\" резервные пути, и что происходит при поломке этой системы.</p>\n<p><strong>Катаболизм пуриновых нуклеотидов — конечный продукт у человека: мочевая кислота</strong></p>\n<p>Путь от АТФ: АТФ → (постадийно) → АДФ → АМФ → аденозин → (гидролитическое удаление NH2-группы) → инозин ИЛИ АМФ может напрямую превращаться в аденин (отделение рибозо-1-фосфата)</p>\n<p>Путь от ГТФ: ГТФ → ГДФ → ГМФ → гуанозин → гуанин</p>\n<p>Схождение путей: инозин (от аденозина) → гипоксантин; гуанин → ксантин; гипоксантин окисляется в ксантин ферментом ксантиноксидазой (КО); ксантин → окисляется той же КО → мочевая кислота (конечный продукт!)</p>\n<p>И адениновая, и гуаниновая ветви в итоге сходятся на ксантине, а дальше идут по одному общему пути к мочевой кислоте — тот же принцип конвергенции, что в общем пути катаболизма!</p>\n<p><strong>Фермент ксантиноксидаза (КО)</strong> — активна в присутствии O2, генерирует H2O2. Содержит ионы Mo2+ и Fe3+. Активна преимущественно в печени и кишечнике.</p>\n<p>Мочевая кислота удаляется в основном с мочой, немного — через кишечник с калом.</p>\n<p><strong>Резервные (спасательные) пути реутилизации:</strong></p>\n<ol>\n<li>Синтез нуклеотидов de novo — очень энергозатратен (6 АТФ только на ИМФ!)</li>\n<li>Клетке нужно МНОГО нуклеотидов постоянно → эволюционно выгоднее \"спасать\" уже готовые азотистые основания/нуклеозиды, а не разбирать их до конца и синтезировать заново</li>\n</ol>\n<p><strong>2 ключевых фермента спасательных путей:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Фермент</th><th>Реакция</th></tr></thead>\n<tbody>\n<tr><td>Гуанин-гипоксантин-фосфорибозилтрансфераза (ГГФРТ)</td><td>ксантин/гипоксантин → гуанозин/инозин</td></tr>\n<tr><td>Аденин-гипоксантин-фосфорибозилтрансфераза</td><td>гипоксантин → инозин ИЛИ аденин → аденозин</td></tr>\n</tbody>\n</table></div>\n<p>Плюс нуклеозиды могут повторно фосфорилироваться (аденозинкиназа): Аденозин + АТФ → АМФ + АДФ</p>\n<p>Логика: вместо того чтобы разбирать нуклеозид до основания+рибозы+фосфата и потом заново собирать весь нуклеотид (что стоило бы 6 АТФ), клетка может просто \"довесить\" обратно нужную часть — гораздо дешевле энергетически.</p>\n<p><strong>Подагра</strong></p>\n<p>Определение: нарушение обмена пуринов, проявляющееся гиперурикемией (↑мочевой кислоты в крови) и отложением уратов (солей мочевой кислоты) в суставах и почках.</p>\n<p>Причины (2 механизма): дефицит ферментов спасательных путей (например, частичный дефицит ГГФРТ — если спасательный путь не работает, организму приходится синтезировать пурины исключительно de novo → в разы больше субстрата идёт на распад → больше конечного продукта, мочевой кислоты!) или ↑активности ксантиноксидазы.</p>\n<p>Клиническая деталь: именно поэтому препарат аллопуринол (конкурентный ингибитор ксантиноксидазы) используется для лечения подагры — он напрямую блокирует финальный фермент, который и производит мочевую кислоту.</p>\n<p><strong>Синдром Леша-Найхана</strong></p>\n<p>Причина: наследственный ПОЛНЫЙ дефицит гуанин-гипоксантин-фосфорибозилтрансферазы (ГГФРТ) — обрати внимание на разницу с подагрой: там частичный дефицит, здесь — полное отсутствие фермента!</p>\n<p>Механизм: без ГГФРТ спасательный путь не работает вообще → накопление ФРДФ (субстрат, который должен был пойти на спасательный путь, а вместо этого копится) → гиперактивация синтеза пуринов de novo (избыток ФРДФ стимулирует именно этот путь!) → тяжёлая гиперурикемия</p>\n<p>Клиника: тяжёлые неврологические нарушения, склонность к членовредительству (характерный, специфический симптом), задержка умственного развития.</p>", "conspectHtml": "<p><strong>100. Катаболизм пуринов, резервные пути, подагра, Леша-Найхана</strong></p>\n<p><strong>Катаболизм:</strong> АТФ→АДФ→АМФ→аденозин→инозин (или АМФ→аденин) ГТФ→ГДФ→ГМФ→гуанозин→гуанин</p>\n<p>Оба пути → гипоксантин/гуанин →(ксантиноксидаза,O2,Mo2+,Fe3+)→ ксантин →(КО)→ Мочевая кислота</p>\n<p><strong>Резервные пути (экономия энергии — de novo стоит 6 АТФ на ИМФ!):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Фермент</th><th>Реакция</th></tr></thead>\n<tbody>\n<tr><td>ГГФРТ</td><td>ксантин/гипоксантин → гуанозин/инозин</td></tr>\n<tr><td>Аденин-ГФРТ</td><td>гипоксантин→инозин; аденин→аденозин</td></tr>\n</tbody>\n</table></div>\n<p><strong>Подагра:</strong> гиперурикемия + ураты в суставах/почках. Причины: дефицит ферментов спасательн.путей(частичный ГГФРТ) или ↑КО <em>Терапия: аллопуринол(ингибитор КО)</em></p>\n<p><strong>Синдром Леша-Найхана:</strong> ПОЛНЫЙ дефицит ГГФРТ → ↑ФРДФ → гиперактивация синтеза пуринов de novo → тяжёлая гиперурикемия → неврологич. нарушения, членовредительство, отставание</p>"}, {"num": 101, "title": "Синтез пиримидиновых нуклеотидов, катаболизм, пути регенерации", "section": "Раздел 9", "sectionTitle": "Обмен нуклеиновых кислот, матричные биосинтезы", "explanationHtml": "<p>В отличие от пуринов (где кольцо собирается прямо на рибозо-фосфатной \"раме\" — ФРДФ), пиримидиновое кольцо сначала полностью собирается ОТДЕЛЬНО, и только потом присоединяется к рибозе.</p>\n<p><strong>Место синтеза:</strong> практически все клетки, в основном печень и мышцы, за исключением зрелых эритроцитов. Процесс идёт в цитозоле.</p>\n<p><strong>Исходные вещества:</strong> аспарагиновая кислота, глутамин, CO2. Затрачивается 2 молекулы АТФ и тетрагидрофолат (Н4-фолат).</p>\n<p><strong>3 этапа синтеза:</strong></p>\n<p>Этап I — образование карбамоилфосфата (в цитозоле): CO2 + глутамин + 2АТФ → (фермент карбамоилфосфатсинтетаза II) → карбамоилфосфат</p>\n<p>Важная деталь для сравнения: это ДРУГОЙ фермент, чем в синтезе мочевины (там была карбамоилфосфатсинтетаза I, работающая в митохондриях печени, субстратом азота там служит свободный NH3)! Здесь — синтетаза II, в цитозоле, субстрат азота — глутамин.</p>\n<p>Этап II — образование пиримидинового кольца: Карбамоилфосфат + аспартат → (фермент аспартаттранскарбамоилаза) → карбамоиласпарагиновая кислота → (дегидратаза, -H2O) → дигидрооротовая кислота → (дегидрогеназа, НАД+) → оротовая кислота</p>\n<p>Этап III — присоединение к рибозе, формирование нуклеотида: Оротовая кислота + ФРДФ (тот же самый ФРДФ, что и в синтезе пуринов! — общий \"строительный материал\" для обоих путей) → оротидинмонофосфат → (декарбоксилаза, -CO2) → Уридин-5'-монофосфат (УМФ)</p>\n<p><strong>От УМФ — дальнейшие превращения к другим пиримидиновым нуклеотидам:</strong></p>\n<p>УМФ → (киназы) → УДФ → УТФ</p>\n<p>УТФ → ЦТФ (аминирование, донор аминогруппы — глутамин, фермент ЦТФ-синтаза)</p>\n<p>УДФ → дУДФ → дУМФ → ТМФ (метилирование, донор метильной группы — N5,N10-метенил-Н4-фолат, фермент ТМФ-синтаза) — вот откуда берётся тимин, специфичный именно для ДНК!</p>\n<p><strong>Катаболизм пиримидиновых нуклеотидов:</strong></p>\n<p>ЦТФ, УТФ, ТТФ → (гидролазы) → пиримидиновые мононуклеотиды (ЦМФ, УМФ, ТМФ) → (нуклеотидазы/фосфатазы) → азотистые основания (цитозин, урацил, тимин)</p>\n<p>Конечные продукты распада: CO2, NH3, β-аланин и β-аминомасляная кислота (β-аминобутират)</p>\n<p>Обрати внимание на принципиальное отличие от пуринов: пиримидиновое кольцо при катаболизме полностью РАЗРУШАЕТСЯ до простых молекул (нет аналога мочевой кислоты как единого \"конечного продукта\"), тогда как пуриновое кольцо сохраняется целиком вплоть до мочевой кислоты.</p>\n<p><strong>Судьба β-аланина и β-аминобутирата:</strong></p>\n<ul>\n<li>В мышцах: используются на синтез дипептидов карнозина (увеличивает амплитуду мышечных сокращений) и ансерина (связан с процессом возбуждения) — оба функционируют как нейропептиды</li>\n<li>В других тканях (особенно печени): трансаминируются с α-КГ → образуются малонил-SKoA и сукцинил-SKoA → включаются в ЦТК или другие метаболические пути</li>\n</ul>\n<p><strong>Пути регенерации пиримидиновых нуклеотидов:</strong></p>\n<p>Логика та же, что и с пуринами — использование уже готовых оснований/нуклеозидов из катаболизма избегает энергозатратного повторного синтеза de novo целого кольца.</p>\n<p>Примеры:</p>\n<ul>\n<li>Уридинфосфорилаза: Урацил + рибозо-1-фосфат → уридин + H3PO4</li>\n<li>Уридинцитидинкиназа: Уридин + АТФ → УМФ + АДФ</li>\n<li>Цитидиндезаминаза: ЦМФ + H2O → УМФ + NH3 (цитидиновые нуклеотиды могут \"перетекать\" в уридиновые прямо путём дезаминирования!)</li>\n</ul>", "conspectHtml": "<p><strong>101. Синтез и катаболизм пиримидиновых нуклеотидов</strong></p>\n<p><strong>Место синтеза:</strong> цитозоль, печень+мышцы (НЕ эритроциты). Исходные: Асп, Глн, CO2, +2АТФ, Н4-фолат</p>\n<p><strong>3 этапа:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Этап</th><th>Р-ция</th><th>Фермент</th></tr></thead>\n<tbody>\n<tr><td>I</td><td>CO2+Глн+2АТФ→Карбамоилфосфат</td><td>карбамоилфосфатсинтетаза II (цитозоль! ≠ синтетаза I мочевины)</td></tr>\n<tr><td>II</td><td>+Аспартат→...→Оротовая к-та</td><td>аспартаттранскарбамоилаза, дегидратаза, ДГ(НАД+)</td></tr>\n<tr><td>III</td><td>Оротовая к-та+ФРДФ→оротидинмонофосфат→(-CO2)→УМФ</td><td>декарбоксилаза</td></tr>\n</tbody>\n</table></div>\n<p><strong>Далее:</strong> УМФ→УДФ→УТФ →ЦТФ(аминирование,Глн) / УДФ→дУДФ→дУМФ→ТМФ(метилирование,Н4-фолат)</p>\n<p><strong>Катаболизм:</strong> ЦТФ/УТФ/ТТФ → мононуклеотиды → основания → CO2+NH3+β-аланин+β-аминобутират <em>Кольцо разрушается полностью (в отличие от пуринов!)</em></p>\n<p>Судьба β-аланина/β-аминобутирата: мышцы→карнозин,ансерин(нейропептиды) / печень→трансаминир.→малонил-КоА,сукцинил-КоА→ЦТК</p>\n<p><strong>Регенерация:</strong> Урацил+рибозо-1-Ф→(уридинфосфорилаза)→Уридин→(+АТФ,уридинцитидинкиназа)→УМФ ЦМФ→(цитидиндезаминаза,+Н2О)→УМФ+NH3</p>"}, {"num": 102, "title": "Синтез пуриновых и пиримидиновых дезоксирибонуклеотидов", "section": "Раздел 9", "sectionTitle": "Обмен нуклеиновых кислот, матричные биосинтезы", "explanationHtml": "<p>Короткий, но концептуально важный вопрос — как клетка получает \"строительные блоки\" именно для ДНК (не РНК). Ключевая идея: дезоксирибонуклеотиды НЕ синтезируются отдельным путём с нуля — они получаются прямым восстановлением уже готовых рибонуклеотидов.</p>\n<p><strong>Принцип:</strong> синтез дезоксирибонуклеотидов идёт путём прямого восстановления 2'-C-атома рибозного остатка, а НЕ отдельным синтезом de novo. То есть клетка не строит дезоксирибозу отдельно — она берёт уже готовую рибозу (из обычных рибонуклеотидов) и просто \"убирает\" один атом кислорода в конкретной позиции.</p>\n<p><strong>Важное условие по времени:</strong> восстановление 2'-C-атома рибозы происходит только после превращения пуриновых и пиримидиновых оснований в соответствующие нуклеозиддифосфаты (НДФ) — то есть реакция работает именно на уровне НДФ.</p>\n<p><strong>4 необходимых компонента для процесса восстановления:</strong></p>\n<ol>\n<li>Фермент рибонуклеотидредуктаза — сам катализирующий фермент</li>\n<li>Белковый кофактор тиоредоксин — донор электронов (ē) и протонов (H+)</li>\n<li>Фермент тиоредоксинредуктаза — регенерирует (восстанавливает) тиоредоксин обратно после того, как он отдал свои электроны</li>\n<li>Кофактор НАДФН2 — конечный источник восстановительных эквивалентов для всей цепи</li>\n</ol>\n<p><strong>Схема реакции (пошагово):</strong></p>\n<p>Рибонуклеозиддифосфат + (восстановленный тиоредоксин, отдаёт 2ē+2H+) →(рибонуклеотидредуктаза)→ 2'-дезоксирибонуклеозиддифосфат + (окисленный тиоредоксин)</p>\n<p>Окисленный тиоредоксин затем регенерируется обратно в восстановленную форму: Окисленный тиоредоксин + НАДФН2 →(тиоредоксинредуктаза)→ Восстановленный тиоредоксин + НАДФ+</p>\n<p>Логика этой \"эстафеты\" электронов: сам фермент рибонуклеотидредуктаза не может напрямую взять электроны с НАДФН — ему нужен промежуточный переносчик (тиоредоксин), который сначала \"заряжается\" от НАДФН через свой собственный фермент (тиоредоксинредуктазу), а потом уже передаёт эти электроны непосредственно на реакцию восстановления рибозы.</p>\n<p><strong>Почему это важно понимать концептуально:</strong> этот единый механизм работает универсально для ВСЕХ дезоксирибонуклеотидов (и пуриновых, и пиримидиновых!) — не нужно отдельного пути для дАДФ, дГДФ, дЦДФ, дУДФ — все они получаются одним и тем же ферментативным механизмом восстановления, просто на разных исходных рибонуклеозиддифосфатах.</p>\n<p>Клиническая/фармакологическая деталь: именно фермент рибонуклеотидредуктаза — мишень некоторых противоопухолевых препаратов (например, гидроксимочевины) — блокируя синтез строительных блоков ДНК, можно избирательно бить по быстро делящимся раковым клеткам.</p>", "conspectHtml": "<p><strong>102. Синтез дезоксирибонуклеотидов</strong></p>\n<p><strong>Принцип:</strong> НЕ отдельный синтез de novo — прямое восстановление 2'-C-атома рибозы уже готовых рибонуклеотидов</p>\n<p><strong>Условие:</strong> восстановление идёт только на уровне нуклеозиддифосфатов (НДФ)</p>\n<p><strong>4 компонента системы:</strong></p>\n<ol>\n<li>Рибонуклеотидредуктаза — сам фермент реакции</li>\n<li>Тиоредоксин — белковый кофактор, донор ē+H+</li>\n<li>Тиоредоксинредуктаза — регенерирует тиоредоксин</li>\n<li>НАДФН2 — источник восстановит. эквивалентов</li>\n</ol>\n<p><strong>Схема:</strong> Рибонуклеозид-ДФ + Тиоредоксин(восст.) →(рибонуклеотидредуктаза)→ 2'-дезоксирибонуклеозид-ДФ + Тиоредоксин(окисл.)</p>\n<p>Тиоредоксин(окисл.) + НАДФН2 →(тиоредоксинредуктаза)→ Тиоредоксин(восст.) + НАДФ+</p>\n<p><em>Единый механизм для ВСЕХ дезоксирибонуклеотидов (пуриновых и пиримидиновых) — экономичнее отдельных путей</em></p>"}, {"num": 103, "title": "Репликация: этапы, субстраты, источники энергии, ферменты, ПЦР, репликация теломер", "section": "Раздел 9", "sectionTitle": "Обмен нуклеиновых кислот, матричные биосинтезы", "explanationHtml": "<p>Репликация — это буквально \"ксерокопирование\" всей ДНК клетки перед делением.</p>\n<p><strong>Определение:</strong> удвоение ДНК — синтез дочерней цепи на матрице родительской. Механизм у человека — полуконсервативный (каждая из 2 новых молекул содержит одну старую + одну новую цепь).</p>\n<p><strong>Локализация:</strong> ядро, цитоплазма, митохондрии. Происходит в S-фазу клеточного цикла.</p>\n<p><strong>Субстраты и источник энергии:</strong> дезоксирибонуклеозидтрифосфаты (дАТФ, дГТФ, дЦТФ, дТТФ) — активируются ионами Mg2+. Энергия для самого присоединения нуклеотидов — из макроэргических связей самих дНТФ.</p>\n<p><strong>4 этапа репликации:</strong></p>\n<ol>\n<li>Инициация:</li>\n</ol>\n<ul>\n<li>ДНК-топоизомераза (гираза) — разрывает фосфоэфирную связь в одной цепи → снимает суперспиральное напряжение</li>\n<li>ДНК-хеликаза — разрывает водородные связи между парами оснований (2 АТФ на каждую пару оснований!) → раскручивает спираль</li>\n<li>SSB-белки (дестабилизирующие) — связывают одноцепочечные участки, не давая им снова слипнуться</li>\n</ul>\n<p>Образуется репликационная вилка, начинающаяся с репликационного глаза. Синтез идёт от точек начала — оринджинов (единица репликации между двумя оринджинами = репликон).</p>\n<p>Лидирующая vs отстающая цепь:</p>\n<ul>\n<li>Лидирующая — синтез совпадает с направлением движения вилки → идёт непрерывно</li>\n<li>Отстающая — синтез не совпадает с направлением вилки → идёт прерывисто, фрагментами Оказаки</li>\n</ul>\n<ol>\n<li>Элонгация:</li>\n</ol>\n<ul>\n<li>Праймаза (ДНК-зависимая РНК-полимераза) — синтезирует РНК-затравку (праймер), 10-20 нуклеотидов (ДНК-полимеразы физически не могут начать синтез с нуля)</li>\n<li>ДНК-полимераза III — присоединяет дНТФ к 3'-OH концу затравки → синтез основной массы новой цепи ДНК</li>\n</ul>\n<ol>\n<li>Исключение праймеров:</li>\n</ol>\n<ul>\n<li>ДНК-полимераза I (или РНК-аза) — удаляет РНК-затравку, отщепляя рибонуклеотиды с 5'-конца</li>\n</ul>\n<ol>\n<li>Терминация:</li>\n</ol>\n<ul>\n<li>ДНК-полимераза I заполняет образовавшуюся брешь дезоксинуклеотидами</li>\n<li>ДНК-лигаза — сшивает фрагменты Оказаки (образует фосфодиэфирную связь между 3'-OH одного фрагмента и 5'-фосфатом следующего) — с затратой АТФ</li>\n</ul>\n<p>Логика всей цепочки: топоизомераза \"готовит почву\" → хеликаза \"разматывает\" → праймаза \"даёт зацепку\" → полимераза III \"строит основную массу\" → полимераза I \"убирает леса и достраивает\" → лигаза \"сшивает всё в единое целое\".</p>\n<p><strong>Метилирование ДНК:</strong> метильные группы присоединяются к аденину и цитозину ферментом ДНК-метилазой, источник метила — SAM. Нужно для структуры хромосом и регуляции транскрипции.</p>\n<p><strong>ПЦР (полимеразная цепная реакция):</strong></p>\n<p>Метод амплификации (многократного увеличения количества) специфического фрагмента ДНК in vitro.</p>\n<p>Биомедицинское значение: диагностика инфекций (обнаружение ДНК возбудителя даже при минимальном его количестве в образце) и генетических заболеваний.</p>\n<p><strong>Репликация теломер:</strong></p>\n<p>Проблема: концевые участки хромосом (теломеры) не могут быть полностью скопированы обычным механизмом репликации (так называемая \"проблема недорепликации концов\").</p>\n<p>Решение — фермент теломераза (содержит собственную РНК-матрицу, работает как обратная транскриптаза) — достраивает теломерные повторы, компенсируя недорепликацию.</p>\n<p><strong>Клинически важная деталь про регуляцию активности теломеразы:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип клеток</th><th>Активность теломеразы</th><th>Следствие</th></tr></thead>\n<tbody>\n<tr><td>Соматические клетки</td><td>неактивна</td><td>теломеры укорачиваются с каждым делением → старение (лимит Хейфлика)</td></tr>\n<tr><td>Раковые и стволовые клетки</td><td>активна</td><td>теломеры не укорачиваются → неограниченное деление</td></tr>\n</tbody>\n</table></div>\n<p>Активация теломеразы — один из ключевых механизмов \"бессмертия\" раковых клеток, а её физиологическое отсутствие в обычных клетках тела — встроенный \"счётчик\" продолжительности жизни клеточной линии.</p>", "conspectHtml": "<p><strong>103. Репликация ДНК, ПЦР, теломеры</strong></p>\n<p><strong>Механизм:</strong> полуконсервативный (1 старая+1 новая цепь). Локализация: ядро,цитоплазма,Mx. S-фаза Субстраты: дАТФ,дГТФ,дЦТФ,дТТФ (+Mg2+)</p>\n<p><strong>4 этапа:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Этап</th><th>Ферменты</th><th>Действие</th></tr></thead>\n<tbody>\n<tr><td>1.Инициация</td><td>топоизомераза(снимает напряжение), хеликаза(разрыв H-связей,2АТФ/пара), SSB-белки</td><td>репликационная вилка</td></tr>\n<tr><td>2.Элонгация</td><td>праймаза(РНК-затравка), ДНК-полимераза III(синтез осн.цепи)</td><td>лидирующая(непрерывно)/отстающая(фрагменты Оказаки)</td></tr>\n<tr><td>3.Искл.праймеров</td><td>ДНК-полимераза I</td><td>удаление РНК-затравки</td></tr>\n<tr><td>4.Терминация</td><td>ДНК-полимераза I(заполн.бреши), ДНК-лигаза(сшивка,+АТФ)</td><td>непрерывная цепь</td></tr>\n</tbody>\n</table></div>\n<p><strong>Метилирование ДНК:</strong> аденин,цитозин ← ДНК-метилаза, донор — SAM</p>\n<p><strong>ПЦР:</strong> амплификация фрагмента ДНК in vitro → диагностика инфекций, генетич. болезней</p>\n<p><strong>Теломеры:</strong> достраиваются теломеразой(РНК-матрица)</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Клетки</th><th>Теломераза</th><th>Итог</th></tr></thead>\n<tbody>\n<tr><td>Соматические</td><td>неактивна</td><td>укорочение → старение(лимит Хейфлика)</td></tr>\n<tr><td>Раковые/стволовые</td><td>активна</td><td>неогранич. деление</td></tr>\n</tbody>\n</table></div>"}, {"num": 104, "title": "Программированная гибель клетки (апоптоз): значение и стадии", "section": "Раздел 9", "sectionTitle": "Обмен нуклеиновых кислот, матричные биосинтезы", "explanationHtml": "<p>Апоптоз — это не \"поломка\" клетки, а наоборот, аккуратный, генетически запрограммированный и энергозависимый процесс самоликвидации.</p>\n<p><strong>Определение:</strong> апоптоз — генетически запрограммированная, энергозависимая форма гибели клеток (клетке нужна энергия, чтобы \"правильно\" себя разобрать).</p>\n<p><strong>Биологическое значение апоптоза (4 пункта):</strong></p>\n<ol>\n<li>Нормализация эмбриогенеза (например, исчезновение перепонок между пальцами в процессе развития плода)</li>\n<li>Предотвращение размножения мутантных и повреждённых клеток — это противоопухолевая защита! (клетка, у которой накопились опасные мутации, в норме \"самоликвидируется\", не давая начало опухоли)</li>\n<li>Регуляция иммунной системы (устранение аутореактивных или уже ненужных иммунных клеток)</li>\n<li>Предотвращение старения (устранение повреждённых/дисфункциональных клеток поддерживает общее качество тканей)</li>\n</ol>\n<p><strong>Стадии апоптоза (4 стадии — последовательный, аккуратный процесс):</strong></p>\n<ol>\n<li>Активация специфических протеаз (каспаз) и эндонуклеаз — запускается \"молекулярная машина разборки\" клетки</li>\n<li>Фрагментация ДНК — сначала на крупные куски, затем на характерные фрагменты по 180-200 пар нуклеотидов (эта конкретная длина — узнаваемый лабораторный маркер апоптоза, знаменитая \"лестница\" при электрофорезе ДНК из погибающих апоптозом клеток!)</li>\n<li>Распад клетки на мембранные апоптозные тельца — клетка не просто разваливается хаотично, а аккуратно \"упаковывает\" своё содержимое в мембранные пузырьки</li>\n<li>Фагоцитоз апоптозных телец макрофагами БЕЗ развития воспаления — это ключевое отличие от некроза!</li>\n</ol>\n<p><strong>Отличие апоптоза от некроза — принципиальная разница:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Апоптоз</th><th>Некроз</th></tr></thead>\n<tbody>\n<tr><td>Клетка</td><td>сморщивается</td><td>набухает</td></tr>\n<tr><td>Мембрана</td><td>НЕ повреждается (сохраняет целостность до конца)</td><td>разрывается</td></tr>\n<tr><td>Содержимое клетки</td><td>аккуратно упаковано в тельца, фагоцитируется</td><td>выходит наружу неконтролируемо</td></tr>\n<tr><td>Воспаление</td><td>НЕТ</td><td>ЕСТЬ</td></tr>\n<tr><td>Энергозатратность</td><td>требует АТФ (активный процесс)</td><td>пассивный процесс</td></tr>\n</tbody>\n</table></div>\n<p>Логика этого сравнения: апоптоз — это \"цивилизованное самоубийство\" клетки, аккуратно упакованное так, чтобы содержимое (потенциально повреждающие ферменты, ДНК-фрагменты) не попало во внеклеточное пространство и не вызвало иммунный ответ/воспаление. Некроз — это \"авария\", неконтролируемое разрушение, при котором содержимое клетки выливается наружу и провоцирует воспалительную реакцию соседних тканей.</p>", "conspectHtml": "<p><strong>104. Апоптоз</strong></p>\n<p><strong>Определение:</strong> генетически запрограммированная, энергозависимая гибель клетки</p>\n<p><strong>Биологическое значение (4):</strong></p>\n<ol>\n<li>Нормализация эмбриогенеза</li>\n<li>Противоопухолевая защита (устранение мутантных клеток)</li>\n<li>Регуляция иммунной системы</li>\n<li>Предотвращение старения</li>\n</ol>\n<p><strong>4 стадии:</strong></p>\n<ol>\n<li>Активация каспаз + эндонуклеаз</li>\n<li>Фрагментация ДНК → фрагменты по 180-200 п.н.</li>\n<li>Распад клетки → апоптозные тельца (мембранные)</li>\n<li>Фагоцитоз макрофагами БЕЗ воспаления</li>\n</ol>\n<p><strong>Апоптоз vs Некроз:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Апоптоз</th><th>Некроз</th></tr></thead>\n<tbody>\n<tr><td>Клетка</td><td>сморщивается</td><td>набухает</td></tr>\n<tr><td>Мембрана</td><td>целостна</td><td>разрыв</td></tr>\n<tr><td>Воспаление</td><td>НЕТ</td><td>ЕСТЬ</td></tr>\n<tr><td>Энергия</td><td>требуется(АТФ)</td><td>не требуется</td></tr>\n</tbody>\n</table></div>"}, {"num": 105, "title": "Типы повреждения ДНК, репарация: этапы, субстраты, ферменты, дефекты репарации и наследственные болезни", "section": "Раздел 9", "sectionTitle": "Обмен нуклеиновых кислот, матричные биосинтезы", "explanationHtml": "<p>ДНК постоянно повреждается — и спонтанно, и под внешним воздействием.</p>\n<p><strong>Типы повреждений ДНК — 2 категории:</strong></p>\n<p>Спонтанные (возникают сами по себе, без внешнего воздействия):</p>\n<ul>\n<li>Ошибки репликации (ДНК-полимераза иногда \"ошибается\", вставляя неправильный нуклеотид)</li>\n<li>Депуринизация (спонтанный отрыв пуринового основания от сахарофосфатного остова)</li>\n<li>Дезаминирование — потеря аминогруппы у азотистого основания: Цитозин → Урацил; Аденин → Гипоксантин; Гуанин → Ксантин</li>\n</ul>\n<p>Логика опасности дезаминирования: если урацил (который в норме характерен для РНК, а не ДНК!) появляется в ДНК, при следующей репликации он будет прочитан неправильно — это прямой источник мутаций, если не исправить вовремя.</p>\n<p>Индуцируемые (внешним воздействием):</p>\n<ul>\n<li>УФ-излучение → образование димеров пиримидиновых оснований</li>\n<li>Химические мутагены (алкилирование, окисление)</li>\n<li>Радиация</li>\n</ul>\n<p><strong>Репарация — процесс исправления повреждений ДНК:</strong></p>\n<p>Этапы репарации (при больших повреждениях, 4 шага):</p>\n<ol>\n<li>Узнавание повреждения и удаление азотистого основания — фермент ДНК-N-гликозидаза</li>\n<li>Удаление повреждённого участка — фермент эндонуклеаза (вырезает более широкий фрагмент вокруг повреждения)</li>\n<li>Достройка цепи — ДНК-полимераза (заполняет образовавшуюся брешь, используя неповреждённую комплементарную цепь как матрицу — вот почему двухцепочечность ДНК так важна: вторая цепь служит \"резервной копией\")</li>\n<li>Сшивание фрагментов — ДНК-лигаза</li>\n</ol>\n<p>Специальный фермент для УФ-повреждений: фотолиаза — специфически \"разбирает\" именно пиримидиновые димеры, вызванные УФ-излучением.</p>\n<p><strong>Дефекты репарации и наследственные болезни:</strong></p>\n<ol>\n<li>Пигментная ксеродерма:</li>\n</ol>\n<ul>\n<li>Причина: генетический дефект ферментов репарации (обычно тех, что отвечают за исправление УФ-повреждений)</li>\n<li>Механизм: сверхчувствительность к УФ — солнечный свет накапливает повреждения, которые организм не может исправить</li>\n<li>Следствие: высокий риск рака кожи</li>\n</ul>\n<p>Логика этой болезни: без нормальной репарации каждое воздействие солнца накапливает необратимые мутации в ДНК клеток кожи → со временем эти мутации приводят к злокачественной трансформации.</p>\n<ol>\n<li>Прогерия (синдром Гетчинсона-Гилфорда):</li>\n</ol>\n<ul>\n<li>Преждевременное старение</li>\n<li>Тип наследования: неизвестен</li>\n<li>Проявления: низкий рост, отсутствие подкожного жирового слоя, алопеция (облысение), маленькое лицо/нижняя челюсть, большая голова, экзофтальм, оттопыренные уши, тонкая сухая кожа, бесплодие, ранний атеросклероз</li>\n<li>Продолжительность жизни: 7-27 лет</li>\n</ul>\n<p>Логика связи с репарацией: накопление неисправленных повреждений ДНК со временем — один из ключевых механизмов старения вообще.</p>", "conspectHtml": "<p><strong>105. Повреждения ДНК, репарация, наследственные болезни</strong></p>\n<p><strong>Типы повреждений:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Спонтанные</th><th>Индуцируемые</th></tr></thead>\n<tbody>\n<tr><td>Ошибки репликации</td><td>УФ → димеры пиримидинов</td></tr>\n<tr><td>Депуринизация</td><td>Химич. мутагены(алкилирование,окисление)</td></tr>\n<tr><td>Дезаминирование(Ц→У,А→Гипоксантин,Г→Ксантин)</td><td>Радиация</td></tr>\n</tbody>\n</table></div>\n<p><strong>Репарация (4 этапа):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Действие</th><th>Фермент</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Узнавание+удаление основания</td><td>ДНК-N-гликозидаза</td></tr>\n<tr><td>2</td><td>Удаление повреждённого участка</td><td>эндонуклеаза</td></tr>\n<tr><td>3</td><td>Достройка (по неповреждён. цепи-матрице)</td><td>ДНК-полимераза</td></tr>\n<tr><td>4</td><td>Сшивание</td><td>ДНК-лигаза</td></tr>\n</tbody>\n</table></div>\n<p>Спец.фермент для УФ-димеров: фотолиаза</p>\n<p><strong>Наследственные болезни при дефектах репарации:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Болезнь</th><th>Причина</th><th>Проявления</th></tr></thead>\n<tbody>\n<tr><td>Пигментная ксеродерма</td><td>дефект ферментов репарации</td><td>сверхчувствительность к УФ → рак кожи</td></tr>\n<tr><td>Прогерия(Гетчинсона-Гилфорда)</td><td>наследование неизвестно</td><td>преждевременное старение, ранний атеросклероз, жизнь 7-27 лет</td></tr>\n</tbody>\n</table></div>"}, {"num": 106, "title": "Транскрипция РНК: этапы, субстраты, источники энергии, ферменты, процессинг", "section": "Раздел 9", "sectionTitle": "Обмен нуклеиновых кислот, матричные биосинтезы", "explanationHtml": "<p>Транскрипция — это \"переписывание\" информации с ДНК на РНК.</p>\n<p><strong>Определение:</strong> синтез РНК на матрице ДНК. Субстраты — АТФ, ГТФ, ЦТФ, УТФ (не дезоксирибонуклеотиды, как в репликации, потому что продукт — РНК, а не ДНК!). Ферменты — РНК-полимеразы I, II, III (разные полимеразы синтезируют разные типы РНК — р-РНК, и-РНК, т-РНК соответственно).</p>\n<p><strong>Структура гена (участок ДНК):</strong></p>\n<p>3'-промотор — экзон — интрон — экзон — интрон — экзон — терминатор-5'</p>\n<ul>\n<li>Экзоны — информативные, кодирующие участки (останутся в зрелой РНК)</li>\n<li>Интроны — неинформативные вставки (будут вырезаны при процессинге)</li>\n<li>Промотор — место посадки РНК-полимеразы</li>\n<li>Терминатор — сигнал окончания транскрипции</li>\n</ul>\n<p><strong>3 этапа транскрипции:</strong></p>\n<ol>\n<li>Инициация: РНК-полимераза связывается с промотором (при участии ТАТА-фактора)</li>\n<li>Элонгация: синтез цепи пре-РНК в направлении 5'→3' на матричной цепи ДНК</li>\n<li>Терминация: синтез завершается на участке терминатора</li>\n</ol>\n<p>Результат первичной транскрипции — пре-РНК — это ещё \"сырой\", незрелый продукт, который содержит и экзоны, и интроны вперемешку.</p>\n<p><strong>Процессинг — созревание РНК из пре-РНК (происходит в ядре):</strong></p>\n<p>Общие операции для всех типов РНК:</p>\n<ul>\n<li>Вырезание неинформативных участков (интронов)</li>\n<li>Сращивание информативных участков (экзонов) — это называется сплайсинг</li>\n<li>Модификация концов молекулы</li>\n</ul>\n<p>Процессинг для пре-и-РНК (информационной, кодирующей белок):</p>\n<ul>\n<li>Формирование 5'-колпачка (кэп) — защищает от деградации, нужен для узнавания рибосомой</li>\n<li>Формирование 3'-поли-А-хвоста</li>\n<li>Метилирование оснований</li>\n<li>Удаление интронов (сплайсинг)</li>\n</ul>\n<p>Процессинг для пре-р-РНК (рибосомальной):</p>\n<ul>\n<li>Расщепление на зрелую р-РНК</li>\n<li>Метилирование</li>\n</ul>\n<p>Процессинг для пре-т-РНК (транспортной):</p>\n<ul>\n<li>Расщепление</li>\n<li>Удаление интронов</li>\n<li>Присоединение акцепторного конца ЦЦА (специфическая последовательность на 3'-конце, куда будет крепиться аминокислота при трансляции)</li>\n<li>Метилирование оснований</li>\n</ul>\n<p>Логика того, зачем нужен весь этот процессинг: \"сырая\" пре-РНК, скопированная прямо с ДНК, физически непригодна для немедленного использования — она либо слишком длинная и содержит ненужные вставки, либо слишком нестабильна.</p>", "conspectHtml": "<p><strong>106. Транскрипция РНК, процессинг</strong></p>\n<p><strong>Определение:</strong> синтез РНК на матрице ДНК. Субстраты: АТФ,ГТФ,ЦТФ,УТФ. Ферменты: РНК-полимеразы I,II,III</p>\n<p><strong>Структура гена:</strong> промотор — экзон — интрон — экзон — интрон — экзон — терминатор</p>\n<p><strong>3 этапа:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Этап</th><th>Суть</th></tr></thead>\n<tbody>\n<tr><td>Инициация</td><td>РНК-полимераза + промотор (ТАТА-фактор)</td></tr>\n<tr><td>Элонгация</td><td>синтез пре-РНК, направление 5'→3'</td></tr>\n<tr><td>Терминация</td><td>на участке терминатора</td></tr>\n</tbody>\n</table></div>\n<p><strong>Процессинг (в ядре) — общие операции:</strong> вырезание интронов + сшивание экзонов(сплайсинг) + модификация концов</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип РНК</th><th>Специфич. процессинг</th></tr></thead>\n<tbody>\n<tr><td>пре-и-РНК</td><td>5'-кэп, 3'-поли-А-хвост, метилирование, удаление интронов</td></tr>\n<tr><td>пре-р-РНК</td><td>расщепление → зрелая р-РНК, метилирование</td></tr>\n<tr><td>пре-т-РНК</td><td>расщепление, удаление интронов, присоединение ЦЦА(акцепторный конец), метилирование</td></tr>\n</tbody>\n</table></div>"}, {"num": 107, "title": "Трансляция, регуляция синтеза белка у эукариот", "section": "Раздел 10", "sectionTitle": "Трансляция, биохимические основы канцерогенеза", "explanationHtml": "<p>Трансляция — финальный этап матричных биосинтезов, где информация с и-РНК превращается в реальную белковую молекулу. Это самый \"механически сложный\" процесс из всех, что мы разбирали — рибосома работает как молекулярный конвейер, читающий код по три нуклеотида за раз.</p>\n<p><strong>Определение:</strong> синтез полипептидной цепи на матрице м-РНК на рибосомах. Локализация: цитоплазма. НЕ связана с фазами клеточного цикла (в отличие от репликации!).</p>\n<p><strong>Компоненты:</strong> 20 аминокислот, т-РНК, аминоацил-тРНК-синтетазы (20 типов — по одной на каждую АК), м-РНК, рибосомы, АТФ+ГТФ, белковые факторы инициации/элонгации/терминации, ионы Mg2+ (стабилизируют рибосому).</p>\n<p><strong>5 этапов трансляции:</strong></p>\n<p>1 этап — Активация аминокислот:</p>\n<p>Присоединение АК к т-РНК ферментом аминоацил-тРНК-синтетазой (затрата 1 АТФ). Каждый фермент имеет 3 участка связывания: АК, АТФ, специфическая т-РНК.</p>\n<p>2 типа этого фермента и соответствующих т-РНК: Инициаторная — активирует ТОЛЬКО метионин (первая АК любого белка!); Элонгационная — активирует остальные 19 аминокислот.</p>\n<p>Логика: синтез любого белка ВСЕГДА начинается именно с метионина — инициаторная метионил-тРНК узнаёт стартовый кодон АУГ.</p>\n<p>2 этап — Инициация:</p>\n<p>Образование инициаторного комплекса: мет-тРНК + м-РНК + малая субъединица рибосомы + белки инициации (IF) + ГТФ → присоединение большой субъединицы (ещё +ГТФ) → мет-тРНК оказывается в П-центре (пептидильном) рибосомы.</p>\n<p>3 этап — Элонгация (циклическое повторение 3 стадий, для каждой новой аминокислоты):</p>\n<ol>\n<li>Присоединение следующей аминоацил-тРНК к А-центру (аминоацильному) — с затратой ГТФ, белок EF1</li>\n<li>Образование пептидной связи — фермент пептидилтрансфераза (часть большой субъединицы рибосомы, это рибозим — то есть каталитическую функцию выполняет сама рРНК, а не белок!)</li>\n<li>Транслокация — перемещение рибосомы на 1 кодон вдоль м-РНК (затрата ГТФ, белок EF2). Пептидил-тРНК переходит из А-центра в П-центр, освободившаяся тРНК уходит</li>\n</ol>\n<p>Цикл повторяется снова и снова, пока рибосома не дойдёт до стоп-кодона.</p>\n<p>4 этап — Терминация:</p>\n<p>При попадании в А-центр стоп-кодона (УАА, УАГ, УГА) присоединяется белок терминации RF1 → гидролитическое отщепление полипептидной цепи от последней тРНК, отделение тРНК от П-центра, диссоциация рибосомы на субъединицы, высвобождение м-РНК.</p>\n<p>5 этап — Сворачивание полипептидной цепи и процессинг (посттрансляционная модификация):</p>\n<p>Готовая цепь либо сразу принимает активную конформацию, либо требует дополнительной обработки: удаление N-концевого метионина (аминопептидаза) или части олигопептида (протеаза); образование дисульфидных мостиков (S-S, пример — молекула инсулина); фосфорилирование серина/треонина/тирозина (та же логика ковалентной регуляции, что мы видели много раз!); присоединение олигосахаридных цепей (гликозилирование, пример — мембранные рецепторы).</p>\n<p><strong>Энергозатратность синтеза белка (на 1 пептидную связь):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Этап</th><th>Затраты</th></tr></thead>\n<tbody>\n<tr><td>Активация АК</td><td>1 АТФ</td></tr>\n<tr><td>Инициация</td><td>1 АТФ + 1 ГТФ</td></tr>\n<tr><td>Элонгация</td><td>2 ГТФ</td></tr>\n<tr><td>Итого</td><td>5 макроэргов на 1 связь! (плюс доп. АТФ на исправление ошибок)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Регуляция синтеза белка у эукариот — на уровне транскрипции И трансляции:</strong></p>\n<p>На уровне транскрипции: белки-регуляторы — индукторы (способствуют) и репрессоры (блокируют переписывание ДНК→мРНК). Структура оперона: ген-регулятор + ген-оператор + промотор + энхансер/сайленсер + структурные гены.</p>", "conspectHtml": "<p><strong>107. Трансляция, регуляция синтеза белка</strong></p>\n<p><strong>Компоненты:</strong> 20АК, тРНК, 20 аминоацил-тРНК-синтетаз, мРНК, рибосомы, АТФ+ГТФ, Mg2+</p>\n<p><strong>5 этапов:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Этап</th><th>Суть</th><th>Затраты</th></tr></thead>\n<tbody>\n<tr><td>1.Активация АК</td><td>АК+тРНК(аминоацил-тРНК-синтетаза)</td><td>1АТФ</td></tr>\n<tr><td>2.Инициация</td><td>мет-тРНК(АУГ)+мРНК+субъединицы(IF)</td><td>1АТФ+1ГТФ</td></tr>\n<tr><td>3.Элонгация(цикл)</td><td>А-центр(+ГТФ,EF1)→пептидная связь(пептидилтрансфераза)→транслокация(+ГТФ,EF2)</td><td>2ГТФ/цикл</td></tr>\n<tr><td>4.Терминация</td><td>стоп-кодон(УАА,УАГ,УГА)+RF1 → отщепление ППЦ</td><td>—</td></tr>\n<tr><td>5.Сворачивание+процессинг</td><td>S-S мостики, фосфорилирование, гликозилирование</td><td>—</td></tr>\n</tbody>\n</table></div>\n<p><strong>Затраты на 1 пептидную связь:</strong> 5 макроэргов (1АТФ+1АТФ+1ГТФ+2ГТФ)</p>\n<p><strong>Регуляция (транскрипция+трансляция):</strong> индукторы/репрессоры, оперон(ген-регулятор+ген-оператор+промотор+энхансер/сайленсер+структурные гены)</p>"}, {"num": 108, "title": "Химический канцерогенез, ДНК- и РНК-содержащие вирусы", "section": "Раздел 10", "sectionTitle": "Трансляция, биохимические основы канцерогенеза", "explanationHtml": "<p>Разберём две из трёх больших причин возникновения опухолей (третья — радиация, кратко упомянем): химические вещества и вирусы. Логика везде одна и та же — в конечном счёте всё сводится к повреждению ДНК, просто разными путями.</p>\n<p><strong>Химический канцерогенез — 2 типа канцерогенов по механизму действия:</strong></p>\n<p>Непрямого действия (проканцерогены) — САМИ по себе безвредны, требуют активации:</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Проканцероген</th><th>Источник</th></tr></thead>\n<tbody>\n<tr><td>Полициклические ароматические углеводороды (ПАУ)</td><td>неполное сгорание угля/нефти, жареное мясо, курение</td></tr>\n<tr><td>Ароматические амины</td><td>анилиновые красители, резиновая промышленность</td></tr>\n<tr><td>Нитрозамины</td><td>из вторичных аминов+нитритов (запекание мяса/рыбы, консерванты)</td></tr>\n</tbody>\n</table></div>\n<p>Механизм активации: проканцероген → в печени, система цитохрома Р450 (та же монооксигеназная система, что мы разбирали для печени!) → приобретает -OH группу → становится реакционноспособным канцерогеном → связывается с азотистым основанием ДНК → мутация.</p>\n<p>Дальнейшая развилка: часть канцерогенов вступает в реакцию конъюгации (с ФАФС, глюкуроновой кислотой — те же механизмы детоксикации!) → нетоксичный конъюгат, выводится. Другая часть — реагирует с ДНК/белками напрямую → мутация → рост опухоли.</p>\n<p>Клиническая деталь: ферменты детоксикации (цитохром Р450 и др.) полиморфны у разных людей — это объясняет разную индивидуальную чувствительность к канцерогенам.</p>\n<p>Прямого действия (не требуют активации в печени):</p>\n<ul>\n<li>Алкилирующие вещества (иприт, β-пропиолактон) — напрямую алкилируют азотистые основания ДНК (особенно гуанин)</li>\n<li>Неорганические ионы (Cr6+, Pb2+, Cd2+, Hg+) — образуют электростатические связи с основаниями ДНК, нарушая структуру</li>\n</ul>\n<p>Важная деталь: покоящаяся ДНК (двуспиральная) относительно защищена от повреждений — азотистые основания \"спрятаны\" внутри спирали. Но в процессе репликации (когда цепи расходятся) полинуклеотидные цепи становятся гораздо чувствительнее к канцерогенам — вот почему быстро делящиеся ткани более уязвимы.</p>\n<p><strong>ДНК- и РНК-содержащие вирусы</strong></p>\n<p>Классификация вирусов (4 типа): ДНК-содержащие (одно-/двуцепочечные, напр. вирус герпеса); РНК-содержащие (одно-/двуцепочечные); ДНК-содержащие обратнотранскрибируемые (вирус гепатита В); РНК-содержащие обратнотранскрибируемые (ВИЧ).</p>\n<p>ДНК-содержащие вирусы — интегрируются в геном клетки-хозяина. Могут нести онкогены — при встраивании в геном клетка теряет способность к контрольному торможению, приобретая свойства опухолевой (трансформированной) клетки.</p>\n<p>РНК-содержащие обратнотранскрибируемые (ретровирусы, например ВИЧ) — ключевая особенность: содержат фермент обратную транскриптазу (РНК-зависимую ДНК-полимеразу), которого НЕТ в клетках человека (он приходит вместе с самим вирусом!):</p>\n<p>Вирусная РНК → (обратная транскриптаза) → гибридная молекула РНК-ДНК → достраивается вторая цепь → двухнитевая ДНК (провирус) → интегрируется в геном клетки-хозяина</p>\n<p>Логика опасности: провирус остаётся в составе ДНК клетки-хозяина навсегда — клетка продолжает делиться, \"нося\" в себе и свой, и вирусный геном одновременно. Если провирус содержит онкогены — регуляция клеточного цикла нарушается, что и вызывает злокачественную трансформацию.</p>\n<p>Простые РНК-вирусы (не обратнотранскрибируемые) — работают иначе: содержат фермент РНК-РНК-полимеразу (РНК-репликазу) — синтезирует РНК прямо на матрице РНК, БЕЗ промежуточной ДНК-стадии. Такой вирус НЕ может интегрироваться в геном ядра клетки-хозяина — просто размножается, а затем клетка разрушается при выходе вирионов.</p>\n<p>Ключевое клиническое различие: именно способность к интеграции в геном (ДНК-вирусы и ретровирусы) даёт риск канцерогенеза — а простые РНК-вирусы, не встраивающиеся в геном, такого длительного риска не несут.</p>", "conspectHtml": "<p><strong>108. Химический канцерогенез, ДНК/РНК-вирусы</strong></p>\n<p><strong>Химические канцерогены:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Примеры</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Непрямые(проканцерогены)</td><td>ПАУ, ароматич.амины, нитрозамины</td><td>активация в печени(цитохром Р450)→+OH→канцероген→связь с ДНК</td></tr>\n<tr><td>Прямые</td><td>алкилирующие(иприт), ионы(Cr6+,Pb2+,Cd2+)</td><td>напрямую алкилируют/связываются с ДНК(гуанин)</td></tr>\n</tbody>\n</table></div>\n<p>Полиморфизм ферментов детоксикации → разная индивид. чувствительность к канцерогенам ДНК уязвимее к канцерогенам именно при репликации(цепи разошлись)</p>\n<p><strong>Вирусы (4 типа):</strong> ДНК(герп) / РНК / ДНК-обратнотранскрибир.(гепатит В) / РНК-обратнотранскрибир.(ВИЧ)</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Механизм</th><th>Интеграция в геном</th></tr></thead>\n<tbody>\n<tr><td>ДНК-содержащие</td><td>несут онкогены напрямую</td><td>ДА</td></tr>\n<tr><td>Ретровирусы(ВИЧ)</td><td>обратная транскриптаза: РНК→РНК-ДНК гибрид→ДНК(провирус)</td><td>ДА</td></tr>\n<tr><td>Простые РНК-вирусы</td><td>РНК-репликаза(РНК-РНК, без ДНК-стадии)</td><td>НЕТ</td></tr>\n</tbody>\n</table></div>\n<p>Способность к интеграции в геном = риск канцерогенеза (онкогены встраиваются и нарушают регуляцию цикла)</p>"}, {"num": 109, "title": "Метаболические особенности опухолевых клеток, основные принципы диагностики и лечения опухолей", "section": "Раздел 10", "sectionTitle": "Трансляция, биохимические основы канцерогенеза", "explanationHtml": "<p>Финальный вопрос всего курса! Разберём, чем метаболизм раковой клетки принципиально отличается от нормальной, а также основные стратегии лечения.</p>\n<p><strong>Характеристика опухолевых клеток (общее):</strong> не соблюдают границы ткани, не подчиняются контактному торможению, крупнее нормальных, ядерно-цитоплазматическое соотношение сдвинуто в сторону ядра, сниженная адгезия (могут расти без прикрепления, образуя мультислои).</p>\n<p><strong>Метаболические особенности опухолевых клеток:</strong></p>\n<ol>\n<li>Эффект Варбурга — самая знаменитая метаболическая черта рака:</li>\n</ol>\n<p>Высочайшая скорость анаэробного гликолиза с образованием лактата, причём ДАЖЕ в присутствии кислорода (то есть опухолевая клетка \"предпочитает\" гликолиз, хотя могла бы использовать более эффективное окислительное фосфорилирование!).</p>\n<p>Логика этого парадокса: быстрый рост опухоли + слабая васкуляризация (кровеносные сосуды не успевают прорастать так же быстро, как делятся клетки) → клетки внутри опухоли реально испытывают гипоксию → вынуждены полагаться на гликолиз. Но эффект Варбурга проявляется даже там, где кислорода достаточно — это уже не просто \"вынужденная мера\", а фундаментальная перестройка метаболизма самой раковой клетки.</p>\n<p>Закономерность: чем МЕНЕЕ дифференцирована опухоль и чем ВЫШЕ скорость её роста, тем интенсивнее анаэробный гликолиз и слабее окислительное фосфорилирование.</p>\n<ol>\n<li>Изменения нуклеинового обмена: ↑синтеза ДНК и РНК (логично — клетка активно делится) + ↓катаболизма пуринов и пиримидинов (клетка \"бережёт\" строительные блоки, не разрушая их, а пуская на новый синтез — прямая связь с резервными путями!).</li>\n</ol>\n<ol>\n<li>Фетальные (эмбриональные) изоформы ферментов:</li>\n</ol>\n<p>В опухолевых клетках возвращаются изоформы ферментов, характерные для ЭМБРИОНАЛЬНОГО периода развития — например, гексокиназа с высоким сродством к глюкозе, и ФФК-I — но особая, эмбриональная форма, которая НЕ ингибируется АТФ и цитратом (вспомни — в норме ФФК-I именно так и регулируется реципрокно с глюконеогенезом!).</p>\n<p>Логика опасности этой особенности: нормальный регуляторный \"тормоз\" фермента (ингибирование избытком АТФ/цитрата, когда энергии и так достаточно) в опухолевой клетке ПОТЕРЯН — гликолиз идёт \"на всех парах\" независимо от энергетического статуса клетки, что и объясняет неконтролируемый, нерегулируемый метаболизм рака.</p>\n<p><strong>Принципы диагностики — опухолевые маркеры (ОМ):</strong></p>\n<p>Определение: соединения (белки, пептиды, гормоны, ферменты, метаболиты), синтезируемые раковыми клетками или нормальными тканями в ответ на рак; продукты аномальной экспрессии генома раковой клетки.</p>\n<p>Онкофетальные белки — характерны для эмбриона, в норме исчезают после рождения, но вновь появляются при опухолевой прогрессии:</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Маркер</th><th>Опухоль</th></tr></thead>\n<tbody>\n<tr><td>α-фетопротеин (α-ФП)</td><td>рак печени</td></tr>\n<tr><td>Карциноэмбриональный антиген (КЭА)</td><td>рак прямой кишки</td></tr>\n<tr><td>β-ХГЧ</td><td>опухоли яичников/семенников; в ликворе — метастазы в мозг</td></tr>\n<tr><td>PSA (простатоспецифический антиген)</td><td>рак предстательной железы</td></tr>\n</tbody>\n</table></div>\n<p>Гормоны как опухолевые маркеры:</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Гормон</th><th>Опухоль</th></tr></thead>\n<tbody>\n<tr><td>АКТГ</td><td>рак лёгкого, поджелудочной, щитовидной</td></tr>\n<tr><td>Катехоламины</td><td>феохромоцитома</td></tr>\n<tr><td>Кальцитонин</td><td>карцинома щитовидной железы</td></tr>\n<tr><td>Инсулин</td><td>инсулинома</td></tr>\n<tr><td>Глюкагон</td><td>глюкагонома</td></tr>\n</tbody>\n</table></div>\n<p>Дополнительно как ОМ: белки острой фазы (церулоплазмин, гаптоглобин, СРБ), изоформы ЛДГ и креатинкиназы.</p>\n<p>Важная оговорка: почти всегда при обычных воспалительных заболеваниях тоже отмечается небольшое, неспецифическое повышение ОМ — то есть ни один маркер сам по себе не является 100% доказательством рака, нужна комплексная оценка.</p>\n<p><strong>Принципы лечения — 2 обязательных требования:</strong></p>\n<ol>\n<li>Цитостатический эффект — предотвращение пролиферации</li>\n<li>Цитотоксический эффект — уничтожение опухолевых клеток</li>\n</ol>\n<p>Химиотерапия: блокирует синтез ДНК и деление клеток — но по механизмам, ОБЩИМ для всех быстроделящихся клеток (не только опухолевых!) → отсюда токсичность и побочные эффекты (страдают, например, клетки костного мозга, эпителий ЖКТ — тоже быстро делящиеся ткани).</p>\n<p>Классы препаратов: алкилирующие агенты (повреждают ДНК), антиметаболиты (ингибируют синтез нуклеиновых кислот), антибиотики (повреждают структуру ДНК), гормоны (для гормонозависимых опухолей с рецепторами).</p>\n<p>Дополнительные современные подходы:</p>\n<ul>\n<li>Фотодинамическая терапия — вещество активируется лазером, генерирует свободные радикалы, разрушающие мембраны (не ДНК)</li>\n<li>Направленная доставка — использует повышенную экспрессию рецепторов на мембране опухолевых клеток → рецептор-опосредованный эндоцитоз препарата именно в опухоль</li>\n<li>Подавление ангиогенеза — ингибиторы ангиогенеза (ангиостатин) блокируют рост новых сосудов, \"морят\" опухоль без кровоснабжения</li>\n<li>Генная терапия — введение \"лечебных генов\" (интерлейкин-2, фактор некроза опухоли) → усиление иммуногенности опухоли</li>\n</ul>", "conspectHtml": "<p><strong>109. Метаболизм опухолевых клеток, диагностика и лечение</strong></p>\n<p><strong>Метаболические особенности:</strong></p>\n<ol>\n<li>Эффект Варбурга: ↑анаэробный гликолиз→лактат, ДАЖЕ при наличии O2 (быстрый рост+слабая васкуляризация). Чем менее дифференцирована опухоль → тем сильнее эффект</li>\n<li>↑синтез ДНК/РНК, ↓катаболизм пуринов/пиримидинов</li>\n<li>Фетальные изоформы ферментов (гексокиназа↑сродство к глюкозе; ФФК-I НЕ ингибируется АТФ/цитратом — потеря нормальной регуляции!)</li>\n</ol>\n<p><strong>Опухолевые маркеры (ОМ) — онкофетальные белки:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Маркер</th><th>Опухоль</th></tr></thead>\n<tbody>\n<tr><td>α-ФП</td><td>рак печени</td></tr>\n<tr><td>КЭА</td><td>рак прямой кишки</td></tr>\n<tr><td>β-ХГЧ</td><td>яичники/семенники</td></tr>\n<tr><td>PSA</td><td>простата</td></tr>\n</tbody>\n</table></div>\n<p>Гормоны-маркеры: АКТГ(лёгкое,ПЖ,ЩЖ), катехоламины(феохромоцитома), кальцитонин(ЩЖ), инсулин/глюкагон(инсулинома/глюкагонома)</p>\n<p><strong>Лечение (2 требования):</strong> цитостатич.(↓пролиферация) + цитотоксич.(уничтожение)</p>\n<p>Химиотерапия: алкилирующие агенты, антиметаболиты, антибиотики, гормоны — токсичность из-за общих механизмов деления клеток</p>\n<p>Доп.методы: фотодинамич.терапия, направленная доставка(рецепторный эндоцитоз), подавление ангиогенеза(ангиостатин), генная терапия</p>"}];
</script>
<script>
(function() {
  "use strict";

  // Derive ordered unique sections
  const sectionOrder = [];
  const seen = new Set();
  QUESTIONS.forEach(q => {
    if (!seen.has(q.section)) { seen.add(q.section); sectionOrder.push({id: q.section, title: q.sectionTitle}); }
  });

  const content = document.getElementById('content');
  const sectionNav = document.getElementById('sectionNav');
  const searchInput = document.getElementById('searchInput');
  const searchCount = document.getElementById('searchCount');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const hamburger = document.getElementById('hamburger');
  const themeToggle = document.getElementById('themeToggle');

  // ---- Theme ----
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('biochem-theme', t); } catch(e) {}
  }
  (function initTheme() {
    let t = null;
    try { t = localStorage.getItem('biochem-theme'); } catch(e) {}
    if (!t) {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    applyTheme(t);
  })();
  themeToggle.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  // ---- Mobile sidebar ----
  function openSidebar() { sidebar.classList.add('show'); overlay.classList.add('show'); }
  function closeSidebar() { sidebar.classList.remove('show'); overlay.classList.remove('show'); }
  hamburger.addEventListener('click', () => {
    sidebar.classList.contains('show') ? closeSidebar() : openSidebar();
  });
  overlay.addEventListener('click', closeSidebar);

  // ---- Build sidebar nav ----
  sectionOrder.forEach(sec => {
    const a = document.createElement('a');
    a.className = 'sec-link';
    a.dataset.sectionId = sec.id;
    const numPart = sec.id.replace('Раздел', '').trim();
    a.innerHTML = '<span class="sec-num">' + numPart + '.</span> ' + sec.title;
    a.href = '#sec-' + numPart;
    a.addEventListener('click', () => { closeSidebar(); });
    sectionNav.appendChild(a);
  });

  // ---- Build content ----
  function buildContent() {
    content.innerHTML = '';
    sectionOrder.forEach(sec => {
      const numPart = sec.id.replace('Раздел', '').trim();
      const block = document.createElement('div');
      block.className = 'section-block';
      block.id = 'sec-' + numPart;

      const h = document.createElement('h2');
      h.className = 'section-title';
      h.textContent = sec.id + ' — ' + sec.title;
      block.appendChild(h);

      const qs = QUESTIONS.filter(q => q.section === sec.id);
      const sub = document.createElement('div');
      sub.className = 'section-sub';
      sub.textContent = 'Вопросы ' + qs[0].num + '–' + qs[qs.length-1].num + ' (' + qs.length + ')';
      block.appendChild(sub);

      qs.forEach(q => {
        const card = document.createElement('article');
        card.className = 'qcard';
        card.id = 'q' + q.num;
        card.dataset.num = q.num;

        const head = document.createElement('div');
        head.className = 'qhead';
        head.innerHTML = '<span class="qnum">' + q.num + '</span><span class="qtitle"></span>';
        head.querySelector('.qtitle').textContent = q.title;
        head.addEventListener('click', () => card.classList.toggle('open'));
        card.appendChild(head);

        const body = document.createElement('div');
        body.className = 'qbody';

        const d1 = document.createElement('details');
        d1.className = 'block';
        d1.open = true;
        d1.innerHTML = '<summary>Объяснение</summary><div class="block-inner">' + q.explanationHtml + '</div>';
        body.appendChild(d1);

        const d2 = document.createElement('details');
        d2.className = 'block';
        d2.innerHTML = '<summary>Эталонный конспект</summary><div class="block-inner">' + q.conspectHtml + '</div>';
        body.appendChild(d2);

        card.appendChild(body);
        block.appendChild(card);
      });

      content.appendChild(block);
    });
  }
  buildContent();

  // ---- Search ----
  let searchTimer = null;
  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function clearHighlights(root) {
    root.querySelectorAll('mark.sh').forEach(m => {
      const parent = m.parentNode;
      parent.replaceChild(document.createTextNode(m.textContent), m);
      parent.normalize();
    });
  }

  function highlightText(root, re) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(node => {
      const text = node.nodeValue;
      if (!re.test(text)) return;
      re.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let last = 0, m;
      while ((m = re.exec(text))) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        const mark = document.createElement('mark');
        mark.className = 'sh';
        mark.textContent = m[0];
        frag.appendChild(mark);
        last = m.index + m[0].length;
        if (m.index === re.lastIndex) re.lastIndex++;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function runSearch() {
    const qstr = searchInput.value.trim();
    const cards = content.querySelectorAll('.qcard');
    const blocks = content.querySelectorAll('.section-block');

    if (!qstr) {
      searchCount.style.display = 'none';
      cards.forEach(c => { c.classList.remove('hidden'); c.classList.remove('open'); clearHighlights(c); });
      blocks.forEach(b => b.style.display = '');
      return;
    }

    const re = new RegExp(escapeRegExp(qstr), 'gi');
    let matchCount = 0;

    cards.forEach(c => {
      clearHighlights(c);
      const haystack = c.textContent.toLowerCase();
      const isMatch = haystack.includes(qstr.toLowerCase());
      if (isMatch) {
        c.classList.remove('hidden');
        c.classList.add('open');
        highlightText(c.querySelector('.qtitle'), new RegExp(escapeRegExp(qstr), 'gi'));
        highlightText(c.querySelector('.qbody'), new RegExp(escapeRegExp(qstr), 'gi'));
        matchCount++;
      } else {
        c.classList.add('hidden');
        c.classList.remove('open');
      }
    });

    blocks.forEach(b => {
      const anyVisible = b.querySelectorAll('.qcard:not(.hidden)').length > 0;
      b.style.display = anyVisible ? '' : 'none';
    });

    searchCount.style.display = 'block';
    searchCount.textContent = matchCount === 0
      ? 'Ничего не найдено'
      : 'Найдено вопросов: ' + matchCount;
  }

  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 150);
  });

  // ---- Scrollspy for sidebar active link ----
  const navLinks = Array.from(sectionNav.querySelectorAll('.sec-link'));
  function updateActiveNav() {
    let current = null;
    const blocks = content.querySelectorAll('.section-block');
    const scrollPos = window.scrollY + 90;
    blocks.forEach(b => {
      if (b.offsetTop <= scrollPos) current = b.id;
    });
    navLinks.forEach(a => {
      a.classList.toggle('active', current && a.getAttribute('href') === '#' + current);
    });
  }
  window.addEventListener('scroll', () => {
    window.requestAnimationFrame(updateActiveNav);
  }, { passive: true });
  updateActiveNav();

  // ---- Deep link support (#q42) ----
  function openFromHash() {
    const hash = window.location.hash.replace('#', '');
    if (hash.startsWith('q')) {
      const card = document.getElementById(hash);
      if (card) {
        card.classList.add('open');
        setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
      }
    }
  }
  window.addEventListener('hashchange', openFromHash);
  openFromHash();
})();

</script>
</body>
</html>
