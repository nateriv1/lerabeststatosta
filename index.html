li>\n<li>Незаменимые жирные кислоты: линолевая, α-линоленовая, и арахидоновая (условно незаменимая — \"витамин F\")</li>\n<li>Витамины и минеральные вещества</li>\n</ol>\n<p><strong>Эталонный белок — Лактоальбумин:</strong></p>\n<p>Содержит все незаменимые аминокислоты в нужных пропорциях и легко усваивается. Используется как стандарт для определения биологической ценности других белков.</p>", "conspectHtml": "<p><strong>79. Компоненты пищи, сбалансированное питание, эталонный белок</strong></p>\n<p><strong>Органические компоненты:</strong> белки/углеводы/жиры (основные) + витамины (минорные) <strong>Минеральные:</strong> Na,K,Ca,Cl,P,Mg,Fe,Cu,Zn,Co,Mo,Se,I</p>\n<p><strong>Энергетич. ценность:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Вещество</th><th>ккал/г</th></tr></thead>\n<tbody>\n<tr><td>Белки</td><td>5,4(4,1 усвояемо)</td></tr>\n<tr><td>Жиры</td><td>9,3</td></tr>\n<tr><td>Углеводы</td><td>4,1</td></tr>\n<tr><td>Этанол</td><td>7,1</td></tr>\n</tbody>\n</table></div>\n<p><strong>Соотношение Б:Ж:У = 1:1:4</strong></p>\n<p><strong>Концепция Покровского:</strong> энергия+белок в достатке + баланс незаменимых факторов <strong>Правило стереохим. соответствия:</strong> ферментные системы ⇄ структура пищи (эволюционно)</p>\n<p><strong>Имбалансные рационы:</strong></p>\n<ul>\n<li>Экзогенный — плохое соотношение АК в пище</li>\n<li>Эндогенный — (следствие) несоответствие АК пищи ферментным пропорциям тканей</li>\n</ul>\n<p><strong>Незаменимые факторы питания (3):</strong></p>\n<ol>\n<li>8 незаменимых АК: фенилаланин, метионин, треонин, триптофан, валин, лизин, лейцин, изолейцин</li>\n<li>Незамен. ЖК: линолевая, α-линоленовая, арахидоновая(условно)</li>\n<li>Витамины и минеральные в-ва</li>\n</ol>\n<p><strong>Эталонный белок — Лактоальбумин:</strong> все незамен. АК + легко усваивается → стандарт оценки др. белков</p>"}, {"num": 80, "title": "Витамины: классификации, биологическая роль. Макро- и микроэлементы", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Разберём витамины по двум разным осям классификации, затем — макро- и микроэлементы с их конкретными функциями.</p>\n<p><strong>Классификация витаминов:</strong></p>\n<ol>\n<li>По физико-химическим свойствам:</li>\n</ol>\n<ul>\n<li>Водорастворимые: C, B1, B2, B3(PP), B5, B6, B9, B12, H, P</li>\n<li>Жирорастворимые: A, D, E, K</li>\n</ul>\n<ol>\n<li>По биологическим функциям:</li>\n</ol>\n<ul>\n<li>Энзимовитамины (входят в состав коферментов): B1, B2, B6, B12, K2, PP, биотин, фолиевая кислота</li>\n<li>Гормоны-витамины (регулируют экспрессию генов, работают как истинные гормоны): A, D2, D3, K</li>\n<li>Антиоксиданты (защита от свободных радикалов): E, C, A, липоевая кислота, биофлавоноиды</li>\n</ul>\n<p><strong>Биологическая роль по каждому витамину:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Витамин</th><th>Кофермент</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>B1</td><td>ТПФ</td><td>дегидрогеназы, транскетолаза (обмен углеводов)</td></tr>\n<tr><td>B2</td><td>ФАД/ФМН</td><td>дегидрогеназы (тканевое дыхание)</td></tr>\n<tr><td>B3(PP)</td><td>НАД/НАДФ</td><td>дегидрогеназы</td></tr>\n<tr><td>B5</td><td>HS-KoA</td><td>активация/перенос ацильных групп</td></tr>\n<tr><td>B6</td><td>пиридоксальфосфат</td><td>трансаминазы, декарбоксилазы</td></tr>\n<tr><td>B9</td><td>—</td><td>синтез нуклеотидов (одноуглеродные фрагменты)</td></tr>\n<tr><td>B12</td><td>метилкобаламин, дезоксиаденозилкобаламин</td><td>обмен АК и ЖК</td></tr>\n<tr><td>D</td><td>—</td><td>синтез кальцитриола (Ca/P обмен)</td></tr>\n<tr><td>E</td><td>—</td><td>главный мембранный антиоксидант</td></tr>\n<tr><td>K</td><td>—</td><td>активация факторов свёртывания II,VII,IX,X</td></tr>\n<tr><td>P</td><td>—</td><td>стабилизация межклеточного матрикса, антиоксидант</td></tr>\n</tbody>\n</table></div>\n<p><strong>Макроэлементы (суточная потребность &gt;100 мг): Na, K, Ca, Mg, Cl, P</strong></p>\n<p>Общая роль: осмотическое давление, КОС, потенциал действия, вторичные посредники, структурные компоненты костей/ФЛ.</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Элемент</th><th>Функция</th><th>Недостаточность</th></tr></thead>\n<tbody>\n<tr><td>Калий</td><td>основной внутриклеточный катион, нервная деятельность, сердце</td><td>мышечная слабость, параличи</td></tr>\n<tr><td>Кальций</td><td>кости, мышечное сокращение, вторичный посредник, свёртывание</td><td>рахит(дети)/остеомаляция,остеопороз(взрослые)</td></tr>\n<tr><td>Фосфор</td><td>кости, нуклеозидтрифосфаты, ФЛ</td><td>рахит/остеопороз</td></tr>\n<tr><td>Натрий</td><td>основной внеклеточный катион</td><td>не описаны</td></tr>\n<tr><td>Магний</td><td>кофактор многих ферментов, нервная деятельность</td><td>мышечная слабость, нервные расстройства</td></tr>\n</tbody>\n</table></div>\n<p><strong>Микроэлементы (суточная потребность &lt;100 мг): Fe, Cu, Zn, Co, Mo, Se, I, Cr, Mn</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Элемент</th><th>Функция</th><th>Недостаточность</th></tr></thead>\n<tbody>\n<tr><td>Fe</td><td>гем(Hb,Мг,цитохромы)</td><td>анемия</td></tr>\n<tr><td>Cu</td><td>кофактор ферментов (цитохромоксидаза, СОД, тирозиназа)</td><td>мышечная слабость, инфекции</td></tr>\n<tr><td>Zn</td><td>кофактор карбоангидразы, алкогольДГ, входит в состав инсулина</td><td>—</td></tr>\n<tr><td>Co</td><td>входит в состав B12</td><td>мегалобластная анемия</td></tr>\n<tr><td>Se</td><td>кофактор глутатионпероксидазы</td><td>инфекции</td></tr>\n<tr><td>I</td><td>гормоны щитовидной железы</td><td>гипотиреоз</td></tr>\n<tr><td>Cr</td><td>регуляция глюкозы, ↓ХС/ТАГ</td><td>толерантность к глюкозе</td></tr>\n<tr><td>Mn</td><td>липидный обмен, кости, НК</td><td>хрупкость костей</td></tr>\n</tbody>\n</table></div>\n<p>Обрати внимание, насколько связным оказывается этот вопрос с уже пройденным материалом — Cu(церулоплазмин,СОД), Zn(инсулин), Se(глутатионпероксидаза), Co(В12), I(тиреоидные гормоны) — практически каждый микроэлемент уже видели \"в деле\" в конкретных биохимических путях ранее!</p>", "conspectHtml": "<p><strong>80. Витамины, макро/микроэлементы</strong></p>\n<p><strong>Классификация витаминов:</strong></p>\n<ul>\n<li>По раствор.: водораств.(C,B1,B2,B3,B5,B6,B9,B12,H,P) / жирораств.(A,D,E,K)</li>\n<li>По функции: Энзимовитамины(B1,B2,B6,B12,K2,PP,биотин,фолиевая) / Гормоны-витамины(A,D2,D3,K) / Антиоксиданты(E,C,A,липоевая,биофлавоноиды)</li>\n</ul>\n<p><strong>Роль (кратко):</strong> B1-ТПФ(углеводы), B2-ФАД/ФМН(дыхание), B3-НАД/НАДФ, B5-КоА, B6-ПАЛФ(трансаминазы), B9-нуклеотиды, B12-обмен АК/ЖК, D-кальцитриол, E-мембранный антиоксидант, K-факторы свёртывания(II,VII,IX,X), P-межклет.матрикс</p>\n<p><strong>Макроэлементы(&gt;100мг): Na,K,Ca,Mg,Cl,P</strong> — осмотич.давление,КОС,потенциал действия</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Элемент</th><th>Функция</th><th>Дефицит</th></tr></thead>\n<tbody>\n<tr><td>K</td><td>внутрикл.катион, сердце</td><td>слабость,параличи</td></tr>\n<tr><td>Ca</td><td>кости, сокращение, вторич.посредник</td><td>рахит/остеопороз</td></tr>\n<tr><td>P</td><td>кости, НТФ, ФЛ</td><td>рахит/остеопороз</td></tr>\n<tr><td>Na</td><td>внеклет.катион</td><td>—</td></tr>\n<tr><td>Mg</td><td>кофактор ферментов</td><td>слабость,расстройства</td></tr>\n</tbody>\n</table></div>\n<p><strong>Микроэлементы(&lt;100мг): Fe,Cu,Zn,Co,Mo,Se,I,Cr,Mn</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Элемент</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>Fe</td><td>гем</td></tr>\n<tr><td>Cu</td><td>цитохромоксидаза,СОД,тирозиназа</td></tr>\n<tr><td>Zn</td><td>карбоангидраза,алкогольДГ,инсулин</td></tr>\n<tr><td>Co</td><td>вит.B12</td></tr>\n<tr><td>Se</td><td>глутатионпероксидаза</td></tr>\n<tr><td>I</td><td>тиреоидные гормоны</td></tr>\n<tr><td>Cr</td><td>регуляция глюкозы</td></tr>\n<tr><td>Mn</td><td>липиды, кости, НК</td></tr>\n</tbody>\n</table></div>"}, {"num": 81, "title": "Типы ферментной адаптации ЖКТ и тканей, мальабсорбция, стеаторея", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Разберём, как ЖКТ и ткани \"подстраиваются\" под характер питания на разных временных масштабах.</p>\n<p><strong>Типы адаптации ферментных систем (5 типов, по нарастанию \"скорости\" механизма):</strong></p>\n<ol>\n<li>Эволюционный — ферментные констелляции, закреплённые в генетическом аппарате клетки (самый медленный тип)</li>\n</ol>\n<ol>\n<li>Генетически закреплённая способность использовать витамины как кофакторы, поступающие с пищей — организм \"делегировал\" синтез некоторых кофакторов внешним источникам</li>\n</ol>\n<ol>\n<li>Выработка стереотипа секреции пищеварительных желёз — зависит от ритма поступления пищи</li>\n</ol>\n<ol>\n<li>Адаптация к нутриентам, поступающим в кровь, которые сами становятся гуморальными регуляторами метаболизма клетки — здесь напрямую всплывает понятие имбалансных рационов</li>\n</ol>\n<ol>\n<li>Адаптация систем ферментного синтеза в разные периоды онтогенеза — с возрастом способность к адаптации снижается</li>\n</ol>\n<p><strong>Мальабсорбция (синдром нарушенного всасывания)</strong></p>\n<p>Определение: нарушенное или неадекватное всасывание питательных веществ в ЖКТ, связанное с дефектами мембранного гидролиза, транспорта или образования ферментов.</p>\n<p>Причины (примеры): резекция желудка/тонкого кишечника (синдром короткой кишки), повреждение слизистой кишечника (тропическая спру), хронический панкреатит, генетические дефекты ферментов (например, дефект лактазы у детей).</p>\n<p>Последствия: снижение массы тела и гиповитаминоз — при отсутствии компенсации может угрожать жизни.</p>\n<p><strong>Стеаторея</strong> — во всех случаях нарушения переваривания липидов появляется именно этот синдром: повышенное содержание в кале липидных капель и мыл.</p>\n<p><strong>3 типа стеатореи:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Причина</th><th>В кале</th></tr></thead>\n<tbody>\n<tr><td>Панкреатическая</td><td>недостаток липолитических ферментов</td><td>ТАГ</td></tr>\n<tr><td>Гепатогенная</td><td>нарушен приток желчи (холестаз) → нет эмульгирования/мицелл</td><td>мыла</td></tr>\n<tr><td>Энтерогенная</td><td>дефект слизистой → ↓ресинтез ТАГ</td><td>своб. ВЖК</td></tr>\n</tbody>\n</table></div>\n<p>Клиническое следствие хронической стеатореи: гиповитаминоз жирорастворимых витаминов (A,E,K,D) + дефицит незаменимых ЖК (линолевой, линоленовой, арахидоновой — витамин F).</p>", "conspectHtml": "<p><strong>81. Типы ферментной адаптации, мальабсорбция, стеаторея</strong></p>\n<p><strong>5 типов адаптации ферментных систем:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Тип</th><th>Суть</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Эволюционный</td><td>ферментные констелляции в геноме</td></tr>\n<tr><td>2</td><td>Использование витаминов-кофакторов из пищи</td><td>делегирование синтеза кофакторов пище</td></tr>\n<tr><td>3</td><td>Стереотип секреции пищеварит. желёз</td><td>зависит от ритма питания</td></tr>\n<tr><td>4</td><td>Адаптация к нутриентам крови (гуморальная)</td><td>связь с имбалансными рационами</td></tr>\n<tr><td>5</td><td>Адаптация в онтогенезе</td><td>с возрастом ↓способность</td></tr>\n</tbody>\n</table></div>\n<p><strong>Мальабсорбция:</strong> нарушение всасывания (дефекты гидролиза/транспорта/ферментов) Причины: резекция кишечника, спру, панкреатит, генетич.дефекты(лактаза) Последствия: ↓массы тела, гиповитаминоз</p>\n<p><strong>Стеаторея (3 типа):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Причина</th><th>В кале</th></tr></thead>\n<tbody>\n<tr><td>Панкреатическая</td><td>↓липолитич.ферментов</td><td>ТАГ</td></tr>\n<tr><td>Гепатогенная</td><td>холестаз</td><td>мыла</td></tr>\n<tr><td>Энтерогенная</td><td>дефект слизистой</td><td>своб.ВЖК</td></tr>\n</tbody>\n</table></div>\n<p>Хронич. стеаторея → гиповитаминоз A,E,K,D + дефицит незамен.ЖК (вит.F)</p>"}, {"num": 82, "title": "Принципы диетического питания, коэффициент эффективности жирных кислот, алиментарные заболевания, адаптация к голоданию", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Разберём практическую сторону питания — показатель качества жирнокислотного состава пищи, и подробно — что происходит с организмом при полном голодании.</p>\n<p><strong>Принципы диетического питания:</strong> лечебное питание должно соответствовать потребностям больного организма, учитывать особенности его обменных процессов, скорость обмена веществ и состояние функциональных систем.</p>\n<p><strong>Коэффициент эффективности метаболизма жирных кислот (КЭМ)</strong></p>\n<p>Показатель, отражающий соотношение арахидоновой кислоты к сумме других полиненасыщенных ЖК с 20 и 22 атомами углерода. В норме КЭМ = 3-4 ед. Отклонение состава жирных кислот в пище приводит к его снижению.</p>\n<p><strong>Алиментарные заболевания</strong> — выраженные расстройства питания со специфической клинической картиной. Возникают из-за:</p>\n<ul>\n<li>Энергетической недостаточности (голодание)</li>\n<li>Энергетической избыточности (ожирение)</li>\n<li>Изменения структуры пищи (имбаланс, аллергия, канцерогены)</li>\n</ul>\n<p><strong>Типы голодания (4 типа):</strong></p>\n<ol>\n<li>Абсолютное — без пищи И без воды (самое опасное, смерть быстрее всего)</li>\n<li>Полное — без пищи, но с водой</li>\n<li>Неполное (количественное недоедание) — дефицит калорий при относительно равномерном недостатке всех нутриентов</li>\n<li>Частичное (качественное недоедание) — дефицит одного или нескольких конкретных нутриентов при нормальной/сниженной/даже повышенной общей калорийности</li>\n</ol>\n<p>Важная деталь: даже если витамина В1 в рационе достаточно по номинальной норме, но в питании избыток углеводов — потребность в В1 резко возрастает (нужен для ЦТК как кофермент ПДК) → развивается функциональная витаминная недостаточность, несмотря на \"нормальное\" количество витамина в пище.</p>\n<p><strong>Изменения метаболизма и гормонального статуса при полном голодании — 3 стадии:</strong></p>\n<p>1-я стадия (кратковременная, часы):</p>\n<ul>\n<li>Истощение запасов гликогена (хватает буквально на несколько часов работы в покое!)</li>\n<li>↑глюкагона и кортизола, ↓инсулина</li>\n<li>Активация глюконеогенеза из аминокислот мышц</li>\n</ul>\n<p>2-я стадия (~1 неделя):</p>\n<ul>\n<li>Активация липолиза → ↑свободных жирных кислот в крови</li>\n<li>Развитие кетоза — печень активно производит кетоновые тела</li>\n<li>Мозг и сердце переходят на использование кетоновых тел для сохранения белка</li>\n<li>Распад мышечных белков СНИЖАЕТСЯ (организм экономит белок, раз появился альтернативный источник энергии для критичных органов — это ключевой защитный смысл всей адаптации к голоданию!)</li>\n</ul>\n<p>3-я стадия (терминальная):</p>\n<ul>\n<li>Истощение уже и жировых депо (кетоновые тела больше негде брать)</li>\n<li>Резкое усиление протеолиза как ОСНОВНОГО источника энергии</li>\n<li>Атрофия тканей, гипопротеинемия, отёки (↓онкотического давления плазмы → жидкость выходит в ткани)</li>\n</ul>\n<p>Итоговая логика 3 стадий: организм последовательно расходует свои резервы в порядке \"наименьшей ценности\" — сначала гликоген (быстрый, но маленький резерв), потом жир (большой резерв энергии, при этом бережёт белок за счёт переключения мозга/сердца на кетоны), и только когда жир заканчивается — начинает \"поедать\" собственные функциональные белки, что уже фатально.</p>", "conspectHtml": "<p><strong>82. Принципы диет. питания, КЭМ, голодание</strong></p>\n<p><strong>КЭМ</strong> = арахидоновая к-та / сумма др. ПНЖК(20,22С). Норма 3-4 ед.</p>\n<p><strong>Алиментарные заболевания:</strong> энергетич. недостаточность(голодание) / избыточность(ожирение) / изменение структуры пищи(имбаланс,аллергия)</p>\n<p><strong>4 типа голодания:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Суть</th></tr></thead>\n<tbody>\n<tr><td>Абсолютное</td><td>без пищи И воды</td></tr>\n<tr><td>Полное</td><td>без пищи, с водой</td></tr>\n<tr><td>Неполное</td><td>дефицит калорий (равномерно)</td></tr>\n<tr><td>Частичное</td><td>дефицит 1-неск. нутриентов</td></tr>\n</tbody>\n</table></div>\n<p><strong>3 стадии полного голодания:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Стадия</th><th>Время</th><th>Метаболизм</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>часы</td><td>↓гликоген, ↑глюкагон/кортизол,↓инсулин, ↑глюконеогенез из АК мышц</td></tr>\n<tr><td>2</td><td>~1 неделя</td><td>↑липолиз→↑ВЖК, кетоз, мозг+сердце→кетоновые тела (сбережение белка!), ↓распад мышечн.белков</td></tr>\n<tr><td>3 (терминальная)</td><td>—</td><td>истощение жира → ↑↑протеолиз (осн.источник энергии), атрофия тканей, гипопротеинемия, отёки</td></tr>\n</tbody>\n</table></div>\n<p><em>Логика: гликоген→жир(бережёт белок)→белок(фатально)</em></p>"}, {"num": 83, "title": "Ожирение: типы, причины первичного алиментарного ожирения, лептин, метаболический синдром Х", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Ожирение — не просто \"лишний вес\", а полноценное нейроэндокринное расстройство, в основе которого лежит поломка сложной сигнальной системы гипоталамус-жировая ткань, где ключевую роль играет гормон лептин.</p>\n<p><strong>Типы ожирения:</strong></p>\n<ol>\n<li>Первичное (алиментарное) — 80-90% всех случаев! Самостоятельное нейроэндокринное заболевание из-за нарушения оси \"гипоталамус-адипоциты\"</li>\n<li>Вторичное — связано с дисфункцией нейроэндокринной системы</li>\n</ol>\n<p><strong>Степени ожирения:</strong> I(избыток массы 10-29%), II(30-49%), III(50-99%), IV(&gt;100%, патологическое). Норма избытка: у мужчин до 20%, у женщин до 25%.</p>\n<p><strong>Липостат (массостат)</strong> — условное название системы, контролирующей постоянство веса тела. Контролирующее звено — гипоталамус.</p>\n<p><strong>Причины первичного алиментарного ожирения:</strong> хроническое превышение калорийности пищи над энергозатратами на фоне генетически детерминированной или приобретённой недостаточности лептиновой регуляции.</p>\n<p><strong>Функции лептина:</strong></p>\n<p>Пептидный гормон, вырабатывается адипоцитами в \"сытом\" состоянии (выработка стимулируется инсулином, в меньшей степени глюкокортикоидами; зависит от размера жировых клеток).</p>\n<p>Механизм действия: проникает в гипоталамус → рецептируется вентромедиальными ядрами → вызывает насыщение.</p>\n<p><strong>Эффекты лептина (4 пункта):</strong></p>\n<ol>\n<li>Вызывает чувство насыщения</li>\n<li>Регулирует термогенез, ↑основной обмен (↑потребление O2)</li>\n<li>Стимулирует липолиз в жировой ткани</li>\n<li>Подавляет выработку нейропептида Y в центре голода — ключевой механизм! Нейропептид Y стимулирует поиск пищи, изменяет работу желёз внутренней секреции, потребление пищи, продукцию инсулина, накопление жира.</li>\n</ol>\n<p>Лептин — это \"термостат наоборот\" — чем больше жира накоплено, тем больше лептина, тем сильнее сигнал \"хватит есть\". Ожирение в этом свете — либо поломка производства сигнала, либо поломка его восприятия.</p>\n<p><strong>2 формы лептиновой недостаточности при ожирении:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Форма</th><th>% случаев</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Лептинопеническая</td><td>20%</td><td>жировые клетки НЕ вырабатывают достаточно лептина в ответ на инсулин (абсолютный дефицит гормона)</td></tr>\n<tr><td>Гиперлептинемическая</td><td>80% (основная!)</td><td>лептин вырабатывается НОРМАЛЬНО (концентрация в крови даже повышена!), но гипоталамус нечувствителен к нему (мало рецепторов) → относительная недостаточность ДЕЙСТВИЯ лептина</td></tr>\n</tbody>\n</table></div>\n<p>У подавляющего большинства людей с ожирением проблема не в нехватке гормона, а в резистентности к нему — концептуально та же логика, что и с инсулинорезистентностью при СД II типа!</p>\n<p><strong>Метаболический синдром \"Х\" (введён Ривеном в 1988г.)</strong> — комплекс гормонально-метаболических нарушений, характерных для первичного ожирения:</p>\n<ul>\n<li>Гиперинсулинемия + инсулинорезистентность</li>\n<li>↓секреция соматотропного гормона</li>\n<li>↓чувствительность тканей к тиреоидному гормону, при этом нарушен их баланс</li>\n<li>Гиперкортицизм</li>\n<li>Гиперурикемия, гипернатриемия, гипергидратация, склонность к ацидозам</li>\n</ul>", "conspectHtml": "<p><strong>83. Ожирение, лептин, метаболический синдром Х</strong></p>\n<p><strong>Типы:</strong> Первичное(алиментарное, 80-90%, нарушение оси гипоталамус-адипоциты) / Вторичное(дисфункция нейроэндокр.системы)</p>\n<p><strong>Степени:</strong> I(10-29%)/II(30-49%)/III(50-99%)/IV(&gt;100%)</p>\n<p><strong>Липостат:</strong> гипоталамус контролирует вес через сигналы с жир.тканью+ЖКТ</p>\n<p><strong>Причина первичного ожирения:</strong> ↑калорийность vs энергозатраты + недостаточность лептиновой регуляции</p>\n<p><strong>Лептин:</strong> пептид, из адипоцитов(сытость), стимул.инсулином, рецепция — вентромедиальные ядра гипоталамуса</p>\n<p><strong>Эффекты:</strong> насыщение, ↑термогенез/основной обмен, ↑липолиз, ↓нейропептид Y</p>\n<p><strong>2 формы лептиновой недостаточности:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Форма</th><th>%</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Лептинопеническая</td><td>20%</td><td>↓синтеза лептина</td></tr>\n<tr><td>Гиперлептинемическая</td><td>80%</td><td>лептин ↑, но резистентность рецепторов гипоталамуса (аналог инсулинорезист. при СД2!)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Метаболический синдром Х:</strong> гиперинсулинемия+инсулинорезистентность, ↓СТГ, дисбаланс Т3/Т4, гиперкортицизм, гиперурикемия, гипернатриемия, гипергидратация, ацидоз</p>"}, {"num": 84, "title": "Белоксинтезирующая функция печени, источники и пути использования аминокислот в печени, азотистый баланс", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Печень — центральный \"хаб\" всего белкового обмена организма.</p>\n<p><strong>Белоксинтезирующая функция печени:</strong></p>\n<p>Печень синтезирует большинство белков плазмы крови:</p>\n<ul>\n<li>Все альбумины (100%!)</li>\n<li>75-90% α-глобулинов</li>\n<li>50% β-глобулинов</li>\n<li>Белки свёртывания: фибриноген, протромбин и другие плазменные факторы</li>\n</ul>\n<p>Клиническая связка: именно поэтому при тяжёлых поражениях печени падает и общий белок плазмы (гипопротеинемия), и нарушается свёртываемость крови (дефицит факторов II, VII, IX, X) — два, казалось бы, разных клинических симптома на самом деле имеют одну общую причину.</p>\n<p><strong>Источники аминокислот для печени (2 источника):</strong></p>\n<ol>\n<li>Аминокислоты, поступившие из ЖКТ после переваривания белков пищи (через воротную вену)</li>\n<li>Аминокислоты, освободившиеся при распаде собственных тканевых белков печени (протеолиз)</li>\n</ol>\n<p>Важная деталь про интенсивность обмена именно в печени: потери белка в печени составляют около 20%, тогда как в других органах — не более 4%. Это отражает исключительно высокую скорость обновления (turnover) печёночных белков по сравнению с остальным телом.</p>\n<p><strong>Пути использования аминокислот в печени (5 путей):</strong></p>\n<ol>\n<li>Синтез тканевых белков и белков плазмы крови</li>\n<li>Синтез небелковых азотсодержащих соединений: креатин, глутатион, пурины, пиримидины, гем, коферменты (производные витаминов)</li>\n<li>Дезаминирование (образование NH3 + безазотистого остатка)</li>\n<li>Трансаминирование (синтез заменимых аминокислот)</li>\n<li>Включение безазотистого остатка в общий путь катаболизма (ОПК) — либо на энергию (ЦТК), либо на глюконеогенез</li>\n</ol>\n<p><strong>Роль печени в поддержании азотистого баланса (3 пункта):</strong></p>\n<ol>\n<li>Печень — единственный орган, где происходит синтез мочевины из аммиака (орнитиновый цикл) — это основной путь обезвреживания и выведения избыточного азота из организма. Ни один другой орган не имеет полного набора ферментов орнитинового цикла — только печень.</li>\n</ol>\n<ol>\n<li>Поставляет в другие органы сбалансированную смесь аминокислот (то есть печень не только сама потребляет АК, но и служит \"распределительным центром\" для остального тела)</li>\n</ol>\n<ol>\n<li>Синтезирует заменимые аминокислоты через реакции трансаминирования</li>\n</ol>", "conspectHtml": "<p><strong>84. Белоксинтезирующая функция печени, обмен АК, азотистый баланс</strong></p>\n<p><strong>Синтез белков плазмы (печень):</strong> ВСЕ альбумины, 75-90% α-глобулинов, 50% β-глобулинов, факторы свёртывания(фибриноген,протромбин)</p>\n<p><strong>Источники АК:</strong> 1)из ЖКТ(переваривание пищи) 2)из распада собств.белков печени(протеолиз)</p>\n<p><em>Потери белка в печени ~20% vs 4% в др.органах — высокий turnover</em></p>\n<p><strong>Пути использования АК (5):</strong></p>\n<ol>\n<li>Синтез тканевых белков+белков плазмы</li>\n<li>Синтез небелк.N-соединений(креатин,глутатион,пурины,пиримидины,гем,коферменты)</li>\n<li>Дезаминирование(NH3+безазот.остаток)</li>\n<li>Трансаминирование(синтез заменимых АК)</li>\n<li>Безазот.остаток → ОПК(энергия) или глюконеогенез</li>\n</ol>\n<p><strong>Роль в азотистом балансе (3):</strong></p>\n<ol>\n<li>Единственный орган с полным орнитиновым циклом → синтез мочевины (осн. путь обезвреживания N)</li>\n<li>Поставляет сбалансированную смесь АК другим тканям</li>\n<li>Синтез заменимых АК (трансаминирование)</li>\n</ol>"}, {"num": 85, "title": "Гомеостатическая функция печени (глюкоза), роль печени в обмене фруктозы и галактозы", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Печень выступает главным \"буфером\" уровня глюкозы в крови — переключается между накоплением и высвобождением в зависимости от того, ел человек недавно или голодает.</p>\n<p><strong>Поддержание гомеостаза глюкозы (норма 3,5-6,0 г/л):</strong></p>\n<p>Между приёмами пищи (голодание):</p>\n<ul>\n<li>Активируется гликогенолиз (распад гликогена → глюкоза) и глюконеогенез (из лактата, глицерина, аминокислот)</li>\n<li>Регуляторные ферменты: гликогенфосфорилаза активна в фосфорилированной форме; ферменты глюконеогенеза при этом индуцируются</li>\n<li>Гормоны-активаторы: глюкагон, кортизол</li>\n</ul>\n<p>После приёма пищи:</p>\n<ul>\n<li>Активируется гликогенез (синтез гликогена), глюкоза утилизируется</li>\n<li>Регуляторный фермент гликогенсинтаза активна в дефосфорилированной форме</li>\n<li>Гормон-активатор: инсулин</li>\n</ul>\n<p>Печень занимает промежуточное положение по инсулинзависимости (не полностью зависима, как мышцы/жир через ГЛЮТ-4, но и не полностью независима, как мозг через ГЛЮТ-1/3) — глюкоза проникает в гепатоциты просто по градиенту концентрации, а инсулин действует опосредованно, через увеличение синтеза регулирующих ферментов гликолиза/гликогенолиза.</p>\n<p><strong>Обмен фруктозы в печени (продолжение вопроса 18):</strong></p>\n<p>Основной путь: фосфорилируется фруктокиназой до фруктозо-1-фосфата (на активность этого фермента инсулин и голодание НЕ влияют!)</p>\n<p>Далее фруктозо-1-фосфат расщепляется альдолазой на ДГАФ и глицеральдегид → включаются в гликолиз или глюконеогенез.</p>\n<p><strong>Полиольный путь (глюкоза → сорбитол → фруктоза)</strong></p>\n<p>В печени есть фермент сорбитолдегидрогеназа, который превращает сорбитол во фруктозу (в печени этот путь работает \"во благо\" — просто ещё один способ метаболизировать глюкозу через промежуточный сорбитол).</p>\n<p>Клиническая связка с диабетом: сам сорбитол образуется из глюкозы в ДРУГИХ тканях (не в печени!) при диабете — и там, в отличие от печени, он НЕ имеет фермента для дальнейшего превращения → накапливается → токсичен (так развивается диабетическая ретинопатия, катаракта, нейропатия! В печени же полиольный путь — это нормальный, безопасный обменный путь, а не патологический тупик).</p>\n<p><strong>Наследственные нарушения обмена фруктозы:</strong></p>\n<ul>\n<li>Отсутствие фруктокиназы в печени → идиопатическая фруктозурия (относительно доброкачественное состояние)</li>\n<li>Отсутствие фруктозо-1-фосфатальдолазы → наследственная непереносимость фруктозы: накапливается фруктозо-1-фосфат → ингибирует фосфорилазу печени → гликоген не расщепляется до глюкозы → гипогликемия</li>\n</ul>\n<p>Логика этой патологии: накопленный промежуточный продукт (фруктозо-1-фосфат) блокирует совершенно другой путь (распад гликогена) — классический пример метаболической \"перекрёстной помехи\".</p>\n<p><strong>Обмен галактозы в печени (продолжение вопроса 18):</strong></p>\n<p>Галактоза → галактокиназа → галактозо-1-фосфат → (через УДФ-глюкозу и эпимеразу) → глюкозо-1-фосфат → синтез гликогена или глюкозы.</p>", "conspectHtml": "<p><strong>85. Гомеостаз глюкозы в печени, обмен фруктозы/галактозы</strong></p>\n<p><strong>Гомеостаз глюкозы (норма 3,5-6,0 г/л):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Голодание</th><th>После еды</th></tr></thead>\n<tbody>\n<tr><td>Процесс</td><td>Гликогенолиз+глюконеогенез</td><td>Гликогенез</td></tr>\n<tr><td>Регул.фермент</td><td>гликогенфосфорилаза(фосфорилир.-акт.)</td><td>гликогенсинтаза(дефосфор.-акт.)</td></tr>\n<tr><td>Гормон</td><td>глюкагон, кортизол</td><td>инсулин</td></tr>\n</tbody>\n</table></div>\n<p><em>Печень — промежуточная инсулинзависимость; глюкоза входит по градиенту</em></p>\n<p><strong>Обмен фруктозы:</strong> фруктокиназа(не завис. от инсулина/голодания)→Фр-1-Ф→(альдолаза)→ДГАФ+глицеральдегид→гликолиз/глюконеогенез</p>\n<p><strong>Полиольный путь:</strong> Глюкоза→Сорбитол→(сорбитолдегидрогеназа, в печени!)→Фруктоза <em>В др.тканях при СД сорбитол накапливается(нет фермента)→токсично (ретинопатия,катаракта,нейропатия)</em></p>\n<p><strong>Наследств. нарушения:</strong></p>\n<ul>\n<li>↓фруктокиназы → идиопатич. фруктозурия</li>\n<li>↓фруктозо-1-Ф-альдолазы → непереносимость фруктозы: Фр-1-Ф накапл.→ингибирует фосфорилазу печени→гипогликемия</li>\n</ul>\n<p><strong>Обмен галактозы:</strong> Галактоза→(галактокиназа)→Гал-1-Ф→(УДФ-глюкоза+эпимераза)→Глю-1-Ф→гликоген/глюкоза</p>"}, {"num": 86, "title": "Роль печени в метаболизме жирных кислот, роль печени в синтезе кетоновых тел, судьба кетоновых тел", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Печень — центральный узел жирового обмена: она и получает жирные кислоты из нескольких источников, и решает их дальнейшую судьбу.</p>\n<p><strong>Источники ЖК в печени (3 источника):</strong></p>\n<ol>\n<li>Из альбуминов крови — НЭЖК (неэтерифицированные ЖК — вышли из жировой ткани при липолизе)</li>\n<li>Из ТАГ ЛПОНП (липопротеиды, которые сама печень же и производит)</li>\n<li>Синтез de novo из ацетил-SKoA (особенно из углеводов)</li>\n</ol>\n<p><strong>Судьба ЖК в печени (3 пути — развилка, зависящая от энергетического статуса клетки):</strong></p>\n<ol>\n<li>β-окисление (в митохондриях) → Ацетил-SKoA + энергия (АТФ)</li>\n<li>Синтез ТАГ, ФЛ, ЭХС (этерификация) — для собственных нужд клетки И для формирования ЛПОНП на экспорт</li>\n<li>Синтез кетоновых тел — при избытке ацетил-SKoA</li>\n</ol>\n<p>Логика \"развилки\": какой из трёх путей возобладает — зависит от гормонального статуса (инсулин vs глюкагон) и общего энергетического баланса клетки.</p>\n<p><strong>Синтез кетоновых тел (кетогенез) — печень как ЕДИНСТВЕННОЕ место синтеза:</strong></p>\n<p>Происходит только в печени (в митохондриях) из ацетил-SKoA липидного или кетогенного аминокислотного происхождения. Этапы:</p>\n<ol>\n<li>2 Ацетил-SKoA → Ацетоацетил-SKoA</li>\n<li>+ Ацетил-SKoA → ГМГ-SKoA</li>\n<li>→ Ацетоацетат + Ацетил-SKoA (ГМГ-КоА-лиаза)</li>\n<li>Ацетоацетат → β-гидроксибутират (обратимо) или спонтанно → ацетон</li>\n</ol>\n<p><strong>Судьба кетоновых тел — ключевая идея вопроса, объединяющая печень с остальным телом:</strong></p>\n<p>Кетоновые тела используются как источник энергии для ДРУГИХ тканей — сердце, мышцы, корковый слой почек, головной мозг (только при голодании).</p>\n<p>Сама печень кетоновые тела как энергосубстрат НЕ использует — она их только производит \"на экспорт\", потому что в печени отсутствует фермент тиофераза (сукцинил-КоА-трансфераза), необходимый для активации ацетоацетата перед его окислением.</p>\n<p>Логика этого разделения труда: печень выступает как \"фабрика\", производящая топливо специально для других органов — но сама этим топливом не пользуется, подобно заводу, который производит бензин, но работает на другом источнике энергии.</p>\n<p><strong>Дополнительная деталь про холестерин в печени:</strong></p>\n<p>В печени образуется холестерина больше, чем поступает с пищей: с пищей ~0,3-0,5 г/сут, синтез в печени — до 2-4 г/сут. Соотношение ЭХС/свободный ХС в норме = 0,5-0,7; при поражении печени (↓синтетической активности) — падает до 0,3-0,4, причём прогрессирующее снижение — неблагоприятный прогностический признак.</p>", "conspectHtml": "<p><strong>86. Роль печени в метаболизме ЖК, синтез кетоновых тел</strong></p>\n<p><strong>Источники ЖК в печени (3):</strong> НЭЖК(альбумин крови), ТАГ ЛПОНП, синтез de novo(из ацетил-КоА, углеводов)</p>\n<p><strong>Судьба ЖК (3 пути, развилка по энергостатусу):</strong></p>\n<ol>\n<li>β-окисление(Mx) → Ацетил-КоА+АТФ</li>\n<li>Синтез ТАГ/ФЛ/ЭХС → собств.нужды + ЛПОНП на экспорт</li>\n<li>Синтез кетоновых тел (при избытке ацетил-КоА)</li>\n</ol>\n<p><strong>Кетогенез:</strong> ТОЛЬКО в печени(Mx), из ацетил-КоА(липидного/АК происхождения) 2Ацетил-КоА→Ацетоацетил-КоА→(+Ацетил-КоА)→ГМГ-КоА→Ацетоацетат→(β-гидроксибутиратДГ)⇄β-гидроксибутират / спонтанно→ацетон</p>\n<p><strong>Судьба кетоновых тел:</strong> используются др.тканями(сердце,мышцы,корк.слой почек,мозг при голодании) Печень сама НЕ использует — нет фермента тиоферазы(сукцинил-КоА-трансферазы) для активации ацетоацетата</p>\n<p><em>Логика: печень — \"фабрика\" топлива для других органов, само не потребляет</em></p>\n<p><strong>ХС в печени (доп.):</strong> синтез 2-4г/сут &gt;&gt; пища(0,3-0,5г). ЭХС/своб.ХС=0,5-0,7(норма), ↓до 0,3-0,4 при поражении печени(плохой прогноз)</p>"}, {"num": 87, "title": "Роль печени в гомеостазе холестерина, обмен желчных кислот, состав желчи, аномальная желчь", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Печень — центральный узел всей \"экономики\" холестерина в организме.</p>\n<p><strong>Роль печени в гомеостазе ХС (6 функций):</strong></p>\n<ol>\n<li>Синтез ХС de novo — 50-70% всего ХС в организме синтезируется именно в печени</li>\n<li>Формирование ЛПОНП — экспорт эндогенных липидов и ХС</li>\n<li>Синтез ЛХАТ — фермент, этерифицирующий ХС в крови на поверхности ЛПВП</li>\n<li>Захват из крови \"ремнантных\" ХМ, ЛПОНП, ЛПНП и модифицированных ЛП через различные рецепторы</li>\n<li>\"Обратный\" транспорт ХС — печень захватывает ХС, доставленный в составе ЛПВП из периферических тканей</li>\n<li>Катаболизм ХС — 80% ХС в печени окисляется в желчные кислоты — главный путь выведения ХС из организма</li>\n</ol>\n<p><strong>Синтез желчных кислот (напоминание + детали именно про печень):</strong></p>\n<p>Только в печени, из холестерина. Ключевой фермент — 7-α-гидроксилаза. Образуются первичные ЖК (холевая, хенодезоксихолевая) → конъюгация с глицином/таурином (3:1) → соли желчных кислот → секреция в желчь.</p>\n<p>Количественная деталь про энтерогепатическую циркуляцию: при однократном прохождении крови через печень извлекается 90-95% желчных кислот. Только 3-5% выводится с калом (литохолевая кислота). Нормальное содержание ЖК в сыворотке — 2,5-6,8 мкМ.</p>\n<p>Клиническая деталь: концентрация ЖК в крови повышается при гепатоцеллюлярной патологии — при остром гепатите ↑ в 25-30 раз! Это ранний симптом холестаза.</p>\n<p><strong>Состав желчи:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Компонент</th><th>% / детали</th></tr></thead>\n<tbody>\n<tr><td>Вода</td><td>~90%</td></tr>\n<tr><td>Желчные кислоты и их соли</td><td>—</td></tr>\n<tr><td>Белки</td><td>альбумины, глобулины</td></tr>\n<tr><td>Холестерин и его эфиры</td><td>—</td></tr>\n<tr><td>Билирубиндиглюкуронид</td><td>продукт пигментного обмена</td></tr>\n<tr><td>Минеральные вещества</td><td>Ca, Na, K, Cl</td></tr>\n</tbody>\n</table></div>\n<p><strong>Печёночная vs пузырная желчь:</strong> в желчном пузыре желчь сгущается (всасывается вода+электролиты) → концентрация компонентов в 5-10 раз выше, чем в печёночной. Соотношение ФЛ:ХС:ЖК в пузырной желчи = 2,5:1:12,5.</p>\n<p><strong>Аномальная желчь и понятие литогенности</strong></p>\n<p>Литогенность — отношение фактической концентрации ХС в желчи к максимально возможной концентрации:</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Значение</th><th>Что означает</th></tr></thead>\n<tbody>\n<tr><td>&lt;1</td><td>устойчивая мицеллярная форма (норма)</td></tr>\n<tr><td>=1</td><td>насыщенная, жидкокристаллическая мицеллярная форма (граница нормы)</td></tr>\n<tr><td>&gt;1</td><td>перенасыщенная, неустойчивая мицеллярная форма — аномальная желчь</td></tr>\n</tbody>\n</table></div>\n<p>Механизм образования аномальной желчи: перенасыщение желчи ХС происходит либо при ↑синтеза ХС, либо при ↓образования солей желчных кислот. Избыток ХС выпадает в виде кристаллов → это основа образования желчных камней.</p>\n<p>Клиническая деталь про лечение: хенодезоксихолевая кислота сама является ингибитором ГМГ-КоА-редуктазы — это позволяет использовать её как лекарственный препарат при желчнокаменной болезни.</p>", "conspectHtml": "<p><strong>87. Гомеостаз ХС в печени, обмен желчных кислот, состав желчи</strong></p>\n<p><strong>Роль печени в гомеостазе ХС (6):</strong></p>\n<ol>\n<li>Синтез ХС de novo(50-70% всего ХС организма)</li>\n<li>Формирование ЛПОНП</li>\n<li>Синтез ЛХАТ</li>\n<li>Захват ремнантных ЛП(рецепторы)</li>\n<li>Обратный транспорт ХС (из ЛПВП)</li>\n<li>Катаболизм: 80% ХС → желчные к-ты (гл.путь выведения)</li>\n</ol>\n<p><strong>Синтез ЖК:</strong> только в печени, ХС→(7-α-гидроксилаза)→первичные ЖК→конъюгация(глицин:таурин=3:1)→соли ЖК→желчь</p>\n<p><strong>Энтерогепатич.циркуляция:</strong> извлекается 90-95% ЖК за 1 проход через печень; 3-5% выводится с калом(литохолевая); норма ЖК в крови 2,5-6,8мкМ <em>При остром гепатите ЖК ↑в 25-30 раз (ранний маркер холестаза)</em></p>\n<p><strong>Состав желчи:</strong> вода(~90%), ЖК+соли, белки, ХС+эфиры, билирубиндиглюкуронид, минералы(Ca,Na,K,Cl)</p>\n<p><strong>Печёночная vs пузырная желчь:</strong> в пузыре — сгущение(↑конц. в 5-10×). ФЛ:ХС:ЖК=2,5:1:12,5</p>\n<p><strong>Литогенность</strong> = факт.конц.ХС / макс.возможная:</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Значение</th><th>Форма</th></tr></thead>\n<tbody>\n<tr><td>&lt;1</td><td>устойчивая</td></tr>\n<tr><td>=1</td><td>насыщенная</td></tr>\n<tr><td>&gt;1</td><td>перенасыщенная(аномальная желчь) → кристаллы ХС → камни</td></tr>\n</tbody>\n</table></div>\n<p><strong>Причины перенасыщения:</strong> ↑синтеза ХС или ↓образования солей ЖК</p>\n<p><strong>Терапия:</strong> хенодезоксихолевая к-та — ингибитор ГМГ-КоА-редуктазы → лечение желчнокаменной болезни</p>"}, {"num": 88, "title": "Микросомальное окисление: монооксигеназная и редуктазная цепи, внемикросомальный метаболизм ксенобиотиков, метаболизм этанола", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Разберём систему, которой печень \"разбирает\" чужеродные вещества (ксенобиотики), и отдельно — как именно печень обрабатывает этанол.</p>\n<p><strong>Микросомальное окисление</strong> — универсальная система окисления неполярных соединений (ксенобиотиков любого происхождения), локализована в ЭПР (микросомы). Единственное требование к субстрату — он должен быть неполярным.</p>\n<p>Отличие от митохондриального окисления: там кислород служит конечным акцептором электронов для синтеза АТФ. Здесь — активированный кислород непосредственно внедряется в окисляемое вещество.</p>\n<p><strong>Монооксигеназная цепь (НАДФН-зависимая):</strong></p>\n<p>Компоненты: НАДФ-Р450-редуктаза → флавопротеид (ФАД,ФМН) → цитохром Р450.</p>\n<p>Источник НАДФН2 — пентозофосфатный путь.</p>\n<p>Механизм: флавопротеид принимает 2Н++2е- с НАДФН2 → электроны идут на цитохром Р450, протоны — в среду. Цитохром Р450 (гемопротеид, простетическая группа — гем) активирует кислород и использует его двойственно: 1 атом O включается в окисляемое вещество (ROH), 2-й атом связывает 2H+ → образует H2O.</p>\n<p>Суммарная реакция: RH + O2 + НАДФН2 → ROH + H2O + НАДФ+</p>\n<p>Клиническая деталь про сам Р-450: название происходит от того, что комплекс цитохрома с угарным газом (CO) поглощает свет на длине волны 450 нм.</p>\n<p><strong>Редуктазная цепь (НАДН-зависимая):</strong></p>\n<p>Компоненты: НАДН-цитохром B5-редуктаза → флавопротеид(ФАД) → цитохром B5 → стеарил-КоА-десатураза.</p>\n<p>Источник НАДН — гликолиз.</p>\n<p>Функция: образование двойных связей в жирных кислотах (десатурация — эта цепь занимается не детоксикацией, а модификацией собственных липидов клетки!).</p>\n<p>Индукция микросомальной системы: индукторы — барбитураты, спирты, кетоны, стероидные гормоны. Клиническая деталь: фенобарбитал индуцирует систему конъюгации билирубина → используется в малых дозах у новорождённых для уменьшения физиологической желтухи.</p>\n<p><strong>Внемикросомальный метаболизм ксенобиотиков (реакции конъюгации):</strong></p>\n<p>Тип 1 (активируется конъюгирующее вещество):</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип конъюгации</th><th>Донор</th></tr></thead>\n<tbody>\n<tr><td>Глюкуронидная</td><td>УДФ-глюкуроновая к-та</td></tr>\n<tr><td>Сульфатная</td><td>ФАФС</td></tr>\n<tr><td>Ацетильная</td><td>Ацетил-SKoA</td></tr>\n<tr><td>Метильная</td><td>SAM</td></tr>\n<tr><td>Тиосульфатная</td><td>тиосульфат</td></tr>\n</tbody>\n</table></div>\n<p>Тип 2 (активируется сам ксенобиотик): глициновая (→гиппуровая к-та), глутаминовая (→фенилацетилглутамин)</p>\n<p><strong>Метаболизм этанола в печени — 75-98% этанола окисляется именно в печени, 3 пути:</strong></p>\n<p>1 путь (основной): НАД+-зависимая алкогольдегидрогеназа (цитозоль+митохондрии, Zn-содержащий фермент): Этанол → Ацетальдегид + НАДН+Н+</p>\n<p>Клиническая деталь: у некоторых восточных народов преобладает изоформа с высокой активностью → повышенная чувствительность к алкоголю (\"азиатский флаш\"). Этот фермент НЕ индуцируется при хроническом алкоголизме.</p>\n<p>2 путь (индуцируемый при алкоголизме): Р450-зависимая микросомальная этанолокисляющая система — при хронич. алкоголизме окисление ускоряется на 50-70% за счёт гипертрофии ЭПР.</p>\n<p>3 путь (незначительный, ~2%): каталаза (пероксисомы): Н2О2 + этанол → Н2О + ацетальдегид</p>\n<p>Дальнейшая судьба ацетальдегида: окисляется ацетальдегиддегидрогеназой (НАД+-завис.) → уксусная кислота → (+HSKoA, +АТФ) → Ацетил-SKoA → в зависимости от соотношения АТФ/АДФ и наличия ОАА идёт в ЦТК, синтез ЖК или кетоновых тел.</p>\n<p><strong>Токсичность ацетальдегида (важный клинический блок):</strong></p>\n<ul>\n<li>Неферментативно ацетилирует SH-/NH2-группы белков → нарушение функции (в т.ч. альбумина → осмотическое набухание клеток)</li>\n<li>↑НАДН → ↓активность НАД+-зависимых ферментов → лактатацидоз</li>\n<li>Истощает ОАА (уходит на избыток ацетил-КоА) → ↓глюконеогенез, ↑синтез ЖК/ТАГ (жировая дегенерация печени!)</li>\n<li>Связывается с SH-глутатиона → ↓антиоксидантная защита → ↑ПОЛ</li>\n<li>Взаимодействует с катехоламинами → морфиноподобные соединения (сальсолинол) → алкогольная зависимость</li>\n</ul>", "conspectHtml": "<p><strong>88. Микросомальное окисление, метаболизм этанола</strong></p>\n<p><strong>Микросомальное окисление:</strong> ЭПР, окисляет НЕполярные в-ва, кислород внедряется НЕПОСРЕДСТВЕННО в субстрат</p>\n<p><strong>Монооксигеназная цепь(НАДФН,из ПФП):</strong> НАДФ-Р450-редуктаза→флавопротеид(ФАД,ФМН)→цитохром Р450 RH+O2+НАДФН2 → ROH+H2O+НАДФ+</p>\n<p><strong>Редуктазная цепь(НАДН,из гликолиза):</strong> НАДН-цит.В5-редуктаза→флавопротеид→цитохром В5→стеарил-КоА-десатураза → двойные связи в ЖК</p>\n<p>Индукторы: барбитураты, спирты, стероиды (фенобарбитал→↑конъюгация билирубина, дают новорождённым)</p>\n<p><strong>Внемикросомальный метаболизм (конъюгация):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Донор/механизм</th></tr></thead>\n<tbody>\n<tr><td>1(конъюгир.в-во активир.)</td><td>глюкуронидная(УДФ-ГК), сульфатная(ФАФС), ацетильная(АцКоА), метильная(SAM)</td></tr>\n<tr><td>2(ксенобиотик активир.)</td><td>глициновая(гиппур.к-та), глутаминовая</td></tr>\n</tbody>\n</table></div>\n<p><strong>Метаболизм этанола (75-98% в печени, 3 пути):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>Фермент</th><th>%</th></tr></thead>\n<tbody>\n<tr><td>1(осн.)</td><td>алкогольДГ(НАД+,Zn)</td><td>—</td></tr>\n<tr><td>2(индуц.при алкоголизме)</td><td>Р450-система</td><td>↑50-70% при алкоголизме</td></tr>\n<tr><td>3(незнач.)</td><td>каталаза</td><td>~2%</td></tr>\n</tbody>\n</table></div>\n<p>Ацетальдегид →(ацетальдегидДГ,НАД+)→ уксусная к-та →(+HSKoA,АТФ)→ Ацетил-КоА → ЦТК/ЖК/кетоновые тела</p>\n<p><strong>Токсичность ацетальдегида:</strong> ацетилир.белков(альбумин→отёк клеток), ↑НАДН→лактатацидоз, ↓ОАА→↓глюконеогенез+↑ТАГ(жир.дегенерация), ↓глутатион→↑ПОЛ, →морфиноподобные соед.(зависимость)</p>"}, {"num": 89, "title": "Катаболизм гема, метаболизм билирубина в печени, продукты восстановления билирубина в кишечнике", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Разберём полный путь превращения гема — от разрушения старого гемоглобина до конечных пигментов, окрашивающих мочу и кал.</p>\n<p><strong>Катаболизм гема — 3 этапа:</strong></p>\n<p>Этап I — образование гемохромогенных пигментов (в клетках РЭС: селезёнка, печень, костный мозг):</p>\n<ol>\n<li>НАДФН-зависимая гемоксигеназа (+O2) разрывает кольцевую структуру гема → вердоглобин, при этом Fe2+ окисляется в Fe3+</li>\n<li>Вердоглобин теряет Fe3+ (идёт на трансферрин → костный мозг) и теряет глобин (гидролизуется катепсинами до свободных АК) → образуется биливердин (зелёный пигмент)</li>\n<li>НАДФН-зависимая биливердинредуктаза восстанавливает биливердин → билирубин (красно-жёлтый пигмент)</li>\n</ol>\n<p><strong>Свободный (непрямой) билирубин</strong> — плохо растворим в воде, транспортируется с альбумином.</p>\n<p>Названия-синонимы: свободный / неконъюгированный / непрямой / нерастворимый / несвязанный / токсичный / жирорастворимый.</p>\n<p>% и норма: до 75% общего билирубина плазмы. Норма 5-15 мкМ. Даёт непрямую реакцию с диазореактивом (нужно предварительно осадить альбумин спиртом).</p>\n<p>Токсичность непрямого билирубина — особенно опасен для клеток мозга: через СОО⁻-группы пропионовой кислоты может связываться с мембранными ФЛ → нарушение функции мембран и транспортных систем.</p>\n<p><strong>Этап II — конъюгация (внутри гепатоцитов):</strong></p>\n<p>Билирубин (липофильный) легко проникает через мембрану печёночной клетки, освобождаясь от альбумина → фермент УДФ-глюкуронилтрансфераза присоединяет 1-2 молекулы глюкуроновой кислоты → билирубиндиглюкуронид (прямой билирубин).</p>\n<p>Названия-синонимы: связанный / конъюгированный / прямой / растворимый / несвободный / нетоксичный / водорастворимый.</p>\n<p>% и норма: до 25% общего билирубина. Норма 2-5 мкМ. Даёт прямую реакцию с диазореактивом.</p>\n<p>Общий билирубин = прямой + непрямой. Норма 8-20 мкМ.</p>\n<p>Секретируется в желчь → печёночно-кишечная циркуляция (3-5% всасывается обратно в кровь через воротную вену).</p>\n<p><strong>Этап III — восстановление в кишечнике:</strong></p>\n<ol>\n<li>В верхних отделах тонкого кишечника β-глюкуронидазы (бактериальные) гидролизуют билирубиндиглюкуронид → свободный билирубин + глюкуроновая кислота</li>\n<li>Восстанавливается бактериальными ферментами → мезобилирубин → мезобилирубиноген</li>\n<li>В толстом кишечнике анаэробные бактерии восстанавливают его до стеркобилиногена</li>\n</ol>\n<p><strong>Судьба стеркобилиногена (развилка на 3 пути):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>%</th><th>Судьба</th></tr></thead>\n<tbody>\n<tr><td>Через геморроидальные вены → почки</td><td>2-5%</td><td>выводится с мочой, окисляется до стеркобилина(уробилина) — соломенно-жёлтый цвет мочи</td></tr>\n<tr><td>Через воротную вену → печень</td><td>1-3%</td><td>необратимо разрушается до моно-/дипирролов → с желчью снова в кишечник → кал</td></tr>\n<tr><td>С фекалиями напрямую</td><td>95-98% (основная масса)</td><td>окисляется до стеркобилина — коричневый цвет кала</td></tr>\n</tbody>\n</table></div>\n<p>Логика цвета: и моча, и кал окрашиваются производными одного и того же пигмента (стеркобилина/уробилина) — просто по разным путям выведения.</p>", "conspectHtml": "<p><strong>89. Катаболизм гема, метаболизм билирубина</strong></p>\n<p><strong>Этап I (клетки РЭС):</strong> Гем →(гемоксигеназа,НАДФН,O2)→ Вердоглобин(Fe2+→Fe3+) → -Fe3+(→трансферрин), -глобин(→АК) → Биливердин →(биливердинредуктаза,НАДФН)→ Билирубин(непрямой)</p>\n<p><strong>Непрямой билирубин:</strong> своб./неконъюгир./токсичный/жирораств., + альбумин, 75%(5-15мкМ), непрямая р-ция с диазореактивом Токсичность: связ. с ФЛ мембран(особенно мозг) через COO⁻-группы</p>\n<p><strong>Этап II (гепатоциты):</strong> Билирубин →(УДФ-глюкуронилтрансфераза,+глюкурон.к-та)→ Билирубиндиглюкуронид(прямой) Связ./конъюгир./нетоксичный/водораств., 25%(2-5мкМ), прямая р-ция с диазореактивом Общий билирубин(8-20мкМ) = прямой+непрямой</p>\n<p><strong>Этап III (кишечник):</strong> Билирубиндиглюкуронид →(β-глюкуронидазы)→ своб.билирубин → мезобилирубин → мезобилирубиноген → (толстая кишка, бактерии) → Стеркобилиноген</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>%</th><th>Итог</th></tr></thead>\n<tbody>\n<tr><td>Почки</td><td>2-5%</td><td>стеркобилин(уробилин) — цвет мочи</td></tr>\n<tr><td>Печень(из крови)</td><td>1-3%</td><td>разрушение до пирролов</td></tr>\n<tr><td>Кал</td><td>95-98%</td><td>стеркобилин — цвет кала</td></tr>\n</tbody>\n</table></div>"}, {"num": 90, "title": "Гипербилирубинемии, характеристика билирубинов, виды желтух, физиологическая желтуха новорождённых", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Это прямое клиническое продолжение прошлого вопроса — зная нормальный путь билирубина, легко понять, ЧТО именно \"ломается\" при разных видах желтух.</p>\n<p><strong>Гипербилирубинемия:</strong> повышение общего билирубина в крови (&gt;20 мкМ) → желтушное окрашивание кожи и склер.</p>\n<p><strong>Характеристика билирубинов:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Непрямой (свободный)</th><th>Прямой (связанный)</th></tr></thead>\n<tbody>\n<tr><td>% от общего</td><td>75%</td><td>25%</td></tr>\n<tr><td>Растворимость</td><td>жирорастворимый</td><td>водорастворимый</td></tr>\n<tr><td>Токсичность</td><td>токсичный</td><td>нетоксичный</td></tr>\n<tr><td>Транспорт</td><td>+альбумин</td><td>—</td></tr>\n<tr><td>Реакция с диазореактивом</td><td>непрямая (нужен спирт для осаждения альбумина)</td><td>прямая (быстрая)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Виды желтух (3 типа, по локализации \"поломки\" в конвейере):</strong></p>\n<ol>\n<li>Гемолитическая (надпечёночная) — проблема ДО печени, на этапе образования: массовый внутрисосудистый распад эритроцитов → слишком много гема поступает в РЭС → образуется избыток непрямого билирубина, который печень физически не успевает весь конъюгировать.</li>\n</ol>\n<ul>\n<li>↑↑ непрямого билирубина</li>\n<li>Кал тёмный (много стеркобилина)</li>\n<li>Моча тёмная (много стеркобилина, но билирубина в моче НЕТ — непрямой билирубин связан с альбумином и не фильтруется в почках!)</li>\n</ul>\n<ol>\n<li>Паренхиматозная (печёночно-клеточная, гепатиты) — проблема В САМОЙ печени: гепатоциты повреждены → нарушена и конъюгация, И секреция уже готового прямого билирубина в желчь.</li>\n</ol>\n<ul>\n<li>↑↑ прямого билирубина + ↑ непрямого</li>\n<li>Кал обесцвечен (мало стеркобилина)</li>\n<li>Моча тёмная (появляется прямой билирубин — он водорастворим и легко фильтруется в почках!)</li>\n</ul>\n<ol>\n<li>Обтурационная (подпечёночная, механическая) — проблема ПОСЛЕ печени: закупорка желчных путей (камень, опухоль) → билирубин конъюгирован нормально, но физически не может попасть из печени в кишечник.</li>\n</ol>\n<ul>\n<li>↑↑ прямого билирубина (в крови)</li>\n<li>Кал обесцвечен (стеркобилина НЕТ вообще)</li>\n<li>Моча тёмная (много прямого билирубина, легко фильтруется почками)</li>\n</ul>\n<p><strong>Логика для быстрого различения на экзамене:</strong></p>\n<ul>\n<li>Кал тёмный → гемолитическая (единственный вариант, где кала МНОГО пигмента!)</li>\n<li>Кал обесцвечен — смотрим на билирубин в крови: если и прямой, и непрямой ↑ → паренхиматозная; если только прямой ↑↑ (резко) → обтурационная</li>\n<li>Билирубин в моче есть ТОЛЬКО когда есть прямая фракция (паренхиматозная и обтурационная), при гемолитической — билирубина в моче нет вообще (только стеркобилиноген)</li>\n</ul>\n<p><strong>Физиологическая желтуха новорождённых:</strong></p>\n<p>Возникает на 3-й день жизни — причина — возрастной дефицит фермента УДФ-глюкуронилтрансферазы (незрелость печени новорождённого).</p>\n<p>Механизм: фермент конъюгации ещё не \"созрел\" → накопление непрямого (токсичного!) билирубина.</p>\n<p>Лечение — фототерапия (синий свет): превращает непрямой билирубин в водорастворимый изомер люмирубин, который может выводиться с желчью и мочой БЕЗ участия дефицитного фермента конъюгации.</p>\n<p>Дополнительная клиническая деталь: небольшие дозы фенобарбитала (индуктор микросомальной системы, включая ферменты конъюгации билирубина) тоже применяются для уменьшения проявления патологической желтухи новорождённых.</p>\n<p><strong>Диагностическое значение:</strong> определение фракций билирубина (прямой/непрямой раздельно) позволяет точно дифференцировать тип желтухи и оценить, на каком именно этапе метаболического пути произошла поломка — без биопсии печени, просто по анализу крови.</p>", "conspectHtml": "<p><strong>90. Гипербилирубинемии, виды желтух</strong></p>\n<p><strong>Гипербилирубинемия:</strong> общий билирубин &gt;20 мкМ</p>\n<p><strong>Билирубины:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Непрямой</th><th>Прямой</th></tr></thead>\n<tbody>\n<tr><td>%</td><td>75%</td><td>25%</td></tr>\n<tr><td>Токсичность</td><td>токсичный</td><td>нетоксичный</td></tr>\n<tr><td>Раствор.</td><td>жирораств.</td><td>водораств.</td></tr>\n<tr><td>Диазореактив</td><td>непрямая р-ция</td><td>прямая р-ция</td></tr>\n</tbody>\n</table></div>\n<p><strong>3 вида желтух (по месту поломки):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Причина</th><th>Билирубин крови</th><th>Кал</th><th>Моча</th></tr></thead>\n<tbody>\n<tr><td>Гемолитическая(надпечёночная)</td><td>↑↑распад эритроцитов</td><td>↑↑непрямой</td><td>тёмный(↑стеркобилин)</td><td>тёмная(стеркобилиноген), билирубина НЕТ</td></tr>\n<tr><td>Паренхиматозная(гепатиты)</td><td>повреждение гепатоцитов</td><td>↑↑прямой+↑непрямой</td><td>обесцвечен</td><td>тёмная(появл.прямой билирубин)</td></tr>\n<tr><td>Обтурационная(камни,опухоль)</td><td>блок оттока желчи</td><td>↑↑прямой</td><td>обесцвечен(нет стеркобилина)</td><td>тёмная(много прямого)</td></tr>\n</tbody>\n</table></div>\n<p><em>Быстрый признак: тёмный кал→гемолитич.; обесцвеченный→паренхим./обтурац. (различать по фракциям крови)</em></p>\n<p><strong>Физиологич. желтуха новорождённых:</strong> 3-й день жизни, ↓УДФ-глюкуронилтрансферазы(незрелость печени) → ↑непрямой билирубин Лечение: фототерапия → люмирубин(водораств., минуя дефицитный фермент) ИЛИ фенобарбитал(индукция фермента)</p>"}, {"num": 91, "title": "Клинико-лабораторные синдромы при заболеваниях печени", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Это финальный вопрос раздела печени — систематизация того, как биохимический анализ крови позволяет распознать 4 разных типа повреждения печени.</p>\n<p><strong>Синдром цитолиза (нарушение целостности гепатоцитов)</strong></p>\n<p>Логика: клетки печени разрушаются → их внутриклеточное содержимое (ферменты) \"вытекает\" в кровь.</p>\n<p>Показатели:</p>\n<ul>\n<li>↑активности ферментов в крови: АЛТ, АСТ, ЛДГ, глутаматДГ, альдолаза</li>\n<li>Гипербилирубинемия за счёт прямой фракции (повреждённые клетки \"текут\", часть уже конъюгированного билирубина попадает в кровь)</li>\n</ul>\n<p><strong>Синдром холестаза (нарушение оттока желчи)</strong></p>\n<p>Логика: желчь не может нормально выйти → всё, что должно было уйти с желчью, накапливается в крови.</p>\n<p>Показатели:</p>\n<ul>\n<li>↑активности щелочной фосфатазы (ЩФ)</li>\n<li>↑уровня билирубина (прямого)</li>\n<li>↑холестерина, фосфолипидов</li>\n<li>↑желчных кислот в крови</li>\n</ul>\n<p><strong>Синдром печёночно-клеточной недостаточности (снижение синтетической и детоксикационной функции)</strong></p>\n<p>Логика: печень больше не может нормально ВЫПОЛНЯТЬ свою работу.</p>\n<p>Показатели:</p>\n<ul>\n<li>↓общего белка, особенно альбумина</li>\n<li>↓факторов свёртывания (I,II,V,VII,X) → ↑протромбинового времени</li>\n<li>↓холинэстеразы</li>\n<li>↑аммиака, фенолов, аминокислот в крови</li>\n</ul>\n<p>Это единственный из 4 синдромов, где показатели идут в основном на СНИЖЕНИЕ (белок, факторы свёртывания), а не на повышение.</p>\n<p><strong>Воспалительный синдром (активация РЭС и иммунитета)</strong></p>\n<p>Логика: печень содержит много клеток ретикулоэндотелиальной системы, и при воспалении (гепатиты) активируется иммунный ответ.</p>\n<p>Показатели:</p>\n<ul>\n<li>↑белков \"острой фазы\" (С-реактивный белок, гаптоглобин, церулоплазмин, фибриноген)</li>\n<li>Диспротеинемия (↑глобулинов, особенно γ-фракции)</li>\n</ul>\n<p><strong>Итоговая логика всех 4 синдромов:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Синдром</th><th>Что происходит</th><th>Направление показателей</th></tr></thead>\n<tbody>\n<tr><td>Цитолиз</td><td>клетки разрушаются, ферменты \"вытекают\"</td><td>↑ферментов (АЛТ,АСТ,ЛДГ)</td></tr>\n<tr><td>Холестаз</td><td>желчь не выходит, копится в крови</td><td>↑компонентов желчи (ЩФ,билирубин,ХС,ЖК)</td></tr>\n<tr><td>Печёночно-клеточная недостаточность</td><td>печень не работает</td><td>↓синтеза (белок,факторы свёртывания) + ↑токсинов(NH3)</td></tr>\n<tr><td>Воспалительный</td><td>иммунный ответ активирован</td><td>↑белков острой фазы + ↑γ-глобулинов</td></tr>\n</tbody>\n</table></div>\n<p>На практике эти синдромы редко встречаются в чистом виде — например, при вирусном гепатите обычно одновременно выражены и цитолиз, и воспалительный синдром.</p>", "conspectHtml": "<p><strong>91. Клинико-лабораторные синдромы при заболеваниях печени</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Синдром</th><th>Механизм</th><th>Показатели</th></tr></thead>\n<tbody>\n<tr><td>Цитолиза</td><td>разрушение гепатоцитов → ферменты в кровь</td><td>↑АЛТ,АСТ,ЛДГ,глутаматДГ,альдолаза; ↑билирубин(прямой)</td></tr>\n<tr><td>Холестаза</td><td>нарушен отток желчи</td><td>↑ЩФ, ↑билирубин(прямой), ↑ХС, ↑ФЛ, ↑желчных к-т</td></tr>\n<tr><td>Печёночно-клеточной недостаточности</td><td>↓синтетич./детоксикац. функции</td><td>↓общий белок(альбумин), ↓факторы свёртыв.(I,II,V,VII,X)→↑протромбин.время, ↓холинэстераза, ↑аммиак,фенолы,АК</td></tr>\n<tr><td>Воспалительный</td><td>активация РЭС/иммунитета</td><td>↑белки остр.фазы(СРБ,гаптоглобин,церулоплазмин,фибриноген), диспротеинемия(↑γ-глобулины)</td></tr>\n</tbody>\n</table></div>\n<p><em>Логика: цитолиз/холестаз — показатели ↑ (утечка/застой); недостаточность — показатели ↓ (синтеза) + ↑токсинов; воспаление — иммунный ответ</em></p>"}, {"num": 92, "title": "Особенности метаболизма и энергетического обмена в клетках поперечно-полосатой и гладкой мускулатуры", "section": "Раздел 8", "sectionTitle": "Биохимия мышечной и соединительной тканей", "explanationHtml": "<p>Разберём три типа мышечной ткани, каждый со своей энергетической стратегией.</p>\n<p><strong>Поперечно-полосатые (скелетные) мышцы — 2 типа волокон:</strong></p>\n<p>Быстрые (белые) волокна:</p>\n<ul>\n<li>Хуже снабжаются кровью → меньше кислорода → анаэробный гликолиз — основной путь генерации АТФ</li>\n<li>Быстро утомляются из-за накопления лактата</li>\n<li>Пример: глазные мышцы</li>\n</ul>\n<p>Медленные (красные) волокна:</p>\n<ul>\n<li>Обильно снабжаются кровью, много миоглобина (депо O2) и митохондрий</li>\n<li>Основной путь — окислительное фосфорилирование</li>\n<li>Медленнее сокращаются, но дольше не устают</li>\n<li>Пример: мышцы спины (поддержание позы)</li>\n</ul>\n<p><strong>Энергетические субстраты скелетных мышц (по порядку приоритета при работе):</strong></p>\n<ol>\n<li>Гликоген → лактат+глюкоза (40% вклада)</li>\n<li>При длительной работе подключаются жиры (22%)</li>\n<li>Креатинфосфат — самый быстрый резерв</li>\n</ol>\n<p><strong>Механизм быстрого переключения на синтез АТФ — 3 источника:</strong></p>\n<ol>\n<li>Креатинфосфат — самый быстрый путь регенерации: АДФ+КрФ→АТФ+креатин (фермент креатинкиназа)</li>\n<li>Распад гликогена — регуляторный фермент гликогенфосфорилаза, активна в фосфорилированной форме, активируется киназой-b в присутствии Ca2+</li>\n<li>Миоаденилаткиназная реакция: 2АДФ → АТФ + АМФ — АМФ при этом служит источником аммиака</li>\n</ol>\n<p><strong>Гладкая мускулатура:</strong></p>\n<ul>\n<li>Низкая потребность в АТФ — из-за пониженной активности АТФазы миозина → меньшая скорость ЦТК и дыхательной цепи</li>\n<li>Меньше миофибриллярных белков, чем в скелетной мышце (в желудке — примерно в 2 раза меньше!)</li>\n<li>↑концентрация белков стромы</li>\n<li>Незначительное содержание гликогена</li>\n<li>Иная структура миозина, отсутствует тропониновая система</li>\n<li>Регуляция — по миозиновому типу (фосфорилирование лёгких цепей миозина, а не через тропонин)</li>\n</ul>", "conspectHtml": "<p><strong>92. Метаболизм поперечно-полосатой и гладкой мускулатуры</strong></p>\n<p><strong>Скелетные мышцы — 2 типа волокон:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Быстрые(белые)</th><th>Медленные(красные)</th></tr></thead>\n<tbody>\n<tr><td>Кровоснабжение</td><td>хуже</td><td>обильное</td></tr>\n<tr><td>Путь АТФ</td><td>анаэробный гликолиз</td><td>окислит. фосфорилирование</td></tr>\n<tr><td>Миоглобин</td><td>мало</td><td>много</td></tr>\n<tr><td>Утомляемость</td><td>быстро(лактат)</td><td>медленно</td></tr>\n<tr><td>Пример</td><td>глазные мышцы</td><td>мышцы спины</td></tr>\n</tbody>\n</table></div>\n<p><strong>Энергосубстраты при работе (приоритет):</strong> гликоген→лактат+глюкоза(40%) → при длит.работе жиры(22%)</p>\n<p><strong>3 механизма быстрой регенерации АТФ:</strong></p>\n<ol>\n<li>Креатинфосфат: АДФ+КрФ→АТФ+креатин(креатинкиназа) — самый быстрый</li>\n<li>Распад гликогена: гликогенфосфорилаза(фосфорилир.форма), активация киназой-b + Ca2+</li>\n<li>Миоаденилаткиназная р-ция: 2АДФ→АТФ+АМФ (АМФ→источник NH3)</li>\n</ol>\n<p><strong>Гладкая мускулатура:</strong> ↓АТФаза миозина→↓потребность в АТФ→↓ЦТК/дых.цепь ↓миофибриллярных белков(в желудке в 2× меньше), ↑белков стромы, мало гликогена Иной миозин, НЕТ тропониновой системы → регуляция по миозиновому типу(фосфорилир. лёгких цепей миозина)</p>"}, {"num": 93, "title": "Особенности метаболизма и энергетического обмена в клетках миокарда, метаболические нарушения при инфаркте, лабораторная диагностика", "section": "Раздел 8", "sectionTitle": "Биохимия мышечной и соединительной тканей", "explanationHtml": "<p>Сердце занимает промежуточное положение между скелетной и гладкой мускулатурой по многим параметрам, но его энергетика уникальна.</p>\n<p><strong>Особенности метаболизма миокарда:</strong></p>\n<ul>\n<li>Очень чувствителен к недостатку кислорода (строго аэробная ткань)</li>\n<li>Основной путь энергии — окислительное фосфорилирование. Анаэробный гликолиз для регенерации АТФ практически не протекает (принципиальное отличие от быстрых скелетных мышц!)</li>\n<li>Только 30% кислорода в миокарде расходуется на окисление углеводов</li>\n</ul>\n<p><strong>Приоритет использования субстратов в сердце (меняется в зависимости от ситуации):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Ситуация</th><th>Приоритет субстратов</th></tr></thead>\n<tbody>\n<tr><td>Во время приёма пищи (абсорбтивный)</td><td>1)Глюкоза 2)ВЖК</td></tr>\n<tr><td>После приёма пищи (постабсорбтивный, натощак/покой)</td><td>1)ВЖК (до 70%!) 2)Глюкоза 3)Кетоновые тела(немного)</td></tr>\n<tr><td>Тяжёлая физическая работа</td><td>1)Лактат (цикл Кори!) 2)ВЖК 3)Глюкоза</td></tr>\n</tbody>\n</table></div>\n<p>Интереснейшая деталь: сердце при нагрузке предпочитает именно ЛАКТАТ, приходящий от работающих скелетных мышц — сердце буквально \"доедает\" продукт метаболизма мышц (превращая лактат→ПВК→ацетил-КоА→ЦТК, как в цикле Кори!). Из свободных ЖК легче всего окисляется олеиновая кислота.</p>\n<p><strong>Промежуточное положение миокарда между скелетной и гладкой мускулатурой (по составу):</strong></p>\n<ul>\n<li>Содержание АТФ на 1г ткани: скелетная(4,43мкмоль) &gt; сердце(2,60мкмоль) &gt; гладкая(1,38мкмоль)</li>\n<li>По содержанию гликогена — тоже промежуточное положение</li>\n<li>Миокард богаче фосфоглицеридами, чем другие мышечные ткани</li>\n</ul>\n<p><strong>Эндокринная роль миокарда:</strong> продуцирует атриопептиды (натрийуретические гормоны), в основном в ушках предсердий — подавляют РААС, гипотензивный эффект.</p>\n<p><strong>Метаболические нарушения при инфаркте миокарда:</strong></p>\n<p>Логика: при закупорке коронарной артерии → ишемия → кислород не поступает → строго аэробная ткань миокарда не может работать через окислительное фосфорилирование (в отличие от скелетных мышц, у неё нет \"запасного\" анаэробного пути!) → клетки погибают → их внутриклеточные ферменты выходят в кровь.</p>\n<p><strong>Лабораторная диагностика ИМ — маркеры гибели миоцитов, важна именно временна́я последовательность выхода в кровь:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Маркер</th><th>Специфичность</th><th>Начало ↑</th><th>Пик</th></tr></thead>\n<tbody>\n<tr><td>Миоглобин</td><td>самый ранний, но НЕспецифичный</td><td>0,5-4 ч</td><td>6-12 ч</td></tr>\n<tr><td>Тропонин T и I</td><td>высокоспецифичные</td><td>2,5-4 ч</td><td>8-10 ч и 3-4 сут (двугорбый пик!)</td></tr>\n</tbody>\n</table></div>\n<p>Клиническая логика этой временно́й шкалы: миоглобин — маленькая молекула, быстро выходит из повреждённых клеток и появляется в крови раньше всего, но он есть и в скелетных мышцах тоже (неспецифичен — травма мышцы тоже даст его повышение). Тропонины — более специфичные кардиомаркеры, появляются чуть позже, но держатся дольше и надёжнее указывают именно на повреждение сердца.</p>\n<p>Связка с уже известным материалом: КК-МВ (изофермент креатинкиназы) как кардиомаркер, и ЛДГ1,2 — эта таблица дополняет тот список ещё двумя, более современными и чувствительными маркерами.</p>", "conspectHtml": "<p><strong>93. Метаболизм миокарда, диагностика инфаркта</strong></p>\n<p><strong>Особенности метаболизма:</strong> строго аэробная ткань, АНАЭРОБНЫЙ ГЛИКОЛИЗ практически НЕ идёт. Только 30% О2 на углеводы</p>\n<p><strong>Приоритет субстратов:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Ситуация</th><th>Порядок</th></tr></thead>\n<tbody>\n<tr><td>Во время еды</td><td>Глюкоза→ВЖК</td></tr>\n<tr><td>После еды/покой</td><td>ВЖК(70%)→Глюкоза→кетон.тела</td></tr>\n<tr><td>Нагрузка</td><td>Лактат(цикл Кори)→ВЖК→Глюкоза</td></tr>\n</tbody>\n</table></div>\n<p><strong>Промежуточное положение (АТФ/г ткани):</strong> скелетная(4,43) &gt; сердце(2,60) &gt; гладкая(1,38). Миокард богат фосфоглицеридами</p>\n<p><strong>Эндокринная функция:</strong> атриопептиды(ПНФ) — из ушек предсердий</p>\n<p><strong>Диагностика инфаркта миокарда (маркеры, по времени):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Маркер</th><th>Специфичность</th><th>Начало↑</th><th>Пик</th></tr></thead>\n<tbody>\n<tr><td>Миоглобин</td><td>ранний, НЕспецифичный</td><td>0,5-4ч</td><td>6-12ч</td></tr>\n<tr><td>Тропонин T/I</td><td>высокоспецифичный</td><td>2,5-4ч</td><td>8-10ч и 3-4сут</td></tr>\n</tbody>\n</table></div>\n<p><em>Механизм: аэробная ткань + ишемия → нет запасного анаэробного пути → гибель клеток → выход ферментов в кровь</em></p>"}, {"num": 94, "title": "Фибриллярные и регуляторные белки мышечного сокращения, механизм сокращения, роль ионов кальция, актиновая и миозиновая регуляция", "section": "Раздел 8", "sectionTitle": "Биохимия мышечной и соединительной тканей", "explanationHtml": "<p>Это ключевой, детальный вопрос про сам молекулярный механизм сокращения — как химическая энергия АТФ превращается в механическое движение.</p>\n<p><strong>Фибриллярные (сократительные) белки:</strong></p>\n<ul>\n<li>Миозин (54%) — обладает АТФ-азной активностью, образует толстые филаменты. Состоит из 2 тяжёлых цепей (с глобулярными головками) + лёгкие цепи.</li>\n<li>Актин — существует в 2 формах: G-актин (мономерный) полимеризуется (в присутствии Mg2+) → F-актин (нерастворимая двойная спиральная нить) → образует тонкие филаменты</li>\n<li>Актомиозин — комплекс актина+миозина, тоже обладает АТФ-азной активностью, но другой, чем у самого миозина (активируется Mg2+, ингибируется высокими [АТФ]; у миозина — наоборот)</li>\n</ul>\n<p><strong>Регуляторные белки (только в поперечно-полосатых мышцах!):</strong></p>\n<ul>\n<li>Тропомиозин (7%) — вытянутая молекула из 2 цепей (α,β), лежит в щели F-актина, блокирует центры связывания миозина</li>\n<li>Тропонин (2%) — комплекс из 3 субъединиц: TnC — связывает Ca2+ (структурно аналогичен кальмодулину, связывает 4 иона Ca2+!); TnI — ингибиторный (мешает F-актину и миозину взаимодействовать); TnT — связывает тропомиозин</li>\n</ul>\n<p>Тонкий филамент = F-актин + тропомиозин + TnC+TnI+TnT (5 компонентов).</p>\n<p><strong>Механизм мышечного сокращения — цикл из этапов:</strong></p>\n<ol>\n<li>Покой: АТФ связана с головкой миозина → гидролиз (АТФ-азная активность миозина) → АДФ+Фн остаются связаны с головкой, миозин переходит в \"напряжённое\" состояние (угол 90°)</li>\n<li>Возбуждение + приток Ca2+: Ca2+ связывается с TnC → конформация тропонина меняется → тропомиозин сдвигается (спирализуется) → открываются центры связывания на актине</li>\n<li>Присоединение: головка миозина (с АДФ+Фн) присоединяется к актину под углом 90°</li>\n<li>Силовой гребок: головка поворачивается на 45° за счёт накопленной энергии — АДФ и Фн отщепляются (акт сокращения происходит именно при отделении АДФ, НЕ при самом гидролизе АТФ! — это ключевая тонкость)</li>\n<li>Расслабление: новая молекула АТФ связывается с головкой миозина → отделение от актина</li>\n</ol>\n<p>При истощении АТФ головки остаются прочно связаны с актином → трупное окоченение.</p>\n<p><strong>Роль ионов Ca2+ — количественная логика:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Концентрация Ca2+ в саркоплазме</th><th>Состояние</th></tr></thead>\n<tbody>\n<tr><td>10⁻⁷-10⁻⁸ моль/л (покой)</td><td>мышца расслаблена</td></tr>\n<tr><td>10⁻⁵ моль/л</td><td>сокращение запущено</td></tr>\n</tbody>\n</table></div>\n<p>Транспорт Ca2+: саркоплазматический ретикулум (через Mg2+,Ca2+-АТФазу, кальсеквестрин) закачивает Ca2+ обратно против градиента, поддерживая низкую концентрацию в покое. При возбуждении — канал SR-Foot открывается → Ca2+ выходит → концентрация растёт до 10⁻⁵ → запуск сокращения.</p>\n<p>Клиническая деталь про сердце: в миокарде основной источник Ca2+ — внеклеточная жидкость (не только СПР!) — поэтому при отсутствии внеклеточного Ca2+ сердце останавливается за 1 минуту, а скелетная мышца может сокращаться часами (свои запасы в СПР ещё есть)!</p>\n<p><strong>2 типа регуляции сокращения:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Актиновая регуляция</th><th>Миозиновая регуляция</th></tr></thead>\n<tbody>\n<tr><td>Где</td><td>поперечно-полосатые мышцы (скелетная+миокард)</td><td>гладкие мышцы</td></tr>\n<tr><td>Механизм</td><td>тропонин-тропомиозиновая система на тонком филаменте</td><td>фосфорилирование лёгких цепей миозина</td></tr>\n<tr><td>Тропониновая система</td><td>ЕСТЬ</td><td>НЕТ</td></tr>\n<tr><td>Ca2+-связывающий белок</td><td>TnC</td><td>кальмодулин (Ca2+×4→активирует цАМФ-зависимую киназу)</td></tr>\n</tbody>\n</table></div>\n<p>Обрати внимание — оба механизма всё равно регулируются именно Ca2+, просто через разные посреднические белки.</p>", "conspectHtml": "<p><strong>94. Белки мышечного сокращения, механизм, роль Ca2+, 2 типа регуляции</strong></p>\n<p><strong>Сократительные белки:</strong> Миозин(АТФазная акт., толстый филамент) / F-актин(тонкий филамент) / Актомиозин(др.АТФазная акт.)</p>\n<p><strong>Регуляторные белки (ТОЛЬКО попер.-полос. мышцы):</strong> Тропомиозин(блок центров связывания) / Тропонин: TnC(связ.Ca2+,×4), TnI(ингибитор), TnT(связ.тропомиозин)</p>\n<p><strong>Цикл сокращения (5 этапов):</strong></p>\n<ol>\n<li>Покой: АТФ на головке миозина→гидролиз→АДФ+Фн(напряж.90°)</li>\n<li>Ca2+→TnC → тропомиозин сдвигается → открыты центры на актине</li>\n<li>Головка присоединяется к актину</li>\n<li>Силовой гребок(45°), АДФ+Фн отщепляются → сокращение при отделении АДФ(не при гидролизе!)</li>\n<li>Новая АТФ → отделение миозина от актина</li>\n</ol>\n<p><strong>Роль Ca2+:</strong> покой 10⁻⁷-10⁻⁸М(расслаблено) → 10⁻⁵М(сокращение). СПР(Ca2+,Mg2+-АТФаза,кальсеквестрин) закачивает Ca2+ обратно; SR-Foot(канал) выпускает при возбуждении <em>Сердце: Ca2+ гл.обр. из внеклет.жидкости → без него остановка за 1 мин (vs часы у скелетной)</em></p>\n<p><strong>2 типа регуляции:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Актиновая</th><th>Миозиновая</th></tr></thead>\n<tbody>\n<tr><td>Ткань</td><td>попер.-полосатые(скелет+сердце)</td><td>гладкие</td></tr>\n<tr><td>Механизм</td><td>тропонин-тропомиозин(тонкий филамент)</td><td>фосфорилир. лёгких цепей миозина</td></tr>\n<tr><td>Ca2+-белок</td><td>TnC</td><td>кальмодулин→киназа</td></tr>\n</tbody>\n</table></div>"}, {"num": 95, "title": "Биосинтез коллагена, катаболизм коллагена, диагностическое значение гидроксипролина, роль коллагена в заживлении ран", "section": "Раздел 8", "sectionTitle": "Биохимия мышечной и соединительной тканей", "explanationHtml": "<p>Коллаген — самый распространённый белок в организме человека, и его синтез — многоступенчатый процесс.</p>\n<p><strong>Синтез коллагена — начинается в фибробласте, завершается в межклеточном матриксе:</strong></p>\n<p>В фибробласте:</p>\n<ol>\n<li>Синтез полипептидной цепи (препроформа)</li>\n<li>Отщепление \"пре\"-фрагмента</li>\n<li>Гидроксилирование пролина и лизина в цепи проколлагена — ферменты пролилгидроксилаза и лизилгидроксилаза</li>\n</ol>\n<p>Реакция гидроксилирования требует 4 условий:</p>\n<ol>\n<li>Аскорбиновая кислота (вит. С) — переводит Fe3+→Fe2+ (при дефиците — цинга, синтез коллагена резко падает!)</li>\n<li>Наличие Fe2+</li>\n<li>Наличие α-КГ (донор для реакции гидроксилазы)</li>\n<li>Гликозилирование остатков Pro-OH и Lys-OH (ферментом гликозилтрансферазой, чаще галактозой) — при нарушении гликозилирования развивается синдром Элерса-Данло-Русакова!</li>\n</ol>\n<ol>\n<li>Образование тройной про-α-спирали (3 цепи соединяются водородными и дисульфидными связями) → проколлаген</li>\n</ol>\n<p>Роль пролина/гидроксипролина: стабилизируют тройную спираль. Глицин всегда в месте пересечения цепей.</p>\n<ol>\n<li>Секреция проколлагена в межклеточное пространство (экзоцитоз)</li>\n</ol>\n<p>В межклеточном матриксе:</p>\n<ol>\n<li>ε-проколлагеназа отщепляет концевые N- и C-пропептиды → образуется тропоколлаген (структурная единица коллагеновых фибрилл)</li>\n</ol>\n<p>Клиническая деталь: при снижении активности проколлагеназы пропептиды не отщепляются → нарушено образование тропоколлагена → синдром Элерса-Данло-Русакова тип VII!</p>\n<ol>\n<li>Тропоколлаген → спонтанная самосборка в микрофибриллы</li>\n<li>Микрофибриллы укрепляются ковалентными сшивками (окисление лизиловых/гидроксилизиловых остатков в альдегиды, реакция альдольной конденсации → Шиффовы основания)</li>\n<li>Микрофибриллы → коллагеновые фибриллы → коллагеновое волокно</li>\n</ol>\n<p>Интересная структурная деталь: между C- и N-концами разных молекул тропоколлагена в волокне есть равные промежутки → коллагеновое волокно остаётся на 1/5 полым — эти пустоты нужны для минерализации (важно для костной ткани!).</p>\n<p><strong>Катаболизм коллагена:</strong></p>\n<p>Коллаген — медленно обменивающийся белок (Т½ = несколько месяцев).</p>\n<p>Тканевая коллагеназа (Zn2+-зависимая, синтезируется фибробластами и макрофагами) расщепляет тройную спираль в определённом месте (~1/4 от C-конца, между глицином и лейцином/изолейцином) → фрагменты денатурируют при температуре тела → становятся доступны для пептидогидролаз (нативный коллаген ими НЕ гидролизуется!).</p>\n<p>Активаторы тканевой коллагеназы: плазмин, калликреин, катепсин В.</p>\n<p>Клиническая деталь: ↓катаболизма коллагена → фиброз органов (печень, лёгкие); ↑катаболизма → аутоиммунные заболевания (ревматоидный артрит, СКВ).</p>\n<p><strong>Регуляция обмена коллагена:</strong></p>\n<ul>\n<li>Обратная связь: сам коллаген+N-пропептиды тормозят собственную трансляцию</li>\n<li>Метаболически: аскорбиновая кислота стимулирует синтез</li>\n<li>Гормонально: глюкокортикоиды тормозят синтез; эстрогены стимулируют (рецепторы на фибробластах кожи/матки)</li>\n</ul>\n<p><strong>Диагностическое значение гидроксипролина:</strong></p>\n<p>Гидроксипролин — маркерная аминокислота, содержится только в коллагене (и в малых количествах в эластине). Повышение экскреции с мочой = усиление распада коллагена — маркер при болезни Педжета, гиперпаратиреозе, коллагенозах.</p>\n<p>Возрастная деталь: с возрастом количество поперечных сшивок ↑ → коллаген становится менее доступен для коллагеназы → экскреция гидроксипролина с возрастом ↓.</p>\n<p><strong>Роль коллагена в заживлении ран:</strong> фибробласты мигрируют в рану → активно синтезируют коллаген → образуется соединительнотканный рубец (хаотично расположенные фибриллы). Похожий процесс — при циррозе печени, атеросклерозе.</p>", "conspectHtml": "<p><strong>95. Биосинтез и катаболизм коллагена, гидроксипролин</strong></p>\n<p><strong>Синтез (фибробласт → межклеточный матрикс):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Этап</th><th>Место</th><th>Что происходит</th></tr></thead>\n<tbody>\n<tr><td>1-2</td><td>фибробласт</td><td>синтез ППЦ, отщепл. \"пре\"-фрагмента</td></tr>\n<tr><td>3</td><td>фибробласт</td><td>гидроксилирование Pro,Lys (пролил-/лизилгидроксилаза)</td></tr>\n<tr><td>4</td><td>фибробласт</td><td>тройная про-α-спираль → Проколлаген</td></tr>\n<tr><td>5</td><td>—</td><td>секреция (экзоцитоз)</td></tr>\n<tr><td>6</td><td>матрикс</td><td>ε-проколлагеназа отщепл. N/C-пропептиды → Тропоколлаген</td></tr>\n<tr><td>7-9</td><td>матрикс</td><td>самосборка: микрофибриллы→фибриллы→волокно (сшивки)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Условия гидроксилирования (4):</strong> вит.С(Fe3+→Fe2+, дефицит=цинга), Fe2+, α-КГ, гликозилирование(→нарушение=Элерса-Данло-Русакова) <em>Дефект проколлагеназы → Элерса-Данло тип VII</em></p>\n<p><strong>Катаболизм:</strong> Т½ = месяцы. Тканевая коллагеназа(Zn2+) расщепляет тройную спираль → денатурация → пептидогидролазы Активаторы: плазмин, калликреин, катепсин В ↓катаболизма→фиброз; ↑катаболизма→аутоиммунные болезни(РА,СКВ)</p>\n<p><strong>Регуляция:</strong> обратная связь(коллаген тормозит себя), вит.С(+), глюкокортикоиды(−), эстрогены(+)</p>\n<p><strong>Гидроксипролин:</strong> маркер ТОЛЬКО коллагена → ↑экскреции = ↑распад(Педжет,гиперпаратиреоз) <em>С возрастом ↑сшивок → ↓доступность для коллагеназы → ↓экскреция</em></p>\n<p><strong>Заживление ран:</strong> фибробласты→рубец(хаотичные фибриллы коллагена)</p>"}, {"num": 96, "title": "Эластин: особенности состава, строения и свойств, биосинтез, катаболизм", "section": "Раздел 8", "sectionTitle": "Биохимия мышечной и соединительной тканей", "explanationHtml": "<p>Эластин — второй главный структурный белок соединительной ткани после коллагена, но с принципиально другими свойствами.</p>\n<p><strong>Состав и строение эластина:</strong></p>\n<p>Гликопротеин, ~800 аминокислотных остатков. Преоблад
