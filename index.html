и активный раствор → вода идёт в просвет кишки → осмотическая диарея. Дополнительно лактоза достигает толстой кишки, где бактерии сбраживают её → газообразование, вздутие, ещё больше воды и электролитов в просвете.</p>", "conspectHtml": "<p><strong>13. Пищевые углеводы, переваривание, непереносимость молока</strong></p>\n<p><strong>Пищевые угл-ды:</strong> крахмал, гликоген, сахароза, лактоза, трегалоза, фруктоза</p>\n<p><strong>Схема переваривания:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Отдел</th><th>Фермент</th><th>Субстрат→Продукт</th></tr></thead>\n<tbody>\n<tr><td>Рот</td><td>α-амилаза слюны</td><td>крахмал→декстрины+мальтоза</td></tr>\n<tr><td>Желудок</td><td>— (нет ферментов, кислая среда)</td><td>—</td></tr>\n<tr><td>12-п. кишка</td><td>панкреатич. α-амилаза</td><td>декстрины→мальтоза+изомальтоза</td></tr>\n<tr><td>Тонкая кишка</td><td>см. комплексы ниже</td><td>→ моносахариды</td></tr>\n<tr><td>Толстая кишка</td><td>бактериальные</td><td>целлюлоза→спирты, к-ты, CO₂</td></tr>\n</tbody>\n</table></div>\n<p><strong>3 комплекса тонкой кишки:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Комплекс</th><th>Ферменты</th><th>Связь</th><th>Субстрат</th></tr></thead>\n<tbody>\n<tr><td>Сахаразо-изомальтазный</td><td>сахараза, изомальтаза</td><td>β-1,2 / α-1,6</td><td>сахароза / изомальтоза</td></tr>\n<tr><td>Гликоамилазный</td><td>мальтаза</td><td>α-1,4</td><td>мальтоза</td></tr>\n<tr><td>β-гликозидный</td><td>лактаза, трегалаза</td><td>β-1,4 / α-1,1</td><td>лактоза / трегалоза</td></tr>\n</tbody>\n</table></div>\n<p><strong>Непереносимость молока:</strong> ↓лактазы (β-гликозидн. компл.) → лактоза не расщепляется → осмотич. диарея + бактериальное брожение в толстой кишке</p>\n<p><strong>У грудничков:</strong> переваривание начинается в тонкой кишке (лактоза — не субстрат амилазы слюны)</p>"}, {"num": 14, "title": "Синтез гликогена в печени и скелетных мышцах. Регуляция процесса. Распад гликогена в печени и скелетных мышцах. Регуляция этого процесса", "section": "Раздел 2", "sectionTitle": "Обмен углеводов", "explanationHtml": "<p>Гликоген — это \"депо\" глюкозы в организме (в основном печень и мышцы). Разберём отдельно синтез (гликогенез) и распад (гликогенолиз), и как они регулируются противоположно.</p>\n<p><strong>Синтез гликогена — пошагово:</strong></p>\n<ol>\n<li>Глюкоза + АТФ → Глюкозо-6-фосфат (фермент <strong>гексокиназа</strong>, +АДФ)</li>\n<li>Глюкозо-6-фосфат → Глюкозо-1-фосфат (фермент <strong>фосфоглюкомутаза</strong>, обратимая реакция)</li>\n<li>Глюкозо-1-фосфат + УТФ → <strong>УДФ-глюкоза</strong> + Ф-Фн (пирофосфат) (фермент глюкозо-1-фосфат-уридилтрансфераза)</li>\n</ol>\n<ul>\n<li>Пирофосфат (Ф-Фн) сразу расщепляется пирофосфатазой на 2 Фн — это делает реакцию энергетически необратимой (тянет процесс только в сторону синтеза)</li>\n</ul>\n<ol>\n<li>УДФ-глюкоза (донор остатка глюкозы) присоединяется ферментом <strong>гликогенсинтазой</strong> к \"затравочной ветви\" уже существующей молекулы гликогена</li>\n</ol>\n<p><strong>Важная деталь про \"затравку\":</strong> гликоген в клетке никогда не расщепляется полностью до нуля — синтез идёт путём удлинения уже существующей молекулы. В состав самой \"затравки\" входит специальный белок — <strong>гликогенин</strong>.</p>\n<p>Реакция: УДФ-глюкоза + гликоген(n остатков) → гликоген(n+1) + УДФ</p>\n<p><strong>Регуляция синтеза и распада — ковалентная модификация (фосфорилирование/дефосфорилирование), та же логика, что мы уже разбирали в вопросе 6:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Фермент</th><th>Активная форма</th></tr></thead>\n<tbody>\n<tr><td>Гликогенфосфорилаза (распад)</td><td>фосфорилированная</td></tr>\n<tr><td>Гликогенсинтаза (синтез)</td><td>дефосфорилированная</td></tr>\n</tbody>\n</table></div>\n<p>Оба процесса идут \"антагонистически\", как качели: фосфорилирование одновременно активирует распад и тормозит синтез. Дефосфорилирование — наоборот, активирует синтез и тормозит распад.</p>\n<p>Это очень экономичный механизм: клетке не нужно два отдельных \"переключателя\" — один и тот же сигнал (гормональный каскад, запускающий фосфорилирование) одновременно и включает нужный процесс, и выключает противоположный.</p>\n<p>Глюкагон (гормон \"голода\", сигнализирует о нехватке глюкозы в крови) запускает фосфорилирование (через цАМФ → протеинкиназу А). Активируется гликогенфосфорилаза, а гликогенсинтаза тормозится. Гликоген распадается до глюкозо-1-фосфата → глюкозо-6-фосфата → свободной глюкозы, которая выходит в кровь.</p>", "conspectHtml": "<p><strong>14. Синтез и распад гликогена, регуляция</strong></p>\n<p><strong>Синтез гликогена (пошагово):</strong></p>\n<ol>\n<li>Глю + АТФ → Глю-6-Ф (гексокиназа)</li>\n<li>Глю-6-Ф → Глю-1-Ф (фосфоглюкомутаза, обратимо)</li>\n<li>Глю-1-Ф + УТФ → <strong>УДФ-глюкоза</strong> + Ф-Фн (глюкозо-1-Ф-уридилтрансфераза); Ф-Фн→2Фн (пирофосфатаза, делает р-цию необратимой)</li>\n<li>УДФ-глюкоза + гликоген(n) → гликоген(n+1) + УДФ (<strong>гликогенсинтаза</strong>, присоед. к «затравочной ветви», в составе — белок <strong>гликогенин</strong>)</li>\n</ol>\n<p><strong>Регуляция (ковалентная модификация):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Состояние</th><th>Гликогенфосфорилаза (распад)</th><th>Гликогенсинтаза (синтез)</th></tr></thead>\n<tbody>\n<tr><td>Фосфорилирование</td><td><strong>активна</strong></td><td>тормозится</td></tr>\n<tr><td>Дефосфорилирование</td><td>тормозится</td><td><strong>активна</strong></td></tr>\n</tbody>\n</table></div>\n<p>Один сигнал → одновременно вкл. один процесс + выкл. противоположный</p>\n<p><strong>Пример:</strong> глюкагон → цАМФ → ПКА → фосфорилирование → ↑распад гликогена, ↓синтез</p>"}, {"num": 15, "title": "Гликолиз: общая характеристика, стадии, реакции процесса, регулируемые ферменты, энергетический эффект. Судьба продуктов гликолиза в аэробных условиях. Анаэробный распад глюкозы. Гликолитическая оксидоредукция", "section": "Раздел 2", "sectionTitle": "Обмен углеводов", "explanationHtml": "<p>Гликолиз — путь распада глюкозы в цитозоле (не в митохондриях!), общий для всех клеток. Разберём стадии, ключевые ферменты и что происходит с продуктами дальше — в зависимости от наличия кислорода.</p>\n<p><strong>Общая характеристика:</strong> 1 молекула глюкозы (6С) распадается на 2 молекулы пирувата (по 3С каждая). Процесс идёт в 2 фазы:</p>\n<p><strong>Фаза I (подготовительная, \"затратная\" — тратится 2 АТФ):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Реакция</th><th>Фермент</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Глюкоза → Глю-6-Ф</td><td>Ɛ₁ гексокиназа (-1АТФ)</td></tr>\n<tr><td>2</td><td>Глю-6-Ф → Фр-6-Ф</td><td>Ɛ₂ фосфогексоизомераза</td></tr>\n<tr><td>3</td><td>Фр-6-Ф → Фр-1,6-дифосфат</td><td>Ɛ₃ ФФК-1 (-1АТФ)</td></tr>\n<tr><td>4</td><td>Фр-1,6-дифосфат → ДГАФ + 3-ФГА</td><td>Ɛ₄ альдолаза</td></tr>\n<tr><td>5</td><td>ДГАФ ⇄ 3-ФГА</td><td>Ɛ₅ изомераза</td></tr>\n</tbody>\n</table></div>\n<p>После реакции 4-5 у нас уже 2 молекулы 3-ФГА (одна была сразу, вторая получилась из ДГАФ) — с этого момента все последующие реакции идут ×2!</p>\n<p><strong>Фаза II (энергетическая, \"доходная\" — получаем АТФ):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Реакция (×2!)</th><th>Фермент</th><th>Продукт</th></tr></thead>\n<tbody>\n<tr><td>6</td><td>3-ФГА → 1,3-ДФГ</td><td>Ɛ₆ глицеральдегидфосфатДГ</td><td>НАДН+Н⁺</td></tr>\n<tr><td>7</td><td>1,3-ДФГ → 3-ФГ</td><td>Ɛ₇ фосфоглицераткиназа</td><td>+АТФ (субстратн.!)</td></tr>\n<tr><td>8</td><td>3-ФГ → 2-ФГ</td><td>Ɛ₈ фосфоглицератмутаза</td><td>—</td></tr>\n<tr><td>9</td><td>2-ФГ → ФЕП</td><td>Ɛ₉ енолаза (-Н₂О)</td><td>—</td></tr>\n<tr><td>10</td><td>ФЕП → ПВК</td><td>Ɛ₁₀ пируваткиназа</td><td>+АТФ (субстратн.!)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Регулируемые (ключевые) ферменты гликолиза</strong> — это те же самые Ɛ₁, Ɛ₃, Ɛ₁₀ (гексокиназа, ФФК-1, пируваткиназа) — все три реакции с их участием необратимы, что типично для регуляторных точек любого метаболического пути.</p>\n<p><strong>Энергетический эффект:</strong> во второй фазе получаем 4 АТФ (по 2 на каждую из двух \"веток\" 3-ФГА), но в первой фазе потратили 2 АТФ → <strong>чистый выход = 2 АТФ + 2 НАДН+Н⁺</strong>.</p>\n<p><strong>Судьба продуктов в аэробных условиях (есть O₂):</strong></p>\n<ul>\n<li><strong>ПВК</strong> → заходит в митохондрию (симпортом с Н⁺) → окислительное декарбоксилирование (мы это разбирали в вопросе 11!) → Ацетил-SKoA → ЦТК → CO₂+H₂O+АТФ</li>\n<li><strong>НАДН+Н⁺</strong> (образовался в цитозоле, реакция 6) → не может напрямую пройти через мембрану митохондрии → идёт через <strong>челночные механизмы</strong> (малат-аспартатный или α-глицерофосфатный) → в ЦПЭ → даёт <strong>3 АТФ</strong> (через малат-аспартатный шаттл) или <strong>2 АТФ</strong> (через α-глицерофосфатный, менее эффективный, используется в мышцах/мозге)</li>\n</ul>\n<p><strong>Итоговый выход АТФ в аэробных условиях:</strong> 2 АТФ (субстратное) + 2×3 АТФ (от 2 молекул НАДН, если через малат-аспартатный шаттл) = <strong>8 АТФ</strong> (или 6 АТФ, если через α-ГФ-шаттл) — это только от самого гликолиза, без учёта дальнейшего ЦТК+ЦПЭ от ацетил-КоА.</p>\n<p><strong>Анаэробный гликолиз (нет O₂):</strong></p>\n<p>Проблема: без кислорода дыхательная цепь встаёт, НАДН не может отдать электроны туда → значит, весь НАД⁺ клетки \"закончится\" (превратится в НАДН), и реакция 6 (глицеральдегидфосфатДГ) остановится, потому что ей нужен именно окисленный НАД⁺.</p>\n<p>Решение — <strong>гликолитическая оксидоредукция</strong>: ПВК сам восстанавливается НАДН+Н⁺ до <strong>лактата</strong> (реакция: ПВК + НАДН+Н⁺ → лактат + НАД⁺, фермент <strong>ЛДГ</strong>). Это регенерирует НАД⁺, и гликолиз может продолжаться дальше даже без кислорода.</p>\n<p>Клетка превращает ПВК в лактат не ради самого лактата, а чтобы вернуть НАД⁺. Реакция 6 гликолиза (окисление глицеральдегид-3-фосфата) требует НАД⁺ как кофермента. Если НАДН не окислять обратно, НАД⁺ кончается — и гликолиз останавливается на этой реакции. Лактатдегидрогеназа (ЛДГ) решает проблему: окисляет НАДН обратно в НАД⁺, одновременно восстанавливая пируват до лактата.</p>\n<p><strong>Биологическое значение анаэробного гликолиза:</strong> единственный источник АТФ для:</p>\n<ul>\n<li>Клеток без митохондрий (эритроциты, роговица, хрусталик, стекловидное тело — мы это уже разбирали в вопросе 9!)</li>\n<li>Мышц при интенсивной физической нагрузке (когда кислорода не хватает быстро доставить)</li>\n</ul>", "conspectHtml": "<p><strong>15. Гликолиз, судьба продуктов</strong></p>\n<p><strong>Фаза I (затратная, -2АТФ):</strong> Глю →(Ɛ₁ гексокиназа)→ Глю-6-Ф →(Ɛ₂)→ Фр-6-Ф →(Ɛ₃ ФФК-1)→ Фр-1,6-диФ →(Ɛ₄ альдолаза)→ ДГАФ+3-ФГА →(Ɛ₅)⇄</p>\n<p><strong>Фаза II (энергетич., ×2 с этого момента):</strong> 3-ФГА →(Ɛ₆, +НАДН)→ 1,3-ДФГ →(Ɛ₇, <strong>+АТФ</strong>)→ 3-ФГ →(Ɛ₈)→ 2-ФГ →(Ɛ₉, -Н₂О)→ ФЕП →(Ɛ₁₀, <strong>+АТФ</strong>)→ ПВК</p>\n<p><strong>Регулируемые (необратимые) ферменты:</strong> Ɛ₁ гексокиназа, Ɛ₃ ФФК-1, Ɛ₁₀ пируваткиназа</p>\n<p><strong>Энергетич. эффект:</strong> 4АТФ (фаза II) - 2АТФ (фаза I) = <strong>2 АТФ чистых</strong> + 2НАДН+Н⁺</p>\n<p><strong>Аэробные условия:</strong></p>\n<ul>\n<li>ПВК → Mx → окисл. декарбокс. → Ацетил-КоА → ЦТК</li>\n<li>НАДН → челночные механизмы (малат-аспартатный→3АТФ / α-ГФ-шаттл→2АТФ) → ЦПЭ</li>\n</ul>\n<p><strong>Итого от гликолиза:</strong> 2АТФ + 2×3(или 2)АТФ = <strong>8 АТФ</strong> (или 6)</p>\n<p><strong>Анаэробные условия:</strong> ПВК + НАДН+Н⁺ → <strong>Лактат</strong> + НАД⁺ (фермент <strong>ЛДГ</strong>) = гликолитическая оксидоредукция</p>\n<p><strong>Смысл:</strong> регенерация НАД⁺ (нужен для р.6) → гликолиз продолжается без О₂</p>\n<p><strong>Значение анаэробного гликолиза:</strong> единств. источник АТФ в клетках без митохондрий (эритроциты, роговица, хрусталик) + мышцы при нагрузке</p>"}, {"num": 16, "title": "Биосинтез глюкозы (глюконеогенез) из аминокислот, глицерина и лактата. Энергетические затраты, регулируемые ферменты. Реципрокная регуляция гликолиза и глюконеогенеза, влияние гормонов. Цикл Кори", "section": "Раздел 2", "sectionTitle": "Обмен углеводов", "explanationHtml": "<p>Глюконеогенез — это синтез глюкозы \"с нуля\", из неуглеводных источников. Он нужен, когда запасы гликогена истощены (голодание, длительная нагрузка), а мозгу и эритроцитам всё равно нужна глюкоза.</p>\n<p><strong>Локализация:</strong> печень, корковое вещество почек, эпителий кишечника (НЕ мышцы и не мозг — там нет полного набора ферментов).</p>\n<p><strong>Источники (субстраты):</strong></p>\n<ol>\n<li>Вещества, превращающиеся в ПВК — аминокислоты (кроме лейцина), лактат</li>\n<li>Вещества, превращающиеся в метаболиты пути — глицерин → ДГАФ</li>\n<li>Вещества, превращающиеся в ОАА — часть аминокислот, метаболиты ЦТК</li>\n</ol>\n<p><strong>Главный субстрат — аминокислоты</strong> (кроме лейцина, который чисто кетогенный и не может дать глюкозу).</p>\n<p><strong>Логика глюконеогенеза</strong> — это почти \"обратный гликолиз\", НО есть 3 места, где гликолиз необратим (мы их уже отметили — Ɛ₁, Ɛ₃, Ɛ₁₀), и там глюконеогенез идёт <strong>другими</strong> ферментами в обход этих барьеров — это называется <strong>обходные реакции</strong>.</p>\n<p><strong>Обходная реакция I (ПВК → ФЕП, 4 этапа — самая сложная):</strong></p>\n<p>Прямо ПВК → ФЕП пойти не может (это было бы обратной реакцией пируваткиназы, а она необратима). Поэтому нужен \"крюк\" через митохондрию:</p>\n<ol>\n<li>Митохондрии: 2ПВК + 2CO₂ + 2АТФ → 2ОАА (<strong>пируваткарбоксилаза</strong>, активатор — ацетил-SKoA)</li>\n<li>2ОАА + 2НАДН+Н⁺ → 2Малат (митохондриальная малатДГ)</li>\n<li>Малат выходит в цитозоль (унипорт — ОАА сам через мембрану не проходит, а малат проходит!)</li>\n<li>В цитозоле: 2Малат → 2ОАА (цитозольная малатДГ) → 2ОАА → 2ФЕП (<strong>фосфоенолпируваткарбоксикиназа</strong>, тратит ГТФ)</li>\n</ol>\n<p><strong>Обходная реакция II:</strong> Фруктозо-1,6-дифосфат → Фруктозо-6-фосфат (фермент <strong>фруктозо-1,6-дифосфатаза</strong> — главный регуляторный фермент глюконеогенеза! Активатор — АТФ, ингибитор — АМФ)</p>\n<p><strong>Обходная реакция III:</strong> Глюкозо-6-фосфат → Глюкоза (фермент <strong>глюкозо-6-фосфатаза</strong>). Важная деталь: этого фермента <strong>нет в мозге и мышцах</strong> — поэтому эти ткани не могут выпускать свободную глюкозу в кровь, даже если у них есть запасы гликогена (они используют глюкозу только сами для себя).</p>\n<p><strong>Энергозатраты глюконеогенеза:</strong> 2ПВК + 4АТФ + 2ГТФ + 2НАДН+Н⁺ + 4H₂O → Глюкоза + 2НАД⁺ + 4АДФ + 2ГДФ + 6H₃PO₄</p>\n<p>(Обрати внимание — это очень \"дорогой\" процесс: 6 макроэргических связей на 1 молекулу глюкозы, тогда как гликолиз этой же глюкозы дал бы всего 2 АТФ — то есть синтез в разы затратнее распада, что логично для термодинамики).</p>\n<p><strong>Реципрокная регуляция гликолиза и глюконеогенеза</strong> — ключевая идея: <strong>что активирует один путь — тормозит другой</strong>, и наоборот. Это логично: не может же клетка одновременно и расщеплять глюкозу, и синтезировать её — это был бы бесполезный \"холостой цикл\".</p>\n<p>Два главных регулятора:</p>\n<ol>\n<li><strong>Соотношение АТФ/АДФ/АМФ</strong>:</li>\n</ol>\n<ul>\n<li>↑АТФ → ингибирует гликолиз (ФФК-1), активирует глюконеогенез (Фр-1,6-дифосфатаза)</li>\n<li>↑АДФ/АМФ → наоборот, активируют гликолиз, ингибируют глюконеогенез</li>\n</ul>\n<ol>\n<li><strong>Фруктозо-2,6-бифосфат</strong> — специальный регуляторный метаболит (не путать с фруктозо-1,6-дифосфатом — это разные вещества!), образуется бифункциональным ферментом ФФК-2 из фруктозо-6-фосфата:</li>\n</ol>\n<ul>\n<li>Активирует ФФК-1 (гликолиз)</li>\n<li>Ингибирует фруктозо-1,6-дифосфатазу (глюконеогенез)</li>\n</ul>\n<p><strong>Влияние гормонов</strong> (через регуляцию именно ФФК-2 — это ключевой \"переключатель\"):</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Гормон</th><th>Когда</th><th>Действие на ФФК-2</th><th>Фр-2,6-биФ</th><th>Эффект</th></tr></thead>\n<tbody>\n<tr><td>Инсулин</td><td>во время еды</td><td>дефосфорилирует</td><td>↑</td><td>↑гликолиз, ↓глюконеогенез</td></tr>\n<tr><td>Глюкагон</td><td>между едой</td><td>фосфорилирует</td><td>↓</td><td>↓гликолиз, ↑глюконеогенез</td></tr>\n<tr><td>Глюкокортикоиды</td><td>—</td><td>—</td><td>—</td><td>стимулируют глюконеогенез (усиливают распад белков до АК)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Цикл Кори (молочной кислоты):</strong> Лактат, образующийся в скелетных мышцах и эритроцитах при гликолизе, поступает в печень, где превращается в ПВК (ЛДГ), а затем через глюконеогенез — в глюкозу. Глюкоза поступает в кровь и возвращается в мышцы. Сердечная мышца использует лактат для получения энергии (через ПВК → Ацетил-SKoA → ЦТК).</p>\n<p>Отсутствие глюкозо-6-фосфатазы не запрещает глюконеогенез как путь — оно запрещает только последний шаг: выпуск свободной глюкозы в кровь. Мышца и мозг действительно не могут отдавать глюкозу в кровь, но это не значит, что у них нет глюконеогенеза вообще. А глюкоза из мышечного гликогена никуда не «выпускается» — она идёт внутрь самой мышцы на гликолиз.</p>", "conspectHtml": "<p><strong>16. Биосинтез глюкозы (глюконеогенез), реципрокная регуляция, цикл Кори</strong></p>\n<p><strong>Глюконеогенез:</strong> Синтез глюкозы из неуглеводных компонентов (печень, корковое вещество почек, эпителий кишечника). Источники: 1) превращающиеся в ПВК (аминокислоты, лактат); 2) превращающиеся в метаболиты (глицерин → ДГАФ); 3) превращающиеся в ОАА (часть аминокислот, метаболиты ЦТК). Главный субстрат — аминокислоты (кроме лейцина).</p>\n<p><strong>Обходные реакции (3):</strong></p>\n<p>o <strong>I обходная (4 этапа):</strong> 2 ПВК → 2 ФЕП. Митохондрии: 2 ПВК + 2СО₂ + 2АТФ → 2ОАА + 2АДФ + 2Фн (пируваткарбоксилаза, регуляторный, активатор — ацетил-SKoA). 2 ОАА + 2НАДН+Н⁺ → 2 малат + 2НАД⁺ (митохондриальная малатДГ). Малат → цитозоль (унипорт). Цитозоль: 2 малат + 2НАД⁺ → 2ОАА + 2НАДН+Н⁺ (цитоплазматическая малатДГ). 2 ОАА → 2 ФЕП (фосфоенолпируваткарбоксикиназа, ГТФ).</p>\n<p>o <strong>II обходная:</strong> Фруктозо-1,6-дифосфат → Фруктозо-6-фосфат (фруктозо-1,6-дифосфатаза, главный регуляторный фермент глюконеогенеза). Активатор — АТФ, ингибитор — АМФ.</p>\n<p>o <strong>III обходная:</strong> Глюкозо-6-фосфат → Глюкоза + H₃PO₄ (глюкозо-6-фосфатаза). Отсутствует в мозге и поперечно-полосатой мускулатуре.</p>\n<p><strong>Энергетические затраты:</strong> 2 ПВК + 4АТФ + 2ГТФ + 2НАДН+Н⁺ + 4H₂O → Глюкоза + 2НАД⁺ + 4АДФ + 2ГДФ + 6H₃PO₄.</p>\n<p><strong>Реципрокная регуляция гликолиза и глюконеогенеза:</strong> То, что активирует гликолиз, ингибирует глюконеогенез, и наоборот.</p>\n<p>o Регуляция соотношением АТФ (ингибирует гликолиз, активирует глюконеогенез) и АДФ/АМФ (активируют гликолиз, ингибируют глюконеогенез).</p>\n<p>o Регуляция фруктозо-2,6-бифосфатом (образуется из фруктозо-6-фосфата бифункциональным ферментом ФФК-2). Фруктозо-2,6-бифосфат активирует ФФК-I (гликолиз) и ингибирует фруктозо-1,6-дифосфатазу (глюконеогенез).</p>\n<p>o Влияние гормонов: Инсулин (во время еды) дефосфорилирует ФФК-2 → ↑ фруктозо-2,6-бифосфата → ↑ гликолиз, ↓ глюконеогенез. Глюкагон (между едой) фосфорилирует ФФК-2 → ↓ фруктозо-2,6-бифосфата → ↑ глюконеогенез, ↓ гликолиз. Глюкокортикоиды стимулируют глюконеогенез (усиливают распад белков до АК).</p>\n<p><strong>Цикл Кори (молочной кислоты):</strong> Лактат, образующийся в скелетных мышцах и эритроцитах при гликолизе, поступает в печень, где превращается в ПВК (ЛДГ), а затем через глюконеогенез — в глюкозу. Глюкоза поступает в кровь и возвращается в мышцы. Сердечная мышца использует лактат для получения энергии (через ПВК → Ацетил-SKoA → ЦТК).</p>"}, {"num": 17, "title": "Пентозо-фосфатный путь окисления глюкозы: окислительные реакции (до стадии образования рибулозо-5-фосфата). Интенсивность процесса в различных тканях, пути использования НАДФН+Н⁺", "section": "Раздел 2", "sectionTitle": "Обмен углеводов", "explanationHtml": "<p>ПФП — это альтернативный путь окисления глюкозы (не гликолиз!), который \"заточен\" под две принципиально другие задачи: не энергию (АТФ), а <strong>восстановительные эквиваленты (НАДФН2)</strong> и <strong>пентозы</strong> (для синтеза нуклеотидов).</p>\n<p><strong>Значение ПФ пути: 4 пункта:</strong></p>\n<ol>\n<li>Поставляет НАДФН2, который используется:</li>\n</ol>\n<p>а) для биосинтеза липидов (ВЖК, ХС), синтеза стероидных гормонов, витаминов группы D; б) для процессов обезвреживания аммиака – восстановительное аминирование; в) НАДФН2 – используется для обезвреживания различных ядов, токсинов и разнообразных лекарств в монооксигеназной цепи окисления, локализованной в ЭПР гепатоцитов;</p>\n<ol>\n<li>Используется организмом для получения пентоз, которые идут на синтез нуклеотидов, коферментов нуклеотидной природы, нуклеиновых кислот, гистидина, макроэргов;</li>\n<li>Это метаболический путь – взаимодействия сахаров в организме человека (гексоз и пентоз);</li>\n<li>Может быть использован для опосредованного получения энергии - но не сам, а за счет подключения промежуточных метаболитов этого пути к цепи гликолиза (это 3ФГА).</li>\n</ol>\n<p><strong>Важное разделение НАД+/НАДФ+ по функциям</strong> — это ключевая логика, которую стоит запомнить для понимания, зачем вообще нужны два похожих кофермента:</p>\n<ul>\n<li><strong>НАД⁺</strong> — в основном обслуживает катаболические (энергетические) пути — гликолиз, ЦТК, β-окисление</li>\n<li><strong>НАДФ⁺</strong> — обслуживает анаболические (синтетические) пути — синтез жирных кислот, холестерина</li>\n</ul>\n<p>Весь ПФ-путь условно делится на 2 части:</p>\n<ol>\n<li>Окислительная фаза (ветвь)</li>\n<li>Неокислительная (анаэробная) фаза</li>\n</ol>\n<p>ПФ-путь активен в тех тканях, где интенсивно идут биосинтеза липидов (жировая клетчатка, головной мозг, надпочечники, клетки молочной железы, половые железы, клетки костного мозга, эритроциты, печень).</p>\n<p>Почти не работает (мало активен) ПФ-путь в скелетных мышцах и миокарде.</p>\n<p>Для осуществления ПФ-пути требуется одномоментное участие либо 3-х, либо, чаще, 6-ти молекул глюкозы. Окислительная ветвь заканчивается образованием рубилозо-5-фосфата. Далее, в ходе неокислительной ветви, рубилозо-5-фосфат подвергается изомеризации. Завершается ПФ-путь образованием 5-ти молекул глюкозы, а одна молекула глюкозы переходит в CO2 (6 атомов) в процессе декарбоксилирования.</p>\n<p><strong>Окислительная ветвь (пошагово):</strong></p>\n<p>Глю → Глю-6-Ф (гексокиназа, +АТФ)</p>\n<p>Глю-6-Ф → 6-фосфоглюконолактон (Ɛ1 глюкозо-6-фосфатДГ, <strong>6 НАДФ⁺→6 НАДФН2</strong>)</p>\n<p>6-фосфоглюконолактон → 6-фосфоглюконат (лактоназа, +H2O)</p>\n<p>6-фосфоглюконат → 3-кето-6-фосфоглюконат → <strong>Рибулозо-5-фосфат</strong> (Ɛ2 ДГ, <strong>6 НАДФ⁺→6 НАДФН2</strong> + выделяется CO2)</p>\n<p>У клетки, активно синтезирующей холестерин и стероиды (например, клетка коры надпочечников), особенно активен ПФП — точнее, его окислительная фаза. Причина: для синтеза холестерина и стероидов нужны NADPH (восстановитель) и, в меньшей степени, рибозо-5-фосфат (для нуклеотидов при активном делении/обновлении), а ПФП — главный цитоплазматический источник NADPH. Гликолиз же даёт NADH и АТФ, которые для восстановительных синтезов не подходят.</p>", "conspectHtml": "<p><strong>17. Пентозофосфатный путь — окислительная ветвь</strong></p>\n<p><strong>Значение (4):</strong></p>\n<ol>\n<li>НАДФН2 → синтез липидов/ХС/стероидов/вит.D; обезвреж. NH3; обезвреж. токсинов (цит.Р-450)</li>\n<li>Пентозы → нуклеотиды, коферменты, НК, гистидин</li>\n<li>Взаимопревращение гексоз↔пентоз</li>\n<li>Опосредованная энергия (через 3-ФГА → гликолиз)</li>\n</ol>\n<p><strong>НАД⁺ vs НАДФ⁺:</strong> НАД⁺ — катаболизм (энергия); НАДФ⁺ — анаболизм (синтез)</p>\n<p><strong>Локализация активности:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Активен</th><th>Неактивен</th></tr></thead>\n<tbody>\n<tr><td>жир. ткань, мозг, надпочечники, мол. железа, пол. железы, костн. мозг, эритроциты, печень</td><td>скелетные мышцы, миокард</td></tr>\n</tbody>\n</table></div>\n<p><strong>Требует:</strong> 3 или 6 молекул глюкозы одновременно</p>\n<p><strong>Окислительная ветвь:</strong></p>\n<p>Глю →(гексокиназа,+АТФ)→ Глю-6-Ф →(Ɛ1 Глю-6-Ф-ДГ, <strong>НАДФ⁺→НАДФН2</strong>)→ 6-фосфоглюконолактон →(+H2O)→ 6-фосфоглюконат →(Ɛ2 ДГ, <strong>НАДФ⁺→НАДФН2</strong>, -CO2)→ <strong>Рибулозо-5-фосфат</strong></p>\n<p><strong>Итог:</strong> 1 Глю → 2 НАДФН2 + CO2 (декарбоксилирование) → рибулозо-5-Ф</p>"}, {"num": 18, "title": "Обмен фруктозы и галактозы. Метаболические пути утилизации глюкозы в различных тканях", "section": "Раздел 2", "sectionTitle": "Обмен углеводов", "explanationHtml": "<p>Разберём два моносахарида отдельно — у каждого своя логика метаболизма, и это классический \"любимый\" вопрос экзаменаторов из-за клинической значимости (диабет + фруктоза, галактоземия).</p>\n<p><strong>Обмен фруктозы</strong></p>\n<p>Источники: мёд, фрукты, сахароза (состоит из α-глюкозы и β-фруктозы, связанные β-1,2-гликозидной связью).</p>\n<p><strong>Главный путь (80% фруктозы)</strong> — метаболизируется в печени через фермент <strong>гексокиназу</strong> до фруктозо-6-фосфата. Дальше у этого продукта два варианта судьбы:</p>\n<ul>\n<li>Превращается в глюкозу (через глюкозо-6-фосфат)</li>\n<li>Фосфорилируется дальше ферментом ФФК-1 → фруктозо-1,6-дифосфат → включается прямо в гликолиз</li>\n</ul>\n<p><strong>Альтернативный путь</strong> — часть фруктозы (в печени, мышцах, половых железах, особенно семенниках) фосфорилируется отдельным ферментом <strong>фруктокиназой</strong> до <strong>фруктозо-1-фосфата</strong>. Дальше это расщепляется ферментом фруктозо-1-фосфат-альдолазой на:</p>\n<ul>\n<li>ДГАФ (сразу идёт в гликолиз)</li>\n<li>Глицериновый альдегид → (тиокиназа, +АТФ) → 3-ФГА → тоже гликолиз</li>\n</ul>\n<p><strong>Клинически важная деталь (часто спрашивают):</strong> транспорт фруктозы в клетку и активность фруктокиназы <strong>НЕ регулируются инсулином и не зависят от голодания</strong> — в отличие от глюкозы (транспорт которой через ГЛЮТ-4 и активность гексокиназы жёстко под контролем инсулина). Поэтому у больных сахарным диабетом фруктоза поглощается с нормальной скоростью независимо от инсулиновой недостаточности — поэтому её иногда рекомендуют как альтернативу глюкозе в питании при диабете.</p>\n<p><strong>Обмен галактозы</strong></p>\n<p>Источник — лактоза молока, которая в ЖКТ расщепляется до α-глюкозы и β-галактозы (мы это уже видели в вопросе 13, реакция лактазы).</p>\n<p><strong>Пошагово:</strong></p>\n<ol>\n<li>Галактоза + АТФ → Галактозо-1-фосфат (фермент <strong>галактокиназа</strong>)</li>\n<li>Галактозо-1-фосфат + УДФ-глюкоза → Глюкозо-1-фосфат + <strong>УДФ-галактоза</strong> (фермент галактозо-1-фосфат-уридилтрансфераза) — обрати внимание: это обмен местами, \"донор\" УДФ переходит от глюкозы к галактозе!</li>\n<li>УДФ-галактоза ⇄ УДФ-глюкоза (фермент <strong>эпимераза</strong>, реакция обратима!)</li>\n</ol>\n<p><strong>Куда идёт УДФ-глюкоза дальше:</strong></p>\n<ul>\n<li>→ Синтез гликогена</li>\n<li>→ Глюкозо-1-фосфат → Глюкозо-6-фосфат → Глюкоза (или гликолиз)</li>\n</ul>\n<p><strong>Обратимость эпимеразной реакции — критически важна</strong>, потому что она работает в обе стороны:</p>\n<ul>\n<li>Из глюкозы можно получить галактозу (то есть галактоза — <strong>заменимый</strong> моносахарид в плане синтеза, организм не зависит от пищевого источника)</li>\n<li>Это нужно для синтеза галактозильных остатков в гликолипидах и гликопротеидах (то есть галактоза нужна не только из еды, но и как строительный компонент собственных молекул клетки)</li>\n</ul>\n<p><strong>Клиническая деталь:</strong> наследственный дефект любого из 3-х ферментов этого пути (галактокиназы, уридилтрансферазы или эпимеразы) приводит к <strong>галактоземии</strong> — накоплению галактозы/галактозо-1-фосфата в крови и тканях (токсично, особенно для печени, глаз — катаракта, и мозга у детей).</p>\n<p>При классической галактоземии (дефект галактозо-1-фосфат-уридилтрансферазы, GALT) в крови и тканях накапливается галактозо-1-фосфат (Гал-1-Ф) — и именно он токсичен, а не сама галактоза. Галактоза при этом тоже повышена в крови, но главный патогенный метаболит — Гал-1-Ф, потому что он застревает в клетке и не может дальше превратиться в глюкозо-1-фосфат. Гал-1-Ф застревает, потому что галактокиназа (первый шаг) продолжает нормально работать и продолжает \"закачивать\" галактозу в Гал-1-Ф, а вот следующий фермент (GALT) сломан, так что накопление идёт именно на этом уровне.</p>\n<p><strong>Также важно:</strong> в период лактации у женщин галактоза не является незаменимым компонентом пищи (для синтеза лактозы в молочных железах) — потому что она может синтезироваться из глюкозы, только в обратную сторону через ту же обратимую эпимеразную реакцию.</p>", "conspectHtml": "<p><strong>18. Обмен фруктозы и галактозы</strong></p>\n<p><strong>Фруктоза</strong> (источники: мёд, фрукты, сахароза)</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>%</th><th>Фермент</th><th>Продукт</th></tr></thead>\n<tbody>\n<tr><td>Основной</td><td>80%</td><td>гексокиназа (печень)</td><td>Фр-6-Ф → глюкоза ИЛИ (ФФК-1) → Фр-1,6-диФ → гликолиз</td></tr>\n<tr><td>Альтернативный</td><td>—</td><td><strong>фруктокиназа</strong> (печень, мышцы, семенники)</td><td>Фр-1-Ф →(альдолаза)→ ДГАФ + глицер. альдегид →(тиокиназа)→ 3-ФГА → гликолиз</td></tr>\n</tbody>\n</table></div>\n<p><strong>Клиника:</strong> транспорт фруктозы и фруктокиназа НЕ зависят от инсулина/голодания → фруктоза усваивается нормально у диабетиков</p>\n<p><strong>Галактоза</strong> (источник: лактоза)</p>\n<ol>\n<li>Галактоза →(галактокиназа,+АТФ)→ Гал-1-Ф</li>\n<li>Гал-1-Ф + УДФ-глюкоза →(<strong>уридилтрансфераза</strong>)→ Глю-1-Ф + <strong>УДФ-галактоза</strong></li>\n<li>УДФ-галактоза ⇄(<strong>эпимераза</strong>, обратимо!)⇄ УДФ-глюкоза</li>\n</ol>\n<p>УДФ-глюкоза → синтез гликогена / → Глю → гликолиз</p>\n<p><strong>Обратимость эпимеразы:</strong> глюкоза↔галактоза взаимопревращаемы (галактоза заменима, нужна для гликолипидов/гликопротеидов)</p>\n<p><strong>Галактоземия:</strong> дефект любого из 3 ферментов → ↑галактозы/<strong>Гал-1-Ф</strong> (токсичен) → катаракта, поражение печени, мозга</p>"}, {"num": 19, "title": "Пищевые липиды, переваривание и всасывание в ЖКТ", "section": "Раздел 3", "sectionTitle": "Обмен липидов", "explanationHtml": "<p>Это большой комплексный вопрос про весь путь липидов от рта до энтероцита. Разберём по частям — значение, этапы, ферменты, мицеллы.</p>\n<p><strong>Значение липидов (3 пункта):</strong></p>\n<ol>\n<li>Энергетическое — 1г жиров даёт 9,3 ккал (почти в 2 раза больше, чем белки/углеводы — по 4,1 ккал/г)</li>\n<li>Источник незаменимых полиненасыщенных ЖК (витамин F — линолевая, линоленовая к-ты, которые организм сам синтезировать не может)</li>\n<li>Источник ФЛ и ХС для синтеза мембран</li>\n</ol>\n<p><strong>Суточная потребность:</strong> взрослый (70кг) — 80-100 г/сут; дети 3-10 лет — 25-30 г/сут. Соотношение растительные:животные жиры = 1:3.</p>\n<p><strong>Экзогенные vs эндогенные липиды:</strong></p>\n<ul>\n<li>Экзогенные (из пищи): ТАГ 98%, ФЛ, ХС, ЭХ</li>\n<li>Эндогенные (собственные): слущенный эпителий кишечника, желчь, соки — их роль: формирование химуса + восполнение недостатка экзогенных полиеновых ВЖК и ФЛ</li>\n</ul>\n<p><strong>Переваривание у взрослого (12-перстная кишка) — 3 компонента системы:</strong></p>\n<ol>\n<li><strong>Сок поджелудочной железы</strong> — мукопротеины, NaHCO₃ (нейтрализует кислое содержимое желудка), липолитические ферменты</li>\n<li><strong>Желчь</strong> — содержит желчные кислоты</li>\n<li><strong>Кишечный сок</strong> — липаза, холестеролэстераза</li>\n</ol>\n<p>pH среды — 7,2-7,8 (щелочная, в отличие от кислого желудка).</p>\n<p><strong>Гормональная регуляция</strong> (стимул для их выброса — HCl химуса, попавшего из желудка в 12-перстную кишку):</p>\n<ul>\n<li><strong>Секретин</strong> — стимулирует секрецию панкреатического сока и желчи</li>\n<li><strong>Холецистокинин</strong> — стимулирует секрецию ферментов панкреатического сока, сокращение желчного пузыря, перистальтику</li>\n</ul>\n<p><strong>Функции желчных кислот (4 пункта — важно перечислить все):</strong></p>\n<ol>\n<li>Эмульгаторы липидов</li>\n<li>Участвуют в образовании мицелл</li>\n<li>Активаторы липазы и фосфолипазы А₂</li>\n<li>Холеретическая функция (выведение избытка ХС)</li>\n</ol>\n<p><strong>Этапы переваривания и всасывания (последовательно):</strong></p>\n<p><strong>Этап I — Эмульгирование:</strong> дробление крупных жировых капель на мелкие — соли желчных кислот снижают поверхностное натяжение (физически \"разбивают\" большую каплю жира на множество маленьких, увеличивая площадь поверхности для действия ферментов).</p>\n<p><strong>Этап II — Ферментативный гидролиз</strong> (три разных субстрата, три разных фермента/пути):</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Субстрат</th><th>Фермент</th><th>Продукты</th></tr></thead>\n<tbody>\n<tr><td>ТАГ</td><td>Панкреатическая липаза (+колипаза, соли ЖК)</td><td>ДАГ → β-МАГ (70%) + глицерин+ВЖК (5%)</td></tr>\n<tr><td>ФЛ</td><td>Фосфолипазы А₁,А₂,C,D</td><td>лизофосфатидилхолин (профосфолипаза А₂ активируется трипсином!)</td></tr>\n<tr><td>ЭХ</td><td>Холестеролэстераза</td><td>ХС + ВЖК</td></tr>\n</tbody>\n</table></div>\n<p><strong>Этап III — Мицеллообразование</strong> (два типа мицелл, важно различать):</p>\n<ul>\n<li><strong>Первичная (простая) желчная мицелла</strong> (ещё в желчном пузыре, до контакта с едой): ЖК+ФЛ+ХС в соотношении 12,5:2,5:1. Ядро — ХС, оболочка — ЖК и ФЛ.</li>\n</ul>\n<ul>\n<li><strong>Смешанная (вторичная) мицелла</strong> — формируется уже с продуктами переваривания: гидрофобное ядро (ВЖК, β-МАГ, ДАГ, ХС, жирорастворимые витамины А,Д,Е,К) + гидрофильная оболочка (желчные кислоты, лизо-ФЛ, ФЛ). Она в 100 раз меньше исходных эмульгированных капель — именно такой маленький размер позволяет ей подойти вплотную к мембране энтероцита.</li>\n</ul>\n<p><strong>Этап IV — Всасывание:</strong> сложная мицелла проникает в энтероцит путём простой диффузии.</p>\n<ul>\n<li>Глицерин, аминоспирты, H₃PO₄, ЖК с числом атомов углерода &lt;10 — всасываются свободно, напрямую в кровь воротной вены → печень</li>\n<li>Желчные кислоты — тоже всасываются в кровь → возвращаются в печень (это и есть начало энтерогепатической циркуляции, которую разберём подробнее в отдельном вопросе про желчные кислоты)</li>\n</ul>\n<p><strong>Этап V — Ресинтез липидов в энтероците</strong> — клетка не просто пропускает всосавшиеся компоненты дальше, а заново собирает из них \"свои\" липиды:</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Компонент</th><th>Путь ресинтеза</th></tr></thead>\n<tbody>\n<tr><td>ТАГ</td><td>β-моноацилглицеридный путь (гладкий ЭПР) — β-МАГ + 2 Ацил-КоА → ТАГ; или α-глицерофосфатный путь (шероховатый ЭПР)</td></tr>\n<tr><td>ФЛ</td><td>Лизо-ФЛ этерифицируются эссенциальными полиненасыщенными ВЖК</td></tr>\n<tr><td>ЭХ</td><td>Ацилхолестеролацилтрансфераза (АХАТ) переносит ацил с ацил-КоА на ХС</td></tr>\n</tbody>\n</table></div>\n<p>Биологический смысл ресинтеза: клетка синтезирует липиды, характерные именно для организма человека (а не те, что были в исходной пище — принцип унификации мы уже видели в вопросе 7, здесь та же идея).</p>\n<p><strong>Формирование транспортных форм:</strong> насцентные (только что родившиеся, незрелые) хиломикроны (ХМ) и насцентные ЛПВП — это то, как готовые ресинтезированные липиды покидают энтероцит и попадают в лимфу/кровь (эту тему подробно разберём в разделе про липопротеиды).</p>\n<p><strong>Особенности у детей (грудничков):</strong> переваривание липидов начинается раньше по ЖКТ, чем у взрослых:</p>\n<ul>\n<li>Ротовая полость: липаза языка, pH 4,0-7,5</li>\n<li>Желудок: желудочная липаза, pH 5,0</li>\n<li>Жирные кислоты с короткой цепью частично всасываются уже в желудке</li>\n<li>Женское молоко само содержит ферменты (помогает незрелой пищеварительной системе ребёнка)</li>\n<li>Жиры — основной источник энергии для детей (не углеводы, как у взрослых)</li>\n</ul>\n<p><strong>Нарушения переваривания и всасывания — Стеаторея</strong> (повышенное содержание жира в кале), три разных механизма в зависимости от того, что сломалось:</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Причина</th><th>Что в кале</th></tr></thead>\n<tbody>\n<tr><td>Панкреатическая</td><td>недостаток липолитических ферментов</td><td>высокое ТАГ</td></tr>\n<tr><td>Гепатогенная (холестаз)</td><td>нет желчи → нет эмульгирования</td><td>высокое содержание мыл (Ca/Mg-солей ЖК), гиповитаминозы A,D,E,K</td></tr>\n<tr><td>Энтерогенная</td><td>дефект слизистой, снижен ресинтез ТАГ</td><td>высокое содержание свободных ВЖК</td></tr>\n</tbody>\n</table></div>", "conspectHtml": "<p><strong>19. Переваривание и всасывание липидов</strong></p>\n<p><strong>Значение:</strong> энергетич. (9,3 ккал/г), источник вит.F (полиненасыщ. ЖК), источник ФЛ/ХС для мембран</p>\n<p><strong>Потребность:</strong> 80-100 г/сут (взр.), раст:жив = 1:3</p>\n<p><strong>Условия переваривания (12-п. кишка, pH 7,2-7,8):</strong> сок ПЖ (NaHCO₃+ферменты) + желчь (ЖК) + киш. сок (липаза, ХС-эстераза)</p>\n<p><strong>Гормоны:</strong> Секретин (сок ПЖ+желчь) / Холецистокинин (ферменты+сокращ. ЖП)</p>\n<p><strong>Функции желчных к-т:</strong> эмульгирование, образование мицелл, активация липазы/фосфолипазы А₂, холеретич. (выведение ХС)</p>\n<p><strong>5 этапов:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Этап</th><th>Суть</th><th>Фермент/детали</th></tr></thead>\n<tbody>\n<tr><td>I Эмульгирование</td><td>↓капель жира</td><td>соли ЖК</td></tr>\n<tr><td>II Гидролиз ТАГ</td><td>ТАГ→ДАГ→β-МАГ(70%)+глицерин+ВЖК(5%)</td><td>панкреат. липаза+колипаза</td></tr>\n<tr><td>II Гидролиз ФЛ</td><td>→лизофосфатидилхолин</td><td>фосфолипаза А₂ (акт. трипсином)</td></tr>\n<tr><td>II Гидролиз ЭХ</td><td>→ХС+ВЖК</td><td>холестеролэстераза</td></tr>\n<tr><td>III Мицеллообразование</td><td>первичная (ЖК:ФЛ:ХС=12,5:2,5:1) → смешанная (ВЖК,β-МАГ,ДАГ,ХС,вит.А,Д,Е,К внутри)</td><td>—</td></tr>\n<tr><td>IV Всасывание</td><td>простая диффузия; глицерин/АК/H₃PO₄/ЖК&lt;C10 → кровь; ЖК → печень (энтерогепат. цирк.)</td><td>—</td></tr>\n<tr><td>V Ресинтез в энтероците</td><td>ТАГ (β-МАГ путь / α-ГФ путь), ФЛ (эссенц. ВЖК), ЭХ (АХАТ)</td><td>насцентные ХМ, ЛПВП</td></tr>\n</tbody>\n</table></div>\n<p><strong>У детей:</strong> переваривание начинается во рту (липаза языка) + желудке (pH 5,0); жиры — гл. источник энергии</p>\n<p><strong>Стеаторея:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Причина</th><th>В кале</th></tr></thead>\n<tbody>\n<tr><td>Панкреатическая</td><td>↓липолитич. ферментов</td><td>ТАГ</td></tr>\n<tr><td>Гепатогенная (холестаз)</td><td>нет желчи → нет эмульгир.</td><td>мыла + гиповит. A,D,E,K</td></tr>\n<tr><td>Энтерогенная</td><td>дефект слизистой</td><td>своб. ВЖК</td></tr>\n</tbody>\n</table></div>"}, {"num": 20, "title": "Этапы катаболизма жирных кислот — активация, транспорт, β-окисление", "section": "Раздел 3", "sectionTitle": "Обмен липидов", "explanationHtml": "<p>Это ключевой путь получения энергии из жиров. Разберём по трём чётким этапам: а) активация, б) транспорт в митохондрию, в) само β-окисление.</p>\n<p><strong>а) Активация жирной кислоты (цитозоль, наружная мембрана митохондрий)</strong></p>\n<p>Источники ВЖК: НЭЖК (неэтерифицированные ЖК — приходят из крови в комплексе с альбумином) + цитозольные ТАГ (расщеплённые ТАГ-липазой).</p>\n<p>Прежде чем ЖК может попасть в митохондрию и начать окисляться, её нужно \"активировать\" — присоединить к КоА:</p>\n<p><strong>Реакция:</strong> ВЖК + АТФ + HSKoA → Ацил-SKoA + АМФ + ФФн (пирофосфат)</p>\n<p>Фермент: <strong>ацил-КоА-синтетаза</strong> (она же тиокиназа).</p>\n<p>Важная деталь: в этой реакции тратится сразу 2 макроэргические связи АТФ (АТФ распадается до АМФ, а не до АДФ!) — и это делает реакцию необратимой: пирофосфатаза дополнительно расщепляет образовавшийся ФФн на 2 Фн, что \"утягивает\" равновесие ещё дальше в сторону продукта.</p>\n<p><strong>б) Транспорт ацил-КоА в матрикс митохондрий (карнитиновый челнок)</strong></p>\n<p>Проблема: сам ацил-КоА (с длинной жирнокислотной цепью) не может пройти через внутреннюю мембрану митохондрий напрямую — она непроницаема для таких крупных молекул. Нужен переносчик — <strong>карнитин</strong>.</p>\n<p>Три шага челнока:</p>\n<ol>\n<li><strong>Ацилкарнитинтрансфераза I</strong> (на наружной мембране митохондрий): Ацил-SKoA + карнитин → Ацилкарнитин + HSKoA (КоА \"отцепляется\", остаётся в цитозоле)</li>\n</ol>\n<ol>\n<li><strong>Транслоказа</strong> (на внутренней мембране) — переносит ацилкарнитин внутрь, в матрикс</li>\n</ol>\n<ol>\n<li><strong>Ацилкарнитинтрансфераза II</strong> (на внутренней поверхности мембраны, уже внутри матрикса): Ацилкарнитин + HSKoA (уже митохондриальный КоА) → Ацил-SKoA + Карнитин (карнитин освобождается и возвращается назад, наружу, для следующего цикла)</li>\n</ol>\n<p>Важная деталь: жирные кислоты с короткой цепью (C4-C11) могут проникать в митохондрии напрямую, независимо от карнитина — карнитиновый челнок нужен только для длинноцепочечных ЖК.</p>\n<p><strong>в) β-окисление (матрикс митохондрий) — цикл из 4 реакций</strong></p>\n<p>Название \"β-окисление\" — потому что окисление идёт именно по β-углеродному атому (второй от карбоксильной группы) жирной кислоты, и каждый цикл \"отрезает\" от цепи по 2 атома углерода за раз в виде ацетил-КоА.</p>\n<p><strong>4 реакции цикла (важно помнить именно эту последовательность типов реакций — она перекликается с ЦТК!):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Реакция</th><th>Тип</th><th>Фермент</th><th>Продукт</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Ацил-SKoA → Δ²-транс-еноил-SKoA</td><td>дегидрирование</td><td>ацил-КоА-дегидрогеназа</td><td>ФАДН₂</td></tr>\n<tr><td>2</td><td>Δ²-транс-еноил-SKoA + Н₂О → L-3-гидроксиацил-SKoA</td><td>гидратация</td><td>гидратаза</td><td>—</td></tr>\n<tr><td>3</td><td>L-3-гидроксиацил-SKoA → 3-кетоацил-SKoA</td><td>дегидрирование</td><td>3-гидроксиацил-КоА-дегидрогеназа</td><td>НАДН+Н⁺</td></tr>\n<tr><td>4</td><td>3-кетоацил-SKoA + HSKoA → Ацетил-SKoA + Ацил-SKoA (укороченный на 2С)</td><td>тиолиз</td><td>тиолаза</td><td>Ацетил-SKoA</td></tr>\n</tbody>\n</table></div>\n<p><strong>Заметил закономерность?</strong> Реакции 1-2-3 β-окисления (дегидрирование → гидратация → дегидрирование) <strong>идентичны по логике</strong> реакциям ЦТК (сукцинат→фумарат→малат→ОАА — тоже дегидрирование-гидратация-дегидрирование)! Это удобная мнемоника для запоминания порядка.</p>\n<p>После завершения одного цикла (4 реакции) — укороченная на 2 углерода жирная кислота (ацил-КоА) снова входит в тот же цикл, и так до полного расщепления на молекулы ацетил-КоА.</p>\n<p><strong>Регуляция β-окисления:</strong> контроль идёт не внутри самого β-окисления, а на этапе <strong>транспорта</strong> через мембрану митохондрий (то есть регулируется \"вход\", а не сам процесс).</p>\n<p>Регуляторный фермент — <strong>карнитинацилтрансфераза I</strong>:</p>\n<ul>\n<li>Активаторы: АДФ, АМФ, НАД⁺ (сигналы \"энергии мало, нужно больше окислять жиры\")</li>\n<li>Ингибиторы: АТФ, НАДН+Н⁺ (сигналы \"энергии достаточно, притормози\")</li>\n</ul>\n<p>(Забегая вперёд — есть ещё один мощный ингибитор карнитинацилтрансферазы I, малонил-КоА, но это уже тема биосинтеза жирных кислот, разберём её отдельно в соответствующем вопросе).</p>\n<p><strong>Энергетический эффект β-окисления одного цикла:</strong></p>\n<p>За 1 цикл получаем 1 ФАДН₂ (→2 АТФ) + 1 НАДН+Н⁺ (→3 АТФ) = <strong>5 АТФ</strong> за цикл, плюс сам ацетил-КоА идёт в ЦТК и даёт ещё 12 АТФ (мы это считали в вопросе 12).</p>\n<p><strong>Биологическое значение окисления β-ВЖК:</strong> основной источник энергии для многих тканей (сердце, скелетные мышцы в покое, печень), особенно важен при голодании и длительной физнагрузке, когда запасы гликогена истощены.</p>\n<p>Пальмитиновая кислота (С16:0) полностью проходит β-окисление. Цикл β-окисления повторится 7 раз, и образуется 8 молекул ацетил-КоА.</p>", "conspectHtml": "<p><strong>20. Катаболизм жирных кислот: активация, транспорт, β-окисление</strong></p>\n<p><strong>а) Активация (цитозоль):</strong> ВЖК + АТФ + HSKoA →(ацил-КоА-синтетаза)→ Ацил-SKoA + АМФ + ФФн (→2Фн, необратимо, -2 макроэрг. связи)</p>\n<p><strong>б) Транспорт (карнитиновый челнок):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Шаг</th><th>Локализация</th><th>Фермент</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>наружн. мембрана</td><td>ацилкарнитинтрансфераза I: Ацил-КоА+карнитин→Ацилкарнитин</td></tr>\n<tr><td>2</td><td>внутренняя мембрана</td><td>транслоказа (перенос внутрь)</td></tr>\n<tr><td>3</td><td>матрикс</td><td>ацилкарнитинтрансфераза II: Ацилкарнитин+HSKoA→Ацил-КоА+карнитин(назад)</td></tr>\n</tbody>\n</table></div>\n<p><em>C4-C11 — проникают без карнитина</em></p>\n<p><strong>в) β-окисление (матрикс, 4 реакции/цикл, ⇄ логике ЦТК):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Тип</th><th>Фермент</th><th>Продукт</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>дегидрирование</td><td>ацил-КоА-ДГ</td><td>ФАДН₂</td></tr>\n<tr><td>2</td><td>гидратация</td><td>гидратаза</td><td>—</td></tr>\n<tr><td>3</td><td>дегидрирование</td><td>3-гидроксиацил-КоА-ДГ</td><td>НАДН+Н⁺</td></tr>\n<tr><td>4</td><td>тиолиз</td><td>тиолаза</td><td>Ацетил-SKoA + укороч. ацил (-2С)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Регуляция:</strong> на этапе транспорта, фермент карнитинацилтрансфераза I: акт. АДФ,АМФ,НАД⁺ / ингиб. АТФ,НАДН</p>\n<p><strong>Энергетика 1 цикла:</strong> ФАДН₂(2АТФ)+НАДН(3АТФ) = 5 АТФ + ацетил-КоА(→12 АТФ в ЦТК)</p>\n<p><strong>Для С16:0 (пальмитиновая):</strong> 7 циклов → 8 ацетил-КоА</p>"}, {"num": 21, "title": "Биосинтез жирных кислот", "section": "Раздел 3", "sectionTitle": "Обмен липидов", "explanationHtml": "<p>Это \"зеркальный\" процесс к β-окислению — но идёт другим набором ферментов, в другом месте клетки и с другим коферментом.</p>\n<p><strong>Локализация:</strong> цитоплазма (в отличие от β-окисления, которое шло в матриксе митохондрий!). Субстрат — ацетил-SKoA (преимущественно углеводного происхождения).</p>\n<p><strong>а) Транспорт ацетил-КоА из митохондрий в цитозоль (цитратный челночный механизм)</strong></p>\n<p>Ацетил-КоА образуется в матриксе митохондрий, но синтез ЖК идёт в цитозоле — а сам ацетил-КоА напрямую через мембрану не проходит. Нужен \"челнок\", и в этот раз он работает через цитрат:</p>\n<ol>\n<li>В матриксе: Ацетил-SKoA + Оксалоацетат → Цитрат (фермент цитратсинтаза — та же самая реакция №1 ЦТК!)</li>\n<li>Цитрат переносится в цитозоль (трикарбоксилат-транспортная система)</li>\n<li>В цитозоле: Цитрат + АТФ + KoA-SH → Ацетил-SKoA + АДФ + Фн + Оксалоацетат (фермент цитратлиаза)</li>\n<li>Оксалоацетат → Малат (цитозольная малатДГ, НАД+→НАДН+Н+)</li>\n<li>Малат → ПВК + CO2 + НАДФН2 (фермент малик-фермент) — вот отсюда клетка получает ещё и дополнительный НАДФН2!</li>\n<li>ПВК возвращается обратно в митохондрии (замыкая челнок)</li>\n</ol>\n<p><strong>б) Синтез малонил-SKoA — ключевой регуляторный этап</strong></p>\n<p>Прежде чем начать собирать цепочку ЖК, ацетил-КоА нужно \"активировать\" в малонил-КоА — это единственная необратимая и регулируемая реакция всего пути синтеза.</p>\n<p>Фермент: Ацетил-SKoA-карбоксилаза (содержит биотин — витамин Н).</p>\n<p>Реакция в 2 стадии:</p>\n<ol>\n<li>CO2 (из HCO3-) + биотин → карбокси-биотин-фермент (АТФ-аза, тратит АТФ)</li>\n<li>Перенос COO- с биотина на ацетил-SKoA → Малонил-SKoA</li>\n</ol>\n<p><strong>в) Сборка цепи ВЖК на примере С16:0 (пальмитиновая кислота) — синтазный мультиферментный комплекс</strong></p>\n<p>Комплекс — синтаза ВЖК, активна в виде димера, содержит 7 ферментов и специальный ацилпереносящий белок (АПБ) с SH-группой (фосфопантетеинат — производное витамина В5).</p>\n<p><strong>5 стадий одного цикла удлинения (на 2 атома углерода за раз):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Стадия</th><th>Что происходит</th><th>Фермент</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Заполнение SH-групп</td><td>Ацетил-КоА → на SH конденсирующего фермента (цис-SH); Малонил-КоА → на SH АПБ</td><td>ацетилтрансфераза, малонилтрансфераза</td></tr>\n<tr><td>2</td><td>Конденсация</td><td>Ацетил переносится на малонил, с отщеплением CO2 → образуется 3-кетоацил-Е</td><td>3-кетоацилсинтаза</td></tr>\n<tr><td>3</td><td>1-е восстановление</td><td>3-Кетоацил-Е + НАДФН2 → 3-Гидроксиацил-Е</td><td>кетоацилредуктаза</td></tr>\n<tr><td>4</td><td>Дегидратация</td><td>3-Гидроксиацил-Е → Еноил-Е + Н2О</td><td>гидратаза</td></tr>\n<tr><td>5</td><td>2-е восстановление</td><td>Еноил-Е + НАДФН2 → Насыщенный ацил-Е</td><td>еноилредуктаза</td></tr>\n</tbody>\n</table></div>\n<p>Цикл повторяется 7 раз (то же число циклов, что и в β-окислении для той же молекулы С16:0, только там мы её разбирали на части, а тут — собираем!), пока не образуется С16:0 (пальмитиновая кислота), которая уже не является субстратом для конденсирующего фермента — синтез прекращается.</p>\n<p><strong>Суммарное уравнение:</strong> 1 Ацетил-SKoA + 7 Малонил-SKoA + 14 НАДФН2 → С16:0 + 7CO2 + 6Н2О + 8KoA-SH + 14НАДФ+</p>\n<p><strong>Источники НАДФН2 для синтеза</strong> (три источника):</p>\n<ul>\n<li>ПФ-путь — 40%</li>\n<li>Малик-фермент — 50%</li>\n<li>Цитозольная изоцитратдегидрогеназа — 10%</li>\n</ul>\n<p><strong>Регуляция биосинтеза ВЖК</strong> — главный регуляторный фермент — Ацетил-SKoA-карбоксилаза.</p>\n<p>Метаболическая (ассоциация-диссоциация):</p>\n<ul>\n<li>Активатор: Цитрат (стимулирует ассоциацию субъединиц в активный комплекс)</li>\n<li>Ингибитор: Пальмитоил-КоА (конечный продукт! — вызывает диссоциацию)</li>\n</ul>\n<p>Ковалентная модификация: фермент активен в дефосфорилированной форме.</p>\n<p>Гормональная регуляция:</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Гормон</th><th>Когда</th><th>Действие</th><th>Эффект</th></tr></thead>\n<tbody>\n<tr><td>Инсулин</td><td>абсорбтивный период (после еды)</td><td>дефосфорилирует фермент + индуцирует синтез ферментов</td><td>↑синтез ЖК</td></tr>\n<tr><td>Глюкагон/адреналин</td><td>постабсорбтивный период, физнагрузка</td><td>фосфорилируют фермент</td><td>синтез ЖК приостанавливается</td></tr>\n</tbody>\n</table></div>\n<p><strong>Биологическое значение синтеза ЖК (3 пункта):</strong></p>\n<ol>\n<li>Образовавшиеся ЖК используются для синтеза ТАГ и ФЛ</li>\n<li>Трансформация избытка углеводов в жиры (аккумулирование энергии в компактной форме)</li>\n<li>Из ацетил-SKoA жирнокислотного происхождения НЕ может синтезироваться глюкоза (реакция ПВК→Ацетил-КоА необратима)</li>\n</ol>\n<p>Распад и синтез — противоположные по направлению процессы, и клетка использует для них разные коферментные пулы, чтобы их можно было регулировать независимо и не запускать «бессмысленный цикл» одновременно в обе стороны. НАД+/ФАД — «энергетический» пул (окисление → дыхательная цепь → АТФ). НАДФН — «биосинтетический» пул (восстановительная сила для синтеза).</p>", "conspectHtml": "<p><strong>21. Биосинтез жирных кислот</strong></p>\n<p><strong>Локализация:</strong> цитоплазма. Субстрат — Ацетил-SKoA (углеводного происхождения)</p>\n<p><strong>а) Транспорт ацетил-КоА из Mx в цитозоль (цитратный челнок):</strong></p>\n<ol>\n<li>Mx: Ацетил-КоА + ОАА →(цитратсинтаза)→ Цитрат</li>\n<li>Цитрат → цитозоль (трикарбоксилат-система)</li>\n<li>Цитозоль: Цитрат+АТФ+KoA-SH →(цитратлиаза)→ Ацетил-КоА+АДФ+Фн+ОАА</li>\n<li>ОАА → Малат (цитозольная малатДГ)</li>\n<li>Малат →(малик-фермент)→ ПВК+CO2+НАДФН2</li>\n<li>ПВК → обратно в Mx</li>\n</ol>\n<p><strong>б) Синтез малонил-SKoA (регуляторный этап):</strong> Фермент: Ацетил-SKoA-карбоксилаза (кофактор — биотин, вит.Н) 2 стадии: 1) CO2+биотин (+АТФ) 2) перенос COO- на ацетил-КоА → Малонил-SKoA</p>\n<p><strong>в) Сборка цепи (синтаза ВЖК — комплекс-димер, 7 ферментов + АПБ):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Стадия</th><th>Суть</th><th>Фермент</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Заполнение SH-групп</td><td>Ацетил-КоА→цис-SH; Малонил-КоА→АПБ-SH</td><td>трансферазы</td></tr>\n<tr><td>2</td><td>Конденсация</td><td>ацетил+малонил (-CO2) → 3-кетоацил-Е</td><td>3-кетоацилсинтаза</td></tr>\n<tr><td>3</td><td>1-е восстановление</td><td>+НАДФН2 → 3-гидроксиацил-Е</td><td>кетоацилредуктаза</td></tr>\n<tr><td>4</td><td>Дегидратация</td><td>→ Еноил-Е + Н2О</td><td>гидратаза</td></tr>\n<tr><td>5</td><td>2-е восстановление</td><td>+НАДФН2 → насыщ. ацил-Е</td><td>еноилредуктаза</td></tr>\n</tbody>\n</table></div>\n<p>Цикл ×7 → С16:0 (пальмитат)</p>\n<p><strong>Суммарно:</strong> Ацетил-КоА+7Малонил-КоА+14НАДФН2 → С16:0+7CO2+6Н2О+8KoA-SH+14НАДФ+</p>\n<p><strong>Источники НАДФН2:</strong> ПФ-путь 40% / малик-фермент 50% / изоцитратДГ(цитозоль) 10%</p>\n<p><strong>Регуляция (гл. фермент — ацетил-КоА-карбоксилаза):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Активирует</th><th>Ингибирует</th></tr></thead>\n<tbody>\n<tr><td>Метаболич. (ассоц-диссоц)</td><td>Цитрат</td><td>Пальмитоил-КоА (продукт)</td></tr>\n<tr><td>Ковалентная</td><td>дефосфорилир.</td><td>фосфорилир.</td></tr>\n<tr><td>Гормональная</td><td>Инсулин (дефосфор. + индукция ферментов)</td><td>Глюкагон/адреналин (фосфор.)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Значение:</strong> 1) синтез ТАГ/ФЛ 2) депонирование избытка углеводов как жир 3) из жирнокисл. ацетил-КоА глюкоза НЕ синтезируется</p>"}, {"num": 22, "title": "Катаболизм и биосинтез ТАГ, регуляция", "section": "Раздел 3", "sectionTitle": "Обмен липидов", "explanationHtml": "<p>Этот вопрос про судьбу самого запасного жира (триацилглицеринов) — как он расщепляется в жировой ткани и как заново синтезируется.</p>\n<p><strong>Катаболизм ТАГ (липолиз) — в адипоцитах:</strong></p>\n<p>Фермент: ТАГ-липаза</p>\n<p>Реакция: ТАГ → Глицерин + ВЖК</p>\n<p>Судьба продуктов расходится в разные стороны:</p>\n<ul>\n<li>ВЖК — поступают в плазму крови, связываются с альбумином, доставляются в ткани-потребители для окисления или для синтеза других липидов.</li>\n<li>Глицерин — поступает в кровь, утилизируется тканями, у которых есть фермент глицеролкиназа (печень, почки, кишечник, молочная железа — мышцы и жировая ткань сюда НЕ входят, у них этого фермента нет!). Путь: Глицерин → α-глицерофосфат (глицеролкиназа, +АТФ) → ДГАФ (глицерол-3-фосфат-дегидрогеназа, НАД+) → 3-ФГА (изомераза) → дальше либо в гликолиз, либо в глюконеогенез.</li>\n</ul>\n<p><strong>Биосинтез ТАГ (липогенез)</strong></p>\n<p>Субстраты: α-Глицерофосфат (α-ГФ) и Ацил-SKoA.</p>\n<p>Источники α-ГФ — два разных пути в зависимости от ткани:</p>\n<ol>\n<li>Из глицерина (глицеролкиназа, +АТФ) — работает в печени, почках, кишечнике</li>\n<li>Из глюкозы (через гликолиз: Глюкоза → ДГАФ → α-ГФ) — работает в мышцах и жировой ткани (там глицеролкиназы нет!)</li>\n</ol>\n<p>Жировая ткань не может использовать собственный же глицерин (из распада своих ТАГ) для ресинтеза новых ТАГ — глицерин уходит в кровь, а на синтез идёт α-ГФ, полученный из глюкозы.</p>\n<p><strong>3 этапа синтеза ТАГ:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Этап</th><th>Реакция</th><th>Фермент</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Этерификация</td><td>α-ГФ + 2 Ацил-SKoA → Фосфатидная кислота + 2 HSKoA</td><td>ацилтрансфераза</td></tr>\n<tr><td>2</td><td>Гидролиз</td><td>Фосфатидная кислота + Н2О → 1,2-ДАГ + Н3PO4</td><td>фосфатаза</td></tr>\n<tr><td>3</td><td>Ацилирование</td><td>1,2-ДАГ + Ацил-SKoA → ТАГ + HSKoA</td><td>ацилтрансфераза</td></tr>\n</tbody>\n</table></div>\n<p>(В энтероцитах путь чуть другой — преимущественно β-моноацилглицеридный: β-МАГ + 2 Ацил-SKoA → ТАГ напрямую)</p>\n<p><strong>Регуляция синтеза и распада ТАГ в зависимости от приёма пищи:</strong></p>\n<p>В период приёма пищи (инсулин доминирует):</p>\n<p><em>Печень:</em></p>\n<ul>\n<li>Инсулин стимулирует липогенез</li>\n<li>Активируется гликолиз → ↑цитрат → активация ацетил-SKoA-карбоксилазы → ↑малонил-SKoA (который заодно ингибирует β-окисление) → ↑синтез ЖК → ↑синтез ТАГ</li>\n<li>ТАГ секретируются в кровь в составе ЛПОНП</li>\n</ul>\n<p><em>Жировая ткань:</em></p>\n<ul>\n<li>Инсулин индуцирует синтез липопротеинлипазы (ЛПЛ) — гидролизует ТАГ из ЛПОНП в крови, снаружи адипоцита, высвобождая ВЖК</li>\n<li>Инсулин активирует ГЛЮТ-4 → ↑поступление глюкозы → ↑гликолиз → ↑α-ГФ и ацил-SKoA для синтеза ТАГ</li>\n<li>Инсулин дефосфорилирует ТАГ-липазу → инактивирует распад жиров</li>\n</ul>\n<p><strong>Между приёмами пищи, при голодании, физнагрузке (глюкагон, адреналин доминируют):</strong></p>\n<ul>\n<li>Активируют липолиз в адипоцитах через аденилатциклазную систему → активация протеинкиназы А → фосфорилирование ТАГ-липазы (переводит в активную форму) → расщепление ТАГ до глицерина и ВЖК</li>\n<li>ВЖК с альбуминами крови доставляются в ткани для окисления</li>\n</ul>\n<p>Для гликогенфосфорилазы и для ТАГ-липазы фосфорилирование делает одно и то же — активирует распад. Но для ацетил-КоА-карбоксилазы фосфорилирование, наоборот, ВЫКЛЮЧАЕТ синтез. Общее правило: фосфорилирование — это «переключатель в сторону распада»: оно ВКЛЮЧАЕТ катаболические (распадающие) ферменты и ВЫКЛЮЧАЕТ анаболические (синтезирующие). Дефосфорилирование действует зеркально.</p>", "conspectHtml": "<p><strong>22. Катаболизм и биосинтез ТАГ, регуляция</strong></p>\n<p><strong>Катаболизм (липолиз, адипоциты):</strong> ТАГ →(ТАГ-липаза)→ Глицерин + ВЖК</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Продукт</th><th>Судьба</th></tr></thead>\n<tbody>\n<tr><td>ВЖК</td><td>кровь+альбумин → ткани (окисление/синтез)</td></tr>\n<tr><td>Глицерин</td><td>кровь → печень/почки/кишечник/мол.железа (есть глицеролкиназа) → α-ГФ →(глицерол-3-Ф-ДГ)→ ДГАФ →(изомераза)→ 3-ФГА → гликолиз/глюконеогенез</td></tr>\n</tbody>\n</table></div>\n<p><strong>Биосинтез ТАГ:</strong> субстраты — α-ГФ + Ацил-SKoA</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Источник α-ГФ</th><th>Где</th></tr></thead>\n<tbody>\n<tr><td>из глицерина (глицеролкиназа)</td><td>печень, почки, кишечник</td></tr>\n<tr><td>из глюкозы (гликолиз→ДГАФ→α-ГФ)</td><td>мышцы, жир. ткань (нет глицеролкиназы!)</td></tr>\n</tbody>\n</table></div>\n<p><strong>3 этапа синтеза:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Этап</th><th>Р-ция</th><th>Фермент</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Этерификация</td><td>α-ГФ+2Ацил-КоА→Фосфатидная к-та</td><td>ацилтрансфераза</td></tr>\n<tr><td>2</td><td>Гидролиз</td><td>Фосфатидная к-та+Н2О→1,2-ДАГ</td><td>фосфатаза</td></tr>\n<tr><td>3</td><td>Ацилирование</td><td>1,2-ДАГ+Ацил-КоА→ТАГ</td><td>ацилтрансфераза</td></tr>\n</tbody>\n</table></div>\n<p><strong>Регуляция по приёму пищи:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Приём пищи (инсулин)</th><th>Голод/нагрузка (глюкагон, адреналин)</th></tr></thead>\n<tbody>\n<tr><td>Печень</td><td>↑гликолиз→цитрат→↑АцКоА-карбоксилаза→↑ЖК→↑ТАГ→ЛПОНП</td><td>—</td></tr>\n<tr><td>Жир. ткань</td><td>↑ЛПЛ (гидролиз ТАГ ЛПОНП), ↑ГЛЮТ-4→α-ГФ, дефосфор. ТАГ-липазы (↓распад)</td><td>аденилатциклаза→ПКА→фосфор. ТАГ-липазы (↑распад)→глицерин+ВЖК</td></tr>\n</tbody>\n</table></div>\n<p><strong>Общее правило:</strong> фосфорилирование — переключатель в сторону распада (вкл. катаболизм, выкл. анаболизм); дефосфорилирование — зеркально</p>"}, {"num": 23, "title": "Катаболизм и биосинтез ФЛ, клинические аспекты", "section": "Раздел 3", "sectionTitle": "Обмен липидов", "explanationHtml": "<p><strong>Катаболизм ФЛ в клетке</strong> (не путать с полостным перевариванием из вопроса 19 — там были панкреатические фосфолипазы, а тут — клеточные)</p>\n<p>Ферменты: клеточные фосфолипазы А1, А2, C, D Конечные продукты: ВЖК, глицерин, H3PO4, аминоспирт</p>\n<p><strong>Биосинтез глицеролфосфолипидов (ФЭА и ФХ)</strong></p>\n<p>Субстраты: 1,2-ДАГ + активная форма аминоспирта (фосфоэтаноламин или фосфохолин, в комплексе с ЦТФ).</p>\n<p><strong>Путь «de novo» (только для ФХ):</strong></p>\n<p>Фосфатидилэтаноламин (ФЭА) → трёхкратное метилирование (донор метильных групп — S-аденозилметионин, SAM) → Фосфатидилхолин (ФХ)</p>\n<p><strong>Резервный (\"спасательный\") путь (для ФЭА и ФХ):</strong></p>\n<ol>\n<li>Аминоспирт (этаноламин/холин) → Фосфоаминоспирт (киназа, +АТФ)</li>\n<li>Фосфоаминоспирт + ЦТФ → ЦДФ-аминоспирт + ФФн (цитидилтрансфераза — регуляторный фермент)</li>\n<li>ЦДФ-аминоспирт + 1,2-ДАГ → Фосфолипид (ФЭА или ФХ) + ЦМФ (фосфохолин/фосфоэтаноламин-трансфераза — тоже регуляторный фермент)</li>\n</ol>\n<p><strong>Биологический смысл резервного пути:</strong> сохранение холина от разрушения путём реутилизации.</p>\n<p><strong>Регуляция синтеза ФЛ:</strong> система саморегулируется — регуляторные ферменты активируются при высоких концентрациях холина/этаноламина и при наличии ДАГ. Симпатическая нервная система активирует синтез ФХ, поставляя ацетилхолин.</p>\n<p><strong>Клинические аспекты — 4 состояния:</strong></p>\n<p><strong>1. Роль лецитина (дипальмитоилфосфатидилхолина) — сурфактант лёгких</strong></p>\n<p>Это основной компонент сурфактанта (80% его фосфолипидов). Сурфактант — вещество, выстилающее альвеолы изнутри, снижающее поверхностное натяжение.</p>\n<p>Синтезируется в пневмоцитах II типа, начиная с 32-36 недели беременности.</p>\n<p>Диагностический показатель: соотношение фосфатидилхолин/сфингомиелин &gt;4 — норма. Если &lt;2 — высокий риск респираторного дистресс-синдрома у недоношенных.</p>\n<p>Высокий риск респираторного дистресс-синдрома связан с недостаточным синтезом сурфактанта: его выработка начинается примерно с 32-36 недели, диагностируется это по соотношению лецитин/сфингомиелин (L/S ratio) в амниотической жидкости.</p>\n<p><strong>2. Рассеянный склероз</strong></p>\n<p>Снижение содержания ФЛ и сфинголипидов в белом веществе мозга. Появление эфиров холестерина (которых в норме там быть не должно). Спинномозговая жидкость обогащается ФЛ.</p>\n<p><strong>3. Лизосомные болезни</strong> — наследственные дефекты конкретных гидролаз:</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Болезнь</th><th>Дефектный фермент</th><th>Накопление/проявление</th></tr></thead>\n<tbody>\n<tr><td>Тея-Сакса</td><td>гексозаминидаза</td><td>ганглиозиды, дегенерация НС, слепота, смерть в раннем возрасте</td></tr>\n<tr><td>Нимана-Пика</td><td>сфингомиелиназа</td><td>сфингомиелины в мозге, печени, селезёнке</td></tr>\n<tr><td>Фарбера</td><td>церамидаза</td><td>гепато-/спленомегалия, поражение суставов</td></tr>\n<tr><td>Гоше</td><td>β-глюкозидаза</td><td>—</td></tr>\n<tr><td>Фабри</td><td>α-галактозидаза</td><td>—</td></tr>\n<tr><td>Хёрлера (гаргоилизм)</td><td>α-L-идуронидаза</td><td>протеогликаны, изменение черт лица, умственная отсталость, слепота, смерть</td></tr>\n</tbody>\n</table></div>\n<p><strong>4. Антифосфолипидный синдром</strong></p>\n<p>Появление антител к фосфолипидам (при аутоиммунных, инфекционных заболеваниях). Механизм: нарушают мембран-зависимые реакции гемостаза, ингибируют противосвёртывающую систему → повышенное тромбообразование. Клинически: рецидивирующие тромбозы (венозные, артериальные), спонтанные выкидыши, тромбоцитопения, инфаркт миокарда.</p>", "conspectHtml": "<p><strong>23. Катаболизм и биосинтез ФЛ, клинические аспекты</strong></p>\n<p><strong>Катаболизм ФЛ (клеточный, не путать с полостным):</strong> Фосфолипазы А1,А2,C,D → ВЖК + глицерин + H3PO4 + аминоспирт</p>\n<p><strong>Биосинтез (субстрат: 1,2-ДАГ + актив. аминоспирт+ЦТФ):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>Только для</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>De novo</td><td>ФХ</td><td>ФЭА →(3× метилирование, донор SAM)→ ФХ</td></tr>\n<tr><td>Резервный</td><td>ФЭА и ФХ</td><td>аминоспирт→(киназа,+АТФ)→фосфоаминоспирт→(цитидилтрансфераза)→ЦДФ-аминоспирт+ДАГ→(трансфераза)→ФЛ+ЦМФ</td></tr>\n</tbody>\n</table></div>\n<p><em>Смысл резервного пути: реутилизация холина (экономия)</em></p>\n<p><strong>Регуляция:</strong> саморегуляция (↑холин/этаноламин/ДАГ → ↑ферменты); симпатика (ацетилхолин) → ↑синтез ФХ</p>\n<p><strong>Клинические аспекты:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Состояние</th><th>Суть</th></tr></thead>\n<tbody>\n<tr><td>Лецитин (дипальмитоил-ФХ)</td><td>80% сурфактанта, синтез с 32-36 нед (пневмоциты II типа). Норма ФХ/сфингомиелин &gt;4; &lt;2 → респир. дистресс-синдром</td></tr>\n<tr><td>Рассеянный склероз</td><td>↓ФЛ/сфинголипидов в белом в-ве мозга, ↑эфиров ХС, ФЛ в ликворе</td></tr>\n<tr><td>Лизосомные болезни</td><td>дефект гидролаз → накопление субстрата (Тея-Сакса/Нимана-Пика/Фарбера/Гоше/Фабри/Хёрлера)</td></tr>\n<tr><td>Антифосфолипидный синдром</td><td>антитела к ФЛ → нарушение гемостаза → тромбозы (не кровотечения!), выкидыши</td></tr>\n</tbody>\n</table></div>"}, {"num": 24, "title": "Холестерин — структура, функции, биосинтез, регуляция", "section": "Раздел 3", "sectionTitle": "Обмен липидов", "explanationHtml": "<p>Холестерин — один из самых \"экзаменационно насыщенных\" вопросов.</p>\n<p><strong>Структура и функции ХС</strong></p>\n<p>Относится к группе стероидов (циклопентанпергидрофенантреновое ядро — 4 конденсированных кольца). Это мононенасыщенный спирт (стерин/стерол) — есть ОН-группа в 3-м положении и боковая углеводородная цепь в 17-м положении. Полярный липид, способен образовывать эфиры с жирными кислотами.</p>\n<p>Функции (3 пункта):</p>\n<ol>\n<li>Компонент клеточных мембран (регулятор текучести)</li>\n<li>Предшественник желчных кислот</li>\n<li>Предшественник стероидных гормонов (кортикоидные, половые) и витамина D</li>\n</ol>\n<p><strong>Синтез и распад эфиров холестерина</strong></p>\n<p>Синтез (этерификация):</p>\n<ul>\n<li>В клетках (ЭПР): ХС + Ацил-SKoA → ЭХС + HSKoA (фермент АХАТ — ацилхолестеролацилтрансфераза)</li>\n<li>В плазме крови (в составе ЛПВП): ХС + Фосфатидилхолин (лецитин) → ЭХС + Лизолецитин (фермент ЛХАТ — лецитинхолестеролацилтрансфераза, синтезируется в печени)</li>\n</ul>\n<p>Распад (гидролиз): ЭХС + Н2О → ХС + ВЖК (фермент холестеролэстераза, в лизосомах клеток)</p>\n<p>Биологическое значение: эфиры холестерина — это запасная (депонированная) форма ХС. Этерификация в ЛПВП (через ЛХАТ) особенно важна — она необходима для обратного транспорта холестерина из периферических тканей в печень.</p>\n<p><strong>Фонд, пути использования и выведения холестерина</strong></p>\n<p>В теле взрослого человека около 210-250 г ХС.</p>\n<p>Пулы (по скорости обмена):</p>\n<ul>\n<li>Быстро обменивающийся: печень, кишечник, плазма — 30 г</li>\n<li>Медленно обменивающийся: жировая ткань — 50 г</li>\n<li>Очень медленно обменивающийся: нервная, соединительная ткань — 60 г</li>\n</ul>\n<p>Ежесуточный расход (1,2 г всего): окисление в желчные кислоты — 0,5 г, синтез стероидных гормонов — 0,1 г, выведение с фекалиями — 0,5 г, со слущенным эпителием и секретом сальных желёз — 0,1 г.</p>\n<p>Восполнение: синтез \"de novo\" (0,8 г/сут) + экзогенный ХС с пищей (0,4 г/сут). Норма в плазме крови: 3,9-6,0 ммоль/л (70% — в виде эфиров ЭХС, 30% — свободный ХС).</p>\n<p><strong>Биосинтез ХС</strong> — в цитоплазме, аэробные условия, преимущественно в печени (50-70%). 3 крупные стадии:</p>\n<p>Стадия 1 — Биосинтез мевалоновой кислоты (из ацетил-SKoA):</p>\n<ol>\n<li>2 Ацетил-SKoA → Ацетоацетил-SKoA (фермент тиолаза)</li>\n<li>Ацетоацетил-SKoA + Ацетил-SKoA + Н2О → ГМГ-SKoA (фермент ГМГ-КоА-синтаза)</li>\n<li>ГМГ-SKoA + 2НАДФН+Н+ → Мевалоновая кислота + 2НАДФ+ + HSKoA (фермент ГМГ-КоА-редуктаза — это ключевой, главный регуляторный фермент всего пути!)</li>\n</ol>\n<p>(ГМГ-КоА синтезируется точно так же, как и в кетогенезе, но там дальше идёт другой фермент (лиаза), а здесь — редуктаза, и результат совершенно разный)</p>\n<p>Стадия 2 — Образование сквалена (из мевалоната, с затратой 3 АТФ).</p>\n<p>Стадия 3 — Циклизация сквалена (фермент циклаза) → Ланостерин → (ещё 20 реакций) → Холестерин.</p>\n<p><strong>Регуляция биосинтеза ХС:</strong></p>\n<ol>\n<li>Метаболическая регуляция (отрицательная обратная связь, медленная):</li>\n</ol>\n<ul>\n<li>Холестерин ингибирует активность ГМГ-КоА-редуктазы</li>\n<li>Пищевой ХС угнетает синтез эндогенного ХС</li>\n<li>Есть суточные колебания: максимум синтеза фермента — в полночь, минимум — утром (отсюда — статины рекомендуют пить вечером!)</li>\n</ul>\n<ol>\n<li>Гормональная регуляция (ковалентная модификация, быстрая): ГМГ-КоА-редуктаза активна в дефосфорилированной форме</li>\n</ol>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Гормон</th><th>Действие</th><th>Эффект</th></tr></thead>\n<tbody>\n<tr><td>Инсулин, Т3, Т4</td><td>активируют протеинфосфатазу (дефосфорилирование)</td><td>↑синтез ХС</td></tr>\n<tr><td>Глюкагон, глюкокортикоиды</td><td>активируют протеинкиназу (фосфорилирование)</td><td>↓синтез ХС</td></tr>\n</tbody>\n</table></div>\n<p>Статины рекомендуют принимать вечером, потому что активность ГМГ-КоА-редуктазы максимальна в полночь (и вообще в ночные часы), а период полувыведения большинства статинов короткий. Если принять препарат вечером, его пиковая концентрация в крови совпадёт с пиком активности фермента — и ингибирование будет максимальным.</p>", "conspectHtml": "<p><strong>24. Холестерин: структура, функции, биосинтез, регуляция</strong></p>\n<p><strong>Структура:</strong> стероид, ОН-группа в 3-м положении, полярный липид</p>\n<p><strong>Функции:</strong> мембраны (регулятор текучести), предшественник желчных к-т, предшественник стероидных гормонов и вит.D</p>\n<p><strong>Эфиры ХС:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Процесс</th><th>Место</th><th>Фермент</th><th>Р-ция</th></tr></thead>\n<tbody>\n<tr><td>Синтез</td><td>клетки (ЭПР)</td><td>АХАТ</td><td>ХС+Ацил-КоА→ЭХС</td></tr>\n<tr><td>Синтез</td><td>плазма (ЛПВП)</td><td>ЛХАТ (из печени)</td><td>ХС+лецитин→ЭХС+лизолецитин</td></tr>\n<tr><td>Распад</td><td>лизосомы</td><td>холестеролэстераза</td><td>ЭХС+Н2О→ХС+ВЖК</td></tr>\n</tbody>\n</table></div>\n<p><strong>Значение эфиров:</strong> запасная форма + обратный транспорт ХС (ЛПВП→печень)</p>\n<p><strong>Фонд:</strong> 210-250г. Расход 1,2г/сут (желчн.к-ты 0,5 + гормоны 0,1 + кал 0,5 + кожа 0,1). Восполнение: синтез 0,8 + пища 0,4. Норма крови: 3,9-6,0 ммоль/л</p>\n<p><strong>Биосинтез (цитоплазма, гл.обр. печень):</strong></p>\n<p>Стадия 1 (мевалонат): 2Ацетил-КоА→(тиолаза)→Ацетоацетил-КоА→(ГМГ-КоА-синтаза)→ГМГ-КоА→(ГМГ-КоА-редуктаза, ключев. фермент! +2НАДФН)→Мевалоновая к-та</p>\n<p>Стадия 2: Сквален (-3АТФ)</p>\n<p>Стадия 3: Сквален→(циклаза)→Ланостерин→(20 р-ций)→Холестерин</p>\n<p><strong>Регуляция ГМГ-КоА-редуктазы:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Метаболич. (медл.)</td><td>ХС ингибирует (обратн. связь); max синтеза — полночь, min — утро</td></tr>\n<tr><td>Гормональная (быстр.)</td><td>активна дефосфорилир.; Инсулин/Т3Т4 → дефосфор.(↑); Глюкагон/ГКС → фосфор.(↓)</td></tr>\n</tbody>\n</table></div>"}, {"num": 25, "title": "Синтез желчных кислот, энтерогепатическая циркуляция", "section": "Раздел 3", "sectionTitle": "Обмен липидов", "explanationHtml": "<p>Это единственный путь, которым организм реально избавляется от избытка холестерина.</p>\n<p><strong>Локализация:</strong> печень. Это главный путь выведения холестерина из организма.</p>\n<p><strong>Первичные желчные кислоты:</strong> холевая и хенодезоксихолевая.</p>\n<p><strong>Ключевой (регуляторный) фермент:</strong> 7-α-гидроксилаза — это монооксигеназа, для работы нужны О2, НАДФН+Н+, цитохром Р-450, и витамин С. Катализирует 7-α-гидроксилирование холестерина → 7-α-гидроксихолестерол.</p>\n<p>При недостатке витамина С этот процесс тормозится — то есть цинга косвенно нарушает и выведение холестерина тоже.</p>\n<p>Дальше путь разветвляется:</p>\n<ul>\n<li>С дополнительным гидроксилированием по 12-му положению → холевая кислота</li>\n<li>Без него → хенодезоксихолевая кислота</li>\n</ul>\n<p><strong>Конъюгация (в печени)</strong> — образование пептидной связи между СООН-группой желчной кислоты и NH2-группой глицина или таурина:</p>\n<p>Образуются конъюгаты: гликохолевая, таурохолевая, гликохенодезоксихолевая, таурохенодезоксихолевая кислоты. Соотношение глицин:таурин = 3:1. В желчи они находятся в виде солей (желчные соли).</p>\n<p><strong>Образование вторичных желчных кислот (в кишечнике, под действием бактерий):</strong></p>\n<ul>\n<li>Из холевой → Дезоксихолевая</li>\n<li>Из хенодезоксихолевой → Литохолевая (плохо растворима, не всасывается, выводится с фекалиями — это единственная реальная \"дыра\", через которую холестерин физически покидает организм)</li>\n</ul>\n<p><strong>Энтерогепатическая циркуляция</strong> — ключевая концепция:</p>\n<p>95% солей желчных кислот всасываются в подвздошной кишке → через воротную вену возвращаются в печень → повторно секретируются в желчь. Каждая молекула проходит этот путь 6-8 раз в сутки.</p>\n<p><strong>Биологическое значение синтеза желчных кислот (2 пункта):</strong></p>\n<ol>\n<li>Главный путь избавления организма от избытка холестерина</li>\n<li>Желчные кислоты необходимы для эмульгирования липидов, активации липазы, образования мицелл</li>\n</ol>\n<p><strong>Регуляция синтеза желчных кислот:</strong></p>\n<p>Регуляторный фермент — тот же 7-α-гидроксилаза.</p>\n<p>Метаболическая регуляция:</p>\n<ul>\n<li>Холестерин индуцирует транскрипцию гена 7-α-гидроксилазы</li>\n<li>Желчные кислоты репрессируют транскрипцию</li>\n<li>Зависимость от витамина С</li>\n</ul>\n<p>Гормональная регуляция (ковалентная модификация): 7-α-гидроксилаза активна в фосфорилированной форме — обрати внимание, это исключение из общего правила!</p>\n<ul>\n<li>Тиреоидные гормоны (Т3, Т4) индуцируют синтез и контролируют активность</li>\n<li>Эстрогены репрессируют синтез (у женщин после менопаузы желчнокаменная болезнь встречается в 3-4 раза чаще)</li>\n</ul>\n<p>Уровень холестерина в крови после разрыва энтерогепатической циркуляции (секвестранты желчных кислот) упадёт — потому что разрыв вынуждает печень тратить холестерин на синтез новых желчных кислот, чтобы восполнить их потерю. Это происходит через дерепрессию (снятие ингибирования) 7-α-гидроксилазы. Печень забирает холестерин из крови (через рецепторы ЛПНП) на эту потребность, и уровень ХС ЛПНП падает.</p>", "conspectHtml": "<p><strong>25. Синтез желчных кислот, энтерогепатическая циркуляция</strong></p>\n<p><strong>Локализация:</strong> печень. Гл. путь выведения ХС из организма.</p>\n<p><strong>Первичные ЖК:</strong> холевая, хенодезоксихолевая</p>\n<p><strong>Ключевой фермент: 7-α-гидроксилаза</strong> (монооксигеназа: О2, НАДФН+Н+, цитохром Р-450, вит.С) ХС → 7-α-гидроксихолестерол → (развилка: +12-гидроксил→холевая / без него→хенодезоксихолевая)</p>\n<p><strong>Конъюгация (печень):</strong> ЖК + глицин/таурин (3:1) → гликохолевая, таурохолевая и т.д. (желчные соли)</p>\n<p><strong>Вторичные ЖК (кишечник, бактерии):</strong> холевая → дезоксихолевая хенодезоксихолевая → литохолевая (не всасывается → кал, реальный путь выведения ХС!)</p>\n<p><strong>Энтерогепатич. циркуляция:</strong> 95% всасыв. в подвздошной кишке → воротная вена → печень → желчь. 6-8 циклов/сутки</p>\n<p><strong>Значение:</strong> 1) выведение избытка ХС 2) эмульгирование, активация липазы, мицеллы</p>\n<p><strong>Регуляция (7-α-гидроксилаза):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Активирует</th><th>Ингибирует</th></tr></thead>\n<tbody>\n<tr><td>Метаболич. (кол-во фермента)</td><td>ХС (индукция гена)</td><td>желчные к-ты (репрессия), ↓вит.С</td></tr>\n<tr><td>Гормональная (ковалентная)</td><td>фосфорилирование, Т3/Т4</td><td>эстрогены (репрессия)</td></tr>\n</tbody>\n</table></div>\n<p><em>Искл. из общего правила: активна именно в фосфорилир. форме!</em></p>"}, {"num": 26, "title": "Кетоновые тела — синтез, окисление, регуляция", "section": "Раздел 3", "sectionTitle": "Обмен липидов", "explanationHtml": "<p>Кетоновые тела — это альтернативное \"топливо\", которое печень производит из избытка ацетил-КоА (в основном при голодании или интенсивном распаде жиров), чтобы \"поделиться\" энергией с другими тканями.</p>\n<p><strong>Кетоновые тела:</strong> ацетоацетат, β-гидроксибутират, ацетон.</p>\n<p><strong>Биологическое значение:</strong> энергетические субстраты для периферических тканей (миокард, мышцы, корковый слой почек). При длительном голодании становятся источником энергии даже для ЦНС.</p>\n<p><strong>Важнейшая деталь:</strong> печень сама НЕ утилизирует кетоновые тела — она их только производит \"на экспорт\".</p>\n<p><strong>Синтез кетоновых тел (кетогенез)</strong></p>\n<p>Локализация: матрикс митохондрий печени. Субстрат: Ацетил-SKoA (липидного или аминокислотного происхождения, из кетогенных аминокислот).</p>\n<p><strong>3 реакции:</strong></p>\n<ol>\n<li>2 Ацетил-SKoA → Ацетоацетил-SKoA + HSKoA (фермент тиолаза/трансфераза)</li>\n<li>Ацетоацетил-SKoA + Ацетил-SKoA + Н2О → ГМГ-SKoA + HSKoA (фермент ГМГ-КоА-синтетаза)</li>\n<li>ГМГ-SKoA → Ацетоацетат + Ацетил-SKoA (фермент ГМГ-КоА-лиаза)</li>\n</ol>\n<p>Первые два шага идентичны биосинтезу холестерина! Тот же ГМГ-КоА образуется тем же путём. Но дальше — развилка: если следующий фермент редуктаза (тратит НАДФН, восстанавливает) — получится мевалонат → холестерин. Если фермент лиаза (просто разрезает, без восстановления) — получится ацетоацетат → кетоновые тела.</p>\n<p><strong>Судьба ацетоацетата — расходится на 2 пути:</strong></p>\n<ul>\n<li>Восстановление: Ацетоацетат + НАДН+Н+ → β-Гидроксибутират + НАД+ (фермент β-гидроксибутиратдегидрогеназа) — реакция обратима!</li>\n<li>Спонтанное декарбоксилирование (без фермента!): Ацетоацетат → Ацетон + CO2 (именно поэтому у пациентов с диабетическим кетоацидозом изо рта пахнет ацетоном)</li>\n</ul>\n<p><strong>Окисление кетоновых тел (кетолиз)</strong></p>\n<p>Локализация: клетки периферических тканей (миокард, мышцы, почки, мозг при голодании). В печени отсутствует фермент для утилизации.</p>\n<p>Механизм (по сути обратный синтезу): β-гидроксибутират окисляется обратно до ацетоацетата. Дальше ацетоацетат нужно \"активировать\":</p>\n<p>Ацетоацетат + сукцинил-SKoA → Ацетоацетил-SKoA + сукцинат (фермент трансфераза)</p>\n<p>Ацетоацетил-SKoA + HSKoA → 2 молекулы Ацетил-SKoA (фермент тиолаза) → идут в ЦТК</p>\n<p><strong>Энергетический эффект окисления β-гидроксибутирата:</strong></p>\n<p>3 АТФ (от НАДН) + 24 АТФ (от 2 молекул ацетил-КоА через ЦТК) − 1 АТФ (эквивалент, потраченный на активацию) = 26 АТФ</p>\n<p><strong>Регуляция обмена кетоновых тел — 3 пункта координации кетогенеза:</strong></p>\n<ol>\n<li>Уровень свободных жирных кислот (СЖК) в крови: источник — липолиз ТАГ в жировой ткани. Печень захватывает ~30% СЖК. Высокий уровень СЖК → ингибирование ацетил-SKoA-карбоксилазы → ↓малонил-SKoA</li>\n</ol>\n<ol>\n<li>Митохондриальная ацилкарнитинтрансфераза I: малонил-SKoA — отрицательный модулятор этого фермента → когда малонил-КоА мало → снимается блок с фермента → ↑поступление ацил-КоА в матрикс → ↑β-окисление → ↑ацетил-КоА</li>\n</ol>\n<ol>\n<li>Скорость ЦТК (регуляторный фермент — цитратсинтаза): при дефиците углеводов ↓уровень оксалоацетата → ↓синтез цитрата → накопление ацетил-КоА → ↑синтез кетоновых тел (\"жиры сгорают в пламени углеводов\")</li>\n</ol>\n<p><strong>Кетонемия, кетонурия, кетоацидоз:</strong></p>\n<ul>\n<li>Кетонемия — повышение уровня кетоновых тел в крови (норма 0,03-0,2 ммоль/л; при патологии до 16-20 ммоль/л)</li>\n<li>Кетонурия — появление кетоновых тел в моче</li>\n<li>Кетоацидоз — метаболический ацидоз при кетонемии: 90% β-гидроксибутирата находится в ионизированном состоянии → ↑протонов (Н+) → ↓pH крови</li>\n</ul>\n<p><strong>Причины кетозов:</strong></p>\n<ul>\n<li>Непатологические: углеводное голодание, физнагрузка</li>\n<li>Патологические: сахарный диабет, гиперинсулинизм, дефицит глюкокортикоидов, мочекислый диатез у детей</li>\n</ul>\n<p>У пациента с диабетом клетки не могут нормально использовать глюкозу (несмотря на то, что глюкозы в крови много) → активируется липолиз жировой ткани (как при голодании) → много СЖК идёт в печень → высокий СЖК ингибиру
