 75% приходится на аспарагиновую и глутаминовую кислоты</li>\n<li>В относительно бо́льших концентрациях в мозге содержатся цистатион и таурин</li>\n<li>Ароматические аминокислоты особенно важны как предшественники катехоламинов и серотонина</li>\n</ol>\n<p><strong>Синтез цистатиона и таурина</strong></p>\n<p>Цистатион — продукт конденсации гомоцистеина (синтезируется из метионина+АТФ) и серина, при участии фермента цистатионсинтетазы. Содержание цистатиона выше в белом веществе, чем в сером.</p>\n<p>Дефект цистатионсинтетазы → гомоцистинурия (тот же дефект, что разбирали для метионина — симптомы особенно выражены в нервной ткани: эпизодические припадки, тяжёлое умственное отставание у детей).</p>\n<p>Таурин — образуется путём окисления цистеина. Функции:</p>\n<ul>\n<li>Подавляет нейрональную возбудимость (вызывает гиперполяризацию мембраны)</li>\n<li>Подавляет захват и освобождение Ca2+ синаптосомами мозга</li>\n<li>Активирует К+-стимулированное высвобождение норадреналина</li>\n<li>Повышает синтез дофамина и норадреналина</li>\n<li>Оказывает антиконвульсивное действие</li>\n</ul>\n<p>Дефицит таурина клинически проявляется эпилептическими припадками, наследственной атаксией.</p>\n<p><strong>Глиоксилатный цикл (дикарбоксилатный цикл)</strong></p>\n<p>Это анаплеротический путь — путь пополнения промежуточных продуктов ЦТК. Конкретно: путь образования оксалоацетата (ОАА) из ацетил-SKoA, необходимого для возобновления работы цикла Кребса.</p>\n<p>Ключевые ферменты цикла: изоцитратлиаза и малатсинтаза.</p>\n<p>Важная деталь: из промежуточного продукта этого цикла — глиоксилата — образуется глицин.</p>\n<p><strong>Особенности метаболизма белков нервной ткани</strong></p>\n<p>Ключевая уникальная черта: в клетках нервной ткани транскрибируется более 10% уникальных последовательностей ДНК-генома (тогда как в других тканях — всего 2-3%).</p>", "conspectHtml": "<p><strong>44. Транспорт АК, метаболизм АК нервной ткани, цистатион, таурин, глиоксилатный цикл</strong></p>\n<p><strong>Транспорт АК в мозге:</strong> 2 системы (нейтральные / кислые+основные АК). Незаменимые АК — активн. транспорт через γ-глутаминовый цикл (как в кишечнике)</p>\n<p><strong>Особенности метаболизма АК мозга (5):</strong> 1) интенсивный обмен с кровью 2) малый запас АК 3) 75% поступающих АК = асп.+глутам. к-ты 4) ↑цистатион и таурин 5) ароматич. АК → предшественники катехоламинов/серотонина</p>\n<p><strong>Цистатион:</strong> Гомоцистеин(из метионина)+Серин →(цистатионсинтетаза)→ Цистатион (промежут. продукт обмена S-содержащих АК; больше в белом в-ве) Дефект фермента → Гомоцистинурия (фиброз сосудов, припадки, отставание)</p>\n<p><strong>Таурин:</strong> из окисления цистеина. Функции: ↓возбудимость (гиперполяризация), ↓захват Ca2+, ↑высвобождение НА, ↑синтез дофамина/НА, противосудорожный эффект Дефицит: эпиприпадки, атаксия</p>\n<p><strong>Глиоксилатный цикл:</strong> анаплеротический путь (пополнение ОАА из ацетил-КоА для ЦТК) Ферменты: изоцитратлиаза, малатсинтаза Из глиоксилата → глицин</p>\n<p><strong>Белки нервной ткани:</strong> &gt;10% уникальных послед. ДНК транскрибируется (vs 2-3% в др. тканях)</p>"}, {"num": 45, "title": "Метаболический цикл глутаминовой кислоты, образование и обезвреживание аммиака в нервной ткани", "section": "Раздел 5", "sectionTitle": "Биохимия нервной ткани, гормональная регуляция", "explanationHtml": "<p>Глутамат занимает центральное положение в обмене аминокислот мозга.</p>\n<p><strong>Два пути образования глутамата из α-КГ:</strong></p>\n<ol>\n<li>Восстановительное аминирование из NH3 — фермент глутаматдегидрогеназа, кофермент НАДН+Н+ (обратная реакция ГлутаматДГ из вопроса 37, реакция обратима!)</li>\n<li>Трансаминирование — фермент аспартатаминотрансфераза (АсАТ), кофактор пиридоксальфосфат (витамин В6)</li>\n</ol>\n<p><strong>Глутамат используется для:</strong></p>\n<ol>\n<li>Биосинтеза белка</li>\n<li>Образования глутатиона (антиоксидант), глутамина, ГАМК</li>\n</ol>\n<p><strong>Восполнение α-КГ:</strong> убыль α-КГ восполняется за счёт превращения аспарагиновой кислоты в ОАА — метаболит ЦТК (та же логика анаплероза, что и в глиоксилатном цикле).</p>\n<p><strong>ГАМК-шунт</strong> — это специальный обходной путь ЦТК, работающий именно в нервной ткани:</p>\n<p>Глутаминовая кислота под действием фермента глутаматдекарбоксилазы (кофактор — витамин В6) превращается в ГАМК — тормозной медиатор нервной системы. На образование ГАМК расходуется 20% всего глутамата.</p>\n<p><strong>Инактивация ГАМК</strong> идёт путём дезаминирования с образованием янтарного полуальдегида → далее в янтарную кислоту (сукцинат) — которая возвращается прямо в цикл Кребса!</p>\n<p><strong>Схема ГАМК-шунта (упрощённо):</strong></p>\n<p>α-КГ → (трансаминирование, глутамат-ТА) → Глутамат → (глутаматдекарбоксилаза, В6, -СО2) → ГАМК → (ГАМК-трансаминаза) → Янтарный полуальдегид → (НАД+→НАДН+Н+) → Янтарная кислота → возврат в ЦТК</p>\n<p><strong>Образование и обезвреживание аммиака в нервной ткани</strong></p>\n<p>Мозг особенно чувствителен к токсичности аммиака, поэтому здесь работает специфический, \"местный\" механизм обезвреживания — глутаминовый цикл:</p>\n<p>Глутамат + NH3 + АТФ → Глутамин (фермент глутаминсинтетаза) — это основной способ связывания и обезвреживания аммиака именно в мозге (в отличие от печени, где основной путь — синтез мочевины через орнитиновый цикл, которого в нейронах нет!).</p>\n<p>Глутамин — нейтральная, нетоксичная молекула — выходит из мозга в кровь и транспортируется в печень/почки, где уже там высвобождается обратно в глутамат+NH3 (глутаминазой) для дальнейшей утилизации.</p>\n<p>Ключевая логика вопроса: нервная ткань не может сама синтезировать мочевину, поэтому единственный доступный ей способ обезвредить локально образующийся аммиак — \"упаковать\" его в глутамин и экспортировать проблему в печень.</p>", "conspectHtml": "<p><strong>45. Метаболический цикл глутаминовой кислоты, обмен NH3 в нервной ткани</strong></p>\n<p><strong>Образование глутамата из α-КГ (2 пути):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>Фермент</th><th>Кофермент</th></tr></thead>\n<tbody>\n<tr><td>Восстановит. аминирование</td><td>глутаматДГ</td><td>НАДН+Н+</td></tr>\n<tr><td>Трансаминирование</td><td>АсАТ</td><td>пиридоксальфосфат (В6)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Использование глутамата:</strong> синтез белка, глутатион, глутамин, ГАМК</p>\n<p><strong>Восполнение α-КГ:</strong> аспартат → ОАА (анаплероз, как и в глиоксилатном цикле)</p>\n<p><strong>ГАМК-шунт (обходной путь ЦТК):</strong> α-КГ →(трансаминир.)→ Глутамат →(глутаматдекарбоксилаза,В6,-СО2)→ ГАМК →(ГАМК-ТА)→ Янтарный полуальдегид →(+НАД+)→ Сукцинат → обратно в ЦТК</p>\n<p><em>На ГАМК расходуется 20% глутамата</em></p>\n<p><strong>Обезвреживание NH3 в мозге:</strong> Глутамат+NH3+АТФ →(глутаминсинтетаза)→ Глутамин (нетоксичен) → кровь → печень/почки</p>\n<p><em>Мозг НЕ имеет орнитинового цикла → единств. способ — экспорт NH3 в форме глутамина</em></p>"}, {"num": 46, "title": "Особенности метаболизма липидов нервной ткани, лизосомные болезни, миелиновые мембраны", "section": "Раздел 5", "sectionTitle": "Биохимия нервной ткани, гормональная регуляция", "explanationHtml": "<p>Мозг — самая \"жирная\" ткань организма по относительному содержанию липидов, но эти липиды используются совершенно не так, как в других тканях — не как энергетический резерв, а как структурный материал.</p>\n<p><strong>Особенности метаболизма липидов нервной ткани (8 пунктов):</strong></p>\n<ol>\n<li>Очень высокое содержание липидов — до 50% от сухой массы ткани</li>\n<li>В сером веществе 70% всех липидов — фосфолипиды; в белом веществе — 40-45%</li>\n<li>Холестерина — 25% от суммарного содержания всех липидов мозга (около 9 г) — мозг почти не обменивается холестерином с кровью (ГЭБ практически непроницаем для него) — мозг синтезирует его сам</li>\n<li>Мозг и нервная ткань содержат очень мало ТАГ и ЭХС</li>\n<li>Интенсивно синтезируются сфингомиелины, ганглиозиды, цереброзиды</li>\n<li>Мозг обладает высокой способностью синтезировать жирные кислоты — но эти ЖК идут исключительно на синтез ФЛ разных классов, не на резервные жиры. Большое содержание длинноцепочечных полиненасыщенных ЖК (20:4, 22:5, 22:6)</li>\n<li>Активность ферментов β-окисления в нервной ткани очень низкая — поэтому жирные кислоты малоактивно используются мозгом как источник энергии</li>\n<li>В клетках нервной ткани идёт α-окисление жирных кислот (для ЖК длиннее 20 атомов углерода) — этот процесс НЕ связан с синтезом АТФ</li>\n</ol>\n<p><strong>Лизосомные болезни:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Болезнь</th><th>Дефектный фермент</th><th>Накопление</th><th>Клиника</th></tr></thead>\n<tbody>\n<tr><td>Тея-Сакса</td><td>Гексозаминидаза</td><td>Ганглиозиды</td><td>дегенерация НС, отставание, слепота, смерть в раннем возрасте</td></tr>\n<tr><td>Нимана-Пика</td><td>Сфингомиелиназа</td><td>Сфингомиелины</td><td>накопление в мозге/селезёнке/печени, смерть в раннем возрасте</td></tr>\n<tr><td>Фарбера</td><td>Церамидаза</td><td>—</td><td>гепато-/спленомегалия, поражение суставов</td></tr>\n<tr><td>Гоше</td><td>β-Глюкозидаза</td><td>Лактозилцерамид</td><td>относительно долгая жизнь</td></tr>\n<tr><td>Фабри</td><td>α-Галактозидаза</td><td>Глобозид</td><td>относительно долгая жизнь</td></tr>\n<tr><td>Хёрлера (гаргоилизм)</td><td>α-L-Идуронидаза</td><td>Протеогликаны</td><td>изменение черт лица, отставание, слепота, смерть в раннем возрасте</td></tr>\n</tbody>\n</table></div>\n<p><strong>Миелиновые мембраны</strong></p>\n<p>Структура: миелин — это сложная смесь липидов и белков, образующаяся в результате превращения цитоплазматических мембран шванновских клеток (в ЦНС — олигодендроциты).</p>\n<p>Химический состав:</p>\n<ul>\n<li>Содержит 78-80% липидов — больше, чем в любых других мембранах нервной ткани</li>\n<li>Большое количество цереброзидов и цереброзидсульфатов</li>\n<li>В сфинголипидах миелина — много длинноцепочечных ЖК (19-26 атомов углерода)</li>\n<li>Только 1 из 17 жирных кислот миелина является полиненасыщенной — объясняет чрезвычайную стабильность миелиновых оболочек</li>\n<li>Белки миелина — преимущественно основного характера</li>\n</ul>\n<p><strong>Функции миелина (2 пункта):</strong></p>\n<ol>\n<li>Изоляция аксона</li>\n<li>Ускорение проведения нервного импульса (скачкообразная проводимость)</li>\n</ol>\n<p>Миелинизация основных проводящих путей завершается к 7-10 годам.</p>", "conspectHtml": "<p><strong>46. Липиды нервной ткани, лизосомные болезни, миелин</strong></p>\n<p><strong>Особенности липидов мозга (8):</strong></p>\n<ol>\n<li>до 50% сухой массы — липиды</li>\n<li>серое в-во: 70% ФЛ; белое: 40-45% ФЛ</li>\n<li>ХС — 25% от липидов (~9г), мозг синтезирует сам (ГЭБ непроницаем для ХС плазмы)</li>\n<li>мало ТАГ и ЭХС (нет запасания жира)</li>\n<li>↑синтез сфингомиелинов, ганглиозидов, цереброзидов</li>\n<li>↑синтез ЖК → только на ФЛ (не на резерв); много длинноцепоч. ПНЖК (20:4,22:5,22:6)</li>\n<li>↓активность β-окисления → ЖК малоактивны как энергосубстрат</li>\n<li>α-окисление ЖК (&gt;C20), НЕ связано с синтезом АТФ</li>\n</ol>\n<p><strong>Лизосомные болезни:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Болезнь</th><th>Дефект</th><th>Накопление</th></tr></thead>\n<tbody>\n<tr><td>Тея-Сакса</td><td>гексозаминидаза</td><td>ганглиозиды</td></tr>\n<tr><td>Нимана-Пика</td><td>сфингомиелиназа</td><td>сфингомиелины</td></tr>\n<tr><td>Фарбера</td><td>церамидаза</td><td>—</td></tr>\n<tr><td>Гоше</td><td>β-глюкозидаза</td><td>лактозилцерамид</td></tr>\n<tr><td>Фабри</td><td>α-галактозидаза</td><td>глобозид</td></tr>\n<tr><td>Хёрлера</td><td>α-L-идуронидаза</td><td>протеогликаны</td></tr>\n</tbody>\n</table></div>\n<p><strong>Миелин:</strong> Структура: мембраны шванновских клеток (липид+белок) Состав: 78-80% липидов (больше, чем в др. мембранах!), цереброзиды+цереброзидсульфаты, длинноцепоч. ЖК (19-26С), только 1/17 ЖК полиненасыщена → стабильность. Белки — основного характера</p>\n<p>Функции: 1) изоляция аксона 2) скачкообразная проводимость (ускорение импульса)</p>\n<p>Миелинизация завершается к 7-10 годам</p>"}, {"num": 47, "title": "Транспорт глюкозы через ГЭБ, метаболизм углеводов и энергетический обмен нервной ткани", "section": "Раздел 5", "sectionTitle": "Биохимия нервной ткани, гормональная регуляция", "explanationHtml": "<p>Мозг — самый \"прожорливый\" по энергии орган относительно своей массы, и при этом почти полностью зависит от одного-единственного субстрата — глюкозы.</p>\n<p><strong>Механизм транспорта глюкозы через ГЭБ</strong></p>\n<p>Глюкоза попадает в клетки нервной ткани через мембрану только при участии белков-транспортёров ГЛЮТ-1 и ГЛЮТ-3 (вид транспорта — облегчённая диффузия, унипорт), легко преодолевая гематоэнцефалический барьер по градиенту концентрации.</p>\n<p><strong>Особенности метаболизма углеводов нервной ткани:</strong></p>\n<p>Запас гликогена в мозге незначителен — хватает буквально на 5-7 минут работы мозга.</p>\n<p>Глюкоза — основной энергосубстрат мозга:</p>\n<ul>\n<li>85-90% — полностью окисляется до CO2 и H2O</li>\n<li>5% — расходуется в гликолизе с образованием молочной кислоты</li>\n<li>5-7% — используется в других реакциях биосинтеза (в том числе ПФ-путь)</li>\n</ul>\n<p>Основной путь получения энергии — аэробный гликолиз. Если в течение 5 минут кислород не поступает в мозг — наступают необратимые изменения.</p>\n<p>Мозг сам по себе инсулиннезависимая ткань (транспорт глюкозы через ГЛЮТ-1/3 не требует инсулина). НО концентрация и активность самой гексокиназы всё же зависит от инсулина (инсулин стимулирует её синтез).</p>\n<p>Разница между глией и нейронами по изоформам ЛДГ:</p>\n<ul>\n<li>Глиальные клетки: активна ЛДГ5 — реакция сдвинута в сторону молочной кислоты</li>\n<li>Нейроны: активна ЛДГ1 — реакция сдвинута в сторону ПВК</li>\n</ul>\n<p>Это создаёт возможность метаболического сотрудничества между глией и нейронами (\"лактатный челнок астроцит-нейрон\").</p>\n<p>ПФ-путь активно работает в мозге — генерирует НАДФН2 для синтеза липидов.</p>\n<p><strong>Энергетический обмен нервной ткани</strong></p>\n<p>Мозг составляет ~2% массы тела, но потребляет 20-25% всего кислорода организма. Внутри мозга: 67% кислорода расходуют нейроны, 30% — глиальные клетки.</p>\n<p><strong>Почему мозгу нужно так много энергии — 2 главные причины:</strong></p>\n<ol>\n<li>Необходимость непрерывной работы систем активного транспорта — активность Mg2+-зависимой Na+/K+-АТФазы в мозге значительно выше, чем в других тканях</li>\n<li>Необходимость постоянного синтеза медиаторов нервных импульсов</li>\n</ol>\n<p>При голодании — субстратом энергии для мозга могут стать кетоновые тела.</p>\n<p>Макроэрги мозга: АТФ и креатинфосфат синтезируются в больших количествах и сразу расходуются. ГТФ, ЦТФ, УТФ составляют менее 10% от суммы всех макроэргов мозга.</p>", "conspectHtml": "<p><strong>47. Транспорт глюкозы через ГЭБ, метаболизм углеводов и энергетика нервной ткани</strong></p>\n<p><strong>Транспорт глюкозы:</strong> ГЛЮТ-1, ГЛЮТ-3 (облегчённая диффузия, унипорт), по градиенту, легко через ГЭБ</p>\n<p><strong>Особенности метаболизма углеводов:</strong></p>\n<ul>\n<li>Запас гликогена мал → хватает на 5-7 минут работы мозга</li>\n<li>Судьба глюкозы: 85-90% → полное окисление (CO2+H2O); 5% → лактат; 5-7% → биосинтез</li>\n<li>Осн. путь энергии — аэробный гликолиз. Без О2 &gt;5 мин → необратимые изменения</li>\n<li>Мозг инсулиннезависим (транспорт), НО гексокиназа зависит от инсулина (стимулирует синтез)</li>\n<li>ЛДГ5 (глия, →лактат) vs ЛДГ1 (нейроны, →ПВК)</li>\n<li>Активен ПФ-путь → НАДФН2 для синтеза липидов</li>\n</ul>\n<p><strong>Энергетический обмен:</strong></p>\n<ul>\n<li>Мозг = 2% массы тела, но 20-25% потребления О2 всего организма (нейроны 67%, глия 30%)</li>\n<li>Причины высокой потребности: 1) непрерывная работа Na+/K+-АТФазы (мембранный потенциал) 2) постоянный синтез медиаторов</li>\n<li>При голодании: субстрат — кетоновые тела</li>\n<li>Макроэрги: АТФ+креатинфосфат синтезируются и сразу расходуются (ГТФ/ЦТФ/УТФ &lt;10% макроэргов)</li>\n</ul>"}, {"num": 48, "title": "Нейромедиаторы и нейропептиды мозга", "section": "Раздел 5", "sectionTitle": "Биохимия нервной ткани, гормональная регуляция", "explanationHtml": "<p>Разберём главные нейромедиаторы и отдельно нейропептиды.</p>\n<p><strong>Нейромедиаторы</strong> — химические вещества-передатчики нервных импульсов.</p>\n<p><strong>Принцип Дейла:</strong> одна нервная клетка синтезирует только ОДИН тип медиаторного вещества.</p>\n<p><strong>3 критерия принадлежности к нейромедиаторам:</strong></p>\n<ol>\n<li>Синтез в нейроне + содержание в пресинаптических окончаниях</li>\n<li>Высвобождение в синаптическую щель в ответ на импульс</li>\n<li>Действие на специализированные рецепторы постсинаптической клетки</li>\n</ol>\n<p><strong>Таблица 5 главных медиаторов:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Медиатор</th><th>Тип действия</th><th>Синтез</th><th>Функции</th><th>Катаболизм</th></tr></thead>\n<tbody>\n<tr><td>Ацетилхолин</td><td>преим. возбуждающий (реже тормозной)</td><td>Ацетил-SKoA+холин (холинацетилтрансфераза)</td><td>передача импульса в синапсах</td><td>АХЭ (ацетилхолинэстераза) → ацетат+холин</td></tr>\n<tr><td>Норадреналин</td><td>тормозной в коре больших полушарий</td><td>из дофамина (дофамин-β-гидроксилаза)</td><td>медиатор симпатической НС</td><td>МАО, КОМТ</td></tr>\n<tr><td>Дофамин</td><td>ингибирующий (нейроны ствола мозга)</td><td>из ДОФА (ДОФА-декарбоксилаза, В6)</td><td>двигательная активность, эмоции, мотивация</td><td>МАО, КОМТ</td></tr>\n<tr><td>Серотонин</td><td>регуляторный</td><td>из триптофана (триптофан-5-гидроксилаза → декарбоксилаза)</td><td>настроение, сон, аппетит, агрессия</td><td>МАО</td></tr>\n<tr><td>ГАМК</td><td>тормозной медиатор ЦНС</td><td>из глутамата (глутаматдекарбоксилаза, В6)</td><td>торможение ЦНС (↓ГАМК → судороги)</td><td>ГАМК-трансаминаза → янтарный полуальдегид → сукцинат → ЦТК</td></tr>\n</tbody>\n</table></div>\n<p>Катаболизм катехоламинов через МАО+метилирование — здесь появляется конкретное название фермента метилирования — КОМТ (катехол-О-метилтрансфераза).</p>\n<p><strong>Другие важные медиаторы:</strong></p>\n<ul>\n<li>Глутаминовая кислота — основной ВОЗБУЖДАЮЩИЙ медиатор мозга</li>\n<li>Аспарагиновая кислота — возбуждающий медиатор спинномозговых рефлексов</li>\n<li>Глицин, таурин — тормозные медиаторы (глицин — спинной мозг, таурин — головной и спинной мозг)</li>\n<li>Аденозин — седативный, противосудорожный, гипотензивный медиатор; кофеин — его ингибитор (отсюда бодрящий эффект кофеина)</li>\n</ul>\n<p><strong>Нейропептиды (НП)</strong></p>\n<p>Определение: малые и средние пептиды (2-50/60 аминокислотных остатков), образуются путём протеолиза более крупных пептидов-предшественников прямо в нейронах.</p>\n<p>Ключевое функциональное отличие от классических медиаторов: нейропептиды, как правило, сосуществуют и совместно функционируют с \"обычными\" мономолекулярными нейромедиаторами (классические медиаторы — из мелких пузырьков, синтезированных прямо в пресинаптическом окончании, пептиды — из крупных пузырьков, синтезированных в аппарате Гольджи в теле нейрона).</p>\n<p>Механизм действия НП: через рецепторы с G-белками (цАМФ, цГМФ) или через гидролиз фосфоинозитидов с мобилизацией Ca2+.</p>\n<p><strong>Классификация нейропептидов по семействам:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Семейство</th><th>Представители</th><th>Функции</th></tr></thead>\n<tbody>\n<tr><td>Либерины/статины гипоталамуса</td><td>тиреолиберин, кортиколиберин, соматостатин</td><td>регуляция выброса гормонов гипофиза</td></tr>\n<tr><td>Опиоидные пептиды</td><td>энкефалины, эндорфины</td><td>обезболивание, чувство удовлетворения, регуляция эмоций</td></tr>\n<tr><td>АКТГ (кортикотропин)</td><td>—</td><td>стимуляция выделения кортикостероидов, влияние на внимание/память</td></tr>\n<tr><td>Вазопрессин и окситоцин</td><td>—</td><td>АДГ-функция + эмоц. состояние; сокращение матки + лактация</td></tr>\n<tr><td>Панкреатические пептиды</td><td>нейропептид Y</td><td>сужение сосудов, поиск пищи, усиление действия адреналина</td></tr>\n</tbody>\n</table></div>\n<p>β-эндорфин (самый активный из опиоидной группы) вызывает аналгезию, положительное подкрепление, снижает температуру тела, стимулирует иммунитет — эндогенный аналог морфина.</p>", "conspectHtml": "<p><strong>48. Нейромедиаторы и нейропептиды</strong></p>\n<p><strong>Принцип Дейла:</strong> 1 нейрон = 1 тип медиатора</p>\n<p><strong>Критерии медиатора (3):</strong> синтез в нейроне, высвобождение в щель, действие на рецепторы постсин. клетки</p>\n<p><strong>5 главных медиаторов:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Медиатор</th><th>Синтез</th><th>Функция</th><th>Катаболизм</th></tr></thead>\n<tbody>\n<tr><td>Ацетилхолин</td><td>Ацетил-КоА+холин (холинацетилтрансфераза)</td><td>передача импульса</td><td>АХЭ→ацетат+холин</td></tr>\n<tr><td>Норадреналин</td><td>из дофамина (дофамин-β-гидроксилаза)</td><td>симпатич. НС, тормозной в коре</td><td>МАО, КОМТ</td></tr>\n<tr><td>Дофамин</td><td>из ДОФА (декарбоксилаза,В6)</td><td>движение, эмоции, мотивация</td><td>МАО, КОМТ</td></tr>\n<tr><td>Серотонин</td><td>из триптофана (гидроксилаза→декарбоксилаза)</td><td>настроение, сон</td><td>МАО</td></tr>\n<tr><td>ГАМК</td><td>из глутамата (глутаматдекарбоксилаза,В6)</td><td>торможение ЦНС (↓→судороги)</td><td>ГАМК-ТА→сукцинат→ЦТК (ГАМК-шунт)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Другие медиаторы:</strong> Глутамат(возбуждающий, гл.), Асп(возбужд.,спинной мозг), Глицин/Таурин(тормозные), Аденозин(седативный, блокируется кофеином)</p>\n<p><strong>Нейропептиды:</strong> 2-50 АК, из протеолиза предшественников, СОсуществуют с классич. медиаторами (крупные везикулы, синтез в аппарате Гольджи сомы)</p>\n<p>Механизм: G-белки(цАМФ/цГМФ) или Са2+-фосфоинозитидный путь</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Семейство</th><th>Пример</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>Либерины/статины</td><td>тиреолиберин, соматостатин</td><td>регуляция гипофиза</td></tr>\n<tr><td>Опиоидные</td><td>энкефалины, β-эндорфин</td><td>аналгезия, \"эйфория\", иммуностимуляция</td></tr>\n<tr><td>—</td><td>АКТГ</td><td>кортикостероиды, внимание/память</td></tr>\n<tr><td>—</td><td>вазопрессин, окситоцин</td><td>АДГ + сокращение матки/лактация</td></tr>\n</tbody>\n</table></div>"}, {"num": 49, "title": "Иерархический принцип управления эндокринной системой, классификация гормонов, гормоны гипоталамуса и гипофиза", "section": "Раздел 5", "sectionTitle": "Биохимия нервной ткани, гормональная регуляция", "explanationHtml": "<p>Прежде чем разбирать конкретные гормоны по отдельности, важно понять общую архитектуру системы — кто кому подчиняется и по каким принципам.</p>\n<p><strong>Иерархический принцип управления</strong> — строгая подчинённость каждого нижележащего отдела регуляции вышестоящему, по цепочке:</p>\n<p>ЦНС (кора) → нисходящее влияние → Гипоталамус (высший центр эндокринной регуляции) → либерины/статины → Аденогипофиз (передняя доля гипофиза) → тропные гормоны → Периферические эндокринные железы</p>\n<p><strong>Гипоталамус</strong> управляет аденогипофизом через два типа регуляторных веществ:</p>\n<ul>\n<li>Либерины — стимулируют выброс тропных гормонов</li>\n<li>Статины — тормозят выброс тропных гормонов</li>\n</ul>\n<p>Кроме того, гипоталамус сам синтезирует 2 нейрогормона напрямую (не через посредничество аденогипофиза): АДГ (вазопрессин) и окситоцин — они идут в заднюю долю гипофиза (нейрогипофиз), откуда просто секретируются в кровь.</p>\n<p><strong>Важная параллельная ветвь:</strong> гипоталамус — ещё и высший вегетативный центр, оказывающий нисходящее влияние на симпатическую нервную систему (боковые рога спинного мозга, T1-L4). Мозговое вещество надпочечников по сути является \"редуцированным спинальным ганглием\" — поэтому при стимуляции симпатической нервной системы выделяются катехоламины.</p>\n<p><strong>Аденогипофиз</strong> воспринимает изменения концентрации гормонов периферических желёз (по принципу обратной связи) и через свои тропные гормоны:</p>\n<ol>\n<li>Регулирует биосинтез/секрецию гормонов периферических желёз</li>\n<li>Регулирует функциональное состояние отделов нервной системы</li>\n<li>Регулирует функции и метаболизм в клетках-мишенях</li>\n</ol>\n<p><strong>Тропные гормоны аденогипофиза (передней доли):</strong> ФСГ, ЛГ, пролактин, АКТГ, тиреотропин (ТТГ), соматотропин (СТГ), меланоцитостимулирующий гормон.</p>\n<p><strong>Дополнительные уровни регуляции:</strong></p>\n<ul>\n<li>Аутокринная регуляция — гормон действует на те же клетки, которые его секретировали</li>\n<li>Паракринная регуляция — гормон воздействует на соседние клетки других типов</li>\n</ul>\n<p><strong>Классификация гормонов по химическому строению (3 класса):</strong></p>\n<ol>\n<li>Белково-пептидной природы — гормоны передней/задней доли гипофиза, поджелудочной железы (инсулин, глюкагон)</li>\n<li>Производные аминокислот — адреналин, норадреналин (из тирозина), Т3, Т4</li>\n<li>Стероидные (синтезируются из холестерина) — кортизол, альдостерон, половые гормоны, гормоны плаценты</li>\n</ol>\n<p><strong>Классификация гормонов по биологическим функциям (4 группы):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Группа</th><th>Функция</th><th>Примеры</th></tr></thead>\n<tbody>\n<tr><td>А</td><td>метаболизм углеводов/АК/липидов</td><td>инсулин, глюкагон</td></tr>\n<tr><td>Б</td><td>водно-солевой обмен</td><td>ПНФ, вазопрессин, альдостерон</td></tr>\n<tr><td>В</td><td>обмен фосфора и кальция</td><td>кальцитонин, кальцитриол, паратгормон</td></tr>\n<tr><td>Г</td><td>регуляция других эндокринных желёз</td><td>тиреотропин, АКТГ</td></tr>\n</tbody>\n</table></div>\n<p><strong>Гормоны гипоталамуса — примеры:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Гормон</th><th>Природа</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>Тиреолиберин</td><td>трипептид</td><td>стимулирует ТТГ (через цАМФ, инозитол-3-фосфат)</td></tr>\n<tr><td>Кортиколиберин</td><td>полипептид (41 АК)</td><td>стимулирует АКТГ (те же вторичные посредники)</td></tr>\n</tbody>\n</table></div>", "conspectHtml": "<p><strong>49. Иерархия эндокринной системы, классификация гормонов, гипоталамус/гипофиз</strong></p>\n<p><strong>Иерархия:</strong> ЦНС → Гипоталамус (высший центр) → либерины(+)/статины(−) → Аденогипофиз → тропные гормоны → периферические железы</p>\n<p>Гипоталамус сам синтезирует: АДГ + окситоцин (напрямую, через нейрогипофиз)</p>\n<p>Гипоталамус также — высший вегетативный центр → симпатика (боковые рога сп.мозга T1-L4) → мозговое в-во надпочечников (=редуцир. симпат. ганглий) → катехоламины</p>\n<p><strong>Тропные гормоны аденогипофиза:</strong> ФСГ, ЛГ, пролактин, АКТГ, ТТГ, СТГ, МСГ</p>\n<p><strong>Доп. уровни:</strong> аутокринная (на себя) / паракринная (на соседей) регуляция</p>\n<p><strong>Классиф. по химич. строению (3 класса):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Класс</th><th>Примеры</th></tr></thead>\n<tbody>\n<tr><td>Белково-пептидные</td><td>гипофиз, инсулин, глюкагон</td></tr>\n<tr><td>Производные АК</td><td>адреналин, НА, Т3/Т4</td></tr>\n<tr><td>Стероидные (из ХС)</td><td>кортизол, альдостерон, половые</td></tr>\n</tbody>\n</table></div>\n<p><strong>Классиф. по функции (4 группы):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Группа</th><th>Функция</th><th>Пример</th></tr></thead>\n<tbody>\n<tr><td>А</td><td>углеводы/АК/липиды</td><td>инсулин, глюкагон</td></tr>\n<tr><td>Б</td><td>водно-солевой обмен</td><td>ПНФ, вазопрессин, альдостерон</td></tr>\n<tr><td>В</td><td>Ca/P обмен</td><td>кальцитонин, кальцитриол, ПТГ</td></tr>\n<tr><td>Г</td><td>регуляция желёз</td><td>тиреотропин, АКТГ</td></tr>\n</tbody>\n</table></div>\n<p><strong>Гормоны гипоталамуса:</strong> тиреолиберин(трипептид)→стимул. ТТГ; кортиколиберин(41АК)→стимул. АКТГ (мех-зм: цАМФ, инозитол-3-фосфат)</p>"}, {"num": 50, "title": "Инсулин", "section": "Раздел 5", "sectionTitle": "Биохимия нервной ткани, гормональная регуляция", "explanationHtml": "<p>Начинаем разбор конкретных гормонов, начиная с самого известного — инсулина.</p>\n<p><strong>Химическая природа:</strong> белково-пептидная. Инсулин состоит из 2 полипептидных цепей: α-цепь (21 аминокислота) и β-цепь (30 аминокислот), соединённых 2 дисульфидными мостиками.</p>\n<p><strong>Схема синтеза (пошагово):</strong></p>\n<ol>\n<li>На рибосомах шероховатого ЭПР синтезируется препроинсулин</li>\n<li>В цистернах ШЭР — частичный протеолиз → образуется проинсулин: β-цепь–С-пептид–α-цепь</li>\n<li>Между α- и β-цепями образуются дисульфидные связи. Проинсулин транспортируется в аппарат Гольджи</li>\n<li>В аппарате Гольджи — протеолиз проинсулина (отщепление С-пептида) → образуется зрелый инсулин</li>\n<li>Инсулин соединяется с Zn2+ и накапливается в секреторных гранулах вместе с амилином и С-пептидом (содержание инсулина и С-пептида в гранулах эквимолярно — то есть 1:1!)</li>\n</ol>\n<p><strong>Клиническая деталь про С-пептид:</strong> измерение уровня С-пептида в крови используется как маркер собственной секреции инсулина поджелудочной железой.</p>\n<p>Амилин — пептид из 37 АК, тоже вырабатывается β-клетками, снижает чувствительность β-клеток к глюкозе.</p>\n<p><strong>Регуляция синтеза и секреции:</strong></p>\n<p>Метаболическая: повышение глюкозы в крови стимулирует секрецию инсулина — в 2 фазы:</p>\n<ul>\n<li>I фаза — выброс уже готового, ранее синтезированного инсулина (быстрый ответ)</li>\n<li>II фаза — секреция инсулина, синтезированного заново (более медленный, но длительный ответ)</li>\n</ul>\n<p>Гормональная:</p>\n<ul>\n<li>Стимулируют: соматотропин, гормоны ЖКТ, эстрогены</li>\n<li>Ингибируют: адреналин и соматостатин</li>\n</ul>\n<p><strong>Механизм торможения адреналином:</strong> адреналин фосфорилирует β-субъединицу рецептора инсулина по серину и треонину → рецептор меняет конформацию → переходит в неактивную форму.</p>\n<p><strong>Механизм действия:</strong></p>\n<p>Рецептор инсулина — это фермент тирозинкиназа. В покое рецептор — 2 отдельных димера (α+β субъединицы). Присоединение инсулина к α-субъединице → объединение в единый тетрамерный комплекс → β-субъединицы приобретают тирозинкиназную активность → аутофосфорилирование → фосфорилированная β-субъединица присоединяет и фосфорилирует белки-адаптеры.</p>\n<p><strong>Два параллельных пути передачи сигнала:</strong></p>\n<p>Путь 1 (медленные эффекты): активация белка RAS → MAPK → факторы транскрипции → синтез белков, рост и пролиферация клеток</p>\n<p>Путь 2 (быстрые и очень быстрые эффекты): активация фосфоинозитол-3-киназы → фосфоинозитол-3,4,5-трифосфат → активация протеинкиназы → фосфорилирование:</p>\n<ul>\n<li>ГЛЮТ-4 (встраивание в мембрану → транспорт глюкозы внутрь клетки)</li>\n<li>фосфодиэстеразы (разрушает цАМФ)</li>\n<li>протеинфосфатазы (дефосфорилирует ферменты синтеза гликогена и гликолиза → активирует их)</li>\n</ul>\n<p><strong>Судьба гормона:</strong> циркулирует в крови около 10 минут, затем распадается в печени/почках под действием фермента инсулиназы (Zn-содержащий, гидролизует также и глюкагон).</p>\n<p><strong>Дополнительный эффект инсулина на ионный обмен:</strong> активирует Na+/K+-АТФазу и ингибирует Ca2+-АТФазу.</p>\n<p><strong>Органы-мишени:</strong> все ткани организма, КРОМЕ нервной. ГЛЮТ-4 (инсулин-зависимый транспортёр) характерен именно для скелетных мышц, сердечной мышцы, жировой ткани.</p>", "conspectHtml": "<p><strong>50. Инсулин</strong></p>\n<p><strong>Природа:</strong> белково-пептидная, α-цепь(21АК)+β-цепь(30АК), 2 дисульфидных мостика</p>\n<p><strong>Синтез:</strong> Препроинсулин →(ШЭР, протеолиз)→ Проинсулин(β-С-пептид-α) → (Гольджи, отщепление С-пептида) → Инсулин + С-пептид (в гранулах +Zn2+ +амилин, инсулин:С-пептид = 1:1)</p>\n<p><strong>Регуляция:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Стимул</th><th>Ингиб.</th></tr></thead>\n<tbody>\n<tr><td>Метаболич.</td><td>↑глюкоза (2 фазы: I-готовый, II-новосинтез.)</td><td>—</td></tr>\n<tr><td>Гормон.</td><td>соматотропин, гормоны ЖКТ, эстрогены</td><td>адреналин, соматостатин</td></tr>\n</tbody>\n</table></div>\n<p><em>Адреналин: фосфорилир. β-субъединицы рецептора (Ser/Thr) → неактивн. форма</em></p>\n<p><strong>Механизм действия:</strong> рецептор = тирозинкиназа. Инсулин→димеры объедин.→аутофосфорилирование β-субъед.→адапторные белки</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>Каскад</th><th>Эффект</th></tr></thead>\n<tbody>\n<tr><td>1 (медл.)</td><td>RAS→MAPK→транскрипция</td><td>синтез белков, рост клеток</td></tr>\n<tr><td>2 (быстр.)</td><td>ФИ-3-киназа→ФИ-3,4,5-трифосфат→протеинкиназа</td><td>фосфорилир. ГЛЮТ-4(транспорт глю), фосфодиэстеразы(↓цАМФ), протеинфосфатазы(↑гликоген/гликолиз)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Доп. эффект:</strong> ↑Na+/K+-АТФаза, ↓Ca2+-АТФаза</p>\n<p><strong>Судьба:</strong> 10 мин в крови → распад в печени/почках (инсулиназа, Zn-фермент)</p>\n<p><strong>Мишени:</strong> все ткани КРОМЕ нервной. ГЛЮТ-4 — мышцы, жир. ткань, сердце</p>"}, {"num": 51, "title": "Глюкагон", "section": "Раздел 5", "sectionTitle": "Биохимия нервной ткани, гормональная регуляция", "explanationHtml": "<p>Глюкагон — функциональный антагонист инсулина (контринсулярный гормон).</p>\n<p><strong>Химическая природа:</strong> белково-пептидная, состоит из 29 аминокислот.</p>\n<p><strong>Место синтеза — два источника:</strong></p>\n<ul>\n<li>α-клетки поджелудочной железы (основной источник)</li>\n<li>Нейроэндокринные клетки кишечника (кишечный глюкагон)</li>\n</ul>\n<p><strong>Схема синтеза:</strong> проглюкагон (37 АК) → частичный протеолиз → глюкагон (29 АК).</p>\n<p><strong>Регуляция синтеза и секреции:</strong></p>\n<p>Метаболическая:</p>\n<ul>\n<li>↓глюкозы в крови стимулирует секрецию глюкагона</li>\n<li>↑аланина в крови тоже стимулирует секрецию — помнишь глюкозо-аланиновый цикл? Аланин, приходящий из мышц, не только несёт азот на утилизацию, но и сам является сигналом для глюкагона, чтобы запустить глюконеогенез именно из этого же аланина</li>\n</ul>\n<p>Гормональная:</p>\n<ul>\n<li>Соматостатин — ингибирует синтез и секрецию глюкагона</li>\n<li>GLP-1 (глюкагоноподобный пептид-1, из кишечника) — ингибирует секрецию глюкагона и стимулирует синтез инсулина</li>\n<li>ЖИП (желудочный ингибирующий полипептид) стимулирует синтез GLP-1</li>\n</ul>\n<p><strong>Механизм действия:</strong> мембранно-внутриклеточный, вторичный посредник — цАМФ.</p>\n<p><strong>Органы-мишени:</strong> печень и жировая ткань (на мышечную ткань почти не влияет).</p>\n<p><strong>Биологические эффекты (повышает глюкозу крови):</strong></p>\n<p>В печени:</p>\n<ul>\n<li>Активирует гликогенфосфорилазу → распад гликогена → глюкоза в кровь</li>\n<li>Активирует ТАГ-липазу → распад ТАГ → ВЖК+глицерин</li>\n<li>Активирует глюконеогенез (из АК, из глицерина)</li>\n<li>Ингибирует гликолиз</li>\n</ul>\n<p>В жировой ткани:</p>\n<ul>\n<li>Активирует ТАГ-липазу → липолиз → ВЖК в кровь → доставляются в мышцы, сердце для окисления</li>\n</ul>", "conspectHtml": "<p><strong>51. Глюкагон</strong></p>\n<p><strong>Природа:</strong> белково-пептидная, 29 АК</p>\n<p><strong>Синтез:</strong> α-клетки ПЖ (+кишечный глюкагон): Проглюкагон(37АК) →(протеолиз)→ Глюкагон(29АК)</p>\n<p><strong>Регуляция:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Стимул</th><th>Ингиб.</th></tr></thead>\n<tbody>\n<tr><td>Метаболич.</td><td>↓глюкоза, ↑аланин</td><td>—</td></tr>\n<tr><td>Гормон.</td><td>—</td><td>соматостатин, GLP-1(+стимулирует инсулин)</td></tr>\n</tbody>\n</table></div>\n<p><em>ЖИП → стимулирует GLP-1</em></p>\n<p><strong>Механизм действия:</strong> мембранно-внутриклеточный, вторичный посредник — цАМФ</p>\n<p><strong>Мишени:</strong> печень + жировая ткань (НЕ мышцы!)</p>\n<p><strong>Эффекты (↑глюкозы крови):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Ткань</th><th>Действие</th></tr></thead>\n<tbody>\n<tr><td>Печень</td><td>↑гликогенфосфорилаза(распад гликогена), ↑ТАГ-липаза, ↑глюконеогенез, ↓гликолиз</td></tr>\n<tr><td>Жир.ткань</td><td>↑ТАГ-липаза → липолиз → ВЖК в кровь (мышцы/сердце)</td></tr>\n</tbody>\n</table></div>\n<p><em>Логика: гормон \"мобилизации запасов\" — противоположность инсулину</em></p>"}, {"num": 52, "title": "Адреналин", "section": "Раздел 5", "sectionTitle": "Биохимия нервной ткани, гормональная регуляция", "explanationHtml": "<p>Адреналин — гормон немедленной мобилизации (\"бей или беги\").</p>\n<p><strong>Химическая природа:</strong> производное аминокислоты тирозина (катехоламин).</p>\n<p><strong>Место синтеза (3 источника):</strong></p>\n<ul>\n<li>Мозговое вещество надпочечников (хромаффинные клетки) — 80% адреналина, 20% норадреналина</li>\n<li>Нейроэпителиальные клетки кишечника (APUD-система)</li>\n<li>Нейроны симпатического отдела автономной нервной системы</li>\n</ul>\n<p><strong>Схема синтеза:</strong></p>\n<p>Тирозин →(тирозингидроксилаза, регуляторный фермент)→ ДОФА →(ДОФА-декарбоксилаза, В6)→ Дофамин →(дофамин-β-гидроксилаза)→ Норадреналин →(метилирование, SAM)→ Адреналин</p>\n<p><strong>Регуляция синтеза и секреции:</strong></p>\n<p>Главный регуляторный фермент — тирозингидроксилаза: активна в фосфорилированной форме, неактивна в дефосфорилированной. Это ещё одно исключение из общего правила про фосфорилирование.</p>\n<p>Норадреналин активирует фосфорилирование этого фермента — то есть сам продукт пути стимулирует свой собственный синтез (положительная обратная связь).</p>\n<p>Быстрая vs медленная регуляция:</p>\n<ul>\n<li>Быстрая — за счёт выброса уже готового норадреналина при стимуляции нервной системой</li>\n<li>Медленная — норадреналин стимулирует гены, ответственные за синтез самой тирозингидроксилазы</li>\n</ul>\n<p><strong>Механизм действия:</strong> мембранно-внутриклеточный. Два вторичных посредника в зависимости от типа рецептора:</p>\n<ul>\n<li>цАМФ — через α2, β1, β2-рецепторы</li>\n<li>Инозитол-3-фосфат + ДАГ — через α1-рецепторы</li>\n</ul>\n<p><strong>Разница между адреналином и норадреналином по рецепторам:</strong></p>\n<ul>\n<li>Норадреналин: в больших концентрациях действует через α1 → вазоконстрикция; в малых концентрациях через β2 → вазодилатация</li>\n<li>Адреналин: возбуждает оба типа рецепторов примерно одинаково</li>\n</ul>\n<p><strong>Органы-мишени:</strong> практически все ткани — сердце, сосуды, мышцы, лёгкие, печень, жировая ткань.</p>\n<p><strong>Влияние адреналина на метаболизм в органах-мишенях:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Ткань</th><th>Эффект</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Печень</td><td>↑распад гликогена, ↑глюконеогенез</td><td>активация фосфорилазы, индукция ферментов</td></tr>\n<tr><td>Жировая ткань</td><td>↑липолиз</td><td>активация ТАГ-липазы → ↑ВЖК в крови (топливо для миокарда)</td></tr>\n<tr><td>Скелетные мышцы</td><td>↓синтез белка, ↑протеолиз, ↓поглощение глюкозы</td><td>↓РНК-полимеразы; сбережение глюкозы для нервной ткани</td></tr>\n<tr><td>Сердце</td><td>↑окисление ВЖК</td><td>β-окисление → АТФ</td></tr>\n</tbody>\n</table></div>\n<p>Адреналин специально снижает поглощение глюкозы мышцами, потому что приоритет отдаётся мозгу — единственной ткани, критически зависящей именно от глюкозы. Мышцы в этот момент переключаются на ВЖК как топливо, освобождая глюкозу для мозга.</p>\n<p><strong>Общие физиологические эффекты:</strong> ↑ЧСС, ↑АД (зависит от типа рецептора в конкретном сосуде), расширение бронхов, ↑глюкозы крови.</p>\n<p><strong>Гормональные механизмы реализации стресса:</strong></p>\n<ol>\n<li>Быстрая ветвь: активация симпато-адреналовой системы → выброс катехоламинов → немедленная мобилизация энергетических ресурсов</li>\n<li>Медленная ветвь (для длительной адаптации): активация гипоталамо-гипофизарно-надпочечниковой системы → кортиколиберин → АКТГ → кортизол → поддерживает длительный глюконеогенез и катаболизм белков</li>\n</ol>", "conspectHtml": "<p><strong>52. Адреналин</strong></p>\n<p><strong>Природа:</strong> производное тирозина (катехоламин)</p>\n<p><strong>Синтез:</strong> мозговое в-во надпочечников (80% адреналин/20% НА), кишечник(APUD), симпатич. нейроны Тирозин →(тирозингидроксилаза,регулят.)→ ДОФА →(декарбоксилаза,В6)→ Дофамин →(β-гидроксилаза)→ НА →(метилир.,SAM)→ Адреналин</p>\n<p><strong>Регуляция:</strong> тирозингидроксилаза активна фосфорилированная (искл. из общего правила!). НА активирует своё же фосфорилирование (полож. обр. связь)</p>\n<p><strong>Механизм:</strong> мембранно-внутриклеточный</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Рецептор</th><th>Вторич. посредник</th></tr></thead>\n<tbody>\n<tr><td>α2,β1,β2</td><td>цАМФ</td></tr>\n<tr><td>α1</td><td>инозитол-3-Ф+ДАГ</td></tr>\n</tbody>\n</table></div>\n<p><strong>НА vs Адреналин:</strong> НА(много)→α1→вазоконстрикция; НА(мало)→β2→вазодилатация. Адреналин — оба типа рецепторов равномерно</p>\n<p><strong>Эффекты на ткани:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Ткань</th><th>Эффект</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Печень</td><td>↑гликогенолиз, ↑глюконеогенез</td><td>активация фосфорилазы</td></tr>\n<tr><td>Жир. ткань</td><td>↑липолиз</td><td>ТАГ-липаза</td></tr>\n<tr><td>Мышцы</td><td>↓синтез белка, ↑протеолиз, ↓поглощение глюкозы</td><td>сбережение глюкозы для мозга</td></tr>\n<tr><td>Сердце</td><td>↑окисление ВЖК</td><td>β-окисление</td></tr>\n</tbody>\n</table></div>\n<p><strong>Стресс (2 ветви):</strong></p>\n<ol>\n<li>Быстрая: симпато-адреналовая → катехоламины (секунды-минуты)</li>\n<li>Медленная: гипоталамус→АКТГ→кортизол (часы-дни, длит. адаптация)</li>\n</ol>"}, {"num": 53, "title": "Кортизол, гормоны половых желёз", "section": "Раздел 5", "sectionTitle": "Биохимия нервной ткани, гормональная регуляция", "explanationHtml": "<p>Кортизол — главный глюкокортикоид, \"гормон долгой адаптации\".</p>\n<p><strong>Химическая природа:</strong> стероидная (из холестерина).</p>\n<p><strong>Место синтеза:</strong> корковое вещество надпочечника, пучковая зона.</p>\n<p><strong>Схема синтеза:</strong> ХС → Прегненолон → 17-ОН-прегненолон → Прогестерон → Кортизол (а также, по параллельной ветви от прегненолона — Кортикостерон, слабый глюкокортикоид, ~5% активности).</p>\n<p><strong>Регуляция синтеза и секреции (гипоталамо-гипофизарно-надпочечниковая ось):</strong></p>\n<p>Стимул (гипогликемия, гипоксия, боль) → гипоталамус → кортиколиберин → аденогипофиз → АКТГ → кора надпочечника (пучковая зона) → кортизол</p>\n<p>Отрицательная обратная связь: ↑кортизола → ↓кортиколиберина и ↓АКТГ.</p>\n<p>Суточный ритм: наименьший уровень — в конце дня и перед сном; наибольший — в 6-8 утра.</p>\n<p><strong>АКТГ:</strong> синтезируется из общего белка-предшественника проопиомеланокортина, из которого путём частичного протеолиза образуется также и меланоцитостимулирующий гормон (МСГ). Это объясняет клинически важный феномен — при недостаточности коры надпочечников избыточный АКТГ \"тянет за собой\" и избыток МСГ → гиперпигментация кожи.</p>\n<p><strong>Механизм действия:</strong> внутриклеточный (цитозольный). Транспортируется в крови в комплексе с транскортином и альбумином (~5% в свободной форме).</p>\n<p><strong>Органы-мишени — разное действие в зависимости от ткани:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Действие</th><th>Ткань</th></tr></thead>\n<tbody>\n<tr><td>Анаболическое</td><td>печень</td></tr>\n<tr><td>Катаболическое</td><td>кожа, соединительная ткань, кости, жировая ткань, лимфоидная ткань</td></tr>\n</tbody>\n</table></div>\n<p><strong>Биологические эффекты (детально по тканям):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Ткань</th><th>Эффект</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Печень</td><td>↑глюконеогенез</td><td>индукция АлАТ, АсАТ, ФЕП-карбоксилазы; ↑гликогенсинтазы</td></tr>\n<tr><td>Печень</td><td>↑синтез белков и НК</td><td>стимуляция транскрипции</td></tr>\n<tr><td>Мышцы, лимфоидная, жировая ткань, кожа, кости</td><td>↓синтез белков, ↑распад белков до АК</td><td>торможение транскрипции, ↑протеолиза</td></tr>\n<tr><td>Жировая ткань</td><td>↑липогенез (туловище, лицо); ↑липолиз (конечности)</td><td>усиление липолитич. действия катехоламинов и гормона роста</td></tr>\n<tr><td>Общий эффект</td><td>↓потребление глюкозы периферич. тканями</td><td>экономия глюкозы</td></tr>\n</tbody>\n</table></div>\n<p><strong>Гипофункция коры надпочечников (болезнь Аддисона):</strong></p>\n<ul>\n<li>Причина: первичная недостаточность коры надпочечников</li>\n<li>Проявления: гиперпигментация кожи (\"бронзовая болезнь\"), гипогликемия, мышечная слабость</li>\n</ul>\n<p><strong>Гиперфункция (синдром Иценко-Кушинга):</strong></p>\n<ul>\n<li>Причина: аденома гипофиза (↑АКТГ), карцинома надпочечников, длительное лекарственное применение глюкокортикоидов</li>\n<li>Проявления: ↑массы тела (лунообразное лицо + истончённые конечности), гипергликемия, остеопороз, истончение кожи, мышечная атрофия, плохое заживление ран</li>\n</ul>\n<p><strong>Гормоны половых желёз (кратко):</strong></p>\n<p>В мужском организме: ЛГ аденогипофиза → клетки Лейдига → синтез тестостерона → секретируется в кровь → в клетках Сертоли восстанавливается до дигидротестостерона (биологическая активность в 10 раз выше, чем у тестостерона!). Синтез тестостерона в клетках Сертоли контролируется ФСГ.</p>", "conspectHtml": "<p><strong>53. Кортизол, гормоны половых желёз</strong></p>\n<p><strong>Природа:</strong> стероидная (из ХС). Место: кора надпочечника, пучковая зона</p>\n<p><strong>Синтез:</strong> ХС→Прегненолон→17-ОН-прегненолон→Прогестерон→Кортизол (+ветвь →Кортикостерон, слабый, 5%)</p>\n<p><strong>Регуляция (ГГН-ось):</strong> стимул(гипогликемия,гипоксия,боль)→гипоталамус→кортиколиберин→АКТГ→кортизол Обратная связь: ↑кортизол → ↓кортиколиберин/АКТГ Суточн. ритм: max 6-8 утра, min вечером</p>\n<p><em>АКТГ из проопиомеланокортина → тот же предшественник, что и МСГ!</em></p>\n<p><strong>Механизм:</strong> внутриклеточный (цитозольный), транспорт — транскортин+альбумин</p>\n<p><strong>Эффекты:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Ткань</th><th>Действие</th><th>Эффект</th></tr></thead>\n<tbody>\n<tr><td>Печень</td><td>Анаболич.</td><td>↑глюконеогенез, ↑синтез белков/НК</td></tr>\n<tr><td>Мышцы,лимф.,жир.,кожа,кости</td><td>Катаболич.</td><td>↓синтез белков, ↑протеолиз</td></tr>\n<tr><td>Жир.ткань</td><td>смешанно</td><td>↑липогенез(туловище/лицо), ↑липолиз(конечности)</td></tr>\n<tr><td>Общий</td><td>—</td><td>↓потребление глюкозы на периферии (экономия для мозга)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Гипофункция (Аддисон):</strong> гиперпигментация(МСГ↑), гипогликемия, слабость <strong>Гиперфункция (Иценко-Кушинг):</strong> лунообразн. лицо+тонкие конечности, гипергликемия, остеопороз, истончение кожи</p>\n<p><strong>Половые гормоны (из ХС):</strong> ЛГ→клетки Лейдига→Тестостерон→(в кл.Сертоли)→Дигидротестостерон (10× активнее!). Синтез в Сертоли контролирует ФСГ</p>"}, {"num": 54, "title": "Биохимические механизмы возникновения симптомов сахарного диабета, пути метаболизма глюкозы, лабораторная диагностика", "section": "Раздел 5", "sectionTitle": "Биохимия нервной ткани, гормональная регуляция", "explanationHtml": "<p>Это один из самых практически важных вопросов — здесь сходятся почти все темы, которые разобрали ранее.</p>\n<p><strong>Сахарный диабет (СД)</strong> — заболевание вследствие абсолютного или относительного дефицита инсулина.</p>\n<p><strong>Формы СД:</strong></p>\n<ul>\n<li>СД I типа (инсулинзависимый): разрушение β-клеток островков Лангерганса (аутоиммунные реакции, β-цитотропные вирусы, токсины, генетический дефект) → абсолютный дефицит инсулина</li>\n<li>СД II типа (инсулиннезависимый): относительный дефицит (нарушение секреции, нарушение превращения проинсулина→инсулин, ↑катаболизм инсулина, дефект рецептора, антитела к рецептору, мутации генов)</li>\n</ul>\n<p><strong>Общая логика:</strong> при СД соотношение инсулин/глюкагон снижено.</p>\n<p><strong>Биохимические механизмы симптомов:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Симптом</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Гипергликемия</td><td>↓использования глюкозы тканями (↓ГЛЮТ-4 на мембранах); стимуляция выброса глюкагона и кортизола</td></tr>\n<tr><td>Глюкозурия</td><td>гипергликемия превышает почечный порог реабсорбции → глюкоза выводится с мочой</td></tr>\n<tr><td>Полиурия, жажда</td><td>глюкоза в канальцах связывает воду (осмотический эффект) → потеря воды и солей (особенно K+)</td></tr>\n<tr><td>↑Липолиз, ↑ВЖК</td><td>↓инсулина → ↑ТАГ-липазы → ВЖК в кровь</td></tr>\n<tr><td>Кетонемия, кетоацидоз</td><td>ВЖК→β-окисление→↑ацетил-КоА → при дефиците ОАА (из-за нехватки глюкозы!) → синтез кетоновых тел (\"жиры сгорают в пламени углеводов\")</td></tr>\n<tr><td>Гиперхолестеринемия, атеросклероз</td><td>↑ацетил-КоА → ↑синтеза ХС; ↓ЛПВП (нарушение синтеза белков); гликозилирование ЛПНП</td></tr>\n<tr><td>Отрицательный азотистый баланс</td><td>↑кортизола → распад белков → АК → дезаминирование → ↑мочевины</td></tr>\n<tr><td>Плохое заживление ран, инфекции</td><td>гликозилирование белков (нарушает их нормальную функцию)</td></tr>\n<tr><td>Нарушение микроциркуляции</td><td>↓NO• (гликозилирование NO-синтазы)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Пути метаболизма глюкозы при сахарном диабете — 4 пути:</strong></p>\n<ol>\n<li>Гликолиз — сам процесс не изменён биохимически, но глюкоза физически не может попасть в клетки (нет ГЛЮТ-4 на мембране без инсулина)</li>\n</ol>\n<ol>\n<li>Полиольный путь — активируется именно при СД: Глюкоза → Сорбитол (фермент альдозоредуктаза, +НАДФН+Н+) → Фруктоза → Фр-1-фосфат → ПВК</li>\n</ol>\n<p>Сорбитол плохо диффундирует из клеток, накапливается в сетчатке, хрусталике, клубочках почек, шванновских клетках, эндотелии → осмотическое повреждение (набухание клеток) → прямой механизм диабетической ретинопатии, катаракты, нейропатии!</p>\n<ol>\n<li>Гексозаминовый путь — активируется при СД: Глюкоза → глюкозамин-6-фосфат → УДФ-N-ацетилглюкозамин → окислительное гликозилирование белков (утрата функции)</li>\n</ol>\n<ol>\n<li>AGE-путь (неферментативное гликозилирование) — глюкоза напрямую (без ферментов!) реагирует с NH2-группами белков → продукт Амадори (фруктоза в составе белка) → практически необратимо → нарушение функции белков, ↓NO•, нарушение микроциркуляции</li>\n</ol>\n<p>Это тот самый механизм гликозилирования ЛПНП.</p>\n<p><strong>Лабораторная диагностика сахарного диабета:</strong></p>\n<ol>\n<li>Глюкоза в плазме натощак — норма 3,5-6,0 г/л (выше — СД)</li>\n<li>Глюкоза в моче — в норме отсутствует, появление = глюкозурия</li>\n<li>Тест толерантности к глюкозе (сахарная нагрузка): глюкоза натощак → приём 75г глюкозы → измерение каждый час 3 часа → повышение выше 10 ммоль/л через 2 часа = СД</li>\n</ol>", "conspectHtml": "<p><strong>54. Механизмы симптомов СД, метаболизм глюкозы, диагностика</strong></p>\n<p><strong>Формы:</strong> СД I (аутоиммунное разрушение β-клеток, абсолютный дефицит) / СД II (относительный дефицит — рецептор, секреция, антитела)</p>\n<p><strong>Общее:</strong> ↓соотношение инсулин/глюкагон</p>\n<p><strong>Механизмы симптомов:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Симптом</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Гипергликемия</td><td>↓ГЛЮТ-4, ↑контринсулярные гормоны</td></tr>\n<tr><td>Глюкозурия</td><td>превышен почечный порог</td></tr>\n<tr><td>Полиурия/жажда</td><td>осмотич. эффект глюкозы в канальцах, потеря K+</td></tr>\n<tr><td>↑ВЖК</td><td>↓инсулин→↑ТАГ-липаза</td></tr>\n<tr><td>Кетоацидоз</td><td>↑ацетил-КоА при дефиците ОАА → кетогенез</td></tr>\n<tr><td>↑ХС, атеросклероз</td><td>↑ацетил-КоА→ХС; ↓ЛПВП; гликозилир. ЛПНП</td></tr>\n<tr><td>Отрицат. азот. баланс</td><td>↑кортизол→протеолиз→мочевина</td></tr>\n<tr><td>Плохое заживление</td><td>гликозилирование белков</td></tr>\n<tr><td>↓Микроциркуляция</td><td>гликозилирование NO-синтазы→↓NO•</td></tr>\n</tbody>\n</table></div>\n<p><strong>4 пути метаболизма глюкозы при СД:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>Схема</th><th>Клиника</th></tr></thead>\n<tbody>\n<tr><td>Гликолиз</td><td>не изменён (но глюкоза не входит в клетку)</td><td>—</td></tr>\n<tr><td>Полиольный</td><td>Глю→(альдозоредуктаза,НАДФН)→Сорбитол→Фруктоза→ПВК</td><td>накопление в сетчатке/хрусталике/почках → ретинопатия, катаракта, нейропатия</td></tr>\n<tr><td>Гексозаминовый</td><td>Глю→глюкозамин-6-Ф→УДФ-ацетилглюкозамин</td><td>гликозилирование белков</td></tr>\n<tr><td>AGE-путь</td><td>Глю+NH2-белка→продукт Амадори (необратимо)</td><td>нарушение функции белков, ↓NO•</td></tr>\n</tbody>\n</table></div>\n<p><strong>Диагностика:</strong></p>\n<ol>\n<li>Глюкоза натощак (N 3,5-6,0 г/л)</li>\n<li>Глюкоза в моче (N отсутствует)</li>\n<li>Тест толерантности: 75г глюкозы → &gt;10 ммоль/л через 2ч = СД</li>\n</ol>"}, {"num": 55, "title": "Тиреоидные гормоны", "section": "Раздел 5", "sectionTitle": "Биохимия нервной ткани, гормональная регуляция", "explanationHtml": "<p>Финальный вопрос эндокринного блока — тиреоидные гормоны уникальны тем, что содержат йод.</p>\n<p><strong>Химическая природа:</strong> производные аминокислоты тирозина. Тиреоциты вырабатывают Т3 (3,5,3'-трийодтиронин) и Т4 (3,5,3',5'-тетрайодтиронин, тироксин). Соотношение Т4:Т3 = 4:1.</p>\n<p><strong>Место синтеза:</strong> щитовидная железа (тиреоциты).</p>\n<p><strong>Биосинтез — 4 этапа:</strong></p>\n<ol>\n<li>Включение I⁻ в щитовидную железу: транспорт йодида против градиента концентрации через специальный белок — Na+/K+-АТФазу, известную как \"йодный насос\" (ЩЖ захватывает 25-30% всего поступившего с пищей йода).</li>\n</ol>\n<ol>\n<li>Йодирование (органификация йода):</li>\n</ol>\n<ul>\n<li>Окисление: I⁻ → IO⁻ (реакционноспособный гипойодит) — фермент тиреопероксидаза, окислитель Н2О2</li>\n<li>Гипойодит йодирует остатки тирозина в составе белка тиреоглобулина → образуются МИТ (монойодтирозин) и ДИТ (дийодтирозин)</li>\n</ul>\n<ol>\n<li>Конденсация (тоже катализирует тиреопероксидаза):</li>\n</ol>\n<ul>\n<li>2 ДИТ → Т4</li>\n<li>МИТ + ДИТ → Т3</li>\n</ul>\n<p>Гормоны остаются в составе йодтиреоглобулина — запасная форма тиреоидных гормонов.</p>\n<ol>\n<li>Протеолиз и секреция: йодтиреоглобулин эндоцитозом попадает из коллоида обратно в тиреоцит → гидролиз лизосомальными ферментами → освобождение Т3 и Т4 → секреция в кровь.</li>\n</ol>\n<p><strong>Регуляция синтеза и секреции (гипоталамо-гипофизарно-тиреоидная ось):</strong></p>\n<p>↓Т3,Т4 → гипоталамус → тиреолиберин → аденогипофиз → ТТГ → ЩЖ → синтез Т3,Т4</p>\n<p>Отрицательная обратная связь: ↑Т3,Т4 → ↓тиреолиберина и ↓ТТГ.</p>\n<p><strong>Транспортные белки в крови (3 белка):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Белок</th><th>Связывает</th></tr></thead>\n<tbody>\n<tr><td>Тироксин-связывающий глобулин (ТСГ)</td><td>60% Т4, до 90% Т3 (наибольшее сродство)</td></tr>\n<tr><td>Тироксин-связывающий преальбумин</td><td>30% Т4, до 10% Т3</td></tr>\n<tr><td>Альбумин</td><td>10% Т4</td></tr>\n</tbody>\n</table></div>\n<p>Свободная (активная) форма — лишь 0,03% Т4 и 0,3% Т3.</p>\n<p><strong>Механизм действия:</strong> внутриклеточный. Гормон попадает в клетку либо напрямую через мембрану, либо через рецепторы I типа → в цитозоле происходит дейодирование → связывание с ядерными рецепторами (II тип) → активация транскрипции генов.</p>\n<p><strong>Биологические эффекты — по видам обмена:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Обмен</th><th>Эффект</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Белковый</td><td>↑синтез белка, ↑мышечная масса</td><td>↑транскрипция, ↑Na+/K+-АТФазы, малатДГ, СДГ, ЦХО</td></tr>\n<tr><td>Углеводный</td><td>↑всасывание углеводов, ↑гликолиз, ↑распад гликогена/↓синтез, ↑потребление глюкозы мышцами</td><td>—</td></tr>\n<tr><td>Липидный</td><td>↑синтез ХС и желчных кислот (печень), ↑синтез ФЛ (Т4), ↑липолиз</td><td>косвенно, через ↑малик-фермента</td></tr>\n</tbody>\n</table></div>\n<p><strong>Калоригенный эффект</strong> — важнейший эффект тиреоидных гормонов: возрастание потребления О2 организмом + увеличение теплопродукции. Механизм — НЕ разобщение окислительного фосфорилирования, а увеличение расхода АТФ в энергозависимых процессах → распад АТФ→АДФ → АДФ стимулирует окислительное фосфорилирование → ↑потребление О2. Количество АТФ при этом не растёт и не падает.</p>\n<p><strong>Инактивация тиреоидных гормонов:</strong> через дейодирование в периферических тканях (ещё 22-25 мкг Т3 образуется именно так, из Т4, а не напрямую из ЩЖ!).</p>\n<p><strong>Гипер- и гипотиреоз:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Состояние</th><th>Проявления</th></tr></thead>\n<tbody>\n<tr><td>Гипертиреоз (Базедова болезнь)</td><td>↑основного обмена, тахикардия, похудание, тремор, экзофтальм</td></tr>\n<tr><td>Гипотиреоз (микседема у взрослых, кретинизм у детей)</td><td>↓основного обмена, брадикардия, отёки, ↓умственной активности, у детей — задержка роста и умственного развития</td></tr>\n</tbody>\n</table></div>", "conspectHtml": "<p><strong>55. Тиреоидные гормоны</strong></p>\n<p><strong>Природа:</strong> производные тирозина. Т3 и Т4 (соотношение Т4:Т3=4:1)</p>\n<p><strong>Биосинтез (4 этапа):</strong></p>\n<ol>\n<li>Захват I⁻ (Na+/K+-АТФаза, \"йодный насос\")</li>\n<li>Йодирование: I⁻→IO⁻ (тиреопероксидаза,Н2О2) → МИТ+ДИТ (на тиреоглобулине)</li>\n<li>Конденсация: 2ДИТ→Т4; МИТ+ДИТ→Т3 (тиреопероксидаза) → запас в йодтиреоглобулине</li>\n<li>Протеолиз: эндоцитоз→лизосомы→ Т3,Т4 в кровь</li>\n</ol>\n<p><strong>Регуляция (ГГТ-ось):</strong> ↓Т3/Т4→тиреолиберин→ТТГ→ЩЖ. Обратная связь: ↑Т3/Т4→↓ТРГ/ТТГ</p>\n<p><strong>Транспорт:</strong> ТСГ(60%Т4,90%Т3) / преальбумин(30%Т4) / альбумин(10%Т4). Свободно: 0,03%Т4, 0,3%Т3</p>\n<p><strong>Механизм:</strong> внутриклеточный, дейодирование в цитозоле → ядерные рецепторы → транскрипция</p>\n<p><strong>Эффекты:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Обмен</th><th>Эффект</th></tr></thead>\n<tbody>\n<tr><td>Белковый</td><td>↑синтез белка, ↑Na+/K+-АТФаза, малатДГ, СДГ</td></tr>\n<tr><td>Углеводный</td><td>↑гликолиз, ↑распад гликогена</td></tr>\n<tr><td>Липидный</td><td>↑синтез ХС/желч.к-т, ↑ФЛ, ↑липолиз</td></tr>\n</tbody>\n</table></div>\n<p><strong>Калоригенный эффект:</strong> ↑О2, ↑теплопродукция. Механизм: НЕ разобщение! — ↑расход АТФ→АДФ→стимул окисл.фосфорилир.→↑О2 (кол-во АТФ не меняется)</p>\n<p><strong>Инактивация:</strong> дейодирование на периферии (доп. источник Т3 из Т4)</p>\n<p><strong>Патология:</strong> Гипертиреоз(тахикардия,похудание,тремор) / Гипотиреоз(микседема/кретинизм — ↓обмена, задержка развития)</p>"}, {"num": 56, "title": "Функции почек, метаболизм почечной ткани, образование мочи", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Почки — не просто \"фильтр\", а орган с собственной активной метаболической функцией и эндокринной активностью.</p>\n<p><strong>Функции почек (11 пунктов):</strong></p>\n<ol>\n<li>Регулируют ионный состав и баланс организма</li>\n<li>Регулируют объём внеклеточной жидкости</li>\n<li>Регулируют кислотно-основное состояние</li>\n<li>Поддерживают постоянство осмотического давления</li>\n<li>Экскретируют конечные продукты азотистого обмена (мочевина, мочевая кислота) и чужеродные вещества</li>\n<li>Регуляция АД (система ренин-ангиотензин)</li>\n<li>Регулируют эритропоэз (выделяют эритропоэтин)</li>\n<li>Участвуют в свёртывании крови (выделяют урокиназу — переводит плазминоген в плазмин)</li>\n<li>Эндокринная функция — секретируют брадикинин, 1,25-(ОН)2D3 (активная форма витамина D!), простагландины Е2 и А2</li>\n<li>Экскреторная (вода, электролиты, продукты обмена, Н+)</li>\n<li>Регуляторная (АД, гемопоэз, кальций, гемостаз)</li>\n</ol>\n<p>Почки не просто \"выводят отходы\", а являются полноценной эндокринной железой.</p>\n<p><strong>Особенности метаболизма почечной ткани:</strong></p>\n<ol>\n<li>Огромное потребление АТФ — 80% расходуется именно на активный транспорт</li>\n<li>Строго аэробный метаболизм — почки потребляют 10% всего кислорода организма, при том что их масса — всего 0,4% от веса тела!</li>\n<li>В корковом веществе: активен аэробный гликолиз, глюконеогенез, изоферменты ЛДГ1,2 (их повышение в крови — маркер острой почечной недостаточности)</li>\n<li>В мозговом слое: анаэробный гликолиз, активна ЛДГ4,5</li>\n</ol>\n<p><strong>Процесс образования мочи — 3 этапа:</strong></p>\n<p>Этап 1 — Клубочковая фильтрация (пассивный процесс): фильтрация идёт, если гидростатическое давление в клубочке (60 мм рт.ст.) &gt; онкотическое давление белков плазмы (32) + давление в капсуле Боумена (18).</p>\n<p>Фильтрационный барьер — 3 слоя: эндотелий капилляров (с фенестрами), базальная мембрана (коллаген IV типа), эпителий капсулы.</p>\n<p>Селективность по размеру (поры 2,9 нм): вещества с М&lt;5 кДа проходят свободно; М 5-65 кДа — частично; М&gt;65 кДа — задерживаются. Примерно 20% объёма плазмы превращается в первичную мочу.</p>\n<p>Этап 2 — Канальцевая реабсорбция: в проксимальных извитых канальцах реабсорбируются: глюкоза, аминокислоты, Na+, K+, Ca2+, Mg2+, H+, Cl-, SO4²⁻, HPO4²⁻, HCO3⁻, мочевина (до 70%, простой диффузией), мочевая кислота (90%), креатин.</p>\n<p>Виды транспорта при реабсорбции: симпорт (Na+ с глюкозой, АК), антипорт (Na+/H+), облегчённая диффузия, активный транспорт (Na+/K+-АТФаза, протонный насос), простая диффузия.</p>\n<p>Этап 3 — Канальцевая секреция — активная передача веществ из крови/клеток канальца непосредственно в просвет канальца.</p>\n<p><strong>Процесс концентрирования мочи</strong> — работает через противоточный механизм в петле Генле: NaCl активно реабсорбируется в толстом восходящем колене, но эта часть непроницаема для воды → создаётся высокая осмолярность в мозговом веществе почки. Дальше происходит \"круговорот мочевины\". Вода реабсорбируется по градиенту осмотического давления (через аквапорины, под действием АДГ).</p>", "conspectHtml": "<p><strong>56. Функции почек, метаболизм, образование мочи</strong></p>\n<p><strong>Функции почек (гл.):</strong> ионный баланс, ОЦК, КОС, осмотич. давление, экскреция азотистых продуктов, регуляция АД, эритропоэз(эритропоэтин), гемостаз(урокиназа), эндокринная (брадикинин, вит.D3-активация, ПГ)</p>\n<p><strong>Метаболизм почек:</strong></p>\n<ul>\n<li>80% АТФ → активный транспорт</li>\n<li>Аэробный тип: 10% О2 организма при массе 0,4%!</li>\n<li>Корковое в-во: аэробный гликолиз, глюконеогенез, ЛДГ1,2 (маркер ОПН)</li>\n<li>Мозговой слой: анаэробный гликолиз, ЛДГ4,5</li>\n</ul>\n<p><strong>Образование мочи (3 этапа):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Этап</th><th>Суть</th><th>Детали</th></tr></thead>\n<tbody>\n<tr><td>1. Клубочковая фильтрация</td><td>пассивно, разность давлений</td><td>60(гидростат.)&gt;32(онкотич.)+18(капсула). Барьер 3 слоя. Поры 2,9нм: &lt;5кДа своб., &gt;65кДа не проходят. ~20% плазмы→первичн. моча</td></tr>\n<tr><td>2. Канальцевая реабсорбция</td><td>избират. возврат в кровь</td><td>Глю,АК,ионы,мочевина(70%),мочев.к-та(90%). Транспорт: симпорт(Na++глю), антипорт(Na+/H+), облегч.диффузия, актив.транспорт</td></tr>\n<tr><td>3. Канальцевая секреция</td><td>активная передача в мочу</td><td>Н+ и др.</td></tr>\n</tbody>\n</table></div>\n<p><strong>Концентрирование мочи:</strong> противоточный механизм петли Генле. NaCl реабсорбир. (толстое восход. колено, непрониц. для воды) → ↑осмолярность мозгового слоя. \"Круговорот мочевины\" замещает NaCl. Вода реабсорбир. по градиенту (аквапорины, АДГ)</p>"}, {"num": 57, "title": "Виды транспорта при реабсорбции, почечные механизмы поддержания КОС", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Разберём подробнее конкретные виды транспорта, которые почка использует для реабсорбции разных веществ, и три параллельных механизма, которыми почка \"подкисляет\" мочу.</p>\n<p><strong>Виды транспорта в процессе реабсорбции (5 видов):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Вид транспорта</th><th>Направление</th><th>Вещества</th></tr></thead>\n<tbody>\n<tr><td>Симпорт (котранспорт)</td><td>просвет→клетка</td><td>Na++глюкоза, Na++АК, Na++HPO4²⁻, Na++HSO4⁻, Na++Cl⁻</td></tr>\n<tr><td>Антипорт</td><td>Na+(в клетку)/H+(из клетки)</td><td>механизм подкисления мочи</td></tr>\n<tr><td>Облегчённая диффузия (селективная)</td><td>клетка→кровь</td><td>Na+, K+, Ca2+, Mg2+, Cl⁻</td></tr>\n<tr><td>Простая диффузия</td><td>через мембрану</td><td>H2O (вслед за ионами), мочевина, гормоны, мочевая к-та, креатин</td></tr>\n<tr><td>Активный транспорт</td><td>—</td><td>Na+(клетка→кровь, Na+/K+-АТФаза), H+(клетка→просвет, протонная помпа), HCO3⁻(клетка→кровь, в обмен на Cl⁻)</td></tr>\n</tbody>\n</table></div>\n<p>Особая деталь — реабсорбция белка: в норме белок в первичной моче отсутствует, но если он всё же профильтровался, реабсорбируется через пиноцитоз в проксимальных извитых канальцах.</p>\n<p><strong>Почечные механизмы поддержания КОС — 3 параллельных механизма (все служат одной цели — секреция Н+ и удержание NaHCO3 в организме):</strong></p>\n<ol>\n<li>Бикарбонатный механизм: CO2 (простая диффузия из крови) + H2O → H2CO3 (карбоангидраза) → H+ + HCO3⁻. HCO3⁻ активным транспортом (в обмен на Cl⁻) возвращается в плазму. H+ выводится в просвет канальца (в обмен на Na+, который реабсорбируется).</li>\n</ol>\n<ol>\n<li>Аммиачный механизм: NH3 образуется в клетках дистального отдела из глутамина и глутаминовой кислоты (ферменты глутаминаза и глутаматдегидрогеназа) → NH3 поступает в просвет канальца (унипорт) → реагирует с H+ → образуется NH4+ → аммонийные соли (NH4Cl, NH4HSO4) выводятся с мочой. Этот механизм активируется именно при ацидозе.</li>\n</ol>\n<ol>\n<li>Фосфатный механизм: HPO4²⁻ секретируется в просвет канальца вместе с Na+ (симпорт) → протонируется H+ → образуется H2PO4⁻. Соотношение в моче H2PO4⁻:HPO4²⁻ = 50:1 (в отличие от плазмы крови, где соотношение обратное).</li>\n</ol>", "conspectHtml": "<p><strong>57. Виды транспорта при реабсорбции, почечные механизмы КОС</strong></p>\n<p><strong>Виды транспорта:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Вид</th><th>Вещества</th></tr></thead>\n<tbody>\n<tr><td>Симпорт</td><td>Na++глюкоза/АК/HPO4²⁻/HSO4⁻/Cl⁻</td></tr>\n<tr><td>Антипорт</td><td>Na+(вход)/H+(выход)</td></tr>\n<tr><td>Облегч. диффузия</td><td>Na+,K+,Ca2+,Mg2+,Cl⁻ (клетка→кровь)</td></tr>\n<tr><td>Простая диффузия</td><td>H2O, мочевина, гормоны, мочев.к-та, креатин</td></tr>\n<tr><td>Активный транспорт</td><td>Na+/K+-АТФаза, протонная помпа, HCO3⁻(в обмен на Cl⁻)</td></tr>\n</tbody>\n</table></div>\n<p><em>Белок (если профильтровался) → реабсорбция пиноцитозом</em></p>\n<p><strong>3 механизма поддержания КОС (все секретируют H+):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Механизм</th><th>Схема</th></tr></thead>\n<tbody>\n<tr><td>Бикарбонатный</td><td>CO2+H2O→(карбоангидраза)→H2CO3→H++HCO3⁻; HCO3⁻→кровь(на Cl⁻); H+→просвет</td></tr>\n<tr><td>Аммиачный</td><td>Глутамин/глутамат→(глутаминаза,глутаматДГ)→NH3→просвет→+H+→NH4+→соли(NH4Cl) в мочу</td></tr>\n<tr><td>Фосфатный</td><td>HPO4²⁻(симпорт с Na+)→+H+→H2PO4⁻ (в моче H2PO4⁻:HPO4²⁻=50:1)</td></tr>\n</tbody>\n</table></div>\n<p><em>Аммиачный механизм усиливается при ацидозе (аварийный клапан для H+)</em></p>"}, {"num": 58, "title": "Химический состав мочи, клиренс, патологические компоненты мочи", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Разберём, из чего вообще состоит нормальная моча, затем — клиренс, и что появляется в моче при патологии.</p>\n<p><strong>Органические компоненты мочи и их происхождение:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Компонент</th><th>Происхождение</th><th>Клиническая деталь</th></tr></thead>\n<tbody>\n<tr><td>Мочевина</td><td>конечный продукт обмена аммиака</td><td>↑ при гиперпротеиновой диете, ↑распаде белков</td></tr>\n<tr><td>Мочевая кислота</td><td>распад пуриновых оснований</td><td>↑ при подагре, лейкемии, гепатитах</td></tr>\n<tr><td>Креатинин</td><td>распад креатинфосфата (мышцы)</td><td>используется для оценки СКФ</td></tr>\n<tr><td>Гиппуровая кислота</td><td>парное соединение (бензойная к-та+глицин, в печени)</td><td>↑ при растительной пище; ↓ при поражении печени</td></tr>\n<tr><td>Животный индикан</td><td>обезвреживание индола в печени</td><td>показатель функции печени</td></tr>\n<tr><td>Безазотистые органич. к-ты</td><td>оксалат, лактат, цитрат и др.</td><td>↑лактат при физнагрузке; ↑цитрат/сукцинат при алкалозе</td></tr>\n<tr><td>Аминокислоты</td><td>—</td><td>до 1 г/сут</td></tr>\n<tr><td>Пигменты (урохромы)</td><td>стеркобилиноген, глюкурониды билирубина</td><td>придают соломенно-жёлтую окраску</td></tr>\n</tbody>\n</table></div>\n<p><strong>Неорганические компоненты мочи:</strong></p>\n<ul>\n<li>Катионы: Na+, K+, Ca2+, Mg2+, NH4+</li>\n<li>Анионы: Cl⁻, SO4²⁻, HPO4²⁻, H2PO4⁻</li>\n</ul>\n<p><strong>Клиренс (коэффициент очищения)</strong></p>\n<p>Определение: объём плазмы крови (в мл), который полностью очищается от какого-либо вещества за 1 минуту при прохождении через почки.</p>\n<p>Формула: С = (U×V)/P, где U — концентрация вещества в моче, V — минутный диурез, P — концентрация вещества в плазме.</p>\n<p><strong>Логика интерпретации значения клиренса:</strong></p>\n<p>Почки фильтруют примерно 120 мл плазмы в минуту (это и есть скорость клубочковой фильтрации, СКФ). Отсюда:</p>\n<ul>\n<li>Если клиренс вещества МЕНЬШЕ 120 мл/мин → вещество реабсорбируется</li>\n<li>Если клиренс БОЛЬШЕ 120 мл/мин → вещество дополнительно секретируется в канальцах</li>\n<li>Если клиренс РАВЕН СКФ (то есть равен ~120 мл/мин) → вещество только фильтруется, но НЕ реабсорбируется и НЕ секретируется</li>\n</ul>\n<p>Именно поэтому креатинин — идеальный маркер для измерения СКФ — он практически не реабсорбируется и не секретируется.</p>\n<p><strong>Классификация веществ мочи по механизму попадания (5 групп):</strong></p>\n<ol>\n<li>Фильтруемые (только) — креатинин, мочевина, инулин</li>\n<li>Реабсорбируемые и секретируемые — электролиты</li>\n<li>Секретируемые — органические кислоты и основания</li>\n<li>Продуцируемые прямо в почках — NH3</li>\n<li>Реабсорбируемые (почти полностью) — сахара, аминокислоты</li>\n</ol>\n<p><strong>Патологические компоненты мочи:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Компонент</th><th>Название</th><th>Происхождение</th></tr></thead>\n<tbody>\n<tr><td>Белок</td><td>Протеинурия</td><td>повреждение мочевыводящих путей/базальных мембран (пиелонефрит)</td></tr>\n<tr><td>Кровь (эритроциты)</td><td>Гематурия</td><td>травмы, камни, туберкулёз, опухоли; повреждённые эритроциты — гломерулонефрит</td></tr>\n<tr><td>Глюкоза</td><td>Глюкозурия</td><td>СД, стероидный диабет, избыток углеводов</td></tr>\n<tr><td>Фруктоза</td><td>Фруктозурия</td><td>врождённая недостаточность ферментов обмена фруктозы</td></tr>\n</tbody>\n</table></div>", "conspectHtml": "<p><strong>58. Химический состав мочи, клиренс, патология</strong></p>\n<p><strong>Органические компоненты:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Компонент</th><th>Происхождение</th></tr></thead>\n<tbody>\n<tr><td>Мочевина</td><td>обмен аммиака</td></tr>\n<tr><td>Мочевая к-та</td><td>распад пуринов</td></tr>\n<tr><td>Креатинин</td><td>распад креатинфосфата</td></tr>\n<tr><td>Гиппуровая к-та</td><td>бензойная к-та+глицин (печень)</td></tr>\n<tr><td>Животный индикан</td><td>обезвреживание индола (печень)</td></tr>\n<tr><td>Урохромы</td><td>стеркобилиноген, билирубин-глюкурониды</td></tr>\n</tbody>\n</table></div>\n<p><strong>Неорганич.:</strong> катионы(Na+,K+,Ca2+,Mg2+,NH4+), анионы(Cl⁻,SO4²⁻,HPO4²⁻,H2PO4⁻)</p>\n<p><strong>Клиренс:</strong> С=(U×V)/P. СКФ≈120 мл/мин</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Клиренс</th><th>Означает</th></tr></thead>\n<tbody>\n<tr><td>&lt;120</td><td>вещество реабсорбируется</td></tr>\n<tr><td>&gt;120</td><td>вещество секретируется</td></tr>\n<tr><td>=120</td><td>только фильтрация (креатинин — идеальный маркер СКФ)</td></tr>\n</tbody>\n</table></div>\n<p><strong>5 групп веществ по механизму:</strong> только фильтруемые(креатинин,мочевина) / реабс.+секрет.(электролиты) / секретируемые(орг.к-ты) / продуцируемые в почках(NH3) / реабсорбируемые почти полностью(сахара,АК)</p>\n<p><strong>Патология мочи:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Компонент</th><th>Название</th><th>Причина</th></tr></thead>\n<tbody>\n<tr><td>Белок</td><td>Протеинурия</td><td>повреждение нефрона</td></tr>\n<tr><td>Эритроциты</td><td>Гематурия</td><td>травмы, камни, гломерулонефрит</td></tr>\n<tr><td>Глюкоза</td><td>Глюкозурия</td><td>СД</td></tr>\n<tr><td>Фруктоза</td><td>Фруктозурия</td><td>дефект ферментов фруктозы</td></tr>\n</tbody>\n</table></div>"}, {"num": 59, "title": "Водные бассейны организма, параметры крови, нарушения водно-электролитного баланса", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Вода — основная реакционная среда организма, и она распределена по нескольким \"бассейнам\".</p>\n<p><strong>Общее количество воды в организме</strong> зависит от пола: у мужчин — 60% массы тела, у женщин — 50% (разница объясняется большей долей жировой ткани у женщин).</p>\n<p><strong>Водные бассейны:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Бассейн</th><th>% массы тела (м/ж)</th><th>Объём</th></tr></thead>\n<tbody>\n<tr><td>Внутриклеточная вода</td><td>40% / 30%</td><td>26 л</td></tr>\n<tr><td>Внеклеточная вода</td><td>20% (у обоих)</td><td>—</td></tr>\n<tr><td>— Интерстициальная</td><td>—</td><td>10,5 л</td></tr>\n<tr><td>— Плазма крови</td><td>—</td><td>3,5 л</td></tr>\n</tbody>\n</table></div>\n<p>Депо воды: мышечная ткань (50% всей воды организма содержится именно в мышцах!), печёночная и кожная ткани.</p>\n<p>Электролиты и вода свободно проникают через стенки капилляров → внеклеточный объём (плазма+интерстиций) можно рассматривать как единую осмотически однородную массу.</p>\n<p><strong>Система регуляции воды:</strong></p>\n<ol>\n<li>Гормоны — РААС (ренин-ангиотензин-альдостерон), кальцитонин, паратгормон, вазопрессин, кальцитриол</li>\n<li>Органы — почки, лёгкие, кожа</li>\n</ol>\n<p>Критическая деталь: при отсутствии питья человек погибает через несколько суток, когда потеря воды достигает ~12% от общего количества.</p>\n<p><strong>Основные параметры крови как жидкой среды:</strong></p>\n<ul>\n<li>Р осм — осмотическое давление</li>\n<li>Р онк — онкотическое давление (создаётся белками плазмы)</li>\n<li>ОЦК — объём циркулирующей крови (мужчины ≈5,2 л, женщины ≈3,9 л)</li>\n<li>Осмолярность — суммарная концентрация всех осмотически активных веществ</li>\n</ul>\n<p><strong>Виды нарушений водно-электролитного баланса — 6 типов, важно чётко разделять по логике \"что происходит с клеткой\":</strong></p>\n<p>Гипергидратация (накопление воды):</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Подтип</th><th>Механизм</th><th>Причина</th><th>Что с клеткой</th></tr></thead>\n<tbody>\n<tr><td>Гипотоническая</td><td>вода накапливается БЕЗ соли</td><td>бессолевые растворы, дистиллированная вода</td><td>вода \"распределяется\" по всему телу → водное отравление, судороги, вымывание K+</td></tr>\n<tr><td>Изотоническая</td><td>вода + адекватное количество соли</td><td>перегрузка физраствором NaCl</td><td>↑объём внеклеточного пространства → отёки</td></tr>\n<tr><td>Гипертоническая</td><td>накопление катионов (особенно Na+) во внеклеточной жидкости</td><td>употребление морской воды</td><td>вода ПОКИДАЕТ клетку → клетка сморщивается, нарушение функции</td></tr>\n</tbody>\n</table></div>\n<p>Дегидратация (потеря воды):</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Подтип</th><th>Механизм</th><th>Причина</th><th>Что с клеткой</th></tr></thead>\n<tbody>\n<tr><td>Гипотоническая</td><td>потеря солей БЕЗ потери воды</td><td>недостаточность коры надпочечников (болезнь Аддисона)</td><td>вода устремляется ВНУТРЬ клетки → клетка набухает и гибнет</td></tr>\n<tr><td>Нормостеническая</td><td>потеря воды + адекватного кол-ва солей</td><td>поражения ЖКТ, диарея, инфекции</td><td>↓внеклеточной жидкости, ↓ОЦК, анурия</td></tr>\n<tr><td>Гипертоническая</td><td>потеря воды БЕЗ потери солей</td><td>ограничение доступа к пресной воде</td><td>обезвоживание</td></tr>\n</tbody>\n</table></div>\n<p>Ключевая логика: вода всегда движется туда, где выше концентрация растворённых частиц (по градиенту осмотического давления).</p>", "conspectHtml": "<p><strong>59. Водные бассейны, параметры крови, нарушения ВЭБ</strong></p>\n<p><strong>Общая вода:</strong> муж.60%/жен.50% массы тела</p>\n<p><strong>Бассейны:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Бассейн</th><th>% (м/ж)</th><th>Объём</th></tr></thead>\n<tbody>\n<tr><td>Внутриклеточная</td><td>40%/30%</td><td>26л</td></tr>\n<tr><td>Внеклеточная (интерстиций+плазма)</td><td>20%</td><td>10,5л+3,5л</td></tr>\n</tbody>\n</table></div>\n<p>Депо: мышцы (50% всей воды), печень, кожа</p>\n<p><strong>Регуляция:</strong> гормоны(РААС,кальцитонин,ПТГ,вазопрессин,кальцитриол) + почки/лёгкие/кожа Гибель при потере ~12% воды</p>\n<p><strong>Параметры крови:</strong> Р осм, Р онк(белки плазмы), ОЦК(муж 5,2л/жен 3,9л), осмолярность</p>\n<p><strong>Нарушения ВЭБ (6 типов):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Гипотонич.</th><th>Изотонич.</th><th>Гипертонич.</th></tr></thead>\n<tbody>\n<tr><td>Гипергидратация</td><td>вода без соли → отравление, судороги, ↓K+</td><td>вода+соль(NaCl перегрузка) → отёки</td><td>↑Na+ внеклет. → вода из клетки, сморщивание</td></tr>\n<tr><td>Дегидратация</td><td>потеря соли без воды(Аддисон) → вода в клетку, набухание, гибель</td><td>потеря воды+соли(диарея) → ↓ОЦК, анурия</td><td>потеря воды без соли(жажда) → обезвоживание</td></tr>\n</tbody>\n</table></div>\n<p><em>Логика: вода идёт туда, где выше осмотич. концентрация</em></p>"}, {"num": 60, "title": "Антидиуретический гормон (вазопрессин), несахарный диабет", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>АДГ — гормон, напрямую регулирующий, сколько воды почка вернёт обратно в кровь.</p>\n<p><strong>Химическая природа:</strong> белково-пептидная, 8 аминокислот.</p>\n<p><strong>Место синтеза:</strong> гипоталамус. Схема: Препрогормон → прогормон → в составе нейросекреторных гранул транспортируется в нейрогипофиз → там происходит процессинг прогормона (частичный протеолиз) → образуется зрелый гормон (8 АК) + транспортный белок нейрофизин.</p>\n<p><strong>Регуляция секреции:</strong></p>\n<p>↑осмотического давления внеклеточной жидкости (↑Na+) → осморецепторы гипоталамуса улавливают это изменение → нервные импульсы идут на нейрогипофиз → секреция АДГ.</p>\n<p><strong>Механизм действия:</strong> мембранно-внутриклеточный, вторичный посредник — цГМФ. Два типа рецепторов:</p>\n<ul>\n<li>V1 — на гладкомышечных клетках сосудов</li>\n<li>V2 — на собирательных трубочках и дистальных канальцах почек (здесь работает через цАМФ)</li>\n</ul>\n<p><strong>Органы-мишени:</strong> сосуды (гладкая мускулатура) и почки (собирательные трубочки, дистальные канальцы).</p>\n<p><strong>Биологические эффекты (2 пункта):</strong></p>\n<ol>\n<li>Повышает АД — за счёт сужения просвета сосудов (через V1-рецепторы) — отсюда и название \"вазопрессин\"</li>\n</ol>\n<ol>\n<li>Повышает реабсорбцию воды в почках — через V2-рецепторы, цАМФ → стимулирует синтез канальцевых белков аквапоринов → аквапорины встраиваются в апикальную мембрану клеток собирательных канальцев → вода проникает внутрь клетки и дальше реабсорбируется</li>\n</ol>\n<p><strong>Несахарный диабет (патологический аспект):</strong></p>\n<p>Снижение секреции АДГ (центральный несахарный диабет) или нечувствительность рецепторов к нему (нефрогенный несахарный диабет) → полиурия (много мочи), жа
