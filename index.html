жда (компенсаторная), низкая плотность мочи (моча разбавленная).</p>\n<p><strong>Важное отличие от сахарного диабета:</strong> при несахарном диабете глюкозы в моче НЕТ — полиурия здесь связана исключительно с нарушением реабсорбции воды, а не с осмотическим эффектом глюкозы (как при обычном сахарном диабете).</p>", "conspectHtml": "<p><strong>60. Вазопрессин (АДГ), несахарный диабет</strong></p>\n<p><strong>Природа:</strong> белково-пептидная, 8 АК</p>\n<p><strong>Синтез:</strong> Гипоталамус: Препрогормон→Прогормон → (нейросекреторн. гранулы) → Нейрогипофиз → процессинг → АДГ+нейрофизин(транспортн. белок)</p>\n<p><strong>Регуляция:</strong> ↑Росм внеклет. жидкости(↑Na+) → осморецепторы гипоталамуса → нервные импульсы → секреция АДГ</p>\n<p><strong>Механизм действия:</strong> мембранно-внутриклеточный, вторичный посредник — цГМФ</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Рецептор</th><th>Локализация</th><th>Посредник</th></tr></thead>\n<tbody>\n<tr><td>V1</td><td>гладкомыш. клетки сосудов</td><td>—</td></tr>\n<tr><td>V2</td><td>собират. трубочки, дист. канальцы</td><td>цАМФ</td></tr>\n</tbody>\n</table></div>\n<p><strong>Эффекты:</strong></p>\n<ol>\n<li>↑АД (сужение сосудов, V1)</li>\n<li>↑реабсорбция воды (V2→цАМФ→синтез аквапоринов→встраивание в апикальн. мембрану)</li>\n</ol>\n<p><strong>Несахарный диабет:</strong> ↓АДГ или нечувствит. рецепторов → полиурия, жажда, низкая плотность мочи <em>Отличие от сахарного диабета: глюкозы в моче НЕТ</em></p>"}, {"num": 61, "title": "Альдостерон, система РААС, ангиотензин II, ПНФ", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Разберём систему регуляции АД и солевого баланса: альдостерон, РААС, и ПНФ.</p>\n<p><strong>Альдостерон</strong></p>\n<p>Химическая природа: стероидная (из холестерина). Место синтеза: кора надпочечников, клубочковая зона.</p>\n<p><strong>Регуляция синтеза и секреции — система ренин-ангиотензин-альдостерон (РААС):</strong></p>\n<p>Ангиотензиноген (синтезируется в печени) → [фермент ренин, синтезируется в почках, выделяется при ↓АД или ↓Na+] → Ангиотензин I (декапептид, 10 АК) → [фермент АПФ (карбоксипептидаза), синтезируется в лёгких] → Ангиотензин II (октапептид, 8 АК) → действует на кору надпочечников → Альдостерон</p>\n<p><strong>Механизм действия:</strong> внутриклеточный (цитозольный). Связывается с ядерными рецепторами → активация транскрипции → синтез белков (Na+/K+-АТФазы, ионных каналов).</p>\n<p><strong>Органы-мишени:</strong> сосуды, почки, ЖКТ.</p>\n<p><strong>Биологические эффекты альдостерона:</strong></p>\n<ol>\n<li>Повышает АД</li>\n<li>Повышает всасывание Na+ в почках и в ЖКТ</li>\n<li>Усиливает выведение K+ и H+ с мочой</li>\n</ol>\n<p><strong>Влияние на солевой обмен:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Состояние</th><th>Причина</th><th>Проявления</th></tr></thead>\n<tbody>\n<tr><td>Гиперальдостеронизм</td><td>опухоль коры надпочечников</td><td>гипернатриемия, гипокалиемия, метаболический алкалоз, гипертензия</td></tr>\n<tr><td>Гипоальдостеронизм</td><td>недостаточность коры надпочечников</td><td>гипонатриемия, гиперкалиемия, ацидоз, гипотензия</td></tr>\n</tbody>\n</table></div>\n<p><strong>Биологические эффекты ангиотензина II (5 пунктов):</strong></p>\n<ol>\n<li>Мощный вазоконстриктор → ↑АД (прямой эффект, независимо от альдостерона!)</li>\n<li>Стимулирует секрецию альдостерона</li>\n<li>Стимулирует секрецию АДГ (то есть две системы регуляции воды/солей работают не изолированно, а взаимно усиливают друг друга!)</li>\n<li>Вызывает жажду</li>\n<li>Усиливает реабсорбцию Na+ в проксимальных канальцах почек</li>\n</ol>\n<p><strong>Предсердный натрийуретический фактор (ПНФ) — функциональный антагонист всей системы РААС</strong></p>\n<p>Химическая природа: белково-пептидная. Место синтеза: кардиомиоциты предсердий.</p>\n<p>Схема синтеза: Препрогормон (126 АК) → прогормон → гормон (28 АК).</p>\n<p>Регуляция секреции: основной стимул — ↑АД, ↑венозного возврата (растяжение предсердий).</p>\n<p>Механизм действия: мембранно-внутриклеточный, вторичный посредник цГМФ.</p>\n<p>Органы-мишени: нейрогипофиз, почки, сосуды.</p>\n<p><strong>Биологические эффекты ПНФ (все направлены на ↓АД — полная противоположность РААС!):</strong></p>\n<ol>\n<li>Ингибирует секрецию АДГ</li>\n<li>Ингибирует выделение ренина (↓активность всей РААС)</li>\n<li>Как следствие — ингибируется секреция альдостерона</li>\n<li>Усиливает выделение почками Na+ (натрийурез) и воды (диурез)</li>\n<li>Вызывает релаксацию сосудов (вазодилатация)</li>\n</ol>", "conspectHtml": "<p><strong>61. Альдостерон, РААС, ангиотензин II, ПНФ</strong></p>\n<p><strong>Альдостерон:</strong> стероидная, кора надпочечников (клубочковая зона)</p>\n<p><strong>РААС:</strong> Ангиотензиноген(печень) →[ренин(почки,↓АД/↓Na+)]→ АнгиотензинI(10АК) →[АПФ(лёгкие)]→ АнгиотензинII(8АК) → кора надпочечников → Альдостерон</p>\n<p><strong>Механизм:</strong> внутриклеточный (цитозольный) → транскрипция → Na+/K+-АТФаза</p>\n<p><strong>Эффекты альдостерона:</strong> ↑АД, ↑реабсорбция Na+(почки,ЖКТ), ↑выведение K+/H+</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Причина</th><th>Эффект</th></tr></thead>\n<tbody>\n<tr><td>Гиперальдостеронизм</td><td>опухоль</td><td>↑Na+,↓K+,алкалоз,гипертензия</td></tr>\n<tr><td>Гипоальдостеронизм</td><td>недостат. коры</td><td>↓Na+,↑K+,ацидоз,гипотензия</td></tr>\n</tbody>\n</table></div>\n<p><strong>Ангиотензин II (5 эффектов):</strong> 1)вазоконстриктор(прямой↑АД) 2)стимул. альдостерон 3)стимул. АДГ 4)жажда 5)↑реабс. Na+(прокс.канальцы)</p>\n<p><strong>ПНФ:</strong> белково-пептидная, кардиомиоциты предсердий: Препрогормон(126АК)→прогормон→Гормон(28АК) Регуляция: ↑АД, растяжение предсердий Механизм: цГМФ</p>\n<p><strong>Эффекты ПНФ (↓АД, антагонист РААС):</strong> ↓АДГ, ↓ренин, ↓альдостерон, ↑натрийурез+диурез, вазодилатация</p>"}, {"num": 62, "title": "Паратиреоидный гормон (ПТГ)", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Паратгормон — гормон, который вместе с кальцитриолом и кальцитонином отвечает за фосфорно-кальциевый обмен.</p>\n<p><strong>Химическая природа:</strong> белково-пептидная. Схема синтеза: препрогормон (115 АК) → прогормон → гормон (84 АК). Место синтеза: паращитовидные железы.</p>\n<p><strong>Регуляция секреции:</strong></p>\n<ul>\n<li>↓Ca2+ в крови → стимулирует секрецию ПТГ</li>\n<li>↑Ca2+ → ингибирует секрецию</li>\n</ul>\n<p><strong>Механизм действия:</strong> мембранно-внутриклеточный, вторичный посредник — цАМФ.</p>\n<p><strong>Органы-мишени:</strong> почки, кости, кишечник.</p>\n<p><strong>Биологические эффекты (общий итог: ↑Ca2+ в крови, ↓фосфаты в крови):</strong></p>\n<ol>\n<li>Почки: стимулирует реабсорбцию Ca2+ в дистальных канальцах; НО одновременно снижает реабсорбцию фосфатов в дистальных извитых канальцах (действует на Ca2+ и фосфаты в противоположных направлениях!)</li>\n</ol>\n<ol>\n<li>Кости: взаимодействует с рецепторами на остеобластах и остеоцитах → вызывает вымывание Ca2+ и фосфатов из костной ткани в кровь</li>\n</ol>\n<ol>\n<li>Кишечник: усиливает всасывание Ca2+ и фосфатов — но не напрямую, а косвенно, через индукцию синтеза кальцитриола (активная форма витамина D)</li>\n</ol>\n<p><strong>Клиническая логика по каждому органу:</strong> в почках ПТГ действует напрямую и быстро; в костях — тоже напрямую, через рецепторы на клетках кости; в кишечнике — опосредованно, через второй гормон.</p>\n<p><strong>Патологический аспект:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Состояние</th><th>Причина</th><th>Изменения</th><th>Клиника</th></tr></thead>\n<tbody>\n<tr><td>Гиперпаратиреоз</td><td>опухоль паращитовидных желёз</td><td>↑Ca2+, ↓фосфатов</td><td>мышечная гипотония, камни в почках</td></tr>\n<tr><td>Гипопаратиреоз</td><td>—</td><td>↓Ca2+, ↑фосфатов</td><td>тетания (мышечные судороги)</td></tr>\n</tbody>\n</table></div>\n<p>Кальций в норме \"стабилизирует\" мембраны нервных и мышечных клеток, снижая их возбудимость. При дефиците Ca2+ мембраны становятся аномально возбудимыми → спонтанные, неконтролируемые мышечные сокращения (судороги).</p>", "conspectHtml": "<p><strong>62. Паратиреоидный гормон (ПТГ)</strong></p>\n<p><strong>Природа:</strong> белково-пептидная. Синтез: Препрогормон(115АК)→Прогормон→Гормон(84АК)</p>\n<p><strong>Место:</strong> паращитовидные железы</p>\n<p><strong>Регуляция:</strong> ↓Ca2+ → стимулирует секрецию; ↑Ca2+ → ингибирует</p>\n<p><strong>Механизм:</strong> мембранно-внутриклеточный, посредник — цАМФ</p>\n<p><strong>Эффекты (общий итог: ↑Ca2+, ↓фосфаты в крови):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Орган</th><th>Механизм</th><th>Эффект</th></tr></thead>\n<tbody>\n<tr><td>Почки</td><td>↑реабсорбция Ca2+(дист.канальцы), ↓реабсорбция фосфатов</td><td>↑Ca2+,↓PO4</td></tr>\n<tr><td>Кости</td><td>рецепторы на остеобластах/остеоцитах</td><td>вымывание Ca2+ + фосфатов из кости</td></tr>\n<tr><td>Кишечник</td><td>КОСВЕННО через индукцию синтеза кальцитриола</td><td>↑всасывание Ca2+ + фосфатов</td></tr>\n</tbody>\n</table></div>\n<p><strong>Патология:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Причина</th><th>Изменения</th><th>Клиника</th></tr></thead>\n<tbody>\n<tr><td>Гиперпаратиреоз</td><td>опухоль</td><td>↑Ca2+,↓PO4</td><td>мышечная гипотония, камни в почках</td></tr>\n<tr><td>Гипопаратиреоз</td><td>—</td><td>↓Ca2+,↑PO4</td><td>тетания (судороги, ↑нервно-мышечная возбудимость)</td></tr>\n</tbody>\n</table></div>"}, {"num": 63, "title": "Кальцитриол, рахит", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Кальцитриол — активная форма витамина D, синтезируется в три этапа, в трёх разных органах.</p>\n<p><strong>Химическая природа:</strong> стероидная.</p>\n<p><strong>Этапы синтеза (3 этапа, каждый в своём органе):</strong></p>\n<ol>\n<li>Кожа: под действием УФ-облучения из холестерина через промежуточный 7-дегидрохолестерол образуется превитамин D3 → Витамин D3 (холекальциферол). Это неферментативный процесс.</li>\n</ol>\n<ol>\n<li>Печень: гидроксилирование витамина D3 ферментом 25-гидроксилазой → 25-гидроксихолекальциферол.</li>\n</ol>\n<ol>\n<li>Почки: здесь — развилка, зависящая от уровня кальция в крови:</li>\n</ol>\n<ul>\n<li>При низкой концентрации Ca2+ → фермент α1-гидроксилаза превращает 25-гидроксихолекальциферол в активную форму — Кальцитриол (1,25-(OH)2-D3)</li>\n<li>При высокой концентрации Ca2+ → почки превращают его в неактивные формы</li>\n</ul>\n<p>Активация α1-гидроксилазы стимулируется паратгормоном (ПТГ не только сам напрямую действует на кости/почки, но и \"включает\" производство кальцитриола, который потом действует на кишечник).</p>\n<p><strong>Регуляция:</strong></p>\n<ul>\n<li>Метаболическая: концентрация Ca2+ в крови (обратная связь)</li>\n<li>Гормональная: эстрогены, прогестерон, андрогены увеличивают активность α1-гидроксилазы</li>\n</ul>\n<p><strong>Механизм действия:</strong> внутриклеточный (цитозольный), через ядерные рецепторы.</p>\n<p><strong>Органы-мишени:</strong> кишечник, кости (остеобласты).</p>\n<p><strong>Биологические эффекты (все направлены на ↑Ca2+ и фосфатов):</strong></p>\n<ol>\n<li>Усиливает всасывание Ca2+ и фосфатов через слизистую кишечника</li>\n<li>↑Ca2+ в крови</li>\n<li>↑фосфатов в крови</li>\n<li>↑Ca2+ и фосфатов в костях (минерализация — в отличие от ПТГ, который \"вымывает\" кальций ИЗ костей, кальцитриол наоборот способствует ЕГО отложению В кость!)</li>\n</ol>\n<p><strong>Патологический аспект — Рахит (у детей) / Остеомаляция (у взрослых):</strong></p>\n<p>Причина: недостаток витамина D3 → ↓всасывания Ca2+ и фосфатов из кишечника → ↓Ca2+ и фосфатов в плазме → нарушение минерализации костей → деформации скелета.</p>\n<p><strong>Наследственные формы витамин D-зависимого рахита (2 типа):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Дефект</th></tr></thead>\n<tbody>\n<tr><td>I тип</td><td>генетический дефект превращения 25-гидроксихолекальциферола в кальцитриол (↓α1-гидроксилазы)</td></tr>\n<tr><td>II тип</td><td>генетический дефект — отсутствие рецепторов к кальцитриолу</td></tr>\n</tbody>\n</table></div>", "conspectHtml": "<p><strong>63. Кальцитриол, рахит</strong></p>\n<p><strong>Природа:</strong> стероидная</p>\n<p><strong>Синтез (3 этапа):</strong></p>\n<ol>\n<li>Кожа (УФ, неферментативно): ХС→7-дегидрохолестерол→превитамин D3→Витамин D3</li>\n<li>Печень: Витамин D3 →(25-гидроксилаза)→ 25-гидроксихолекальциферол</li>\n<li>Почки: при ↓Ca2+ →(α1-гидроксилаза, стимул. ПТГ)→ Кальцитриол(1,25-(OH)2-D3); при ↑Ca2+ → неактивные формы (24,25-(OH)2-D3)</li>\n</ol>\n<p><strong>Регуляция:</strong> метаболич.(Ca2+, обратн. связь) + гормональн.(эстрогены/прогестерон/андрогены ↑α1-гидроксилазу)</p>\n<p><strong>Механизм:</strong> внутриклеточный (цитозольный), ядерные рецепторы</p>\n<p><strong>Мишени:</strong> кишечник, кости (остеобласты)</p>\n<p><strong>Эффекты (все ↑):</strong> всасывание Ca2+/PO4 в кишечнике, Ca2+ и PO4 в крови, Ca2+ и PO4 в костях (минерализация — противоположно ПТГ!)</p>\n<p><strong>Рахит/остеомаляция:</strong> ↓вит.D3 → ↓всасывания Ca2+/PO4 → нарушение минерализации → деформации скелета</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип наследств. рахита</th><th>Дефект</th></tr></thead>\n<tbody>\n<tr><td>I</td><td>↓α1-гидроксилазы (нет синтеза кальцитриола)</td></tr>\n<tr><td>II</td><td>нет рецепторов к кальцитриолу</td></tr>\n</tbody>\n</table></div>"}, {"num": 64, "title": "Кальцитонин", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Кальцитонин — третий и последний гормон \"кальциевой троицы\", и он единственный из трёх, кто снижает уровень кальция в крови.</p>\n<p><strong>Химическая природа:</strong> белково-пептидная. Схема синтеза: прогормон → гормон (32 АК).</p>\n<p><strong>Место синтеза:</strong> К-клетки щитовидной железы (или С-клетки паращитовидной железы).</p>\n<p><strong>Регуляция секреции:</strong></p>\n<ul>\n<li>↑Ca2+ в крови → стимулирует секрецию кальцитонина</li>\n<li>↓Ca2+ → ингибирует</li>\n</ul>\n<p>(Сравни с ПТГ: там было ровно наоборот — классическая пара гормонов-антагонистов, работающих на одну и ту же систему в противоположных направлениях, как инсулин и глюкагон для глюкозы!)</p>\n<p><strong>Механизм действия:</strong> мембранно-внутриклеточный, вторичный посредник — цГМФ.</p>\n<p><strong>Органы-мишени:</strong> почки, кости, кишечник — те же самые три органа, что и у ПТГ и кальцитриола!</p>\n<p><strong>Биологические эффекты (все направлены на ↓Ca2+ в крови):</strong></p>\n<ol>\n<li>Кости: ингибирует высвобождение Ca2+ и фосфатов из кости (↓активность остеокластов) и способствует проникновению Ca2+ и фосфатов в кости из крови (прямая противоположность ПТГ!)</li>\n</ol>\n<ol>\n<li>Почки: ↓реабсорбция Ca2+ в канальцах (кальций больше теряется с мочой — опять противоположно эффекту ПТГ!)</li>\n</ol>\n<ol>\n<li>Кишечник: уменьшает всасывание Ca2+ (снова противоположно кальцитриолу)</li>\n</ol>\n<p><strong>Итоговая логика вопроса — идеальная симметрия трёх гормонов кальциевого обмена:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>ПТГ</th><th>Кальцитриол</th><th>Кальцитонин</th></tr></thead>\n<tbody>\n<tr><td>Эффект на Ca2+ крови</td><td>↑</td><td>↑</td><td>↓</td></tr>\n<tr><td>Кости</td><td>вымывает (остеобласты/циты)</td><td>откладывает (минерализация)</td><td>тормозит вымывание (остеокласты)</td></tr>\n<tr><td>Почки</td><td>↑реабсорбция Ca2+</td><td>—</td><td>↓реабсорбция Ca2+</td></tr>\n<tr><td>Кишечник</td><td>↑ (косвенно, через кальцитриол)</td><td>↑ (напрямую)</td><td>↓</td></tr>\n</tbody>\n</table></div>\n<p><strong>Патологический аспект:</strong></p>\n<ul>\n<li>Недостаток кальцитонина: приводит к незначительному повышению кальция, клинического проявления практически нет</li>\n<li>Гиперфункция (опухоль, например медуллярный рак щитовидной железы): гипокальциемия крови</li>\n</ul>", "conspectHtml": "<p><strong>64. Кальцитонин</strong></p>\n<p><strong>Природа:</strong> белково-пептидная. Синтез: Прогормон → Гормон(32 АК)</p>\n<p><strong>Место синтеза:</strong> К-клетки щитовидной железы (С-клетки паращитовидной)</p>\n<p><strong>Регуляция:</strong> ↑Ca2+ → стимулирует секрецию; ↓Ca2+ → ингибирует (противоположно ПТГ!)</p>\n<p><strong>Механизм:</strong> мембранно-внутриклеточный, посредник — цГМФ</p>\n<p><strong>Мишени:</strong> почки, кости, кишечник (те же, что у ПТГ и кальцитриола!)</p>\n<p><strong>Эффекты (все ↓Ca2+ в крови):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Орган</th><th>Эффект</th></tr></thead>\n<tbody>\n<tr><td>Кости</td><td>↓остеокластов → тормозит вымывание Ca2+/PO4, способствует отложению в кость</td></tr>\n<tr><td>Почки</td><td>↓реабсорбция Ca2+ (канальцы)</td></tr>\n<tr><td>Кишечник</td><td>↓всасывание Ca2+</td></tr>\n</tbody>\n</table></div>\n<p><strong>Сводная таблица 3 гормонов (Ca2+ обмен):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>ПТГ</th><th>Кальцитриол</th><th>Кальцитонин</th></tr></thead>\n<tbody>\n<tr><td>Ca2+ крови</td><td>↑</td><td>↑</td><td>↓</td></tr>\n<tr><td>Кости</td><td>вымывает</td><td>откладывает</td><td>тормозит вымывание</td></tr>\n<tr><td>Кишечник</td><td>↑(косвенно)</td><td>↑(напрямую)</td><td>↓</td></tr>\n</tbody>\n</table></div>\n<p><strong>Патология:</strong> недостаток кальцитонина — малозначим; гиперфункция(опухоль) → гипокальциемия</p>"}, {"num": 65, "title": "Функции крови, белковый спектр плазмы, белки острой фазы", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Начинаем большой блок про кровь. Разберём общие функции, состав белков плазмы, причины отклонений в общем белке, и специальные группы белков.</p>\n<p><strong>Функции крови (3 главные):</strong></p>\n<ol>\n<li>Транспортная (3 подвида): дыхательная (O2 от лёгких к тканям, CO2 обратно), питательная (перенос питательных веществ), экскреторная (перенос конечных продуктов обмена к почкам/коже/желудку)</li>\n</ol>\n<ol>\n<li>Гомеостатическая — поддержание постоянства внутренней среды</li>\n</ol>\n<ol>\n<li>Регуляторная — перенос гормонов и биологически активных веществ</li>\n</ol>\n<p><strong>Белковый спектр плазмы</strong> (норма общего белка 60-80 г/л):</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Фракция</th><th>Норма (г/л)</th><th>Норма (%)</th></tr></thead>\n<tbody>\n<tr><td>Альбумины</td><td>46</td><td>58</td></tr>\n<tr><td>α1-глобулины</td><td>3</td><td>4</td></tr>\n<tr><td>α2-глобулины</td><td>5</td><td>9</td></tr>\n<tr><td>β-глобулины</td><td>8</td><td>13</td></tr>\n<tr><td>γ-глобулины</td><td>14</td><td>19</td></tr>\n</tbody>\n</table></div>\n<p><strong>Функции белков плазмы (7 пунктов):</strong></p>\n<ol>\n<li>Связывают воду, поддерживают осмотическое давление (онкотическое давление)</li>\n<li>Образуют белковую буферную систему крови</li>\n<li>Определяют вязкость крови</li>\n<li>Транспортная функция (холестерин, билирубин, лекарства)</li>\n<li>Иммунитет (иммуноглобулины)</li>\n<li>Резерв аминокислот</li>\n<li>Поддерживают уровень катионов (связывают до 50% Ca2+, часть Fe, Mg, Cu)</li>\n</ol>\n<p><strong>Причины отклонений общего белка:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Состояние</th><th>Причины</th></tr></thead>\n<tbody>\n<tr><td>Гиперпротеинемия (↑)</td><td>диарея, рвота, обширные ожоги (потеря воды → \"сгущение\" крови); миеломная болезнь (специфич. миеломные белки)</td></tr>\n<tr><td>Гипопротеинемия (↓)</td><td>поражение гепатоцитов (↓синтеза — большинство белков плазмы синтезируется в печени!), поражение ЖКТ (↓всасывания АК), опухоли (↑распад белков), потеря белка с мочой (патология почек)</td></tr>\n<tr><td>Диспротеинемия</td><td>изменение % соотношения фракций при НОРМАЛЬНОМ общем белке (инфекции, ревматизм, болезни печени)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Белки \"острой фазы\"</strong> — синтезируются в печени, главный индуктор синтеза — интерлейкин-1:</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Белок</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>С-реактивный белок</td><td>стимулирует систему комплемента; при ревматоидном артрите ↑ в 30 раз!</td></tr>\n<tr><td>α1-антитрипсин</td><td>инактивирует протеазы, освобождающиеся при воспалении</td></tr>\n<tr><td>Гаптоглобин</td><td>связывает гемоглобин → предотвращает потерю железа</td></tr>\n<tr><td>Кислый гликопротеин</td><td>—</td></tr>\n<tr><td>Фибриноген</td><td>—</td></tr>\n</tbody>\n</table></div>\n<p><strong>Белки-переносчики ионов металлов:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Белок</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>Церулоплазмин</td><td>Cu2+-фермент, окисляет Fe2+→Fe3+ (ферроксидаза); тормозит ПОЛ на стадии разветвления цепи; за счёт Cu2+ проявляет свойства СОД</td></tr>\n<tr><td>Трансферрин</td><td>связывает свободное Fe3+, транспортирует к тканям (работает как хелатор)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Механизм агглютинации эритроцитов:</strong></p>\n<p>На поверхности эритроцита — антигены (агглютиногены) А и В. Если эритроцит НЕ имеет агглютиноген А → в плазме есть антитела анти-А-агглютинины (и наоборот для В). Агглютинины — это γ-глобулины (IgM, IgG).</p>\n<p>Механизм реакции: при встрече ОДНОИМЁННЫХ агглютининов и агглютиногенов (α встречает А, β встречает В) → эритроциты склеиваются (агглютинация). В норме в крови НЕТ агглютининов к собственным эритроцитам.</p>\n<p>Этот принцип используется для определения групп крови и резус-фактора (антиген D: наличие → Rh+, отсутствие → Rh⁻).</p>\n<p><strong>Небелковые органические компоненты плазмы (остаточный азот, 15-25 ммоль/л):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Компонент</th><th>% остат. азота</th><th>Происхождение</th></tr></thead>\n<tbody>\n<tr><td>Мочевина</td><td>50%</td><td>обмен аммиака</td></tr>\n<tr><td>Своб. аминокислоты</td><td>25%</td><td>пул АК</td></tr>\n<tr><td>Мочевая кислота</td><td>4%</td><td>распад пуринов</td></tr>\n<tr><td>Креатин</td><td>5%</td><td>—</td></tr>\n<tr><td>Креатинин</td><td>2,5%</td><td>—</td></tr>\n<tr><td>Аммиак</td><td>0,5%</td><td>дезаминирование</td></tr>\n</tbody>\n</table></div>", "conspectHtml": "<p><strong>65. Функции крови, белковый спектр плазмы</strong></p>\n<p><strong>Функции крови:</strong> 1)Транспортная(дыхат./питат./экскреторн.) 2)Гомеостатическая 3)Регуляторная</p>\n<p><strong>Белковый спектр (общий белок 60-80г/л):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Фракция</th><th>г/л</th><th>%</th></tr></thead>\n<tbody>\n<tr><td>Альбумины</td><td>46</td><td>58</td></tr>\n<tr><td>α1-глобулины</td><td>3</td><td>4</td></tr>\n<tr><td>α2-глобулины</td><td>5</td><td>9</td></tr>\n<tr><td>β-глобулины</td><td>8</td><td>13</td></tr>\n<tr><td>γ-глобулины</td><td>14</td><td>19</td></tr>\n</tbody>\n</table></div>\n<p><strong>Функции белков плазмы:</strong> осмотич. давление, буфер, вязкость, транспорт, иммунитет(Ig), резерв АК, связывание катионов(50%Ca2+)</p>\n<p><strong>Отклонения:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Причины</th></tr></thead>\n<tbody>\n<tr><td>Гиперпротеинемия</td><td>диарея/рвота/ожоги(сгущение), миелома</td></tr>\n<tr><td>Гипопротеинемия</td><td>↓печень, ↓ЖКТ, опухоли, ↓почки</td></tr>\n<tr><td>Диспротеинемия</td><td>смена % фракций при норм. общем белке</td></tr>\n</tbody>\n</table></div>\n<p><strong>Белки острой фазы (индуктор — ИЛ-1, печень):</strong> СРБ(↑30× при РА), α1-антитрипсин, гаптоглобин, фибриноген</p>\n<p><strong>Переносчики металлов:</strong> Церулоплазмин(Cu2+, Fe2+→Fe3+, тормоз ПОЛ, свойства СОД) / Трансферрин(связ. Fe3+, хелатор)</p>\n<p><strong>Агглютинация:</strong> антигены А,В на эритроцитах ↔ антитела(γ-глобулины) в плазме → при встрече ОДНОИМЁННЫХ — склеивание. Резус: антиген D → Rh+/Rh⁻</p>\n<p><strong>Небелковые компоненты (ост. азот):</strong> мочевина(50%), АК(25%), мочев.к-та(4%), креатин(5%), креатинин(2,5%)</p>"}, {"num": 66, "title": "Особенности метаболизма в эритроцитах, механизм защиты от гемолиза", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Эритроцит — уникальная клетка: она полностью лишена ядра и большинства органелл, поэтому её метаболизм сильно упрощён.</p>\n<p><strong>Особенности метаболизма эритроцитов:</strong></p>\n<p>Зрелые эритроциты не имеют: ядра, рибосом, митохондрий, лизосом. Соответственно: нет ДНК, не синтезируется РНК, не происходит белковый синтез, не идут реакции цикла Кребса.</p>\n<p><strong>Основные метаболические пути — только 2:</strong> анаэробный гликолиз и пентозофосфатный путь (ПФП). Это прямое следствие отсутствия митохондрий — эритроцит физически не может использовать окислительное фосфорилирование.</p>\n<p><strong>Анаэробный гликолиз в эритроцитах:</strong></p>\n<ul>\n<li>Единственный источник АТФ для клетки</li>\n<li>Субстрат — глюкоза (заходит через облегчённую диффузию, ГЛЮТ)</li>\n<li>Глюкоза расщепляется до лактата, образуется АТФ и НАДН</li>\n</ul>\n<p><strong>Роль НАДН в эритроците:</strong> НАДН, образующийся в гликолизе, восстанавливает метгемоглобин обратно в гемоглобин. Это критически важно: метгемоглобин (Fe3+ вместо нормального Fe2+ в геме) не способен переносить кислород — и именно продукт гликолиза (НАДН) поддерживает гем в рабочей, функциональной форме.</p>\n<p><strong>Пентозофосфатный путь (ПФП) в эритроцитах:</strong></p>\n<p>Окисление глюкозы в ПФП даёт НАДФН — необходимый для поддержания восстановленной формы глутатиона (GSH).</p>\n<p><strong>Механизм защиты эритроцита от гемолиза:</strong></p>\n<p>Глутатион (GSH) — главный защитник эритроцита от перекисного окисления мембраны (глутатионпероксидаза (ГПО) — вторая линия антиоксидантной защиты!):</p>\n<p>ROOH + 2G-SH → ROH + H2O + G-S-S-G (окисленный глутатион)</p>\n<p>Окисленный глутатион (G-S-S-G) нужно снова восстановить обратно в рабочую форму (GSH), и именно для этого нужен НАДФН из ПФП (глутатионредуктаза использует НАДФН как донор электронов).</p>\n<p><strong>Логическая цепочка защиты от гемолиза:</strong></p>\n<p>Глюкоза → (ПФП) → НАДФН → восстанавливает окисленный глутатион (GSSG→2GSH) → GSH нейтрализует перекиси в мембране эритроцита (через ГПО) → мембрана защищена от разрушения → эритроцит не гемолизируется.</p>\n<p><strong>Клиническая связка:</strong> это объясняет, почему при дефиците фермента глюкозо-6-фосфатдегидрогеназы (первый фермент окислительной ветви ПФП) развивается гемолитическая анемия — без этого фермента эритроцит не может генерировать достаточно НАДФН, глутатион не восстанавливается, мембрана эритроцита беззащитна перед окислительным стрессом (классический пример фавизма).</p>", "conspectHtml": "<p><strong>66. Метаболизм эритроцитов, защита от гемолиза</strong></p>\n<p><strong>Особенности:</strong> нет ядра, рибосом, митохондрий, лизосом → нет ДНК/РНК синтеза, нет белк. синтеза, нет ЦТК</p>\n<p><strong>2 пути метаболизма:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>Роль</th></tr></thead>\n<tbody>\n<tr><td>Анаэробный гликолиз</td><td>единств. источник АТФ; Глю→Лактат+АТФ+НАДН</td></tr>\n<tr><td>ПФП</td><td>Глю→НАДФН (для восстановления глутатиона)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Роль НАДН (гликолиз):</strong> восстанавливает метгемоглобин(Fe3+) → гемоглобин(Fe2+) (рабочая форма для переноса О2)</p>\n<p><strong>Защита от гемолиза (цепочка):</strong> Глю →(ПФП)→ НАДФН → восстанавливает GSSG→2GSH (глутатионредуктаза) → GSH нейтрализует ROOH (ГПО) → защита мембраны эритроцита от ПОЛ</p>\n<p><em>Дефицит Г-6-ФДГ (1-й фермент ПФП) → ↓НАДФН → ↓GSH → гемолитическая анемия</em></p>"}, {"num": 67, "title": "Миоглобин и гемоглобин: структура, функции, кооперативность, гемоглобинопатии", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Оба белка относятся к гемопротеидам, выполняют похожую функцию — работу с кислородом — но принципиально различаются по структуре и, как следствие, по регулируемости.</p>\n<p><strong>Миоглобин (Мг):</strong></p>\n<ul>\n<li>1 полипептидная цепь, 153 АК, 1 гем → только третичная структура (нет четвертичной!)</li>\n<li>Внутри глобулы — гидрофобный карман для гема. 2 ключевых остатка гистидина: проксимальный (F8) — связывает Fe2+ с белком; дистальный (E7) — обеспечивает угловое присоединение O2 (121°)</li>\n<li>Не имеет аллостерических эффектов</li>\n<li>Высокое сродство к O2 — функция: депонирование (запасание) O2 в мышцах. Даже при низком pO2=10 мм рт.ст. насыщение ~80%! Отдаёт O2 только при критическом падении pO2 до 5 мм рт.ст. (при физнагрузке/гипоксии)</li>\n</ul>\n<p><strong>Гемоглобин (Нв):</strong></p>\n<ul>\n<li>4 субъединицы (2α+2β цепи, HbA), 4 гема — олигомерный белок, есть четвертичная структура</li>\n<li>Именно четвертичная структура даёт аллостерические эффекты (3 вида): кооперативное связывание O2, эффект Бора, влияние 2,3-ДФГ</li>\n<li>Функция: транспорт O2 в крови (не запасание, как у миоглобина!)</li>\n</ul>\n<p><strong>Сравнительная таблица:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Признак</th><th>Гемоглобин</th><th>Миоглобин</th></tr></thead>\n<tbody>\n<tr><td>Субъединицы</td><td>4 (олигомер)</td><td>1 (мономер)</td></tr>\n<tr><td>Гемы</td><td>4</td><td>1</td></tr>\n<tr><td>Аллостерич. эффекты</td><td>Есть</td><td>Нет</td></tr>\n<tr><td>Кривая насыщения O2</td><td>S-образная</td><td>Гипербола</td></tr>\n<tr><td>Функция</td><td>Транспорт</td><td>Депонирование</td></tr>\n</tbody>\n</table></div>\n<p><strong>Кооперативные свойства гемоглобина</strong></p>\n<p>Логика: присоединение O2 к первому гему облегчает присоединение к остальным трём гемам той же молекулы (в лёгких, высокое pO2). И наоборот — отщепление от первого гема облегчает отщепление от остальных (в тканях, низкое pO2). Это создаёт характерную S-образную кривую.</p>\n<p><strong>Механизм кооперативного эффекта (2 конформации):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Дезоксигемоглобин (Т-форма)</th><th>Оксигемоглобин (R-форма)</th></tr></thead>\n<tbody>\n<tr><td>Структура</td><td>жёсткая (8 солевых связей)</td><td>мягкая (солевые связи разорваны)</td></tr>\n<tr><td>Fe2+</td><td>выступает из плоскости гема на 0,3 Å (к F8)</td><td>подтягивается к плоскости (на 0,2 Å)</td></tr>\n<tr><td>Сродство к O2</td><td>низкое</td><td>↑ в 300 раз</td></tr>\n</tbody>\n</table></div>\n<p>Логика: присоединение O2 к одному гему тянет Fe2+ в плоскость → за ним тянется проксимальный гистидин F8 и вся полипептидная цепь → разрушаются солевые связи → вся молекула переходит в \"мягкую\" R-форму → остальным трём гемам легче присоединить O2.</p>\n<p><strong>Типы гемоглобина человека и смена типов в онтогенезе:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Состав</th><th>Особенность</th></tr></thead>\n<tbody>\n<tr><td>HbF (фетальный)</td><td>2α+2γ</td><td>↑сродство к O2 (слабо связывает 2,3-ДФГ — в аллостерич. центре серин, не гистидин!). У новорождённого до 80%, к концу 1 года — заменяется на HbA. У взрослых до 1,5%</td></tr>\n<tr><td>HbA (взрослый)</td><td>2α+2β</td><td>основной</td></tr>\n<tr><td>HbA2 (минорный)</td><td>2α+2δ</td><td>—</td></tr>\n<tr><td>HbCO (карбоксигемоглобин)</td><td>Hb+CO</td><td>высокое сродство, необратимо блокирует O2</td></tr>\n<tr><td>MetHb (метгемоглобин)</td><td>Fe3+</td><td>не связывает O2, нет аллостерич. эффектов</td></tr>\n</tbody>\n</table></div>\n<p>Логика повышенного сродства HbF к O2: плод получает кислород через плаценту от материнской крови, и ему нужно \"перетягивать\" O2 у материнского гемоглобина — отсюда и физиологическая необходимость более высокого сродства.</p>\n<p><strong>Гемоглобинопатии (болезни гемоглобинов, &gt;200 видов, 2 группы):</strong></p>\n<ol>\n<li>Гемоглобинопатии (наследственное изменение структуры цепи): серповидноклеточная анемия — в β-цепи в 6-м положении глутаминовая кислота заменена на валин → HbS, эритроциты приобретают форму серпа, теряют способность нормально связывать O2.</li>\n</ol>\n<ol>\n<li>Талассемии: снижение скорости синтеза целой цепи (α-талассемия или β-талассемия — не изменение структуры, а именно недостаточное количество нормальной цепи!) → тяжёлая анемия.</li>\n</ol>", "conspectHtml": "<p><strong>67. Миоглобин и гемоглобин</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Признак</th><th>Гемоглобин</th><th>Миоглобин</th></tr></thead>\n<tbody>\n<tr><td>Субъединицы/гемы</td><td>4/4 (олигомер)</td><td>1/1 (мономер)</td></tr>\n<tr><td>Структура</td><td>4-я (четвертичная)</td><td>только 3-я</td></tr>\n<tr><td>Аллостерич. эффекты</td><td>ЕСТЬ (3: кооператив., Бора, 2,3-ДФГ)</td><td>НЕТ</td></tr>\n<tr><td>Кривая O2</td><td>S-образная</td><td>Гипербола</td></tr>\n<tr><td>Функция</td><td>Транспорт O2</td><td>Депонирование O2</td></tr>\n</tbody>\n</table></div>\n<p><strong>Кооперативность:</strong> O2 на 1-й гем → облегчает связывание на остальные 3 (в лёгких); отщепление от 1-го → облегчает отщепление от остальных (в тканях)</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Т-форма (дезокси)</th><th>R-форма (окси)</th></tr></thead>\n<tbody>\n<tr><td>Связи</td><td>8 солевых (жёсткая)</td><td>разорваны (мягкая)</td></tr>\n<tr><td>Fe2+</td><td>вне плоскости(0,3Å)</td><td>в плоскости</td></tr>\n<tr><td>Сродство O2</td><td>низкое</td><td>↑300×</td></tr>\n</tbody>\n</table></div>\n<p><strong>Типы Hb:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Тип</th><th>Состав</th><th>Особенность</th></tr></thead>\n<tbody>\n<tr><td>HbF</td><td>2α+2γ</td><td>↑сродство к O2 (серин вместо гис в алл.центре); 80% у новорождённого</td></tr>\n<tr><td>HbA</td><td>2α+2β</td><td>основной взрослый</td></tr>\n<tr><td>HbA2</td><td>2α+2δ</td><td>минорный</td></tr>\n<tr><td>HbCO</td><td>+CO</td><td>необратимо блокирует O2</td></tr>\n<tr><td>MetHb</td><td>Fe3+</td><td>не связывает O2</td></tr>\n</tbody>\n</table></div>\n<p><strong>Гемоглобинопатии:</strong> Серповидноклет. анемия(β-цепь, Глу→Вал в 6 позиции→HbS) / Талассемии(↓синтеза целой цепи α или β)</p>"}, {"num": 68, "title": "Дыхательная функция крови, эффект Бора, роль 2,3-ДФГ", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Разберём оставшиеся два аллостерических эффекта гемоглобина — оба решают одну и ту же задачу: как гемоглобин \"узнаёт\", где ему нужно отдать кислород, а где — забрать.</p>\n<p><strong>Дыхательная функция крови — основы:</strong></p>\n<p>Транспорт O2 от лёгких к тканям и CO2 от тканей к лёгким. CO2 транспортируется в крови двумя путями:</p>\n<ul>\n<li>80-85% — в виде HCO3⁻ (через реакцию с карбоангидразой)</li>\n<li>15-20% — обратимо связано с концевыми NH2-группами α- и β-цепей гемоглобина, образуя карбаминогемоглобин</li>\n</ul>\n<p><strong>Эффект Бора</strong></p>\n<p>Определение: влияние pH (концентрации H+) и концентрации CO2 на связывание O2 гемоглобином. Между связыванием O2 и связыванием H+/CO2 существует обратимая, взаимоисключающая зависимость.</p>\n<p><strong>Логика по месту нахождения крови:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Место</th><th>pO2</th><th>Что происходит</th></tr></thead>\n<tbody>\n<tr><td>Лёгкие</td><td>высокое (~100 мм рт.ст.)</td><td>Hb связывает O2, освобождая H+ и CO2 (выдыхаются)</td></tr>\n<tr><td>Тканевые капилляры</td><td>низкое (~40 мм рт.ст.)</td><td>Hb отдаёт O2 и связывает H+ и CO2</td></tr>\n</tbody>\n</table></div>\n<p>Количественная деталь: в периферических тканях гемоглобин связывает 2H+ на каждые 4 освободившиеся молекулы O2 — связывание H+ происходит по концевым остаткам гистидина в β-цепях.</p>\n<p>Механизм на уровне конформации: протонирование Hb (связывание H+) и связывание с CO2 → образуется карбаминогемоглобин → это стабилизирует именно Т-форму (напряжённую) → уменьшается сродство к O2.</p>\n<p>Биологический смысл эффекта Бора: активно работающая ткань (мышца при нагрузке) производит много CO2 и H+ — и именно там, где кислород нужнее всего, гемоглобин автоматически \"настраивается\" отдавать его легче.</p>\n<p><strong>Роль 2,3-ДФГ (2,3-дифосфоглицерат, он же БФГ)</strong></p>\n<p>Происхождение: 2,3-ДФГ вырабатывается в эритроцитах при анаэробном гликолизе (побочный продукт).</p>\n<p>Механизм действия: является аллостерическим регулятором — присоединяется к гемоглобину в аллостерическом центре (содержит NH3-группы лизина и гистидина), в соотношении 1:1. Образует дополнительные ионные связи (к уже имеющимся 8 солевым связям Т-формы!).</p>\n<p>Ключевая деталь: 2,3-ДФГ присоединяется именно к дезоксигемоглобину (Т-форме), ещё больше её стабилизирует → сродство к O2 снижается ещё сильнее → ↑доставка O2 в ткани.</p>\n<p>В лёгких — обратный процесс: высокое pO2 → оксигенирование Hb → разрыв ионных связей → расслабление белковой молекулы → уменьшение центральной полости → 2,3-ДФГ физически \"выдавливается\" и высвобождается.</p>\n<p><strong>Связь с HbF:</strong> HbF имеет более высокое сродство к O2 именно потому, что слабо связывает 2,3-ДФГ — в его аллостерическом центре не гистидин, а серин.</p>\n<p><strong>Клиническая деталь про метгемоглобин:</strong> у MetHb отсутствует эффект Бора вообще — потому что проксимальный гистидин F8 замещён на тирозин, а железо в 3-валентном состоянии не даёт нормальных аллостерических взаимодействий.</p>", "conspectHtml": "<p><strong>68. Дыхательная функция крови, эффект Бора, 2,3-ДФГ</strong></p>\n<p><strong>Транспорт CO2:</strong> 80-85% как HCO3⁻; 15-20% как карбаминогемоглобин (на NH2-группах Hb)</p>\n<p><strong>Эффект Бора:</strong> влияние pH/CO2 на связывание O2 (обратимая взаимоисключающая зависимость)</p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Место</th><th>pO2</th><th>Hb делает</th></tr></thead>\n<tbody>\n<tr><td>Лёгкие</td><td>↑(100мм)</td><td>связывает O2, отдаёт H++CO2</td></tr>\n<tr><td>Ткани</td><td>↓(40мм)</td><td>отдаёт O2, связывает H++CO2</td></tr>\n</tbody>\n</table></div>\n<p>Кол-во: 2H+ на 4 O2. Связывание H+→гистидин β-цепей → карбаминогемоглобин → стабилизация Т-формы → ↓сродство к O2</p>\n<p><em>Смысл: активная ткань(↑CO2,H+) сама \"просит\" больше O2</em></p>\n<p><strong>2,3-ДФГ:</strong> образуется в эритроцитах (анаэробный гликолиз) → аллостерический регулятор → садится на дезоксигемоглобин(Т-форму), 1:1 → доп. ионные связи → ещё ↓сродство к O2 → ↑доставка в ткани</p>\n<p>В лёгких: оксигенирование → разрыв связей → ↓центральная полость → 2,3-ДФГ высвобождается</p>\n<p><strong>Связь с HbF:</strong> в аллостерич. центре серин (не гистидин) → слабо связывает 2,3-ДФГ → ↑сродство к O2 → хуже отдаёт O2 (нужно для забора O2 от матери)</p>\n<p><em>MetHb: F8→тирозин, Fe3+ → эффект Бора ОТСУТСТВУЕТ</em></p>"}, {"num": 69, "title": "Буферные системы крови, роль почек и лёгких, ацидоз/алкалоз", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Организм должен удерживать pH крови в чрезвычайно узком диапазоне. Разберём 4 буферные системы крови, а затем — как почки и лёгкие подключаются как \"вторая линия защиты\".</p>\n<p><strong>4 буферные системы крови (по убыванию значимости, % буферной ёмкости):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Система</th><th>Компоненты</th><th>% ёмкости</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Гемоглобиновая</td><td>HHb/KHb; HbO2/KHbO2</td><td>75% (самая мощная!)</td><td>см. ниже</td></tr>\n<tr><td>Бикарбонатная</td><td>HCO3⁻/H2CO3 (20:1)</td><td>10%</td><td>H++HCO3⁻→H2CO3→H2O+CO2↑</td></tr>\n<tr><td>Фосфатная</td><td>HPO4²⁻/H2PO4⁻</td><td>1%</td><td>H++HPO4²⁻→H2PO4⁻</td></tr>\n<tr><td>Белковая</td><td>белок-кислота/белок-основание</td><td>меньше всех</td><td>амфотерные свойства белков</td></tr>\n</tbody>\n</table></div>\n<p><strong>Гемоглобиновая буферная система — самая мощная, и она напрямую связана с эффектом Бора!</strong></p>\n<p>Оксигемоглобин (HbO2) — более сильная кислота, чем дезоксигемоглобин (HHb). Это работает согласованно с дыханием:</p>\n<ul>\n<li>В тканях: KHbO2 → KHb + O2 (кислород отдаётся); затем KHb + H2CO3 → HHb + KHCO3 (гемоглобин \"принимает на себя\" протон, буферизуя угольную кислоту)</li>\n<li>В лёгких: HHb + O2 → HHbO2; HHbO2 + KHCO3 → KHbO2 + H2CO3 → H2O + CO2↑ (карбоангидраза)</li>\n</ul>\n<p><strong>Бикарбонатная система</strong> — вторая по мощности, соотношение HCO3⁻:H2CO3 = 20:1 в норме. Механизм — классическая буферная пара.</p>\n<p><strong>Роль лёгких (вторая линия защиты после буферов):</strong></p>\n<ul>\n<li>При ацидозе → гипервентиляция → удаление избытка CO2</li>\n<li>При алкалозе → гиповентиляция → задержка CO2</li>\n</ul>\n<p><strong>Роль почек (вторая линия защиты, работает медленнее лёгких, но мощнее по объёму)</strong> — те же 3 механизма:</p>\n<ol>\n<li>Бикарбонатный: выведение H+ (в обмен на Na+), реабсорбция HCO3⁻</li>\n<li>Аммиачный: глутамин/глутамат → NH3 → связывает H+ → NH4+ → выводится с солями</li>\n<li>Фосфатный: выведение H2PO4⁻, реабсорбция HPO4²⁻</li>\n</ol>\n<p><strong>Нормальные показатели КОС крови:</strong></p>\n<ul>\n<li>pH плазмы = 7,4 ± 0,05</li>\n<li>[HCO3⁻] = 24,4±3 ммоль/л (щелочной резерв крови)</li>\n<li>pCO2 = 40 мм рт.ст.</li>\n<li>Критические значения для жизни: pH 6,8 (ацидоз) и pH 8,0 (алкалоз)</li>\n</ul>\n<p><strong>Причины и формы ацидоза/алкалоза — классификация по происхождению:</strong></p>\n<p>Метаболический ацидоз: ↑продукция метаболических кислот (СД I типа/голодание — кетоацидоз; лактатацидоз — шок, гипоксия, СД II типа); потеря гидрокарбонатов</p>\n<p>Дыхательный (респираторный) ацидоз: гиповентиляция лёгких → ↑pCO2 &gt;40 (гиперкапния)</p>\n<p>Метаболический алкалоз: потери желудочного сока (рвота), потеря H+ с мочой при гипокалиемии, запоры, избыток щелочной пищи</p>\n<p>Дыхательный (респираторный) алкалоз: гипервентиляция → ↓pCO2 &lt;40 (гипокапния)</p>", "conspectHtml": "<p><strong>69. Буферные системы крови, роль почек/лёгких, ацидоз/алкалоз</strong></p>\n<p><strong>4 буферные системы:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Система</th><th>% ёмкости</th><th>Пара</th></tr></thead>\n<tbody>\n<tr><td>Гемоглобиновая</td><td>75%</td><td>HHb/HbO2 (связана с эффектом Бора)</td></tr>\n<tr><td>Бикарбонатная</td><td>10%</td><td>HCO3⁻/H2CO3 (20:1)</td></tr>\n<tr><td>Фосфатная</td><td>1%</td><td>HPO4²⁻/H2PO4⁻</td></tr>\n<tr><td>Белковая</td><td>меньше всех</td><td>амфотерность</td></tr>\n</tbody>\n</table></div>\n<p><strong>Гемоглобиновый буфер:</strong> в тканях KHbO2→KHb+O2 (буферизует H2CO3); в лёгких HHbO2 вытесняет H2CO3 из соли → CO2↑</p>\n<p><strong>Роль лёгких:</strong> ацидоз→гипервентиляция(↓CO2); алкалоз→гиповентиляция(↑CO2)</p>\n<p><strong>Роль почек (3 мех-ма):</strong> бикарбонатный, аммиачный(глутамин→NH3→NH4+), фосфатный</p>\n<p><strong>Норма КОС:</strong> pH 7,4±0,05; [HCO3⁻] 24,4±3ммоль/л; pCO2 40мм рт.ст. Критич.: pH 6,8/8,0</p>\n<p><strong>Классификация:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Метаболический</th><th>Дыхательный</th></tr></thead>\n<tbody>\n<tr><td>Ацидоз</td><td>↑кислот(кетоацидоз,лактат) или ↓HCO3⁻</td><td>гиповентиляция→↑pCO2</td></tr>\n<tr><td>Алкалоз</td><td>потеря H+(рвота), запоры</td><td>гипервентиляция→↓pCO2</td></tr>\n</tbody>\n</table></div>"}, {"num": 70, "title": "Обмен железа", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Железо — критически важный микроэлемент, но при этом токсичный в свободном виде.</p>\n<p><strong>Функции железа:</strong> входит в состав гемоглобина, миоглобина, цитохромов, железосодержащих ферментов.</p>\n<p><strong>Пулы железа в организме (всего 3-5 г):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Пул</th><th>%</th></tr></thead>\n<tbody>\n<tr><td>В составе эритроцитов (циркулирующих + костный мозг)</td><td>~65% (основная масса!)</td></tr>\n<tr><td>Тканевое (ферменты, миоглобин)</td><td>~15%</td></tr>\n<tr><td>Запасы (ферритин, гемосидерин)</td><td>~20%</td></tr>\n<tr><td>Транспортное (трансферрин)</td><td>0,1-0,2%</td></tr>\n</tbody>\n</table></div>\n<p><strong>Всасывание железа в кишечнике — 3 пути:</strong></p>\n<ol>\n<li>Геминовое Fe2+ (~30%): гем (целиком, неразрушенный!) заходит в энтероцит через транспортёр HCP-1 → внутри клетки гемоксигеназа разрушает гем, высвобождая Fe3+ → ферриредуктаза восстанавливает до Fe2+</li>\n</ol>\n<ol>\n<li>Негеминовое Fe3+ (~70%, основной путь): через мобилферрин-интегриновый комплекс (Cu2+-зависимая ферриредуктаза, нужны НАДФН2 и аскорбиновая кислота) → Fe3+→Fe2+ → в энтероцит</li>\n</ol>\n<ol>\n<li>Негеминовое Fe2+: через белок DMT-1 (эндоцитоз)</li>\n</ol>\n<p><strong>Судьба Fe2+ внутри энтероцита — развилка:</strong></p>\n<ul>\n<li>25% связывается с апоферритином → ферритин (Fe3+) — запасная форма</li>\n<li>75% выходит через ферропортин (базолатеральный транспортёр) + гефестин (Cu2+-зависимый, окисляет Fe2+→Fe3+) → в кровь → Fe3+ загружается на трансферрин</li>\n</ul>\n<p><strong>Транспорт железа в плазме:</strong></p>\n<p>Трансферрин(Fe3+) несёт железо к тканям, преимущественно в костный мозг (для синтеза Hb).</p>\n<p>Утилизация клетками-потребителями: комплекс рецептор-трансферрин-Fe3+ → эндоцитоз → внутри клетки распадается на составляющие → Fe3+ используется или связывается с апоферритином (депо) → рецептор возвращается на мембрану, трансферрин — обратно в кровь.</p>\n<p>Рециркуляция железа: макрофаги селезёнки/печени разрушают состарившиеся эритроциты (время жизни 3-4 месяца), освобождают железо → церулоплазмин окисляет Fe2+→Fe3+ → снова на трансферрин → снова в костный мозг.</p>\n<p><strong>Регуляция обмена железа — гормон гепсидин:</strong></p>\n<p>Гепсидин — пептид (25 АК), синтезируется в гепатоцитах. Механизм: блокирует ферропортин → железо не может выйти из клеток (энтероцитов, макрофагов, гепатоцитов) → тормозит поступление железа в кровь. Вырабатывается в ответ на повышение уровня железа в плазме — классическая отрицательная обратная связь.</p>\n<p>Регуляция на уровне генов: при высоком Fe → ↑синтез апоферритина, ↓синтез рецепторов трансферрина; при низком Fe — наоборот.</p>\n<p><strong>Железодефицитные состояния:</strong></p>\n<ul>\n<li>Причины: недостаток железа в пище, нарушение всасывания, хронические кровопотери</li>\n<li>Проявления: анемия, растрескивание в уголках рта, депрессия, головокружение</li>\n</ul>\n<p><strong>Гемосидероз и гемохроматоз:</strong></p>\n<p>Гемосидерин — скопление молекул ферритина (Fe3+) в виде аморфных золотисто-жёлтых зёрен.</p>\n<p>Гемохроматоз — большие накопления гемосидерина в печени, поджелудочной железе, селезёнке → повреждение органов (цирроз печени, сахарный диабет, сердечная недостаточность).</p>", "conspectHtml": "<p><strong>70. Обмен железа</strong></p>\n<p><strong>Функции:</strong> Hb, Мг, цитохромы, Fe-содержащие ферменты</p>\n<p><strong>Пулы (3-5г):</strong> эритроциты(65%), тканевое(15%), запасы-ферритин/гемосидерин(20%), транспортное-трансферрин(0,1-0,2%)</p>\n<p><strong>Всасывание (3 пути, кишечник):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Путь</th><th>Форма</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Гем Fe2+(30%)</td><td>HCP-1→гемоксигеназа→Fe3+→ферриредуктаза→Fe2+</td></tr>\n<tr><td>2</td><td>Негем Fe3+(70%,гл.)</td><td>мобилферрин-компл.(НАДФН,вит.С)→Fe2+</td></tr>\n<tr><td>3</td><td>Негем Fe2+</td><td>DMT-1</td></tr>\n</tbody>\n</table></div>\n<p>В энтероците: 25%→ферритин(депо) / 75%→ферропортин+гефестин(Fe2+→Fe3+)→трансферрин→кровь</p>\n<p><strong>Транспорт:</strong> Трансферрин(Fe3+)→костный мозг(синтез Hb) → рецепторный эндоцитоз → депо(апоферритин) или использование</p>\n<p><strong>Рециркуляция:</strong> макрофаги разрушают старые эритроциты(3-4мес) → церулоплазмин(Fe2+→Fe3+) → снова трансферрин</p>\n<p><strong>Регуляция — гепсидин</strong> (гепатоциты, 25АК): блокирует ферропортин → ↓выход Fe из клеток. Вырабатывается при ↑Fe в плазме (обратная связь)</p>\n<p><strong>Железодефицит:</strong> анемия, трещины в углах рта, депрессия, головокружение</p>\n<p><strong>Гемосидероз/гемохроматоз:</strong> избыток ферритина→гемосидерин → накопление в печени/поджелуд./селезёнке → цирроз, СД, сердечная недост.</p>"}, {"num": 71, "title": "Гемостаз: определение, компоненты, функции эндотелия/субэндотелия/тромбоцитов; сосудисто-тромбоцитарный гемостаз", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Гемостаз — система с двойной задачей: держать кровь жидкой там, где сосуд цел, и быстро \"заклеивать\" повреждение там, где сосуд травмирован.</p>\n<p><strong>Определение:</strong> гемостаз — биологическая система, обеспечивающая сохранение крови в жидком состоянии в сосудах и образование тромбов в области повреждения стенки.</p>\n<p><strong>2 режима работы:</strong></p>\n<ul>\n<li>Антикоагулянтный — поддержание жидкого состояния при неповреждённом эндотелии</li>\n<li>Коагулянтный — свёртывание при контакте с повреждённым эндотелием</li>\n</ul>\n<p><strong>3 компонента системы гемостаза:</strong></p>\n<ol>\n<li>Сосудистое звено (эндотелий, субэндотелий, гладкомышечные клетки)</li>\n<li>Тромбоцитарное звено</li>\n<li>Плазменное звено (свёртывающие + противосвёртывающие факторы)</li>\n</ol>\n<p><strong>Функции сосудистого эндотелия (4 пункта — здоровый эндотелий активно ПРЕПЯТСТВУЕТ свёртыванию):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Функция</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Контактная инертность</td><td>отрицательный заряд (гепарансульфат, дерматансульфат) → отталкивает клетки крови</td></tr>\n<tr><td>Синтез вазодилататоров</td><td>ПГI2(простациклин), NO → расширяют сосуд; ПГI2 также ингибирует агрегацию тромбоцитов</td></tr>\n<tr><td>Антикоагулянтные факторы</td><td>тромбомодулин, протеин S, ТАП(тканевой активатор плазминогена), гепарин, антиконвертин</td></tr>\n<tr><td>Структурная целостность</td><td>синтез коллагена, эластина, фибронектина, VIII фактора в субэндотелий</td></tr>\n</tbody>\n</table></div>\n<p><strong>Функции субэндотелия (обнажается только при повреждении):</strong></p>\n<ul>\n<li>Плазменные факторы свёртывания: тканевой тромбопластин (ф.III), фактор V, фактор VII</li>\n<li>Вазоконстрикторы: эндотелин-1, норадреналин</li>\n<li>Ингибиторы фибринолиза: ИАП-1, ИАП-2</li>\n</ul>\n<p>Логика: эндотелий — \"антикоагулянтный щит\", субэндотелий — \"прокоагулянтный резерв\", который открывается только при повреждении.</p>\n<p><strong>Структура тромбоцита:</strong> мембрана с рецепторами адгезии (R1) и агрегации (R2). 4 типа гранул:</p>\n<ul>\n<li>α-гранулы (тромбоцитарные факторы P1-P11: P3-тромбопластин, P4-антигепариновый, P6-ретрактозим, P10-серотонин, P11-АДФ)</li>\n<li>Плотные гранулы (АДФ, АТФ, серотонин, Ca2+)</li>\n<li>Пероксисомы (H2O2 → тромбоксан)</li>\n<li>Лизосомальные гранулы (гидролазы)</li>\n</ul>\n<p><strong>Сосудисто-тромбоцитарный (первичный) гемостаз — 3 фазы:</strong></p>\n<p>Фаза 1 — местная вазоконстрикция: выделяется из повреждённых тромбоцитов (АДФ-P11, серотонин-P10, тромбоксан А2) и повреждённых тканей (катехоламины, эндотелины 1-6).</p>\n<p>Фаза 2 — адгезия (прикрепление тромбоцита к субэндотелию): при оголении субэндотелия выделяется VIII фактор (Виллебранда). Прилипание тромбоцитов к коллагену/фибронектину идёт через 2-ю субъединицу фактора Виллебранда. Процесс усиливают АДФ и тромбоксан А2.</p>\n<p>Фаза 3 — агрегация (тромбоциты слипаются друг с другом): через фибрин-полимер (тромбоцитарного происхождения, P5). При распаде тромбоцитов выходит тромбоцитарный фактор III (тромбопластиноген) — обладает эффектом тромбина → переводит фибриноген в фибрин-мономер → фибрин-полимер связывает тромбоциты. P9 (фибринстабилизирующий, идентичен XIIIа плазмы) стабилизирует полимер.</p>\n<p>Рецепторы: R1 — к субъединице Виллебранда, R2 — к нити фибрина-полимера. При недостатке R2 — тромбастения Гланцмана-Негели.</p>\n<p>Активаторы агрегации: АДФ, тромбоксан А2, катехоламины.</p>\n<p>Результат: \"белый тромб\" (сетка тромбоцитов+фибрина, прикреплена к субэндотелию). P6 (ретрактозим) уплотняет тромб.</p>\n<p><strong>Участие тромбоксана и простациклина — классическая пара антагонистов:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Тромбоксан А2</th><th>Простациклин ПГI2</th></tr></thead>\n<tbody>\n<tr><td>Синтез</td><td>тромбоциты</td><td>эндотелий</td></tr>\n<tr><td>Эффект на сосуд</td><td>сужение</td><td>расширение</td></tr>\n<tr><td>Эффект на агрегацию</td><td>усиливает</td><td>ингибирует</td></tr>\n</tbody>\n</table></div>", "conspectHtml": "<p><strong>71. Гемостаз: определение, компоненты; сосудисто-тромбоцитарный гемостаз</strong></p>\n<p><strong>Определение:</strong> сохранение крови жидкой + образование тромбов при повреждении</p>\n<p><strong>Компоненты:</strong> сосудистое звено / тромбоцитарное звено / плазменное звено</p>\n<p><strong>Эндотелий (антикоагулянтный щит):</strong> контактная инертность, вазодилататоры(ПГI2,NO), антикоагулянты(тромбомодулин,протеинS,ТАП,гепарин), структурная целостность</p>\n<p><strong>Субэндотелий (прокоагулянтный резерв, при повреждении):</strong> тромбопластин(фIII), фV, фVII; вазоконстрикторы(эндотелин-1,НА); ингибиторы фибринолиза(ИАП)</p>\n<p><strong>Тромбоцит:</strong> R1(адгезия)/R2(агрегация); гранулы: α(P1-P11), плотные(АДФ,АТФ,серотонин,Ca2+), пероксисомы(H2O2), лизосомальные</p>\n<p><strong>3 фазы сосудисто-тромбоцитарного гемостаза:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Фаза</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>1.Вазоконстрикция</td><td>АДФ,серотонин,тромбоксан А2 + катехоламины,эндотелины</td></tr>\n<tr><td>2.Адгезия</td><td>фVIII(Виллебранда) → тромбоциты к коллагену/фибронектину</td></tr>\n<tr><td>3.Агрегация</td><td>фибрин-полимер(P5); тромбопластиноген(фIII тромбоцитов)→фибриноген→фибрин; P9 стабилизирует</td></tr>\n</tbody>\n</table></div>\n<p>Результат: \"белый тромб\" (тромбоциты+фибрин)</p>\n<p><em>Дефект R2 → тромбастения Гланцмана-Негели</em></p>\n<p><strong>Тромбоксан vs Простациклин:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Тромбоксан А2</th><th>Простациклин ПГI2</th></tr></thead>\n<tbody>\n<tr><td>Источник</td><td>тромбоциты</td><td>эндотелий</td></tr>\n<tr><td>Эффект на сосуд</td><td>сужение</td><td>расширение</td></tr>\n<tr><td>Эффект на агрегацию</td><td>усиливает</td><td>ингибирует</td></tr>\n</tbody>\n</table></div>"}, {"num": 72, "title": "Плазменные факторы свёртывания, роль витамина К и Ca2+", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Плазменные факторы — это 15 пронумерованных римскими цифрами белков (плюс кальций), которые составляют \"молекулярный конвейер\" вторичного гемостаза.</p>\n<p><strong>Общая характеристика 15 факторов:</strong></p>\n<ul>\n<li>Все, кроме фосфолипидов и Ca2+, — белки (гликопротеиды/липопротеиды)</li>\n<li>Синтезируются в печени (I, II, V, VII, IX, X, XIII); XIII также в селезёнке, почках, лейкоцитах, эндотелии</li>\n<li>7 факторов в активной форме — сериновые протеазы (XII, XI, IX, X, VII, II); XIII — трансглутаминаза</li>\n<li>3 фактора без ферментативной активности (III, V, VIII) — но регулируют образование активных X и II</li>\n</ul>\n<p><strong>Ключевые факторы (таблица):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Фактор</th><th>Название</th><th>Активация</th></tr></thead>\n<tbody>\n<tr><td>I</td><td>Фибриноген</td><td>IIа → фибрин-мономер</td></tr>\n<tr><td>II</td><td>Протромбин (вит.К-завис.)</td><td>Ха → IIа(тромбин)</td></tr>\n<tr><td>III</td><td>Тканевой тромбопластин</td><td>активирует VII→VIIа</td></tr>\n<tr><td>IV</td><td>Ca2+</td><td>кофактор для IIа,VIIа,IXа,Xа</td></tr>\n<tr><td>V</td><td>Проакцелерин</td><td>III, затем IIа → Vа</td></tr>\n<tr><td>VII</td><td>Проконвертин (вит.К-завис.)</td><td>III → VIIа (внешний путь)</td></tr>\n<tr><td>VIII</td><td>Антигемофильный глобулин А</td><td>связывает IXа; субъед. Виллебранда — адгезия</td></tr>\n<tr><td>IX</td><td>Антигемофильный глобулин В (вит.К-завис.)</td><td>XIа → IXа (внутренний путь)</td></tr>\n<tr><td>X</td><td>Фактор Стюарта-Прауэра (вит.К-завис.)</td><td>IXа/VIIа → Ха (общий путь)</td></tr>\n<tr><td>XII</td><td>Фактор Хагемана</td><td>контактная активация</td></tr>\n<tr><td>XIII</td><td>Фибринстабилизирующий</td><td>IIа → XIIIа (трансглутаминаза)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Роль витамина К:</strong></p>\n<p>4 фактора витамин К-зависимы: II, VII, IX, X — важно запомнить именно эту четвёрку.</p>\n<p>Механизм: витамин К служит донором карбоксильной группы, которая присоединяется к глутаминовой кислоте → образуется γ-карбоксиглутаминовая кислота.</p>\n<p>Зачем нужна эта модификация: остатки γ-карбоксиглутаминовой кислоты в активных VIIа, IXа, Xа обеспечивают их взаимодействие через Ca2+ с отрицательно заряженными фосфолипидами мембран тромбоцитов и повреждённого эндотелия. Без витамина К эти факторы физически не могут \"закрепиться\" на нужной поверхности через кальциевый мостик — весь процесс свёртывания останавливается на этом этапе, даже если сами белки-факторы синтезированы в достаточном количестве!</p>\n<p>Именно поэтому антикоагулянты типа варфарина работают, блокируя цикл витамина К.</p>\n<p><strong>Роль ионов Ca2+ (фактор IV) — 3 функции:</strong></p>\n<ol>\n<li>Необходимы для прикрепления VIIа, IXа, Xа к фрагменту мембраны разрушенного тромбоцита (через γ-карбоксиглутаминовые остатки)</li>\n<li>Активаторы ферментативной активности IIа, VIIа, IXа, Xа</li>\n<li>В отсутствии Ca2+ кровь не свёртывается — отсюда использование цитрата или ЭДТА как антикоагулянтов в пробирках.</li>\n</ol>", "conspectHtml": "<p><strong>72. Плазменные факторы свёртывания, роль вит.К и Ca2+</strong></p>\n<p><strong>Общее (15 факторов):</strong> все белки, кроме фосфолипидов и Ca2+. Синтез — печень (I,II,V,VII,IX,X,XIII). 7 факторов — сериновые протеазы(XII,XI,IX,X,VII,II); XIII — трансглутаминаза. 3 фактора без ферм. активности (III,V,VIII)</p>\n<p><strong>Ключевые факторы:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Ф</th><th>Название</th><th>Активация</th></tr></thead>\n<tbody>\n<tr><td>I</td><td>Фибриноген</td><td>→фибрин-мономер</td></tr>\n<tr><td>II</td><td>Протромбин(вит.К)</td><td>Ха→тромбин</td></tr>\n<tr><td>III</td><td>Тканевой тромбопластин</td><td>активир. VII</td></tr>\n<tr><td>IV</td><td>Ca2+</td><td>кофактор IIа,VIIа,IXа,Xа</td></tr>\n<tr><td>VII</td><td>Проконвертин(вит.К)</td><td>внешний путь</td></tr>\n<tr><td>VIII</td><td>Антигемоф.глоб.А</td><td>+субъед.Виллебранда</td></tr>\n<tr><td>IX</td><td>Антигемоф.глоб.В(вит.К)</td><td>внутренний путь</td></tr>\n<tr><td>X</td><td>Стюарта-Прауэра(вит.К)</td><td>общий путь</td></tr>\n<tr><td>XIII</td><td>Фибринстабилизирующий</td><td>трансглутаминаза</td></tr>\n</tbody>\n</table></div>\n<p><strong>Витамин К:</strong> донор карбоксильной группы → Глу→γ-карбоксиглутаминовая к-та (в II,VII,IX,X) Смысл: γ-карбоксиглутамат связывает факторы с фосфолипидами мембран через Ca2+ (без вит.К — факторы не \"закрепляются\")</p>\n<p><strong>Роль Ca2+ (3 функции):</strong> 1)прикрепление VIIа,IXа,Xа к мембране 2)активатор IIа,VIIа,IXа,Xа 3)без Ca2+ — кровь НЕ свёртывается</p>"}, {"num": 73, "title": "Внешний и внутренний пути гемокоагуляции (вторичный гемостаз)", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Вторичный (коагуляционный) гемостаз — это уже не \"затыкание дыры\" тромбоцитами, а полноценный ферментативный каскад, заканчивающийся плотным фибриновым сгустком.</p>\n<p><strong>Определение:</strong> вторичный гемостаз — ферментативный процесс образования фибринового сгустка (\"красный тромб\" — в отличие от \"белого тромба\" первичного гемостаза, здесь в структуру попадает много эритроцитов).</p>\n<p><strong>Внешний путь (быстрый):</strong></p>\n<p>Требует факторов, которых нет в норме в крови — они поступают только при повреждении тканей (тканевой тромбопластин, фосфолипиды тканей).</p>\n<p>Схема: Фактор III (тканевой тромбопластин) + VII → VIIа. VIIа + Ca2+ + фосфолипиды тканей → активация X → Ха</p>\n<p>Логика \"быстроты\": путь короткий, всего пара шагов до Ха.</p>\n<p><strong>Внутренний путь (медленный):</strong></p>\n<p>Обеспечивается ТОЛЬКО факторами, уже имеющимися в плазме крови, и фосфолипидами тромбоцитов.</p>\n<p>Схема: Контакт XII с чужеродной поверхностью (или с калликреином+ВМК) → XIIа → активация XI → XIа + Ca2+ → активация IX → IXа. IXа + Ca2+ + фосфолипиды тромбоцитов + VIIIа → активация X → Ха</p>\n<p>Логика \"медленности\": путь длиннее.</p>\n<p><strong>Общий конечный путь</strong> (начинается с активации X, куда сходятся оба предыдущих пути) — 5 стадий:</p>\n<ol>\n<li>Образование тромбина: Ха + Ca2+ + фосфолипиды тромбоцитов + Vа → активация II(протромбин) → IIа (тромбин). Комплекс IIа-Ca2+ обладает протеолитической активностью.</li>\n</ol>\n<p>(Фактор II может активироваться в IIа также напрямую фактором P3 (тромбоцитарным тромбопластином))</p>\n<ol>\n<li>Образование фибрина: IIа-Ca2+ расщепляет фибриноген(I) → фибрин-мономер(Iа) + фибропептиды А и В</li>\n</ol>\n<ol>\n<li>Полимеризация фибрина: молекулы фибрина-мономера образуют между собой непрочные нековалентные водородные связи → фибрин-полимер (гель фибрина)</li>\n</ol>\n<ol>\n<li>Стабилизация фибрина: IIа-Ca2+ активирует XIII → XIIIа (трансглутаминаза) → образует прочные ковалентные амидные связи между молекулами фибрина-мономера и между фибрином и фибронектином субэндотелия → тромб становится прочным и фиксированным</li>\n</ol>\n<ol>\n<li>Ретракция тромба: тромбоциты выделяют P6 (ретрактозим, АТФазная активность) → сжимает тромб → выжимается сыворотка, концы разорванного сосуда стягиваются</li>\n</ol>\n<p>Итоговая логика вопроса: оба пути — это просто два разных \"входа\" в одну и ту же систему, которые сходятся на активации Х, а дальше идёт единый, общий для всех случаев каскад.</p>", "conspectHtml": "<p><strong>73. Внешний и внутренний пути гемокоагуляции (вторичный гемостаз)</strong></p>\n<p><strong>Определение:</strong> ферментативный процесс → фибриновый сгусток (\"красный тромб\")</p>\n<p><strong>Внешний путь (быстрый):</strong> нужны внешние факторы (при повреждении ткани) ф.III(тканев.тромбопластин)+VII→VIIа →(+Ca2+ +фосфолипиды ткани)→ активация X→Ха</p>\n<p><strong>Внутренний путь (медленный):</strong> только факторы плазмы+тромбоцитов Контакт XII с поверхностью(или калликреин+ВМК) → XIIа → XI→XIа(+Ca2+) → IX→IXа →(+Ca2+ +фосфолипиды тромбоцитов+VIIIа)→ X→Ха</p>\n<p><strong>Общий конечный путь (5 стадий, от Ха):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>№</th><th>Стадия</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>Образование тромбина</td><td>Ха+Ca2+ +фосфолипиды+Vа → протромбин(II)→IIа(тромбин)</td></tr>\n<tr><td>2</td><td>Образование фибрина</td><td>IIа-Ca2+: фибриноген(I)→фибрин-мономер(Iа)</td></tr>\n<tr><td>3</td><td>Полимеризация</td><td>водородные связи → фибрин-полимер(рыхлый)</td></tr>\n<tr><td>4</td><td>Стабилизация</td><td>XIII→XIIIа(трансглутаминаза) → ковалентные связи → прочный тромб</td></tr>\n<tr><td>5</td><td>Ретракция</td><td>P6(ретрактозим) сжимает тромб → выжимается сыворотка</td></tr>\n</tbody>\n</table></div>\n<p><em>Оба пути сходятся на активации X → далее единый общий путь</em></p>"}, {"num": 74, "title": "Противосвёртывающая система", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>После вопросов о том, как кровь СВЁРТЫВАЕТСЯ, разберём противоположный механизм — как организм тормозит и ограничивает этот процесс.</p>\n<p><strong>Определение:</strong> противосвёртывающая система — физиологические ингибиторы свёртывания, сохраняющие кровь в жидком состоянии.</p>\n<p><strong>а) Тромбомодулин (ТМ)</strong></p>\n<p>Гликопротеид, интегральный белок мембран эндотелиальных клеток (вен, артерий, капилляров, лимфосистемы большинства органов, кроме головного мозга).</p>\n<p>Механизм: связывает тромбин (IIа) в присутствии Ca2+ → инактивирует его (образуется комплекс ТМ-IIа-Ca2+).</p>\n<p>Тромбин — это как раз тот фермент, который запускает финальный этап свёртывания. Тромбомодулин буквально \"перехватывает\" его и превращает из прокоагулянта в свою противоположность — активатор системы протеина С.</p>\n<p>Регуляция синтеза ТМ: стимулируется тромбином, цАМФ, ретиноевой кислотой; ингибируется ИЛ-1, гипоксией, эндотоксином (при воспалении/инфекции противосвёртывающая защита ослабевает — повышенный риск тромбозов при сепсисе!).</p>\n<p><strong>б) Система протеина С</strong></p>\n<p>Протеин С (ПрС): синтезируется в печени в неактивной форме (норма в плазме = 4 г/л). Активируется комплексом ТМ-IIа-Ca2+ путём частичного протеолиза.</p>\n<p>Активированный ПрС связывается с протеином S и Ca2+ → комплекс ПрС-S-Ca2+ инактивирует Vа и VIIIа путём гидролиза (это критически важно — Vа и VIIIа были ключевыми кофакторами в общем пути свёртывания!). Также активирует плазминоген → плазмин.</p>\n<p>Протеин S: синтезируется в печени при участии витамина К, образует комплекс с Ca2+.</p>\n<p><strong>в) Ингибиторы активированных факторов свёртывания:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Ингибитор</th><th>Механизм действия</th></tr></thead>\n<tbody>\n<tr><td>Антитромбин III</td><td>синтез в печени+эндотелии; неактивен в свободном виде; связывается с гепарином → комплекс АТIII-гепарин → ингибирует IIа, IXа, Xа, XIIа, XIVа (НЕ ингибирует VIIа!)</td></tr>\n<tr><td>Гепарин</td><td>мукополисахарид, синтезируется тучными клетками; активирует антитромбин III</td></tr>\n<tr><td>α2-Макроглобулин</td><td>печень, ингибирует IIа-Ca2+</td></tr>\n<tr><td>Антиконвертин</td><td>эндотелий, связывается с комплексом III-VIIа-Ca2+-фосфолипиды → комплекс улавливается печенью и разрушается</td></tr>\n<tr><td>α1-Антитрипсин</td><td>печень+лёгкие(альвеолярные макрофаги); неспецифично ингибирует IIа, XIа, XIVа + лейкоцитарную эластазу</td></tr>\n</tbody>\n</table></div>\n<p><strong>Ключевая клиническая деталь про антитромбин III и гепарин:</strong> гепарин сам по себе — не главный антикоагулянт, он лишь активатор антитромбина III. Поэтому при лечении гепарином важен исходный уровень антитромбина III в крови пациента.</p>\n<p><strong>Общая логика вопроса — три уровня защиты от избыточного свёртывания:</strong></p>\n<ol>\n<li>Тромбомодулин \"перехватывает\" сам тромбин и переключает его функцию</li>\n<li>Система протеина С разрушает ключевые усилители каскада (Vа, VIIIа)</li>\n<li>Прямые ингибиторы (антитромбин III и другие) напрямую блокируют активные протеазы факторов</li>\n</ol>", "conspectHtml": "<p><strong>74. Противосвёртывающая система</strong></p>\n<p><strong>Определение:</strong> физиологические ингибиторы свёртывания, держат кровь жидкой</p>\n<p><strong>а) Тромбомодулин (ТМ):</strong> белок эндотелия → связывает тромбин(IIа)+Ca2+ → инактивирует его → комплекс ТМ-IIа-Ca2+ (активирует систему протеина С) Регуляция: (+)тромбин,цАМФ,ретиноев.к-та; (−)ИЛ-1,гипоксия,эндотоксин</p>\n<p><strong>б) Система протеина С:</strong> Протеин С(печень,неактивн.,4г/л) →(активация комплексом ТМ-IIа-Ca2+)→ Активный ПрС + Протеин S(вит.К-завис.,печень) + Ca2+ → комплекс ПрС-S-Ca2+ → инактивирует Vа и VIIIа (гидролиз) + активирует плазминоген→плазмин</p>\n<p><strong>в) Ингибиторы активных факторов:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Ингибитор</th><th>Синтез</th><th>Действие</th></tr></thead>\n<tbody>\n<tr><td>Антитромбин III</td><td>печень,эндотелий</td><td>+гепарин→ингибирует IIа,IXа,Xа,XIIа,XIVа (НЕ VIIа!)</td></tr>\n<tr><td>Гепарин</td><td>тучные клетки</td><td>активирует АТIII (сам не главный игрок!)</td></tr>\n<tr><td>α2-Макроглобулин</td><td>печень</td><td>ингибирует IIа-Ca2+</td></tr>\n<tr><td>Антиконвертин</td><td>эндотелий</td><td>блок III-VIIа-Ca2+ → разрушение в печени</td></tr>\n<tr><td>α1-Антитрипсин</td><td>печень,лёгкие</td><td>IIа,XIа,XIVа + эластаза лейкоцитов</td></tr>\n</tbody>\n</table></div>\n<p><em>Клинически: гепарин без АТIII неэффективен (лишь активатор, не самостоятельный ингибитор)</em></p>"}, {"num": 75, "title": "Фибринолитическая система", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Если противосвёртывающая система предотвращает избыточное образование тромба, то фибринолиз — это следующий этап: разрушение уже готового сгустка.</p>\n<p><strong>Определение:</strong> фибринолиз — ферментативное расщепление волокон фибрина-полимера с образованием растворимых пептидов (X, Y, D, E), которые фагоцитируются в кровотоке.</p>\n<p><strong>Компоненты фибринолитической системы:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Компонент</th><th>Происхождение</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>Плазминоген</td><td>печень, почки, костный мозг, кишечник</td><td>неактивный предшественник плазмина</td></tr>\n<tr><td>Плазмин</td><td>из плазминогена при активации</td><td>сериновая протеаза</td></tr>\n<tr><td>ТАП (тканевой активатор плазминогена)</td><td>эндотелий всех тканей, кроме печени (больше всего в матке)</td><td>превращает плазминоген→плазмин</td></tr>\n<tr><td>Урокиназа</td><td>почки</td><td>превращает плазминоген→плазмин</td></tr>\n<tr><td>Стрептокиназа</td><td>β-гемолитический стрептококк</td><td>превращает плазминоген→плазмин (лекарственный препарат!)</td></tr>\n</tbody>\n</table></div>\n<p>Важная количественная деталь про ТАП: на его долю приходится 70% активности всех активаторов плазминогена. ТАП ингибируется двумя специфическими ингибиторами — И-ТАП-1 (эндотелий, гепатоциты) и И-ТАП-2 (плацента, моноциты).</p>\n<p>Урокиназа и стрептокиназа — это те же самые препараты, которые уже упоминались в вопросе про ферментотерапию — \"предотвращение тромбообразования: стрептокиназа, урокиназа\".</p>\n<p><strong>Два эффекта плазмина:</strong></p>\n<ol>\n<li>Тромболитический (лизис тромба): плазмин (сериновая протеаза) расщепляет связи в молекуле фибрина-полимера → тромб растворяется.</li>\n</ol>\n<ol>\n<li>Инактивация плазменных факторов свёртывания: плазмин расщепляет факторы IIа, Vа, VIIа, VIIIа, IXа, XIа.</li>\n</ol>\n<p>Логика этого двойного эффекта: плазмин работает \"на два фронта\" — не только разрушает уже существующий тромб (тромболизис), но и одновременно снижает общую свёртываемость крови.</p>\n<p>Важная деталь про регуляцию: плазминоген не превращается в плазмин, пока не активируется (принцип частичного протеолиза, как и в системе свёртывания).</p>\n<p><strong>Механизм активации плазминогена:</strong> активация плазминогена, как и свёртывание крови, осуществляется по внешнему и внутреннему механизму — то есть система фибринолиза \"зеркалит\" структуру системы коагуляции, только в обратном направлении.</p>", "conspectHtml": "<p><strong>75. Фибринолитическая система</strong></p>\n<p><strong>Определение:</strong> ферментативное расщепление фибрина-полимера → растворимые пептиды(X,Y,D,E) → фагоцитоз в кровотоке</p>\n<p><strong>Компоненты:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Компонент</th><th>Происхождение</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>Плазминоген</td><td>печень,почки,костн.мозг,кишечник</td><td>предшественник плазмина</td></tr>\n<tr><td>Плазмин</td><td>из плазминогена</td><td>сериновая протеаза</td></tr>\n<tr><td>ТАП</td><td>эндотелий(кроме печени, ↑↑матка)</td><td>плазминоген→плазмин, 70% всей активности</td></tr>\n<tr><td>Урокиназа</td><td>почки</td><td>плазминоген→плазмин</td></tr>\n<tr><td>Стрептокиназа</td><td>β-гемолитич. стрептококк</td><td>плазминоген→плазмин (лекарство!)</td></tr>\n</tbody>\n</table></div>\n<p><em>ТАП ингибируется И-ТАП-1(эндотелий,гепатоциты)/И-ТАП-2(плацента,моноциты)</em></p>\n<p><strong>2 эффекта плазмина:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Эффект</th><th>Суть</th></tr></thead>\n<tbody>\n<tr><td>1.Тромболитический</td><td>расщепляет связи в фибрине-полимере → лизис тромба</td></tr>\n<tr><td>2.Инактивация факторов</td><td>расщепляет IIа,Vа,VIIа,VIIIа,IXа,XIа → ↓свёртываемость</td></tr>\n</tbody>\n</table></div>\n<p><strong>Регуляция:</strong> плазминоген активируется только по требованию (частичный протеолиз, как и факторы свёртывания)</p>\n<p><strong>Активация:</strong> по внешнему и внутреннему пути (зеркалит систему коагуляции)</p>"}, {"num": 78, "title": "Калликреин-кининовая система (ККС)", "section": "Раздел 6", "sectionTitle": "Биохимия выделительной системы, ВЭО, биохимия крови", "explanationHtml": "<p>Финальный вопрос раздела крови — калликреин-кининовая система (ККС) тесно переплетена с системой свёртывания (фактор XII и калликреин в внутреннем пути коагуляции!), но её главная функция — не свёртывание, а регуляция сосудистого тонуса, боли и воспаления.</p>\n<p><strong>Компоненты ККС:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Компонент</th><th>Характеристика</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>Кининогены</td><td>ВМК(высокомолек., фактор XV) и НМК(низкомолек.) — белки-предшественники</td><td>при расщеплении калликреином → кинины</td></tr>\n<tr><td>Калликреины</td><td>протеолитич. ферменты (фактор XIV, прекалликреин)</td><td>активируют кининогены + активируют фактор XII (обратная связь!)</td></tr>\n<tr><td>Кинины</td><td>биологически активные пептиды: брадикинин(9АК), каллидин(10АК)</td><td>вазодилатация, ↑проницаемость, боль, сокращение гладких мышц, воспаление</td></tr>\n</tbody>\n</table></div>\n<p>Каллидин является предшественником брадикинина: под действием аминопептидазы плазмы каллидин(10АК) теряет одну аминокислоту и превращается в брадикинин(9АК).</p>\n<p><strong>Место синтеза компонентов:</strong></p>\n<ul>\n<li>Кининогены — печень</li>\n<li>Калликреин(прекалликреин) — печень, циркулирует в плазме в неактивной форме</li>\n<li>Кинины — образуются прямо в плазме крови (НЕ синтезируются de novo как отдельные белки, а высвобождаются из уже готового кининогена)</li>\n</ul>\n<p><strong>Механизм активации кининогенов — пошагово:</strong></p>\n<p>Фактор XII (Хагемана) — ключевой запускающий фактор всей системы (ровно тот же фактор, что запускает внутренний путь свёртывания!):</p>\n<ol>\n<li>Контакт фактора XII с чужеродной поверхностью (повреждённый эндотелий, коллаген) → XIIа</li>\n<li>XIIа активирует прекалликреин(фактор XIV) → Калликреин(XIVа)</li>\n<li>Калликреин в присутствии ВМК(фактор XV) расщепляет кининоген → Брадикинин(9АК) + Каллидин(10АК)</li>\n<li>Образовавшийся калликреин ДОПОЛНИТЕЛЬНО активирует фактор XII → положительная обратная связь</li>\n</ol>\n<p>Логическая связка с гемостазом: фактор XII — это буквально одна и та же \"точка входа\" для двух систем — внутреннего пути свёртывания крови и калликреин-кининовой системы.</p>\n<p><strong>Биологические эффекты кининов (брадикинина и каллидина):</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Эффект</th><th>Механизм</th></tr></thead>\n<tbody>\n<tr><td>Вазодилатация</td><td>расслабление гладких мышц сосудов → ↓АД</td></tr>\n<tr><td>↑Проницаемости сосудов</td><td>межэндотелиальные щели → отёк, выход белков в ткани</td></tr>\n<tr><td>Боль</td><td>возбуждение болевых нервных окончаний (медиатор боли)</td></tr>\n<tr><td>Сокращение гладких мышц</td><td>бронхоконстрикция, сокращение кишечника, матки</td></tr>\n<tr><td>Воспаление</td><td>местное расширение сосудов, отёк, боль</td></tr>\n<tr><td>Активация гемостаза</td><td>активация фактора XII (усиление свёртывания)</td></tr>\n</tbody>\n</table></div>\n<p><strong>Роль ККС в развитии воспаления — детальный механизм:</strong></p>\n<ol>\n<li>Кинины вызывают местное расширение сосудов (покраснение), ↑проницаемости (отёк), боль — это буквально классические 4 признака воспаления</li>\n<li>Кинины стимулируют высвобождение гистамина из тучных клеток</li>\n<li>Кинины активируют фосфолипазу А2 → высвобождение арахидоновой кислоты → синтез простагландинов и лейкотриенов</li>\n<li>Совместно с системой комплемента и свёртывания крови — участвует в каскадных реакциях защитного ответа организма на повреждение</li>\n</ol>", "conspectHtml": "<p><strong>78. Калликреин-кининовая система (ККС)</strong></p>\n<p><strong>Компоненты:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th></th><th>Что</th><th>Функция</th></tr></thead>\n<tbody>\n<tr><td>Кининогены(ВМК,НМК)</td><td>предшественники</td><td>печень</td></tr>\n<tr><td>Калликреины(ф.XIV)</td><td>протеазы</td><td>активируют кининогены+фXII</td></tr>\n<tr><td>Кинины</td><td>брадикинин(9АК),каллидин(10АК)</td><td>вазодилат.,↑проницаем.,боль,воспаление</td></tr>\n</tbody>\n</table></div>\n<p><em>Каллидин→(аминопептидаза)→брадикинин</em></p>\n<p><strong>Место синтеза:</strong> кининогены/калликреин — печень; кинины — образуются в плазме (не de novo, высвобождение из кининогена)</p>\n<p><strong>Механизм активации:</strong> Фактор XII(контакт с чужерод. пов-стью)→XIIа → активирует прекалликреин(XIV)→Калликреин(XIVа) → +ВМК расщепляет кининоген→Брадикинин+Каллидин Калликреин доп. активирует XII → (+)обратная связь</p>\n<p><em>XII — общая точка запуска с внутренним путём свёртывания!</em></p>\n<p><strong>Эффекты кининов:</strong> вазодилатация(↓АД), ↑проницаемость(отёк), боль, сокращение гладк.мышц(бронхи,матка), воспаление, активация гемостаза(через фXII)</p>\n<p><strong>Роль в воспалении:</strong></p>\n<ol>\n<li>Прямые эффекты(покраснение,отёк,боль)</li>\n<li>Стимуляция гистамина из тучных клеток</li>\n<li>Активация фосфолипазы А2 → арахидоновая к-та → простагландины/лейкотриены</li>\n<li>Совместно с комплементом+свёртыванием → каскад защитной реакции</li>\n</ol>"}, {"num": 79, "title": "Компоненты пищи, сбалансированное питание, имбалансные рационы, незаменимые факторы питания, эталонный белок", "section": "Раздел 7", "sectionTitle": "Биохимия питания и печени", "explanationHtml": "<p>Разберём базовые понятия: из чего состоит пища, сколько её нужно, и что значит \"сбалансированное питание\".</p>\n<p><strong>Органические компоненты пищи:</strong></p>\n<ul>\n<li>Основные (макронутриенты): белки, углеводы, жиры</li>\n<li>Минорные (микронутриенты): витамины</li>\n</ul>\n<p><strong>Минеральные компоненты (макро- и микроэлементы):</strong> Na, K, Ca, Cl, P, Mg, Fe, Cu, Zn, Co, Mo, Se, I и др.</p>\n<p><strong>Энергетическая ценность пищевых веществ:</strong></p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Вещество</th><th>ккал/г</th><th>кДж/г</th></tr></thead>\n<tbody>\n<tr><td>Белки</td><td>5,4 (в организме реально усваивается ~4,1)</td><td>22,6</td></tr>\n<tr><td>Жиры</td><td>9,3</td><td>38,9</td></tr>\n<tr><td>Углеводы</td><td>4,1</td><td>17,2</td></tr>\n<tr><td>Этанол</td><td>7,1</td><td>29,7</td></tr>\n</tbody>\n</table></div>\n<p>Жиры дают почти в 2 раза больше энергии на грамм, чем белки/углеводы, а этанол по калорийности ближе к жирам, чем к углеводам.</p>\n<p><strong>Нормальное соотношение Б:Ж:У = 1:1:4</strong></p>\n<p><strong>Концепция сбалансированного питания (академик А.А. Покровский):</strong> нормальная жизнедеятельность возможна только при адекватном снабжении организма энергией и белком, а также при соблюдении сложных взаимоотношений между многочисленными незаменимыми факторами питания.</p>\n<p><strong>\"Правило стереохимического соответствия\" (Покровский):</strong> ферментные системы организма должны соответствовать химическим структурам питательных веществ — и на уровне пищеварения, и на уровне тканей.</p>\n<p><strong>Имбалансные рационы</strong> — неоптимальное соотношение пищевых веществ, 2 вида:</p>\n<ul>\n<li>Экзогенный имбаланс — неоптимальное соотношение аминокислот именно в белках пищи → истощение адаптивных механизмов</li>\n<li>Эндогенный имбаланс — как следствие экзогенного: несоответствие аминокислотного состава пищи ферментным пропорциям, уже существующим в тканях</li>\n</ul>\n<p><strong>Незаменимые факторы питания (3 категории):</strong></p>\n<ol>\n<li>Незаменимые аминокислоты: фенилаланин, метионин, треонин, триптофан, валин, лизин, лейцин, изолейцин (8 штук)</
